# M6/6E-2b — 이미지 취약점 게이트 정책 데이터(scope.md V-1, 결정 B-1~B-6). 값 없는 키는 정책
# 오류다(1A 관례 — 매직 넘버 금지, 값을 tools/vuln-scan-check.sh 에 리터럴로 박지 않는다).
# 정본 문서: reports/evidence/m6/6e2b/scope.md.
#
# 이 파일은 `config/quality/image-hygiene-policy*.properties` 와 같은 파서 규율 아래 있다 —
# 중복 키·빈 값·CRLF·값 모양 위반은 전부 정책 오류이고, 게이트가 그 자리에서 비-0 으로 끊는다.
#
# **판 2 (M6/6E-2c)** — D-6E2C-1 이 `scan.os.family.<kind>`·`scan.os.name.<kind>` 키 묶음을 더했다.
# 더하기만 한 변경이라 옛 정책 파일을 읽던 게이트는 그대로 돌지만, **판은 스키마를 가리키므로**
# 키가 늘면 올린다(`contract-policy.properties` 선례 — 값 하나 바뀐 승인 태그에도 판을 올렸다).
# 알려진 제한: 이 키를 **읽는 게이트는 없다**(실측 — `tools/`·워크플로에 참조 0, build-logic 의
# 참조 넷은 전부 다른 정책 파일 자리다). 사람이 읽는 표시이지 강제되는 축이 아니다.
policy.version=2

# ── 도구 핀 (B-2) ──────────────────────────────────────────────────────────────
# `aquasecurity/trivy-action`·`setup-trivy` 를 쓰지 않는다. 사유 둘 —
# ① 액션 안의 trivy 버전이 워크플로에 보이지 않아 **두 번째 버전 축**이 생긴다.
# ② 2026-03-19 의 공급망 사고에서 **먼저 무너진 것이 바로 그 액션 태그들**이다(공식
#    권고 GHSA-69fq-xp46-6x23: trivy-action 태그 0.0.1~0.34.2 와 setup-trivy v0.2.0~v0.2.5 가
#    악성 커밋으로 force-push 됐고, 바이너리 쪽 피해는 v0.69.4 하나였다).
# 그래서 `install buf` 선례대로 **릴리스 바이너리를 직접 받고, 체크섬을 이 파일에 핀한다.**
# 핀이 정본인 것이 핵심이다 — 뒤에 릴리스 자산이 바뀌어도 이 값과 어긋나면 설치가 비-0 이다.
#
# 버전 선택 근거(실측 2026-10-08) — v0.75.0 은 사고 노출 창(바이너리 2026-03-19 18:22~21:42,
# 액션 ~2026-03-20 05:40, Docker Hub 이미지 2026-03-22~23) **어디에도 속하지 않고**, 권고가
# 열거한 피해 자산 집합(v0.69.4 바이너리·v0.69.5/6 Docker Hub 이미지·위 액션 태그) 밖이다.
# 릴리스 게시는 2026-10-01 로 사고·수습 이후다. 자산의 sigstore 번들 인증서를 열어
# 발급자(GitHub Actions OIDC)·소스 저장소(aquasecurity/trivy)·ref(refs/tags/v0.75.0)·
# 빌드 커밋(591e9799316a602e703f0b484f6c6d7b234ec8f3, 태그 커밋과 독립 조회로 일치)·서명
# 시각(2026-10-01T13:32Z)을 확인했다. 알려진 제한: cosign 이 호스트·러너에 없어 **서명 자체의
# 암호학적 검증은 돌리지 않았다**(인증서 문면 확인까지) — 구속력 있는 잠금은 아래 체크섬 핀이다.
tool.trivy.version=0.75.0
tool.trivy.asset=trivy_0.75.0_Linux-64bit.tar.gz
tool.trivy.sha256=c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f

# ── 차단 문턱 (B-3 (a)) ────────────────────────────────────────────────────────
# HIGH·CRITICAL 중 **수정본이 있는 것만** 차단한다. 수정본 무관 전부 차단은 고칠 길이 없는
# finding 으로 PR 을 붉혀 상시 붉은 게이트가 된다(2026-09-09 「상시 붉은 게이트도, 안 돌린
# 게이트도 아무것도 막지 못한다」). 나머지는 차단하지 않고 보고서·SBOM 에 그대로 남는다.
block.severities=HIGH,CRITICAL
block.only-fixed=true

# ── 스캔 범위 ──────────────────────────────────────────────────────────────────
# 비밀값 축은 이 게이트가 지지 않는다 — 그쪽 정본은 `leakPatternGate` 이고 대상 집합이 다르다
# (저장소 텍스트 대 이미지 패키지). 한 게이트가 둘을 겸하면 어느 축이 섰는지가 섞인다.
scan.scanners=vuln
scan.pkg-types=os,library

# 이미지 kind — 게이트의 둘째 인자가 이 목록에 있어야 한다. allowlist 키의 kind 성분도 같은
# 목록으로 검증한다(아무 이미지에도 걸리지 않는 등재를 만들지 않는다).
scan.kinds=ml-serving,app

# **양성 대조 둘 (D-6C-5 · D-6E2B-5 나②)** — 축이 **두 개**다. 하나로는 닫히지 않는다.
#
# ① 입력 쪽 — SBOM 의 패키지 구성 요소 수. 스캐너가 이미지를 못 읽으면 「차단 대상 0」이 공허하게
#    참이 된다. 2026-10-08 실측: ml-serving 116 · app 226.
# ② 결과 쪽 — 스캔 결과가 **나열한** 패키지 수(`--list-all-pkgs` 가 싣는 목록).
#    2026-10-09 실측: ml-serving 115(OS 105 + lang 10) · app 225(OS 136 + jar 89).
#
#    **이 축이 재는 것을 과대 주장하지 않는다(verifier 표적 M-1).** `--list-all-pkgs` 는 패키지 목록을
#    **DB 매칭과 무관하게** 싣는다. 그래서 이 하한이 잡는 것은 「결과가 통째로 비었다」(스캔이 서지
#    않음·SBOM 을 못 읽음)이고, **「패키지는 나열했는데 DB 와 맞춰 보지 않았다」는 잡지 못한다** —
#    예를 들어 SBOM 의 OS 판이 DB 와 어긋나면 trivy 는 경고만 내고 finding 이 454 → 6 으로 주는데
#    나열 수는 115 그대로다(실측). 그 일반형은 `OPEN-6E2B-OS-MATCH-PREDICATE` 가 들고 있다.
#
# **finding 수 하한을 두지 않는 이유**: 「취약점이 N건 이상」은 이미지가 정말 깨끗해지는 날 거짓이
# 된다 — 게이트가 좋은 결과를 막는다. 「분석한 패키지가 N개 이상」은 그날에도 참이다.
#
# 미달은 **exit 2(판정 불가)** 다. 차단(exit 1)이 아니다 — 처방이 「올리거나 등재하라」가 아니라
# 「스캐너가 왜 못 읽었는지 보라」이기 때문이다(runbook §8.2 와 같은 문면).
#
# 값은 실측의 약 2/3 로 둔다. 베이스 교체로 줄 여지를 두되 「통째로 못 읽음」은 잡는다.
scan.min-packages.ml-serving=80
scan.min-packages.app=150
scan.min-analyzed-packages.ml-serving=80
scan.min-analyzed-packages.app=150

# ── OS 매칭 (D-6E2C-1 — `OPEN-6E2B-OS-MATCH-PREDICATE` 를 닫는다) ─────────────
# 위 두 하한이 못 잡는 축: 「나열은 했는데 DB 와 맞춰 보지 않았다」. 스캔이 읽은 배포판
# (`.Metadata.OS`)을 여기 선언한 값과 **정확히 일치**시키고, 그 배포판의 OS 패키지 Result
# (`Class=os-pkgs`, `Type=<family>`)가 하나 이상 실재함을 함께 요구한다. 어느 쪽이 어긋나도
# **exit 2(판정 불가)** 다 — 차단이 아니다(처방이 「올리거나 등재하라」가 아니다).
#
# **정확 일치는 의도한 대가를 갖는다**: debian point release 를 올리면 이 값을 같은 커밋에서
# 올려야 게이트가 선다. 베이스 상향이 정책 편집을 강제하는 것이 이 축의 목적이다 — 「배포판이
# 바뀌었는데 아무도 모름」이 6E-2b 가 실측한 바로 그 경로다(finding 468 → 한 자리로 주는데
# 나열 수는 그대로).
#
# 값은 **그 kind 의 베이스 이미지가 담은 배포판**이고 Dockerfile 의 `FROM` 과 함께 움직인다.
scan.os.family.ml-serving=debian
scan.os.name.ml-serving=12.15
scan.os.family.app=ubuntu
scan.os.name.app=24.04

# ── 취약점 DB 메타데이터 술어 (D-6E2B-5 나③) ─────────────────────────────────
# DB 를 「실행마다 받는다」(B-5 (a))는 약속은 **받은 것이 실재하고 최신일 때만** 참이다. 앞 판은
# 버전·갱신 시각을 요약에만 찍어서 DB 가 없거나 갱신이 멎어도 초록이었다. 이제 게이트가 끊는다.
#
# 7일인 이유: 상류는 하루 주기로 공시하므로 하루이틀 밀리는 것은 정상이고(2026-10-07 갱신분이
# 2026-10-09 까지 최신이었다), 일주일을 넘기면 그것은 상류 사고이거나 캐시가 굳은 것이다.
# **알려진 대가**: 상류가 일주일 넘게 멈추면 무관한 PR 이 전부 exit 2 가 된다. 그때 할 일은 값을
# 늘리는 것이 아니라 상류 상태를 확인하는 것이다(runbook §8.2).
scan.db.max-age-days=7

# Java DB 는 jar 층을 다루는 kind 에서만 받아진다. 「전부 요구」면 jar 없는 이미지가 못 받은 DB 로
# 붉어지고, 「전부 생략」이면 jar 를 보는 이미지가 DB 없이 조용히 초록이다 — 어느 kind 가 요구하는지를
# 정책이 선언한다. ml-serving 은 Python wheel 뿐이라 요구하지 않고, 앱은 bootJar 의 jar 를 본다.
scan.java-db-required.ml-serving=false
scan.java-db-required.app=true

# ── SBOM 과 보고서 (B-6) ───────────────────────────────────────────────────────
# CycloneDX JSON. 스캔은 **이 SBOM 을 입력으로** 돌므로 보관본과 판정 대상이 같은 물건임이
# 구조로 보장된다(2026-10-08 실측: 이미지 직접 스캔과 SBOM 경유 스캔의 finding 집합이 두
# 이미지 모두 동일). CI 는 이 디렉터리의 SBOM 을 artifact 로 올린다(보존 90일).
sbom.format=cyclonedx
report.dir=build/vuln-scan

# ── allowlist (B-4) ────────────────────────────────────────────────────────────
# 키 = 취약점 ID + 패키지 이름 + 이미지 kind, 값 = 만료일 + 사유. 좌표(file:line)를 키로 쓰지
# 않는다(leak-baseline 의 교훈 — 좌표 키는 편집 하나로 오탐과 미탐을 동시에 만든다).
# 만료 상한은 90일: 그보다 먼 만료일은 「무기한 면제」의 다른 이름이라 정책이 거부한다.
allowlist.file=config/quality/vuln-allowlist.properties
allowlist.max-days=90
