# 중복 코드 정책 — PMD CPD(`de.aaschmid.cpd`), ADR 0007 OPEN-ADR-16 (a)
#
# **main source set 한정 실패 모드다(운영자 결정 2026-09-06, HEAD f9d80e2 부근 실측).**
# `mode=fail`은 `fail.source-sets`(아래, D-6 `limit.type.members.source-sets`와 같은 이름
# 관례)에 있는 source set 의 중복만 `ignoreFailures=false`로 번역해 build 를 깨뜨린다. 그
# 밖의 source set(관례상 test)은 별도 task(`cpdCheckObserved`)가 `mode` 와 무관하게 항상
# `ignoreFailures=true`로 관찰만 한다 — 실측 근거: HEAD 에서 `cpdCheck`(main) 는 중복 0,
# `qualification/src/test/.../LicenseEligibilityTest.kt` 안에는 7–8줄(54–65 토큰) 중복 3건이
# 있다(전부 test, main 아님). `check`가 두 task 모두에 의존하고 각각의 presence gate
# (`cpdReportPresenceGate`/`cpdReportPresenceGateObserved`, D-4)가 리포트 XML 산출 자체를
# 단언한다 — 어느 쪽이 "실행 안 함"으로 조용히 퇴화해도 다른 쪽 존재가 가려주지 않는다.
# **되돌림**: `mode=observe`로 바꾸면 **실패 거동만** main 도 실패시키지 않는 이전과 같은
# 상태로 돌아간다(rollback.md) — 배선은 그대로다. `fail.source-sets`가 여전히 `cpdCheck`의
# source 를 main 으로 자르므로 리포트는 계속 두 파일(`X.xml`/`X-observed.xml`)로 갈린
# 채고, mode=observe 이전(1A-b)처럼 한 파일에 main+test 가 합쳐지지 않는다(verifier r1
# C-3).
#
# **낡은 리포트 축은 M9/gates-build 가 닫았다**(`OPEN-CPD-GATE-RENAME-BYPASS`). 앞 판의 한계
# (D-4, verifier r1 C-1)는 「프레즌스 게이트가 존재·크기만 보아 `check -x cpdCheck` 가 직전 실행이
# 남긴 XML 로 exit 0 이 난다」였다. 지금 그 게이트는 **리포트가 잴 소스보다 새로운가**를 함께 본다 —
# 소스를 고친 뒤 cpd 를 빼면 리포트가 그보다 낡아 붉는다. 남은 한계: 리포트를 `touch` 하면 이 축은
# 통과한다(내용 무변). `didWork` 를 직접 보는 축은 쓰지 않았다 — configuration-cache 아래에서 다른
# task 의 상태를 실행 시점에 읽으려면 그 task 참조를 들고 있어야 한다.
policy.version=3

# CPD 가 재는 소스 언어 — Kotlin lexer 모드(PMD 7.x).
language=kotlin

# 토큰 50 미만으로 잘린 조각은 재지 못한다 — 관찰 한계(위협 모델 우회 6, scope.md).
minimumTokenCount=50

# PMD CPD 엔진 버전. Gradle 9.6.1 + Kotlin 2.4.10 조합에서 스모크 확인
# (`_workspace/m1-1a-b/01_scout_preflight.md` §1, 2026-09-05).
toolVersion=7.7.0

# observe|fail. 운영자 결정 2026-09-06 — main 만 fail, 나머지(test)는 아래
# fail.source-sets 밖이라 mode 와 무관하게 항상 observe(OPEN-ADR-16 (a) 잔여).
mode=fail

# `mode=fail`일 때 실패로 셀 source set. D-6(`limit.type.members.source-sets`)와 같은
# 이름 관례 — main 만(main+test 는 architecture-policy.properties 의
# module.expected-source-sets 가 정하는 전체 집합, D-2). 키가 없으면 실패한다(기본값
# 없음 — 조용한 전면 확대를 막는다).
fail.source-sets=main

# **Type-2 정규화**(`OPEN-CPD-GATE-RENAME-BYPASS`) — **오늘의 PMD 로는 효과가 없다. 그 OPEN 의 이
# 축은 닫히지 않았다.**
#
# 닫으려던 것: 판정이 식별자·리터럴 **글자**에 의존해 이름 치환 하나로 열린다(verifier 실측 —
# 축어 복사판은 `cpdCheck` exit 1 인데 변수명만 바꿔도 0, 리터럴만 바꿔도 0).
#
# **실측(M9/gates-build)**: 두 값을 참으로 켜도 「구조는 같고 식별자·리터럴은 전부 다른」 블록 둘
# (≈200 토큰)이 탐지되지 않는다. 같은 입력을 축어 동일로 바꾼 통제군은 탐지된다(임계와 lexer 는
# 정상이다). **구조적 사유**: 값은 `CpdExtension` → task → `CPDConfiguration.setIgnoreIdentifiers`
# 까지 제대로 흐르지만, PMD 7.7.0 의 `KotlinLanguageModule.createCpdLexer(LanguagePropertyBundle)`
# 가 그 번들을 **쓰지 않고** 인자 없는 `KotlinCpdLexer()` 를 만든다 — `CPD_ANONYMIZE_IDENTIFIERS`·
# `CPD_ANONYMIZE_LITERALS` 가 Kotlin 토크나이저에 닿을 길이 없다(바이트코드 확인).
#
# 두 키를 **남겨 두는 이유**는 배선이 옳고, PMD 가 Kotlin 에 그 속성을 잇는 판으로 올라가면 그날
# 효과가 나기 때문이다. 값은 참/거짓만 받는다(알 수 없는 값은 정책 오류). **이 주석이 그 사실을
# 들고 있는 한, 이 키의 존재가 「닫혔다」로 읽히지 않는다.**
#
# **알려진 한계 — Type-3**: 판정식 자체를 바꾼 복제(연산 순서·분기 모양 변경)는 토큰 열이 달라져
# 정규화가 동작해도 잡히지 않는다. 그 축은 중복 탐지의 종류가 다르고 PMD CPD 가 제공하지 않는다.
#
# **되돌림**: 둘을 `false` 로 바꾸면 선언이 사라진다 — 오늘의 거동은 어느 쪽이든 같다(위 실측).
normalize.identifiers=true
normalize.literals=true
