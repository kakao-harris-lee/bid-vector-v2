# 중복 코드 정책 — PMD CPD(`de.aaschmid.cpd`), ADR 0007 OPEN-ADR-16 (a)
#
# **main source set 한정 실패 모드다(운영자 결정 2026-09-06, HEAD f9d80e2 부근 실측).**
# `mode=fail`은 `fail.source-sets`(아래, D-6 `limit.type.members.source-sets`와 같은 이름
# 관례)에 있는 source set 의 중복만 `ignoreFailures=false`로 번역해 build 를 깨뜨린다. 그
# 밖의 source set(관례상 test)은 별도 task(`cpdCheckObserved`)가 `mode` 와 무관하게 항상
# `ignoreFailures=true`로 관찰만 한다 — 실측 근거: HEAD 에서 `cpdCheck`(main) 는 중복 0,
# `qualification/src/test/.../LicenseEligibilityTest.kt` 안에는 7–8줄(54–65 토큰) 중복 3건이
# 있다(전부 test, main 아님). `check`가 두 task 모두에 의존하고 각각의 presence gate
# (`cpdReportPresenceGate`/`cpdReportPresenceGateObserved`, D-4)가 리포트 XML 산출 자체를
# 단언한다 — 어느 쪽이 "실행 안 함"으로 조용히 퇴화해도 다른 쪽 존재가 가려주지 않는다.
# **되돌림**: `mode=observe`로 바꾸면 main 도 실패시키지 않는 이전 전체-관찰 동작으로
# 돌아간다(rollback.md).
policy.version=2

# CPD 가 재는 소스 언어 — Kotlin lexer 모드(PMD 7.x).
language=kotlin

# 토큰 50 미만으로 잘린 조각은 재지 못한다 — 관찰 한계(위협 모델 우회 6, scope.md).
minimumTokenCount=50

# PMD CPD 엔진 버전. Gradle 9.6.1 + Kotlin 2.4.10 조합에서 스모크 확인
# (`_workspace/m1-1a-b/01_scout_preflight.md` §1, 2026-09-05).
toolVersion=7.7.0

# observe|fail. 운영자 결정 2026-09-06 — main 만 fail, 나머지(test)는 아래
# fail.source-sets 밖이라 mode 와 무관하게 항상 observe(OPEN-ADR-16 (a) 잔여).
mode=fail

# `mode=fail`일 때 실패로 셀 source set. D-6(`limit.type.members.source-sets`)와 같은
# 이름 관례 — main 만(main+test 는 architecture-policy.properties 의
# module.expected-source-sets 가 정하는 전체 집합, D-2). 키가 없으면 실패한다(기본값
# 없음 — 조용한 전면 확대를 막는다).
fail.source-sets=main
