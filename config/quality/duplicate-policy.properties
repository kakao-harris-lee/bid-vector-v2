# 중복 코드 관찰 정책 — PMD CPD(`de.aaschmid.cpd`), ADR 0007 OPEN-ADR-16 (a)
#
# **관찰 모드다.** `mode=observe`는 `ignoreFailures=true`로 번역된다 — 리포트만 내고 build 를
# 깨뜨리지 않는다. 그래도 `check`가 `cpdCheck`에 의존하고 별도 task(`cpdReportPresenceGate`,
# D-4)가 리포트 XML 산출 자체를 단언한다 — 관찰 모드가 "실행 안 함"으로 조용히 퇴화하지
# 않게 한다. `mode=fail` 전환(실패 모드)은 1C 종료 시 운영자 결정이며, 이 slice 는 그
# 스위치를 만들지 않는다 — 값을 이 한 줄로 바꾸는 것 자체가 위협 모델 밖(하네스 저자의 편집)
# 이라는 전제 위에 있다.
policy.version=1

# CPD 가 재는 소스 언어 — Kotlin lexer 모드(PMD 7.x).
language=kotlin

# 토큰 50 미만으로 잘린 조각은 재지 못한다 — 관찰 한계(위협 모델 우회 6, scope.md).
minimumTokenCount=50

# PMD CPD 엔진 버전. Gradle 9.6.1 + Kotlin 2.4.10 조합에서 스모크 확인
# (`_workspace/m1-1a-b/01_scout_preflight.md` §1, 2026-09-05).
toolVersion=7.7.0

# observe|fail. 전환은 운영자 결정(D-4, OPEN-ADR-16 (a) 잔여) — 이 slice 는 만들지 않는다.
mode=observe
