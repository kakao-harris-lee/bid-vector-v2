# 게이트 test 의 **실행 단언** 목록 — `gateExecutionGate` 가 읽는다.
#
# 게이트를 test 로 표현하면 그 test 를 실행에서 빼는 것이 곧 게이트를 끄는 것이 된다
# (`Test.filter`·`--tests`·`onlyIf`). 그래서 「이 class 들이 실제로 돌았고 실패·건너뜀이 0」을
# 별도 task 가 단언한다. 목록의 근거: **게이트가 잡는다는 증거를 드는 test** 전부다 —
# 위반 fixture 를 평가하는 음성 단언과 production 바이트코드를 평가하는 양성 단언.
#
# 키는 Gradle 모듈 이름이다. 줄이 없는 모듈은 단언 대상이 없다.
policy.version=2

# M1/1B-c ④(1C·1D 가 축을 더함) — authoritative corpus 를 실제 계약과 대조하는 유일한
# 실행자(지금은 rate-unit·money-basis·license·base-amount-provenance·floor-shortfall·
# floor-threshold 여섯 축). 이 목록에서 빠지면 「대조됐다」주장이 gateExecutionGate 없이
# 조용히 거짓이 된다.
gate.tests.app=\
  bidvector.app.architecture.ArchitectureGateCatchesViolationsTest,\
  bidvector.app.architecture.ArchitectureGateTest,\
  bidvector.app.conformance.SharedKernelCorpusConformanceTest

