# 게이트 test 의 **실행 단언** 목록 — `gateExecutionGate` 가 읽는다.
#
# 게이트를 test 로 표현하면 그 test 를 실행에서 빼는 것이 곧 게이트를 끄는 것이 된다
# (`Test.filter`·`--tests`·`onlyIf`). 그래서 「이 class 들이 실제로 돌았고 실패·건너뜀이 0」을
# 별도 task 가 단언한다. 목록의 근거: **게이트가 잡는다는 증거를 드는 test** 전부다 —
# 위반 fixture 를 평가하는 음성 단언과 production 바이트코드를 평가하는 양성 단언.
#
# 키는 Gradle 모듈 이름이다. 줄이 없는 모듈은 단언 대상이 없다.
policy.version=2

# M1/1B-c ④(1C·1D 가 축을 더함) — authoritative corpus 를 실제 계약과 대조하는 유일한
# 실행자(지금은 rate-unit·money-basis·license·base-amount-provenance·floor-shortfall·
# floor-threshold 여섯 축). 이 목록에서 빠지면 「대조됐다」주장이 gateExecutionGate 없이
# 조용히 거짓이 된다.
gate.tests.app=\
  bidvector.app.architecture.ArchitectureGateCatchesViolationsTest,\
  bidvector.app.architecture.ArchitectureGateTest,\
  bidvector.app.conformance.SharedKernelCorpusConformanceTest

# M2/2A — `ml-contract`(included build) 생성 stub 의 유일한 손 소스 소비자. round-trip(⑦)·
# Rate.fraction 정규형(②)·fail-closed enum 거부(⑥)·봉투 필수값 거부(④)를 증명한다
# (scope.md 「구현 순서」 4). `GrpcKotlinStackSmokeTest`는 §4b 런타임 스모크 —
# grpc-kotlin-stub 1.5.0(POM 의 grpc-stub:1.62.2)이 grpc-bom 1.84.0 정렬 아래서 실제로
# 인스턴스화·재구성되는지(NoSuchMethodError 없음)를 증명한다.
#
# M2/2B — `PredictionContractTest`는 `BidPredictionService` 생성 코루틴 stub 위의 in-process
# fake servicer consumer test다. 3후보 고정 순서(scope.md ③)·`Unmeasurable` 두 사유 구별·
# release 일치(exact_release·latest_promoted, 2A ⑥ 인계)·fail-closed enum 거부·
# `Rate.fraction ≤ 1`(D-2B-8)·`Uncertainty.sample_size ≥ 1`·`FeatureInputs` fact oneof
# 미설정 거부·round-trip을 증명한다(scope.md 「구현 순서」 4, 위협 모델 우회 후보 (2)(3)(4)(6)(7)).
#
# M2/2C — `TrainingContractTest`는 `TrainingJobService` 생성 코루틴 stub 위의 in-process
# fake servicer(실제 상태 기계) consumer test다. idempotency 대조·미지 spec 거부·즉시
# ACCEPTED·전이표 밖 전이 거부·SUCCEEDED/FAILED 조합 불변식·CANCELLED artifact 첨부 거부·
# 종료 상태 cancel 멱등·timestamp 순서·dataset_id 일치·fail-closed enum 거부·checksum
# 정규형·round-trip을 증명한다(scope.md 「구현 순서」 3, 위협 모델 우회 후보 (1)(2)(3)(4)(6)(7)).
#
# M2/2D — `ContractUnknownFieldPreservationTest`는 정의 밖 필드 번호가 실제 in-process RPC
# 경계(client 재직렬화 → wire → server 재파싱)를 넘어도 보존되고 응답에는 없음을 증명한다(④).
# `ContractMaxPayloadTest`는 `max_message_bytes` 경계 쌍을 **localhost 소켓**(Netty)에서
# 증명한다(⑤ — in-process 전송은 marshaling 을 생략해 크기 강제가 걸리지 않음을 실측했다).
# `ContractDeadlineCancellationRetryTest`는 짧은 deadline 의 `DEADLINE_EXCEEDED`·coroutine
# 취소가 servicer 의 계산 중단 카운터(플래그 폴링 아님, D-2D-7)로 이어짐·retryable 상태만
# 정책 표본 상한 안에서 재시도함을 증명한다(⑥). `MultiServiceContractTest`는 2B·2C fake
# servicer 를 **같은 in-process 서버**에 함께 등록해 ADR 0010 D-8 "같은 gRPC 서버"의 배선
# 가능성을 증명한다(⑧).
#
# M3/3B — `KonepsOpenApiNoticeSourceTest`는 JDK `HttpServer` loopback mock 위의 scope.md ⑦
# 시나리오 전부(COL-01 공고번호 없음 drop·429 bounded retry 호출횟수·timeout·totalCount
# 부재+같은 페이지 반복 truncated·미지/부재 resultCode Unclassified 비재시도·COL-07
# unknownFields·resultCode 03 NoData·22/30 quota)를 증명한다. `KonepsAdapterDependencyTest`
# 는 S-3b(koneps 패키지의 domain import 는 procurement·shared-kernel 뿐)를 증명한다.
# `ServiceKeyTest`는 D-3B-5(서비스 키가 `toString()`에 노출되지 않음)를 증명한다.
#
# M3/3D — Testcontainers PostgreSQL 위 persistence 통합 test 전부(ADR 0004 D-1, Docker 부재는
# 실패). `CleanMigrationTest`는 S-5(빈 컨테이너 migrate 결과가 information_schema·pg_catalog
# 기대 목록과 같음 + flyway validate + bidvector_app 권한). `PrecedenceMutationTest`는 S-3
# (직접 SQL·superuser 둘 다로 점유 가드·존재 가드·CHECK 우회를 시도해 전부 거부됨을 증명,
# Kotlin write 규칙의 사전 필터도 함께 실측). `ItemAtomicityTest`는 S-4(3항목 중 2번째 실패
# 시 1·3만 커밋 + collection_run 별도 트랜잭션). `NoticeVersioningTest`는 ③ 멱등 upsert·
# revision 증가+audit·OPEN-DIC-06(Undeclared는 거부되지 않고 빈 자리만 채움). `RawAppendOnlyTest`
# 는 ② raw·notice_audit append-only(권한+트리거 두 겹, 우회 (9)(10)). `ProvenanceAuthoritySeedTest`
# 는 DB seed와 `IS_AUTHORITATIVE`(procurement)의 완전 일치. `OpeningQualificationRepositoryTest`
# 는 opening_result·qualification_text의 「최신 관측 우선」 upsert(OPEN-DIC-09 잠정 ⓐ).
# `PersistenceAdapterDependencyTest`는 persistence 패키지의 domain import가 procurement·
# shared-kernel뿐임을 증명한다(`KonepsAdapterDependencyTest`와 같은 관례).
#
# verifier r1 수정 라운드 1(F-1~F-8) — `F2CollisionRegressionTest`는 F-2("Aa"/"BB" 32비트
# hashCode 충돌쌍이 이제 서로 다른 ObservationKey·raw 행 2건을 낸다). `NoticeFindRoundTripTest`
# 는 F-8(금액·범주·마감이 모두 실린 notice의 find() 왕복 손실 없음). 나머지 여섯 class에
# F-1(값만 바뀌는 write 거부)·F-4(비권위→비권위 거부 + Kotlin/DB 술어 쌍별 일치)·F-5
# (opening_result·qualification_text 직접 SQL 위조 거부)·F-6(notice_audit 위조 INSERT
# 거부 + SECURITY DEFINER 트리거 정상 동작) 재현 test를 추가했다(각 class 자체 KDoc 참고).
gate.tests.adapters=\
  bidvector.adapters.contract.ContractDeadlineCancellationRetryTest,\
  bidvector.adapters.contract.ContractMaxPayloadTest,\
  bidvector.adapters.contract.ContractRoundTripTest,\
  bidvector.adapters.contract.ContractUnknownFieldPreservationTest,\
  bidvector.adapters.contract.GrpcKotlinStackSmokeTest,\
  bidvector.adapters.contract.MultiServiceContractTest,\
  bidvector.adapters.contract.PredictionContractTest,\
  bidvector.adapters.contract.TrainingContractTest,\
  bidvector.adapters.koneps.KonepsAdapterDependencyTest,\
  bidvector.adapters.koneps.KonepsOpenApiNoticeSourceTest,\
  bidvector.adapters.koneps.ServiceKeyTest,\
  bidvector.adapters.persistence.CleanMigrationTest,\
  bidvector.adapters.persistence.CleanMigrationTriggerTest,\
  bidvector.adapters.persistence.F2CollisionRegressionTest,\
  bidvector.adapters.persistence.ItemAtomicityTest,\
  bidvector.adapters.persistence.NoticeFindRoundTripTest,\
  bidvector.adapters.persistence.NoticeReconstructionTest,\
  bidvector.adapters.persistence.NoticeVersioningTest,\
  bidvector.adapters.persistence.OpeningQualificationRepositoryTest,\
  bidvector.adapters.persistence.PersistenceAdapterDependencyTest,\
  bidvector.adapters.persistence.PrecedenceLabelColumnTest,\
  bidvector.adapters.persistence.PrecedenceMutationTest,\
  bidvector.adapters.persistence.PrecedenceParityTest,\
  bidvector.adapters.persistence.ProvenanceAuthoritySeedTest,\
  bidvector.adapters.persistence.RawAppendOnlyTest,\
  bidvector.adapters.persistence.RawObservationSourceTextRoundTripTest

# M1/1B — ADR 0002 §6 ①("상호 대입이 컴파일되지 않는다")의 유일한 기계적 증명(설계 검토
