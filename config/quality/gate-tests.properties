# 게이트 test 의 **실행 단언** 목록 — `gateExecutionGate` 가 읽는다.
#
# 게이트를 test 로 표현하면 그 test 를 실행에서 빼는 것이 곧 게이트를 끄는 것이 된다
# (`Test.filter`·`--tests`·`onlyIf`). 그래서 「이 class 들이 실제로 돌았고 실패·건너뜀이 0」을
# 별도 task 가 단언한다. 목록의 근거: **게이트가 잡는다는 증거를 드는 test** 전부다 —
# 위반 fixture 를 평가하는 음성 단언과 production 바이트코드를 평가하는 양성 단언.
#
# 키는 Gradle 모듈 이름이다. 줄이 없는 모듈은 단언 대상이 없다.
policy.version=2

# M1/1B-c ④ — 1B 축(rate-unit·money-basis) authoritative corpus 를 실제 계약과 대조하는
# 유일한 실행자. 이 목록에서 빠지면 「대조됐다」주장이 gateExecutionGate 없이 조용히 거짓이 된다.
gate.tests.app=\
  bidvector.app.architecture.ArchitectureGateCatchesViolationsTest,\
  bidvector.app.architecture.ArchitectureGateTest,\
  bidvector.app.conformance.SharedKernelCorpusConformanceTest

# M1/1B — ADR 0002 §6 ①("상호 대입이 컴파일되지 않는다")의 유일한 기계적 증명(설계 검토
# §4.9). kotlin-compiler-embeddable 로 음성 fixture 컴파일 실패 + 진단 내용과, 2~3 토큰만
# (verifier r1 L-3 정정 — 「한 토큰만」은 부정확했다) 다른 양성 쌍둥이의 컴파일 성공을
# 함께 단언한다.
gate.tests.shared-kernel=\
  bidvector.sharedkernel.CompileFailureHarnessTest

# M1/1A-b verifier r1 M-3 — build-logic 은 게이트 **정의**가 사는 모듈이라 그 test 스위트
# 전부가 "게이트가 잡는다는 증거를 드는 test"다(app/shared-kernel과 달리 이 모듈에 무관한
# 도메인 test 가 섞여 있지 않다 — 판단 근거를 evidence checklist.md 에 남긴다). 18개 전부
# 등재한다 — 그중 `TestFixturesGateTest`는 ④(a) constructive 가드의 **유일한 실행 증거**라
# 특히 중요하다(`--tests` 로 빼도 가드 자체는 살아 있지만 증거층이 사각이 된다, M-3).
gate.tests.build-logic=\
  bidvector.buildlogic.ApiTypePolicyTest,\
  bidvector.buildlogic.CpdReportPresenceTest,\
  bidvector.buildlogic.DomainApiTypeFixtureTest,\
  bidvector.buildlogic.DomainSourceReferenceFixtureTest,\
  bidvector.buildlogic.DuplicatePolicyTest,\
  bidvector.buildlogic.ForbiddenFamilyCoverageTest,\
  bidvector.buildlogic.JarContentPolicyTest,\
  bidvector.buildlogic.KotlinFunctionLengthsTest,\
  bidvector.buildlogic.MemberEffectClassificationTest,\
  bidvector.buildlogic.MemberEffectDerivationTest,\
  bidvector.buildlogic.ModuleDependencyPolicyTest,\
  bidvector.buildlogic.PackageOwnershipPolicyTest,\
  bidvector.buildlogic.PublicApiTypesTest,\
  bidvector.buildlogic.SourceReferencePolicyTest,\
  bidvector.buildlogic.SourceReferencesTest,\
  bidvector.buildlogic.TestFixturesGateTest,\
  bidvector.buildlogic.TypeMembersTest,\
  bidvector.buildlogic.TypeShapeFixtureTest,\
  bidvector.buildlogic.TypeShapeRatchetPolicyTest

# class 당 최소 testcase 수. 0 이면 「실행됐다」만 본다.
gate.tests.minimum=1
