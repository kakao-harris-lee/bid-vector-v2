  bidvector.strategy.WatchRulesTest

# M3/3A — 수집 port 와 canonical fact 커널 불변식 test. `AccountingTest`의 COL-06 항등식
# 생성자 불변식·`Duplicate` 부재(우회 2)·property test, `ResolvedBaseAmountTest`의 `Direct`
# 폐쇄 생성(우회 4a·4b)·`isAuthoritative` 데이터 표·점유 가드 판정, `FieldContractTest`·
# `RawObservationTest`의 `presentIn`·`sourceZone`·`unit` 불변식·레지스트리 중복 거부·
# **같은 모듈 안** 미지 키 판별(COL-07, 우회 1a) — **우회 (1b)·(10)(다른 모듈이 계약을 지어
# 미등재 키를 읽음)의 폐쇄는 `KonepsFieldContract`·`KonepsFieldContractRegistry`의 생성자와
# `of()` 팩토리를 모두 `internal`로 닫는 것이 서고(verifier r1 F-4, r2 N-1), 그 증거는 다른
# 모듈에서의 컴파일 실패라 이 gate 안의 test 로 상주하지 않는다**(evidence
# `reports/evidence/m3/3a/commands.md`·`checklist.md`의 N-1 실측 기록 참고), `NoticeIdTest`의
# `NoticeRound` 제로패딩 폐쇄(R-QUAL-05, 우회 3), `NoticeTest`의 `Notice.applyEvent` 표 밖
# 전이 거부 관측(우회 5) — **`Notice.collected()`는 다른 모듈에서도 호출 가능함을 실측했다
# (항상 `Open`만 내므로 위협이 아니다). 우회 5 가 실제로 막는 것은 `copy(status=…)`이고 그것만
