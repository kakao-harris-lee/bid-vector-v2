# `KonepsCollectionPolicyDataTest`의 추정가격 순서 기초금액 키 교차 거부(§5.2, 우회 11)가
# 그 증거다(scope.md 위협 모델, 우회 후보 (1)~(11)).
#
# M3/3D — `ObservationKeyTest`는 raw 관측의 결정적 재수집 멱등 키(③)가 같은 내용→같은 키·
