# M7/7F-local — **리버스 프록시 이미지** 위생 게이트 정책 데이터(계약 산출물 2, 운영자 결정
# D-7F-1). web 정책과 **같은 갈래**(`runtime.kind`)를 쓰고 값만 다르다 — 사유는 web 정책의 같은
# 자리에 있다. 값 없는 키·CRLF·허용 문자 밖 원소는 정책 오류다.
# 정본 문서: reports/evidence/m7/7f/scope.md.
policy.version=1

runtime.kind=caddy-site

# 2026-10-16 실측(`docker image inspect .Size`, 베이스 2.11.7) — **66,348,248 바이트**(상한의 83%). 이 이미지가
# 싣는 것은 베이스 + 사용자 생성 + 설정 파일 하나다. 상한이 잡는 사고는 「프록시 이미지에 내용이
# 들어오는 것」이다: 인증서 꾸러미·정적 번들·도구를 구우면 이 축이 먼저 붉어진다. web 보다 여유를
# 좁게 두는 이유가 그것이다(web 은 7E 가 번들을 키울 여지를 남겨야 한다).
size.cap.bytes=80000000

# non-root UID 하한 — 다른 세 정책과 같은 값·같은 근거. 이 이미지는 `/data`·`/config` 의 소유권을
# 그 uid 로 옮긴다(`tls internal` 이 실행 시 CA 를 그 아래 만든다).
nonroot.uid.min=1000

# 베이스 다이제스트 고정 — **web 이미지의 runtime stage 와 같은 값**이다(두 이미지가 서로 다른
# Caddy 판으로 갈라지지 않게 같은 다이제스트를 쓴다). 게이트가 이 값을 풀어 실제 layer 체인을
# 파생한다. 알려진 제한은 기존 정책들과 같다(레지스트리 접근 필요 · linux/amd64 하드코딩).
base.image.repo=caddy
base.image.digest=sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af

# ① 금지 실행 파일 — web 과 같은 목록·같은 사유(빌더 누출·베이스 교체). 이 이미지에는 빌더
# stage 가 없지만 목록을 좁히지 않는다: 잡는 것이 「이 이미지에 빌드 도구가 생겼다」이고, 그
# 사고는 베이스를 바꾸거나 `RUN` 을 더하는 편집에서 똑같이 온다. 2026-10-16 실측: 여덟 다 부재.
forbidden.executables=node,npm,npx,yarn,pnpm,gcc,cc,make

# `apk` 예외의 사유는 web 정책의 같은 자리에 있다(보상 통제 + 스캐너의 OS 열거를 눈멀게 하지
# 않는다). 이 이미지도 같은 베이스라 상태가 같다.

# ①' 필수 실행 파일 — compose 의 proxy healthcheck 가 이미지 안 `curl` 로 **로컬 CA 를 신뢰한
# https 요청**을 던진다(그래서 healthy 의 뜻이 「발급이 끝났다」가 된다). 그 전제를 이름 있는
# 축으로 둔다. 2026-10-16 실측: 있다.
required.executables=curl

# ② 이미지가 싣고 있는 내용 — 이 이미지의 「내용」은 **구워진 설정 하나**다.
content.path=/etc/caddy
# 양성 대조 — 경로가 틀리면 아래 금지 패턴이 공허하게 참이 된다. 2026-10-16 실측 1(Caddyfile).
content.min-entries=1
# 필수 내용 — 설정이 **이미지에 구워져 있다**는 사실 자체가 이 slice 의 선택이다(bind mount 를
# 쓰지 않는다 — 뜬 컨테이너의 규칙과 저장소의 파일이 갈라질 자리를 만들지 않는다). 설정이 없으면
# 컨테이너는 어차피 뜨지 않지만, 그 증상은 「기동 실패」라 원인을 가리지 않는다.
required.content.patterns=Caddyfile
# 금지 내용 — **키·인증서 재료**. 계약의 「저장소에 키도 인증서도 없다」를 이미지 축에서 다시
# 잠근다: 로컬 CA 는 `tls internal` 이 **실행 시** `/data` 에 만들고, 설정 디렉터리에는 어떤 키도
# 구워지지 않는다. 운영 인증서를 이미지에 굽는 편집이 생기면 이 축이 그 자리에서 붉어진다.
forbidden.content.patterns=.pem,.key,.crt,.p12,.pfx
