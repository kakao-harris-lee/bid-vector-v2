# public domain API 의 타입 규율 — milestone-1.md 「완료 조건」 · v2-지침서.md §4.1 · ADR 0002 D-2·D-4
#
# 이 목록은 deny 지만 **열린 열거가 아니다** — 바깥 우주가 architecture-policy 의 T-A~T-C 로
# 이미 닫혀 있고, 그 안에서 부동소수를 담는 좌표는 Kotlin 의 부동소수 타입 둘 + 그 배열 형 +
# 박싱 쌍둥이 + 수치 상위 타입으로 끝난다. 근거 전문은 _workspace 의 설계 검토가 든다.
#
# **문면보다 넓다**(운영자 결정 2026-09-04, scope.md 「계약 갱신」):
#   - 문면은 「금액/rate」지만 게이트는 의미를 판별할 수 없다. 이름 규약은 ADR 0002 A-1 이 불채택.
#   - Float·DoubleArray·FloatArray 는 같은 취지의 우회로라 함께 든다.
#   - Number 는 「값 크기로 단위를 추측하는」 표면이라 든다.
policy.version=1
api.forbidden.types=kotlin.Double,kotlin.Float,kotlin.DoubleArray,kotlin.FloatArray,\
  kotlin.Number,java.lang.Double,java.lang.Float,java.lang.Number
