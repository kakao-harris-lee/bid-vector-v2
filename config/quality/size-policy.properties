# 크기 정책 — v2-지침서.md §5 「크기와 결합도」 · ADR 0007 D-4
#
# **파일 크기 축의 정본이 이 파일이다.** detekt 에는 파일 길이 규칙이 없어 도구 없이 서는
# sizeGate task 가 이 축을 든다 — ADR 0007 D-7 이 요구한 「도구에 의존하지 않는 자체 검사」이며
# detekt 이 alpha 인 동안 승인된 임계가 그 도구와 함께 죽지 않게 한다.
#
# **함수 크기 축도 여기다.** sizeGate 가 Kotlin PSI 로 직접 재므로 detekt 을 경유하지 않는다 —
# 그래서 `@Suppress` 가 어떤 표기든 이 임계에 영향이 없다. `detekt.yml` 의 `LongMethod` 는
# 비활성이다(같은 수가 두 자리에 있으면 안 된다).
#
# 승인 문서가 수치로 정한 임계는 그 둘뿐이다. 나머지 축(복잡도·중첩·결합도)의 수치는
# 정해진 바가 없어 1A 가 지어내지 않는다 — detekt 은 도구 기본값을 쓰고 qualityBaseline 이
# 실측을 남긴다(OPEN-ADR-06).
# **임계 수치는 v4 이후 바뀌지 않았다** — 판이 오른 것은 그 임계를 받는 대상이 넓어져서다.
# v5 「본문을 갖는 선언 전부」 · v6 `.kts` 도 같은 임계.
# v7(M1/1A-b ①, 운영자 결정 2026-09-05) — 타입 멤버 수 상한 신설(OPEN-ADR-06 (a)).
policy.version=7

# v2-지침서.md §5 — "V2 코드(이식한 ML 코드 포함) 기준 권장 한도는 Kotlin/Python 함수 50줄, 파일 500줄"
limit.file.lines=500

# v2-지침서.md §5 — 같은 문장의 "Kotlin/Python 함수 50줄".
#
# **여기서 「함수」는 본문을 갖는 선언 전부다** — 함수·람다·프로퍼티 접근자·`init` 블록·보조
# 생성자. 표기를 골라 임계를 비껴가는 자리를 남기지 않으려는 것이며, 표기 하나를 빠뜨리면
# 그것이 곧 우회 경로가 된다(「45줄 함수 + 20줄 람다」·`get() { }`·`init { }`).
# 본문이 없는 선언(주 생성자·추상 함수)과 값을 담을 뿐인 프로퍼티 초기화식은 이 축이 아니다 —
# §5 는 rule table 을 권하므로 데이터가 길다고 함수가 긴 것이 아니다. 그쪽은 파일 축이 든다.
#
# **`.kts` 도 같은 임계를 받는다** — 빌드 로직은 이 저장소에서 실제 코드이고, 빼 두면 긴 함수가
# 스크립트로 옮겨 가는 것이 우회가 된다. 다만 스크립트의 top-level 문장은 함수 본문이 아니라
# 같은 「본문 없는 선언」 쪽이므로 재지 않는다 — 그 안의 람다는 이미 재므로 새는 것이 없다.
limit.function.lines=50

# M1/1A-b ①(OPEN-ADR-06 (a), 운영자 값 30) — 타입(클래스·객체·인터페이스) 하나의 멤버 수 상한.
# **Kotlin PSI 소스** 기준(`MeasuredType.kt`)이지 바이트코드 기준(`QualityBaselineTask` 의
# `maxTypeMembers`)이 아니다 — data class 의 컴파일러 합성 멤버(getter·`componentN`·`copy`·
# `equals`/`hashCode`/`toString`)는 소스에 없어 세지 않는다. 「멤버」의 정의는 주 생성자
# `val`/`var` 파라미터 + 본문 프로퍼티(접근자는 프로퍼티에 포함) + 함수 + 보조 생성자 +
# `init` 블록이다. 중첩·companion 타입은 자기 타입으로 따로 계수하고(멤버 아님), enum entry
# 는 멤버가 아니다(데이터). 실측(2026-09-05, `_workspace/m1-1a-b/01_scout_preflight.md` §2):
# 이 저장소 현재 PSI 최대 6, 바이트코드 최대 20 — 상한 30은 그 여유를 반영한 **운영자 값**이지
# 회귀 추적선(ratchet)이 아니다.
limit.type.members=30

# M1/1A-b D-6(Phase 3 중 신설, 2026-09-05 — 팀장 판단) — 타입 멤버 축이 재는(gate) 대상
# source set. D-5 로 실측됨: build-logic/src/test 의 SourceReferencesTest(@Test 35,
# 471줄, 정상적인 포괄 test 스위트)가 mixin 팽창 없이 상한 30 을 넘겼다. 이 축의 근거
# (ADR 0007 §1.3)는 프로덕션 타입의 합성 팽창이고 test 클래스는 case 수만큼 자연히
# 커지므로, test source set 을 면제한다 — 면제는 이 멤버 축 하나뿐이다(파일 500·함수
# 50 축은 test 에 그대로 적용, 1A 관례 불변). 키가 없으면 실패한다(기본값 없음 — 조용한
# 전면 면제를 막는다). 제외된 source set 의 수치도 리포트에는 관찰로 남는다.
limit.type.members.source-sets=main

# M1/1A-b ②(OPEN-ADR-06 (a)) — 상속 깊이·구현 인터페이스 수 **래칫**(D-3: 증가 금지, 위
# `limit.*`처럼 고정 임계가 아니다). 값은 이 저장소 실측 최댓값(2026-09-05,
# `_workspace/m1-1a-b/01_scout_preflight.md` §3, 9모듈 전체 재실측)이다 — 정당한 도메인
# 모델링(sealed 계층 확장 등)으로 늘어야 하면 이 값을 올리는 편집 자체가 ADR 0007 개정
# 대상이지 이 slice 가 자유로이 바꿀 상수가 아니다. 측정은 바이트코드 기준
# (`TypeShape.kt` — PSI로는 상위 타입 해석이 안 된다), `qualityBaseline`과 `typeShapeGate`가
# 같은 함수로 잰다(중복 금지).
ratchet.type.inheritance-depth.max=2
ratchet.type.interfaces.max=1

