# 크기 정책 — v2-지침서.md §5 「크기와 결합도」 · ADR 0007 D-4
#
# 이 파일이 두 임계의 **유일한 자리**다. detekt 설정은 여기서 생성한 overlay 로 덮이므로
# 같은 수를 두 곳에 적지 않는다(detektThresholdOverlay task).
#
# 승인 문서가 수치로 정한 임계는 이 둘뿐이다. 나머지 축(복잡도·중첩·결합도)의 수치는
# 정해진 바가 없어 1A 가 지어내지 않는다 — config/detekt/detekt.yml 은 도구 기본값을 쓰고
# qualityBaseline 이 실측을 남긴다(OPEN-ADR-06).
policy.version=1

# v2-지침서.md §5 — "V2 코드(이식한 ML 코드 포함) 기준 권장 한도는 Kotlin/Python 함수 50줄, 파일 500줄"
limit.function.lines=50
limit.file.lines=500
