# 크기 정책 — v2-지침서.md §5 「크기와 결합도」 · ADR 0007 D-4
#
# **파일 크기 축의 정본이 이 파일이다.** detekt 에는 파일 길이 규칙이 없어 도구 없이 서는
# sizeGate task 가 이 축을 든다 — ADR 0007 D-7 이 요구한 「도구에 의존하지 않는 자체 검사」이며
# detekt 이 alpha 인 동안 승인된 임계가 그 도구와 함께 죽지 않게 한다.
#
# **함수 크기 축도 여기다.** sizeGate 가 Kotlin PSI 로 직접 재므로 detekt 을 경유하지 않는다 —
# 그래서 `@Suppress` 가 어떤 표기든 이 임계에 영향이 없다. `detekt.yml` 의 `LongMethod` 는
# 비활성이다(같은 수가 두 자리에 있으면 안 된다).
#
# 승인 문서가 수치로 정한 임계는 그 둘뿐이다. 나머지 축(복잡도·중첩·결합도)의 수치는
# 정해진 바가 없어 1A 가 지어내지 않는다 — detekt 은 도구 기본값을 쓰고 qualityBaseline 이
# 실측을 남긴다(OPEN-ADR-06).
policy.version=4

# v2-지침서.md §5 — "V2 코드(이식한 ML 코드 포함) 기준 권장 한도는 Kotlin/Python 함수 50줄, 파일 500줄"
limit.file.lines=500

# v2-지침서.md §5 — 같은 문장의 "Kotlin/Python 함수 50줄". 람다도 이 한도를 받는다:
# 재지 않으면 「45줄 함수 + 20줄 람다」가 한 줄짜리 우회가 된다.
limit.function.lines=50

