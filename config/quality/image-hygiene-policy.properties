# M6/6C — 이미지 위생 게이트 정책 데이터(scope.md ⑥, 설계 검토 (1)). 값 없는 키는 정책
# 오류다(1A 관례 — 매직 넘버 금지, 값을 tools/image-hygiene-check.sh 에 리터럴로 박지
# 않는다). 정본 문서: reports/evidence/m6/6c/scope.md.
policy.version=1

# 5A D-5A-0 (b) — serving 런타임에 들어오면 안 되는 다섯(학습·DB·HTTP 의존). 각각 실제
# import 를 시도해 실패하는지로 실측한다(이름 대조가 아니라 구조, 우회 (2)).
forbidden.packages=sqlalchemy,psycopg,requests,httpx,celery

# 2026-09-16 실측(docker save | wc -c) — wheel(grpcio·protobuf·numpy·lightgbm·scipy·
# pyyaml) + python:3.12.8-slim-bookworm 런타임 = 약 113.7MB. 성장 여유를 두되 학습
# 전용 의존(예: scikit-learn 전체 스택)이 잘못 들어오는 크기 이상 급증은 잡는다.
size.cap.bytes=400000000

# non-root UID 하한 — 0(root)은 항상 거부. 시스템 계정 관례(1000 미만은 데몬/패키지
# 예약대라 애플리케이션 전용 UID 로 보기 어렵다는 통상 관례)를 그대로 따른다.
nonroot.uid.min=1000
