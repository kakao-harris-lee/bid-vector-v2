# M6/6C — 이미지 위생 게이트 정책 데이터(scope.md ⑥, 설계 검토 (1)). 값 없는 키는 정책
# 오류다(1A 관례 — 매직 넘버 금지, 값을 tools/image-hygiene-check.sh 에 리터럴로 박지
# 않는다). 정본 문서: reports/evidence/m6/6c/scope.md.
policy.version=1

# 5A D-5A-0 (b) — serving 런타임에 들어오면 안 되는 다섯(학습·DB·HTTP 의존). 각각 실제
# import 를 시도해 실패하는지로 실측한다(이름 대조가 아니라 구조, 우회 (2)).
forbidden.packages=sqlalchemy,psycopg,requests,httpx,celery

# 2026-09-16 실측(docker save | wc -c) — wheel(grpcio·protobuf·numpy·lightgbm·scipy·
# pyyaml) + python:3.12.8-slim-bookworm 런타임 = 약 113.7MB. 성장 여유를 두되 학습
# 전용 의존(예: scikit-learn 전체 스택)이 잘못 들어오는 크기 이상 급증은 잡는다.
size.cap.bytes=400000000

# non-root UID 하한 — 0(root)은 항상 거부. 시스템 계정 관례(1000 미만은 데몬/패키지
# 예약대라 애플리케이션 전용 UID 로 보기 어렵다는 통상 관례)를 그대로 따른다. F-1
# (D-6C-9, verifier r1 HIGH) 이후 이 값은 **실 ENTRYPOINT 로 띄운 컨테이너의 pid 1
# 사용자**(`docker top -eo pid,uid,comm`)와 대조한다 — `--entrypoint id`로 덮어써 재는
# "선언"이 아니다(그 형태는 USER 를 유지한 채 setuid 로 root 를 얻는 entrypoint 를
# 통과시켰다, verifier r1 실측).
nonroot.uid.min=1000

# F-2(D-6C-9, verifier r1 HIGH) — 베이스 다이제스트 고정을 손으로 적는 라벨 문자열이
# 아니라 **빌드가 실제로 만든 layer 체인**으로 잰다. 아래 넷은
# `python:3.12.8-slim-bookworm@sha256:2199a62885a12290dc9c5be3ca0681d367576ab7bf037da120e564723292a2f0`
# 의 linux/amd64 platform manifest(다이제스트
# `sha256:8859bd6ca943079262c27e38b7119cdacede77c463139a15651dd340087a6cc9`)가 낸
# `RootFS.Layers` 그대로다(2026-09-16 실측 — `docker buildx imagetools inspect <위 다이제스트>`
# 로 platform manifest 다이제스트를 얻고 `docker pull`+`docker inspect
# --format '{{json .RootFS.Layers}}'`로 조회). 이 값은 **위조할 수 없다** — Dockerfile 이
# 다른 이미지에서 시작하면 content-addressed 다이제스트가 우연히도 같은 값이 나올 수 없다.
# CI 러너(ubuntu-latest, amd64)와 같은 플랫폼을 겨눈다 — 다른 플랫폼(arm64 등)에서 빌드하면
# 첫 layer 부터 어긋난다(`OPEN-6C-MULTIARCH`, 6E 전까지 대상 밖). `FROM`의 다이제스트를
# 바꾸면 이 값도 같은 절차로 다시 뽑아 갱신한다 — 라벨과 이 값이 항상 같은 다이제스트를
# 가리키는지는 사람이 리뷰에서 확인한다(라벨은 보조, 이 값이 구속력 있는 정본).
base.image.layers=sha256:7914c8f600f532b7adbd0b003888e3aa921687d62dbe2f1f829d0ab6234a158a,sha256:46cd1391c75e48c6efe37a2cef3e3e267b0dd5f0c7dd370440b9bf22861bb208,sha256:e6c4c63db83312c93d00e0e6e03ae1392b27d8a93a9270a425a95603ed3170ab,sha256:cc193c810c6eab0be16f4e0ab33f34d93469b9e3040c0b43ec8477905da24f6a
