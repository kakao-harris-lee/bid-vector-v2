# M6/6C — 이미지 위생 게이트 정책 데이터(scope.md ⑥, 설계 검토 (1)). 값 없는 키는 정책
# 오류다(1A 관례 — 매직 넘버 금지, 값을 tools/image-hygiene-check.sh 에 리터럴로 박지
# 않는다). 정본 문서: reports/evidence/m6/6c/scope.md.
#
# R2-1(D-6C-10 ①, verifier r2 HIGH) — 값이 비어 있거나 CRLF 가 섞이면 정책 오류로
# 거부한다(스크립트의 `_policy_value`가 kind별로 모양을 본다). 이 파일을 편집할 때
# **값만 지우고 키를 남기는 실수**가 조용히 게이트를 끄지 않는다.
policy.version=2

# 5A D-5A-0 (b) — serving 런타임에 들어오면 안 되는 다섯(학습·DB·HTTP 의존). 각각 실제
# import 를 시도해 실패하는지로 실측한다(이름 대조가 아니라 구조, 우회 (2)).
forbidden.packages=sqlalchemy,psycopg,requests,httpx,celery

# 2026-09-16 실측(docker save | wc -c) — wheel(grpcio·protobuf·numpy·lightgbm·scipy·
# pyyaml) + python:3.12.8-slim-bookworm 런타임 = 약 113.7MB. 성장 여유를 두되 학습
# 전용 의존(예: scikit-learn 전체 스택)이 잘못 들어오는 크기 이상 급증은 잡는다.
size.cap.bytes=400000000

# non-root UID 하한 — 0(root)은 항상 거부. 시스템 계정 관례(1000 미만은 데몬/패키지
# 예약대라 애플리케이션 전용 UID 로 보기 어렵다는 통상 관례)를 그대로 따른다. F-1
# (D-6C-9, verifier r1 HIGH) 이후 이 값은 **실 ENTRYPOINT 로 띄운 컨테이너의 pid 1
# 사용자**(`docker top -eo pid,uid,comm`)와 대조한다 — `--entrypoint id`로 덮어써 재는
# "선언"이 아니다(그 형태는 USER 를 유지한 채 setuid 로 root 를 얻는 entrypoint 를
# 통과시켰다, verifier r1 실측).
nonroot.uid.min=1000

# R2-4(D-6C-10 ②, verifier r2 MEDIUM, F-2/D-6C-9 승계) — 베이스 다이제스트 고정 값은
# **layer 목록이 아니라 다이제스트 하나**다(직전 판은 layer 넷을 여기 나열했는데, 그
# 목록 자체를 변이 이미지 것으로 바꿔치면 게이트가 통과했다 — 바꿔치기 표면이 목록
# 전체였다). 이 값은 Dockerfile 의 두 `FROM` 과 **글자 그대로 같다** — 다이제스트가
# 어긋나면 diff 에서 바로 보인다. 게이트가 이 값을 `docker buildx imagetools inspect`로
# 풀어(멀티플랫폼 index → linux/amd64 platform manifest) 그때그때 실제 layer 체인을
# 파생한다 — 목록을 여기 다시 적지 않으므로 "정책과 이미지가 몰래 같이 바뀌는" 경로가
# 없다. 알려진 제한: 이 파생에 **레지스트리 네트워크 접근이 필요**하다 — 접근이 없는
# 환경에서는 이 축이 판정 불가로 실패한다(checklist.md). **linux/amd64 선택은 하드코딩이다
# (`OPEN-6C-MULTIARCH`, 6E 전까지 대상 밖)** — 다른 플랫폼(arm64 등)에서 빌드하면 이
# 파생 자체가 다른 layer 를 낸다(fail-closed 지만 게이트 문면이 그 가능성을 함께
# 언급한다, R3-3 verifier r3 LOW — 직전 판 주석에 있던 이 단서가 재작성에서 빠졌었다).
base.image.repo=python
base.image.digest=sha256:2199a62885a12290dc9c5be3ca0681d367576ab7bf037da120e564723292a2f0
