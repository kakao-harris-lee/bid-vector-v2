# ADR 0007 `OPEN-ADR-07` — mutation 도구(pitest)의 대상 집합과 절대값 래칫.
#
# **세 축 전부 실측값이다.** 값을 지어내지 않는다(`OPEN-ADR-16` 해소문의 「수치를 지어내지
# 않는다」와 같은 규율). 올리는 것(엄격해지는 방향)은 보통의 변경이고, **내리는 것은 명시적
# 정책 변경**이다 — 이 파일의 diff 가 그 사실을 드러내는 것이 설계 목표다.
#
# 축이 셋인 이유: 하나만으로는 「대상을 줄여 점수를 유지하는」 경로가 열린다. 점수만 보면
# `targetClasses` 를 좁히거나 클래스를 제외 목록으로 빼는 것이 통과이고, 변이 수만 보면
# 테스트를 지우는 것이 통과다.
#
# **도구 버전은 이 파일에 없다** — `gradle/libs.versions.toml` 이 든다(같은 수를 두 자리에
# 두지 않는다). 여기 있는 것은 카탈로그가 가질 수 없는 값뿐이다.
#
# mutator 집합은 **도구 기본값**(`DEFAULTS`)이고 설정하지 않는다. pitest 자신의
# `mutationThreshold` 도 쓰지 않는다 — 판정은 `mutationReportGate` 가 리포트에서 재계산한다.
policy.version=1

# 대상 모듈. `layer.domain`(architecture-policy.properties) 안에서만 고를 수 있고, 그 제약은
# `bidvector.mutation-conventions` 가 **구성 단계에서** 끊는다. 이 집합과 실제 적용 집합의
# 양방향 등식은 `mutationCoverageGate` 가 잰다 — 모듈에서 convention 을 빼면 래칫 task 가
# 사라져 아무것도 실패하지 않기 때문이다.
#
# **지금은 순수 도메인 모듈 전부다.** 비용 실측이 그렇게 정했다(evidence 의 비용표: 변이 분석
# core 시간 합이 분 단위, 가장 큰 모듈 하나가 4분 미만) — 부분집합을 고를 이유가 측정에서
# 나오지 않았다. 한 모듈을 빼야 할 만큼 비싸지면 그것은 이 한 줄의 편집이고, 빠진 사실은
# 위 등식이 그대로 든다(이름이 없는 것이 곧 선언이다).
mutation.modules=bidding,decision,procurement,qualification,settlement,shared-kernel,strategy

# 변이 분석의 실행 폭. 올리면 분석은 빨라지지만 타임아웃 생존으로 점수가 흔들릴 수 있고
# 메모리도 같이 걸린다. 1 로 둔 근거는 실측이다 — 현 판정에 `TIMED_OUT` 변이가 **0 개**라
# 점수가 부하와 무관하게 재현된다(같은 모듈 두 번 실행이 같은 수를 냈다).
threads=1

# 판정은 `mutations.xml` 로만 선다 — XML 을 끄는 것은 게이트를 끄는 것과 같아서 정책 해석이
# XML 부재를 거부한다. HTML 은 사람이 읽는다.
output.formats=XML,HTML

# ---- 모듈별 래칫 (실측값, 2026-11-06 · threads=1) --------------------------------------
# score.min-percent : 탐지/전체의 내림. 분자는 pitest 가 쓴 `detected` 속성이다(`TIMED_OUT` 포함).
#                     비교는 내림한 백분율이 아니라 정수 등식으로 한다 — 1점 미만의 하락도 잡는다.
# mutations.min     : 생성된 변이 수. 대상·mutator 를 좁히면 먼저 이 축이 붉는다.
# classes.min       : 변이가 닿은 클래스 수. 변이를 만들지 않는 타입(sealed interface·값 없는
#                     object 등)은 애초에 세지 않으므로 컴파일된 클래스 수보다 작다.
ratchet.bidding.score.min-percent=80
ratchet.bidding.mutations.min=146
ratchet.bidding.classes.min=20

ratchet.decision.score.min-percent=78
ratchet.decision.mutations.min=549
ratchet.decision.classes.min=56

ratchet.procurement.score.min-percent=80
ratchet.procurement.mutations.min=858
ratchet.procurement.classes.min=110

ratchet.qualification.score.min-percent=77
ratchet.qualification.mutations.min=109
ratchet.qualification.classes.min=18

ratchet.settlement.score.min-percent=83
ratchet.settlement.mutations.min=73
ratchet.settlement.classes.min=8

ratchet.shared-kernel.score.min-percent=70
ratchet.shared-kernel.mutations.min=128
ratchet.shared-kernel.classes.min=28

ratchet.strategy.score.min-percent=90
ratchet.strategy.mutations.min=214
ratchet.strategy.classes.min=27
