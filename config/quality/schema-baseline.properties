# 스키마 기대치 — M6/6B-1 완료 조건 1·6B ① (scope.md). CleanDatabaseReproductionTest 가
# 빈 컨테이너에 V1~V8 을 전건 적용한 뒤 카탈로그(pg_tables·pg_indexes·pg_constraint·
# pg_trigger)와 이 값을 대조한다. **값은 손으로 선언한다** — 생성된 스키마에서 자동
# 추출하면 무엇을 확인하는지 없어진다(자기 증명, scope.md 우회 (2)). 매직값을 test 에
# 박지 않는다(v2-지침서.md §5).
#
# flyway_schema_history 는 Flyway 자신의 부기 표라 대상에서 제외한다(test 쪽 쿼리가
# 걸러낸다) — 이 파일은 도메인 스키마만 다룬다.
#
# 트리거 목록이 핵심 방어선이다(설계 검토 우회 (1)) — V2·V3 의 append-only·provenance
# 가드 트리거를 여기 넣지 않으면 V8 이 그것을 깨뜨려도 이 test 는 초록이다.
policy.version=1

tables=collection_run,edit_session,inbox,notice,notice_audit,opening_reserve_price,opening_result,outbox,provenance_authority,qualification_text,raw_observation,rejected_write

pk-unique.collection_run=collection_run_pkey
pk-unique.edit_session=edit_session_pkey
pk-unique.inbox=inbox_pkey
pk-unique.notice=notice_pkey
pk-unique.notice_audit=notice_audit_pkey
pk-unique.opening_reserve_price=opening_reserve_price_pkey
pk-unique.opening_result=opening_result_pkey
pk-unique.outbox=outbox_pkey
pk-unique.provenance_authority=provenance_authority_pkey
pk-unique.qualification_text=qualification_text_pkey
pk-unique.raw_observation=raw_observation_pkey
pk-unique.rejected_write=rejected_write_pkey

indexes.collection_run=collection_run_pkey,collection_run_reference_date_idx
indexes.edit_session=edit_session_pkey
indexes.inbox=inbox_pkey
indexes.notice=notice_pkey
indexes.notice_audit=notice_audit_notice_idx,notice_audit_pkey
indexes.opening_reserve_price=opening_reserve_price_pkey
indexes.opening_result=opening_result_pkey
indexes.outbox=outbox_pending_order_idx,outbox_pkey
indexes.provenance_authority=provenance_authority_pkey
indexes.qualification_text=qualification_text_pkey
indexes.raw_observation=raw_observation_pkey
indexes.rejected_write=rejected_write_pkey

triggers.raw_observation=raw_observation_append_only
triggers.notice=guard_notice_allocated_budget,guard_notice_base_amount,guard_notice_estimated_amount,guard_notice_floor_rate,guard_notice_status,notice_audit_insert_trigger,notice_revision_bump_trigger
triggers.notice_audit=notice_audit_append_only
triggers.opening_result=guard_opening_result_actual_opening_at,guard_opening_result_derived_base_amount,guard_opening_result_draw_numbers,guard_opening_result_final_award_amount,guard_opening_result_final_award_company_name,guard_opening_result_opening_base_amount,guard_opening_result_opening_rank_one,guard_opening_result_participant_count,guard_opening_result_planned_price,guard_opening_result_progress_division,guard_opening_result_total_reserve_price_candidate_count,guard_opening_result_winning_rate
triggers.qualification_text=guard_qualification_text_raw_text
triggers.opening_reserve_price=guard_opening_reserve_price_base_reserve_price,guard_opening_reserve_price_draw_count,guard_opening_reserve_price_is_drawn
