# M15/15P — 셸 정적 술어가 쓰는 **구문 파서의 핀**. 값 없는 키는 정책 오류다(1A 관례 — 값을
# 워크플로나 스크립트에 리터럴로 박지 않는다). 정본 문서: reports/evidence/m15/15p/scope.md.
#
# 왜 핀인가: `tools/prod-alert-check.sh` 의 정적 술어(「경보 스크립트에 파일로 쓰는 자리가 없다」)는
# 15P 부터 **토큰이 아니라 `shfmt --to-json` 의 구문 트리**를 센다. 판정이 파서의 답에 달려 있으므로
# **파서가 어느 판인지가 곧 술어의 일부**다 — 러너와 로컬이 다른 판을 쓰면 같은 파일에 다른 답이
# 나올 수 있고, 그것은 조용한 미측정이다. 그래서 핀이 **한 자리**에 있고 둘이 함께 읽는다:
#   · CI `container` job 의 `install shfmt` step — 이 값으로 받고 아래 체크섬으로 대조한다.
#   · `tools/prod-alert-check.sh` — PATH 의 `shfmt` 판이 이 값과 다르면 **exit 2(판정 불가)**.
# 숫자를 워크플로에 적지 않는 이유는 `install buf`·`install trivy` 와 같다(둘째 버전 축 금지).
#
# **액션을 쓰지 않는다.** `install trivy` 와 같은 사유 둘 — ① 액션 안의 버전은 워크플로에 보이지
# 않아 조용히 어긋나는 둘째 축이 된다 ② 2026-03-19 공급망 사고에서 먼저 무너진 것이 액션 태그였다
# (GHSA-69fq-xp46-6x23). 릴리스 바이너리를 직접 받고 **체크섬은 이 파일에 핀한다** — 기준이
# 릴리스가 함께 내는 목록이 아니라 저장소의 값이어야 자산이 뒤에 바뀌어도 설치가 비-0 이 된다
# (mvdan/sh 는 v3.13 부터 `sha256sums.txt` 를 내지 않는다 — 목록 대조는 애초에 선택지가 아니다).
#
# 버전 선택 근거(실측 2026-11-24): v3.14.1 은 2026-09-06 공개로 두 달 반 된 안정판이고, `--to-json`
# 이 `Redirect` 노드의 `Op`·`Word`·`N`·`Hdoc` 을 그대로 내보낸다. 체크섬은 내려받은 자산에서 쟀다.
# 알려진 제한: 이 저장소에 cosign 이 없어 **서명 자체의 검증은 하지 않았다**(`vuln-policy` 의 trivy
# 핀과 같은 자리). 핀이 하는 일은 「뒤에 바뀌면 안다」이지 「처음부터 옳다」가 아니다.
