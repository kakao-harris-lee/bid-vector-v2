# M6/6E-2b — 이미지 취약점 게이트 allowlist(scope.md V-4, 결정 B-4). `tools/vuln-scan-check.sh`
# 가 `config/quality/vuln-policy.properties` 의 `allowlist.file` 로 이 파일을 읽는다.
#
# 형식: allow|<이미지 kind>|<취약점 ID>|<패키지 이름>=<만료일 YYYY-MM-DD> <사유>
#   - 키는 **내용**에서 뽑는다 — 좌표(file:line)를 키로 쓰지 않는다(leak-baseline 의 교훈:
#     좌표 키는 편집 하나로 오탐과 미탐을 동시에 만든다).
#   - 구분자 `|` 는 세 성분 어디에도 나타나지 않는다(패키지 이름의 `:`·`/`·`@` 는 허용 문자).
#   - 사유 없는 등재는 정책 오류다. 만료일만 적는 것은 등재가 아니다.
#
# 게이트가 **비-0 으로 끊는 세 경우** —
#   ⓐ 만료가 지난 등재      ⓑ 만료일이 상한(policy 의 allowlist.max-days)보다 먼 등재
#   ⓒ 어느 finding 과도 맞지 않는 등재(stale) — 베이스·의존을 올려 finding 이 사라지면
#      그 등재가 여기서 붉어져 치우기를 강제한다. 「조용히 남는 면제」를 만들지 않는다.
#
# 아래 등재는 전부 **2026-10-08 실측 finding 의 triage 결과**다. 해소 경로는 둘 다 이 slice 의
# 범위 밖이고 **후속 slice 6E-2c** 가 진다(scope.md 계약 갱신 r1, D-6E2B-1) — 베이스 이미지
# 다이제스트 상향(OPEN-6E2B-BASE-IMAGE-BUMP)과 의존 버전 상향(OPEN-6E2B-DEPENDENCY-BUMP).
# 어느 쪽이든 올리는 순간 해당 등재가 stale 로 붉어지므로, 상향과 이 파일의 정리는 같은 PR 에서
# 끝난다.
#
# **만료일이 두 갈래다**(D-6E2B-1) — CRITICAL 10건은 **2026-10-31**, HIGH 57건은 **2026-12-31**.
# 짧은 쪽은 기다림의 상한을 그 10건에 맞춰 둔 것이다: 6E-2c 가 늦어지면 **게이트가 스스로
# 붉어져** 다시 결정을 요구한다. 날짜를 미루는 것은 결정이지 정비가 아니다 — 미룰 때는 사유를
# 새로 쓴다(runbook 「이미지 취약점 스캔」 절).
#
# 운영 절차(판독·등재·만료 처리)는 docs/runbook/m6-6e-operations.md 의 「이미지 취약점 스캔」 절.

