# M6/6E-2b — 이미지 취약점 게이트 allowlist(6E-2b scope.md V-4, 결정 B-4). `tools/vuln-scan-check.sh`
# 가 `config/quality/vuln-policy.properties` 의 `allowlist.file` 로 이 파일을 읽는다.
#
# 형식: allow|<이미지 kind>|<취약점 ID>|<패키지 이름>=<만료일 YYYY-MM-DD> <사유>
#   - 키는 **내용**에서 뽑는다 — 좌표(file:line)를 키로 쓰지 않는다(leak-baseline 의 교훈:
#     좌표 키는 편집 하나로 오탐과 미탐을 동시에 만든다).
#   - 구분자 `|` 는 세 성분 어디에도 나타나지 않는다(패키지 이름의 `:`·`/`·`@` 는 허용 문자).
#   - 사유 없는 등재는 정책 오류다. 만료일만 적는 것은 등재가 아니다.
#   - 사유는 **무엇을 하면 없어지는가**를 적는다. 「영향 없음」 같은 판단만 적힌 등재는 만료일이
#     와도 무엇을 해야 할지 알려주지 않는다.
#
# 게이트가 **비-0 으로 끊는 세 경우** —
#   ⓐ 만료가 지난 등재      ⓑ 만료일이 상한(policy 의 allowlist.max-days)보다 먼 등재
#   ⓒ 어느 finding 과도 맞지 않는 등재(stale) — 베이스·의존을 올려 finding 이 사라지면
#      그 등재가 여기서 붉어져 치우기를 강제한다. 「조용히 남는 면제」를 만들지 않는다.
#
# ── M7/7F-local · chore 2026-10-22~29 — **web·proxy 의 등재도 0 이다**(chore 2026-10-29, 운영자 지시) ──
# caddy 이미지 둘에 쌓였던 기한부 등재 20줄(kind 둘 × 10 — Go `stdlib` 다섯 CVE · `golang.org/x/net` ·
# `go-jose/v4` · alpine `brotli-libs`·`curl`·`libcurl`)을 **면제를 늘리지 않고 상향으로 치웠다.** 상류 caddy
# 는 2026-10-29 에도 v2.11.7(go1.26.8) 뿐이라, caddy 바이너리를 이미지 안에서 직접 빌드한다(go1.26.10 ·
# go-jose v4.1.6 · x/net v0.60.0, 입력은 `docker/caddy/`) — 런타임 베이스는 `alpine:3.23.7` 이고 그 index 의
# `curl`·`libcurl` 8.23.0-r0 · `brotli-libs` 1.2.1-r0 을 하한으로 건다. 사유·실측은
# `reports/evidence/chore/caddy-upgrade-20261029/` 와 두 Dockerfile 의 caddy-build stage 주석.
# 추적 항목 `OPEN-CADDY-STDLIB-111943`·`OPEN-CADDY-STDLIB-56857`·`OPEN-CADDY-GOJOSE-116587`·
# `OPEN-CADDY-BROTLI-111497`·`OPEN-CADDY-CURL-92392` 은 이 상향으로 닫혔다.

# ── M6/6E-2c — **ml-serving·앱 이미지의 등재는 0 이다** ─────────────────────────
# 6E-2b 가 기한부로 유예한 67건(ml-serving OS 52 · 앱 OS 2 · 앱 JVM 13)은 **전부 상향으로
# 해소됐다**: 베이스 이미지 두 개 상향(D-6E2C-2, `OPEN-6E2B-BASE-IMAGE-BUMP`)과 JVM 보안 하한
# (D-6E2C-3, `OPEN-6E2B-DEPENDENCY-BUMP`). CRITICAL 10건의 만료 기한 **2026-10-31 은 미루지
# 않고 소진**했다 — 날짜를 옮기는 것은 결정이지 정비가 아니라는 6E-2b 의 문면 그대로다.
#
# **빈 목록이 게이트를 끄지 않는다.** 정책이 가리키는 이 파일은 실재해야 하고(부재는 exit 2),
# 미등재 차단 후보가 하나라도 생기면 그 자리에서 exit 1 이다. 등재 0 은 「면제가 없다」는 뜻이지
# 「검사가 없다」가 아니다.
#
# **등재 0 이 되면서 그물 하나가 사라진다.** 앞서 stale 검사가 **우연히** 「스캔이 서지 않음」을
# 덮고 있었다(등재가 어떤 차단 후보와도 맞지 않으면 붉어졌으므로). 그 자리는 이제 양성 대조
# 둘(SBOM 구성요소 수·나열 패키지 수)과 **OS 매칭 술어**(D-6E2C-1)가 진다 — 6E-2b 가 이 날을
# 내다보고 그 셋을 먼저 세운 이유다. (M7/7F-local 부터 chore 2026-10-29 까지는 web·proxy kind 에
# 등재가 있어 stale 검사가 그 kind 의 그물 노릇을 했다. 지금은 네 kind 모두 등재 0 이라 그 그물이
# 없고, 양성 대조 둘과 OS 매칭 술어가 진다.)
#
