# M6/6E-2b — 이미지 취약점 게이트 allowlist(6E-2b scope.md V-4, 결정 B-4). `tools/vuln-scan-check.sh`
# 가 `config/quality/vuln-policy.properties` 의 `allowlist.file` 로 이 파일을 읽는다.
#
# 형식: allow|<이미지 kind>|<취약점 ID>|<패키지 이름>=<만료일 YYYY-MM-DD> <사유>
#   - 키는 **내용**에서 뽑는다 — 좌표(file:line)를 키로 쓰지 않는다(leak-baseline 의 교훈:
#     좌표 키는 편집 하나로 오탐과 미탐을 동시에 만든다).
#   - 구분자 `|` 는 세 성분 어디에도 나타나지 않는다(패키지 이름의 `:`·`/`·`@` 는 허용 문자).
#   - 사유 없는 등재는 정책 오류다. 만료일만 적는 것은 등재가 아니다.
#   - 사유는 **무엇을 하면 없어지는가**를 적는다. 「영향 없음」 같은 판단만 적힌 등재는 만료일이
#     와도 무엇을 해야 할지 알려주지 않는다.
#
# 게이트가 **비-0 으로 끊는 세 경우** —
#   ⓐ 만료가 지난 등재      ⓑ 만료일이 상한(policy 의 allowlist.max-days)보다 먼 등재
#   ⓒ 어느 finding 과도 맞지 않는 등재(stale) — 베이스·의존을 올려 finding 이 사라지면
#      그 등재가 여기서 붉어져 치우기를 강제한다. 「조용히 남는 면제」를 만들지 않는다.
#
# ── M7/7F-local(D-7F-2) — **등재 8**(web·proxy, 운영자 승인 2026-10-16) ──────────
# caddy 이미지 둘(web·proxy)이 게이트에 들어오면서 차단 후보 **4건**이 남았다. 넷 다 **caddy
# 바이너리**(`usr/bin/caddy`) 쪽이고 — Go toolchain(`stdlib`) 셋과 모듈(`golang.org/x/net`) 하나 —
# **우리가 그 바이너리를 빌드하지 않는다.** 이미지 쪽 조치는 베이스 상향뿐이고 그것은 이미 했다:
# `caddy:2.11.4` → `2.11.7`(최신 패치)로 올려 차단 후보가 **21 → 4** 로 줄었다. 남은 넷은 상류가
# 수정된 toolchain·모듈로 재빌드한 릴리스를 내야 사라진다.
#
# 만료 **2026-12-15**(약 60일, 상한 90일보다 짧게)의 뜻: Go 패치는 월 단위로 나오고 caddy 는 자주
# 릴리스한다(2.11.7 이 2026-10-05). **상류가 먼저 고치면 이 등재는 stale 로 붉어져 스스로 치워진다**
# (어느 finding 과도 맞지 않는 등재는 exit 1) — 그 성질이 이 짧은 만료의 보완이다.
#
# 등재는 **이미지 kind 마다** 필요하다(같은 CVE 라도 kind 가 키의 성분이다). 두 이미지는 같은
# 베이스의 같은 바이너리라 네 건이 그대로 겹친다.
allow|web|CVE-2026-78667|stdlib=2026-12-15 caddy 바이너리를 우리가 빌드하지 않는다 — 상류가 수정된 Go toolchain·모듈로 재빌드한 릴리스를 내면 베이스 상향으로 해소된다
allow|web|CVE-2026-78669|stdlib=2026-12-15 caddy 바이너리를 우리가 빌드하지 않는다 — 상류가 수정된 Go toolchain·모듈로 재빌드한 릴리스를 내면 베이스 상향으로 해소된다
allow|web|CVE-2026-97031|stdlib=2026-12-15 caddy 바이너리를 우리가 빌드하지 않는다 — 상류가 수정된 Go toolchain·모듈로 재빌드한 릴리스를 내면 베이스 상향으로 해소된다
allow|web|CVE-2026-78669|golang.org/x/net=2026-12-15 caddy 바이너리를 우리가 빌드하지 않는다 — 상류가 수정된 Go toolchain·모듈로 재빌드한 릴리스를 내면 베이스 상향으로 해소된다
allow|proxy|CVE-2026-78667|stdlib=2026-12-15 caddy 바이너리를 우리가 빌드하지 않는다 — 상류가 수정된 Go toolchain·모듈로 재빌드한 릴리스를 내면 베이스 상향으로 해소된다
allow|proxy|CVE-2026-78669|stdlib=2026-12-15 caddy 바이너리를 우리가 빌드하지 않는다 — 상류가 수정된 Go toolchain·모듈로 재빌드한 릴리스를 내면 베이스 상향으로 해소된다
