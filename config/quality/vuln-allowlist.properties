allow|proxy|CVE-2026-78669|golang.org/x/net=2026-12-15 caddy 바이너리를 우리가 빌드하지 않는다 — 상류가 수정된 Go toolchain·모듈로 재빌드한 릴리스를 내면 베이스 상향으로 해소된다

# ── chore(2026-10-22) — **등재 2**(web·proxy, 운영자 승인 2026-10-22, 기한부) ─────────────
# 취약점 DB 갱신으로 `CVE-2026-111943`(Go `stdlib` 1.26.8, HIGH, 수정판 1.26.10·1.27.3)이 caddy 바이너리에
# 새로 잡혔다. 베이스(`caddy:2.11.7`)는 그대로인데 main 의 web·proxy 스캔이 붉어졌다 — 코드 변경이 아니라
# DB 의 시간 변화다. 2026-10-22 기준 레지스트리에 2.11.7 이후의 caddy 판이 없어 베이스 상향으로 닫을 수 없다.
#
# 만료 **2026-11-05(14일)** — 위 묶음보다 짧다. 운영자 결정은 「기한을 붙인 면제」이고, **운영 반입 전에
# 다시 확인**한다(새 caddy 판이 나왔으면 상향, 아니면 사유·기한을 다시 판단 — 날짜를 옮기는 것은 결정이다).
# 상류가 먼저 고치면 이 두 줄은 stale 로 붉어져 스스로 치워진다. 추적 항목 `OPEN-CADDY-STDLIB-111943`.
allow|web|CVE-2026-111943|stdlib=2026-11-05 caddy 바이너리의 Go toolchain(stdlib 1.26.8) — 우리가 빌드하지 않는다. 상류가 stdlib 1.26.10 이상으로 재빌드한 caddy 릴리스를 내면 베이스 상향으로 해소된다. 추적 OPEN-CADDY-STDLIB-111943 · 운영 반입 전 재확인
allow|proxy|CVE-2026-111943|stdlib=2026-11-05 caddy 바이너리의 Go toolchain(stdlib 1.26.8) — 우리가 빌드하지 않는다. 상류가 stdlib 1.26.10 이상으로 재빌드한 caddy 릴리스를 내면 베이스 상향으로 해소된다. 추적 OPEN-CADDY-STDLIB-111943 · 운영 반입 전 재확인

# ── M6/6E-2c — **ml-serving·앱 이미지의 등재는 0 이다** ─────────────────────────
# 6E-2b 가 기한부로 유예한 67건(ml-serving OS 52 · 앱 OS 2 · 앱 JVM 13)은 **전부 상향으로
# 해소됐다**: 베이스 이미지 두 개 상향(D-6E2C-2, `OPEN-6E2B-BASE-IMAGE-BUMP`)과 JVM 보안 하한
# (D-6E2C-3, `OPEN-6E2B-DEPENDENCY-BUMP`). CRITICAL 10건의 만료 기한 **2026-10-31 은 미루지
# 않고 소진**했다 — 날짜를 옮기는 것은 결정이지 정비가 아니라는 6E-2b 의 문면 그대로다.
#
# **빈 목록이 게이트를 끄지 않는다.** 정책이 가리키는 이 파일은 실재해야 하고(부재는 exit 2),
# 미등재 차단 후보가 하나라도 생기면 그 자리에서 exit 1 이다. 등재 0 은 「면제가 없다」는 뜻이지
# 「검사가 없다」가 아니다.
#
# **등재 0 이 되면서 그물 하나가 사라진다.** 앞서 stale 검사가 **우연히** 「스캔이 서지 않음」을
# 덮고 있었다(등재가 어떤 차단 후보와도 맞지 않으면 붉어졌으므로). 그 자리는 이제 양성 대조
# 둘(SBOM 구성요소 수·나열 패키지 수)과 **OS 매칭 술어**(D-6E2C-1)가 진다 — 6E-2b 가 이 날을
# 내다보고 그 셋을 먼저 세운 이유다. (M7/7F-local 이후 web·proxy kind 에는 등재가 있으므로 그
# kind 에서는 stale 검사가 다시 그물 노릇을 한다 — 위 블록의 만료가 그것을 쓴다.)
#
# 운영 절차(판독·등재·만료 처리)는 docs/runbook/m6-6e-operations.md 의 「이미지 취약점 스캔」 절.
