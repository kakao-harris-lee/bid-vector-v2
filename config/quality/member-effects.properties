# 효과 후보의 분류 — `member-effects.generated.properties` 의 모든 키가 여기 한 번씩 있어야 한다.
# 없으면 `memberEffectGate` 가 실패한다. 그것이 이 층을 손 열거가 아니라 **래칫**으로 만든다.
#
# 값은 `forbidden` 이거나 `reviewed:<사유>` 다. 「효과 표면에 닿는다」와 「도메인이 쓰면 안 된다」는
# 다르다 — `ArrayList#add` 는 `System#arraycopy` 를 부르지만 효과를 밖으로 내지 않는다.
#
# **분류의 기준 둘.**
#   ① `body:` 로 잡힌 것 — 호출자가 아무것도 이름 붙이지 않아도 효과가 일어난다. 효과 자체를 본다.
#   ② `signature:` 로 잡힌 것 — 호출자가 표면 타입을 **이름 붙여야** 하고 그것은 T-B·T-C 가 이미
#      막는다. 그래서 대개 `reviewed` 인데, **같은 이름의 다른 오버로드가 본문으로 효과를 내면**
#      그것은 `forbidden` 이다(키가 이름 단위라 오버로드를 흡수한다 — `printStackTrace` · `format`).
policy.version=1

# ---------------------------------------------------------------------------
# forbidden — 도메인이 쓰면 승인 문면의 「I/O 가 없는 입력→출력」이 깨진다
# ---------------------------------------------------------------------------
java.lang.Throwable#printStackTrace=forbidden
java.lang.Throwable#getStackTrace=forbidden
java.lang.Throwable#setStackTrace=forbidden
java.lang.Boolean#getBoolean=forbidden
java.lang.Integer#getInteger=forbidden
java.lang.Long#getLong=forbidden
java.lang.Math#random=forbidden
java.lang.StrictMath#random=forbidden
java.util.Collections#shuffle=forbidden
java.lang.Object#wait=forbidden
java.lang.Object#getClass=forbidden
java.lang.Enum#getDeclaringClass=forbidden
java.lang.String#getBytes=forbidden
java.lang.String#toLowerCase=forbidden
java.lang.String#toUpperCase=forbidden

# ---------------------------------------------------------------------------
# reviewed — 표면에 닿지만 효과를 밖으로 내지 않는다
# ---------------------------------------------------------------------------
# 형식화의 정책 경계는 이 게이트의 축이 아니다 — 알려진 제한 18 이 그 자리를 이미 든다.
# 기본 로케일을 읽는 것은 사실이나 그 판단(형식화를 adapters 로 미는가)은 1B 몫이고,
# 여기서 조용히 정하지 않는다. **양성 corpus 가 이 통과를 고정한다**(`DomainShapes.formatted`).
java.lang.String#format=reviewed:기본 로케일을 읽지만 형식화 경계는 알려진 제한 18 과 1B 의 판단이다
java.lang.String#formatted=reviewed:같은 이유 — `String#format` 의 인스턴스 표기
java.lang.Object#toString=reviewed:기본 구현이 진단 문자열에 getClass 를 쓸 뿐이다
java.lang.Throwable#toString=reviewed:같은 이유 — 예외 메시지를 만든다
java.lang.Enum#hashCode=reviewed:System#identityHashCode 를 쓸 뿐 환경을 읽지 않는다
java.lang.Enum#valueOf=reviewed:Kotlin 이 모든 enum class 에 합성한다 — 클래스 리터럴이 고정돼 리플렉션 진입점이 아니다
java.lang.Enum#describeConstable=reviewed:constant API. 도메인이 부르지 않고 Class 를 상수로 감쌀 뿐이다
java.lang.String#repeat=reviewed:System#arraycopy 로 버퍼를 복사할 뿐이다
java.lang.AbstractStringBuilder#repeat=reviewed:같은 이유 — 내부 버퍼 복사
java.lang.String#<init>=reviewed:생성자 전부가 한 키다. Charset 오버로드는 그 타입을 이름 붙여야 해 T-C 가 막고 char array 생성자는 순수하다
java.lang.Character#getName=reviewed:유니코드 이름 조회. 내부의 Locale 은 상수(ROOT)이고 환경을 읽지 않는다
java.lang.Character#codePointOf=reviewed:같은 이유 — 이름에서 코드포인트를 되찾는다
java.lang.Double#resolveConstantDesc=reviewed:constant-dynamic 지원 멤버. 도메인이 이름 붙일 수 없다
java.lang.Float#resolveConstantDesc=reviewed:같은 이유
java.lang.Integer#resolveConstantDesc=reviewed:같은 이유
java.lang.Long#resolveConstantDesc=reviewed:같은 이유
java.lang.String#resolveConstantDesc=reviewed:같은 이유
java.lang.constant.ConstantDesc#resolveConstantDesc=reviewed:같은 이유 — 위 다섯의 선언 인터페이스
java.lang.annotation.Annotation#annotationType=reviewed:애노테이션 인터페이스의 규약 메서드. 허용 목록의 상위 타입으로 딸려 들어왔다
java.util.ArrayList#add=reviewed:System#arraycopy 로 원소를 옮길 뿐이다
java.util.ArrayList#addAll=reviewed:같은 이유
java.util.ArrayList#toArray=reviewed:같은 이유
java.util.AbstractCollection#toArray=reviewed:Class 로 배열 타입을 맞출 뿐이다
java.util.Arrays#copyOf=reviewed:Class 오버로드는 그 타입을 이름 붙여야 하고 나머지는 순수 복사다
java.util.Arrays#copyOfRange=reviewed:같은 이유
java.util.Arrays#deepHashCode=reviewed:원소 타입 분기에 Class 를 쓸 뿐이다
java.util.Arrays#parallelSort=reviewed:ForkJoinPool 을 쓰지만 도메인은 이 이름을 부를 이유가 없고 결과는 결정적이다
java.util.Objects#toIdentityString=reviewed:진단 문자열. Class 이름을 붙일 뿐이다
java.util.Collections#checkedCollection=reviewed:타입 토큰 API — Class 를 이름 붙여야 하므로 T-C 가 막는다
java.util.Collections#checkedList=reviewed:같은 이유
java.util.Collections#checkedSet=reviewed:같은 이유
java.util.Collections#checkedMap=reviewed:같은 이유
java.util.Collections#checkedQueue=reviewed:같은 이유
java.util.Collections#checkedSortedSet=reviewed:같은 이유
java.util.Collections#checkedSortedMap=reviewed:같은 이유
java.util.Collections#checkedNavigableSet=reviewed:같은 이유
java.util.Collections#checkedNavigableMap=reviewed:같은 이유
java.util.EnumMap#<init>=reviewed:EnumMap 을 만드는 정상 경로. Class 리터럴이 고정돼 있다
java.util.EnumSet#allOf=reviewed:같은 이유
java.util.EnumSet#noneOf=reviewed:같은 이유
