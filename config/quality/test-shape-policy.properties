# test-shape 게이트 정책 — 하네스 `test-discovery-guard`(`OPEN-2B-TEST-DISCOVERY-GUARD`).
#
# JUnit Jupiter 가 조용히 discover 하지 않는 test 메서드 형태(식 본문·비-Unit 반환·suspend·
# private)를 잡는 게이트(`testShapeGate`/`buildLogicTestShapeGate`)의 정책 데이터. 설계 검토
# `_workspace/harness-test-shape/02_design-review.md` A-3.
policy.version=1

# test-메서드 어노테이션(짧은 이름 매칭 — import 해석 없음, A-3). 이 목록에 있으면 허용 형태는
# 「블록 본문 ∧ (반환 타입 없음 ∨ Unit)」 하나뿐이다 — 2B 25/27 가짜 초록 실측(`= runBlocking {…}`)
# 을 막는다.
test.shape.method-annotations=Test,ParameterizedTest,RepeatedTest,TestTemplate

# `@TestFactory` 는 반대다 — `DynamicNode` 컬렉션을 반환해야 하므로 비-Unit 반환이 정당하고,
# 명시 반환 타입이 Unit 이면 오히려 위반이다.
test.shape.factory-annotations=TestFactory

# 미달 후보 (a) — `suspend fun` 에 test-메서드 어노테이션이 붙으면 JUnit 이 discover 하지
# 않는다(블록 본문이라도). 같은 「조용한 미실행」 위협 안이라 정책 스위치로 위반 처리한다.
test.shape.forbid-suspend=true

# 미달 후보 (b) — `private fun` 은 Jupiter 가 discover 하지 않는다. 같은 이유로 위반 처리한다.
test.shape.forbid-private=true
