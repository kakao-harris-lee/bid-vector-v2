# 마이그레이션 번호 순서 정책 — `migrationOrderGate`(`OPEN-MIGRATION-ORDER-GATE`).
#
# 규율의 출처는 `reports/evidence/m6/6f5a/scope.md` D-6F5-8 이고, 그 규율에 **자동 게이트가 없다**는
# 사실이 D-6F5-13 으로 등재됐다(산문으로만 사는 규율은 어긴 것이 보이지 않는다 — 실제로 한 번
# 뒤집혔다). 게이트의 등식은 `읽어낸 version 다중집합 == (1..max ∖ 은퇴)` 다.
#
# 왜 결번이 위반인가: Flyway `outOfOrder=false` 아래에서 적용된 최대 version 보다 낮은 번호로 나중에
# 들어온 마이그레이션은 조용히 적용되지 않는다. 결번은 그 침묵을 기다리는 자리다.
policy.version=1

# 마이그레이션을 가진 Gradle 모듈. 이 모듈에서만 등식을 단언하고, **그 모듈에서 디렉터리가 비면
# 실패한다**(「잴 것이 없어 통과」는 게이트를 옮긴 것과 구별되지 않는다).
migration.module=adapters

# 그 모듈 디렉터리 기준 상대 경로. 선언 입력이자 판정 대상의 유일한 자리다 — 경로를 옮기면
# 디렉터리가 비어 게이트가 붉는다.
migration.resource-path=src/main/resources/db/migration

# **Flyway 가 실제로 읽는 자리**(`migrationOrderGate` 의 판정 입력, 수정 라운드 3 — verifier M-1).
# `PersistenceWiring` 이 `locations("classpath:db/migration")` 로 주는 그 문자열이고, 게이트는 그것을
# **처리된 리소스**(`processResources` 산출) 밑에서 찾는다. 관례 디렉터리만 보던 앞 판은
# `processResources { from("src/main/extra") { into("db/migration") } }` 가 그 자리에 파일을 넣어도
# 초록이었다(실측) — 소스 경로는 넣는 쪽이 정하는 값이고 **처리된 리소스는 소비자가 읽는 값**이다.
# `migration.resource-path` 는 그대로 둔다: 사람이 파일을 두는 자리를 가리키는 문면이다.
migration.classpath-location=db/migration

# **영구히 비워 둔 version** — 결번을 고정한다. 이 번호로 새 파일이 들어오면 위반이고(재사용 금지),
# 목록에만 있고 1..max 밖인 항목도 위반이다(죽은 면제 검출).
#
# 10·11 은 6F-4 가 쓰지 않은 번호다(`6f5a/scope.md` D-6F5-8 「V10 은 파일이 없어 기다리지 않는다」).
# 파일 번호를 다시 매기면 adapters 의 production 거동(적용 이력·checksum)이 바뀌므로 그 대신 두 번호를
# 여기서 닫는다 — 효과는 「그 자리로 나중에 들어오는 마이그레이션이 없다」이고, 그것이 Flyway 사각을
# 닫는 방향이다.
migration.retired-versions=10,11

# **들어오는 판의 등식**(팀장 지시 2026-11-06). 이 slice 를 머지하는 시점의 main 은 **V24 까지**이고
# 은퇴 둘(10·11) 밖의 결번은 0 이다(게이트 실측). 아직 머지되지 않은 레인 둘이 번호를 더한다 —
# **V25**(paper-bid, 먼저 머지된다) · **V26·V27**(ops-migrations). 그 순서로 들어오면 등식은 그대로
# 선다: V25 머지 시점의 집합은 `1..25 ∖ {10,11}`, V26·V27 머지 뒤는 `1..27 ∖ {10,11}` 로 둘 다 결번이
# 0 이다. **순서가 뒤집히면 게이트가 붉는다** — ops-migrations 가 먼저 머지되면 V25 가 결번이 되어
# 「이 번호로 나중에 들어온 마이그레이션은 outOfOrder=false 아래에서 조용히 건너뛰어진다」로 실패한다.
# 그것이 이 게이트의 목적이고, 그때의 처방은 은퇴 목록에 25 를 넣는 것이 **아니라** 뒤에 오는 레인이
# 번호를 당기는 것이다(은퇴는 「영구히 비워 둔 자리」이지 머지 순서의 회피로가 아니다).

# **판독 불가는 닫히는 쪽으로 실패한다**(리뷰 LOW-5). 이 디렉터리의 파일 이름이 `V<번호>__<설명>.sql`
# 관례 밖이면 번호를 읽을 수 없으므로 위반이다 — `.gitkeep`·`README.md` 를 두면 빌드가 깨지고, 점
# 버전(`V1.1__`)과 repeatable(`R__`)도 구조적으로 막힌다. 그 셋이 필요해지면 이 정책과 판독 술어를
# 함께 개정한다(관례를 넓히는 결정이 먼저이고 게이트가 뒤따른다). KDoc 에만 있던 사실을 **이 파일을
# 먼저 읽는 사람 쪽**에도 적는다.
#
# **소유 모듈은 하나다.** 비-소유 모듈에 이 경로가 있고 비어 있지 않으면 위반이다 — Flyway 의 모집단은
# 모듈이 아니라 classpath 이므로(`locations=classpath:db/migration`) 다른 모듈에 둔 파일은 적용되면서
# 번호 등식에는 들어오지 않는다(verifier H-2 실측).
