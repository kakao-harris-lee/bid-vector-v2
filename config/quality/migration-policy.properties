# 마이그레이션 번호 순서 정책 — `migrationOrderGate`(`OPEN-MIGRATION-ORDER-GATE`).
#
# 규율의 출처는 `reports/evidence/m6/6f5a/scope.md` D-6F5-8 이고, 그 규율에 **자동 게이트가 없다**는
# 사실이 D-6F5-13 으로 등재됐다(산문으로만 사는 규율은 어긴 것이 보이지 않는다 — 실제로 한 번
# 뒤집혔다). 게이트의 등식은 `읽어낸 version 다중집합 == (1..max ∖ 은퇴)` 다.
#
# 왜 결번이 위반인가: Flyway `outOfOrder=false` 아래에서 적용된 최대 version 보다 낮은 번호로 나중에
# 들어온 마이그레이션은 조용히 적용되지 않는다. 결번은 그 침묵을 기다리는 자리다.
policy.version=1

# 마이그레이션을 가진 Gradle 모듈. 이 모듈에서만 등식을 단언하고, **그 모듈에서 디렉터리가 비면
# 실패한다**(「잴 것이 없어 통과」는 게이트를 옮긴 것과 구별되지 않는다).
migration.module=adapters

# 그 모듈 디렉터리 기준 상대 경로. 선언 입력이자 판정 대상의 유일한 자리다 — 경로를 옮기면
# 디렉터리가 비어 게이트가 붉는다.
migration.resource-path=src/main/resources/db/migration

# **영구히 비워 둔 version** — 결번을 고정한다. 이 번호로 새 파일이 들어오면 위반이고(재사용 금지),
# 목록에만 있고 1..max 밖인 항목도 위반이다(죽은 면제 검출).
#
# 10·11 은 6F-4 가 쓰지 않은 번호다(`6f5a/scope.md` D-6F5-8 「V10 은 파일이 없어 기다리지 않는다」).
# 파일 번호를 다시 매기면 adapters 의 production 거동(적용 이력·checksum)이 바뀌므로 그 대신 두 번호를
# 여기서 닫는다 — 효과는 「그 자리로 나중에 들어오는 마이그레이션이 없다」이고, 그것이 Flyway 사각을
# 닫는 방향이다.
migration.retired-versions=10,11
