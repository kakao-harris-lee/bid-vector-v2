# M6/6A-2a — **앱 이미지** 위생 게이트 정책 데이터(D-6A2a-7). ml-serving 정책과 같은 파서·같은
# 공통 술어(태그·실 프로세스 사용자·베이스 layer 체인·크기)를 쓰고, 「금지」 판정만 갈라진다:
# 그쪽은 Python `import`, 이쪽은 **JVM 구조**다. 값 없는 키·CRLF·공백만인 원소는 정책 오류다
# (`tools/image-hygiene-check.sh` 의 `_policy_value` — 6C 의 세 라운드가 만든 규율).
# 정본 문서: reports/evidence/m6/6a2a/scope.md.
policy.version=1

# 술어 갈래 선택. 스크립트의 `case` 가 이 값을 소진하고, 모르는 값은 정책 오류로 끊는다
# (열거 방어가 아니라 분기 소진 — 새 kind 를 더하면 스크립트가 그 자리에서 실패한다).
runtime.kind=jvm-app

# 2026-09-26 실측(`docker image inspect .Size`) — eclipse-temurin:21-jre-noble(약 287.6MB) +
# 풀린 layer 넷(의존 97 + 앱) = 339.4MB. 약 32% 여유를 둔다. **JDK 베이스 교체를 잡는 것은
# 이 축이 아니라 아래 `forbidden.executables`** 다(크기만으로는 경계가 흐리다) — 이 축은
# 의존 그래프가 통째로 부푸는 사고를 잡는다.
size.cap.bytes=450000000

# non-root UID 하한 — ml-serving 정책과 같은 값·같은 근거(0=root 는 항상 거부, 1000 미만은
# 데몬/패키지 예약대). 판정은 **실 ENTRYPOINT 로 띄운 컨테이너의 모든 프로세스 uid** 다.
nonroot.uid.min=1000

# 베이스 다이제스트 고정 — 값은 layer 목록이 아니라 **다이제스트 하나**이고 게이트가 그것을
# `docker buildx imagetools inspect` 로 풀어(멀티플랫폼 index → linux/amd64) 그때그때 실제
# layer 체인을 파생한다(D-6C-10 ②). 이 값은 `docker/app.Dockerfile` 의 두 `FROM` 과 글자
# 그대로 같다 — 어긋나면 diff 에서 바로 보인다. 알려진 제한은 ml-serving 정책과 같다:
# 레지스트리 네트워크 접근이 필요하고 linux/amd64 선택이 하드코딩이다(`OPEN-6C-MULTIARCH`).
base.image.repo=eclipse-temurin
base.image.digest=sha256:7edbe8532195c8222735caca437e56780e1fc7db08a4b4b4af77fe188cccc15f

# ① 컴파일·개발 도구 부재 — 「JRE 인가 JDK 인가」가 여기서 갈린다(D-6A2a-3). 이름 대조가
# 아니라 **실제 실행 시도**다(ml-serving 의 `import` 시도와 같은 형태, 우회 (2)). 2026-09-26
# 실측: 이 베이스에서 아홉 다 실행 불가.
forbidden.executables=javac,jshell,jar,javadoc,jdb,jlink,jmod,serialver,jarsigner

# ①' **필수** 실행 파일 — compose healthcheck 이 이미지 안 `curl` 로 관리 포트 readiness 를
# 묻는다(D-6A2a-5). 그 전제가 주석과 실측 기록에만 있으면, 베이스 다이제스트를 올렸을 때
# 사라져도 증상은 「healthy 로 수렴하지 않음」(타임아웃)이라 원인이 보이지 않는다. 이름 있는
# 축으로 만들어 그 자리에서 실패시킨다(code-review r1 Open Question 2).
# 원소에 공백을 넣지 않는다 — `_policy_value` 가 정책 오류로 끊는다(R4-1).
required.executables=curl

# ② 풀린 의존 layer 에 test 전용 좌표 0. **주 잠금은 Gradle 구조**다 — `bootJar` 는
# `runtimeClasspath` 만 담으므로 test 좌표가 들어가려면 `implementation` 선언을 바꿔야 한다.
# 이 검사는 그 구조가 이미지까지 이어졌는지 재는 **보조**이고, 판정은 이미지 안 파일 목록
# 대 이 목록의 대소문자 무시 부분 문자열이다(부분 문자열이라 `junit` 하나가
# `junit-jupiter-*`·`junit-platform-*` 을 함께 덮는다 — 더 넓게 잡고 시끄럽게 실패한다).
dependency.layer.path=/application/lib
forbidden.dependency.coordinates=junit,opentest4j,apiguardian,testcontainers,archunit,kotest,mockk,mockito,byte-buddy,objenesis,assertj,hamcrest,awaitility

# ②의 **양성 대조** — 목록이 비거나 경로가 틀리면 「위반 0」이 조용히 참이 된다(6C 의 세
# 라운드가 같은 계열을 세 번 냈다: 중복 키 → 빈 값 → 공백 원소. 전부 「게이트가 아무 일도
# 하지 않게 됨」이다). 그래서 목록이 **실재함**을 수치로 요구한다. 2026-09-26 실측 97 개.
dependency.layer.min-entries=50
