# 이 목록은 **빈 주입점과 평범한 데이터 생성자 인자를 섞는다**(N-r6-12). 규칙 대상이 제한 층·② 층의
# **모든 클래스**라 DTO·응답 타입의 생성자 인자(`java.lang.String`·`java.util.List`·`kotlin.Unit` …)가
# 함께 들어온다. 과대 근사이고 안전한 방향이다 — 래퍼 클래스로 감싸 나르는 변형도 자동으로 걸린다.
