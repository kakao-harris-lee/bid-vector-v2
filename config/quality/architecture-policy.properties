# 생성자가 함께 들어온다 — verifier r4 F-r4-1 이 그 통로로 편집 use case 를 요청 스코프에서
# 스스로 조립했고, HTTP GET 한 번에 전략이 바뀌면서 outbox·세션 행은 0 이었다.
