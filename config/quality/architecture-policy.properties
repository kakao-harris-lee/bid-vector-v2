# M6/6A-2b D-6A2b-8·10 — `app.http` 의존 게이트와 운영자 자격증명 참조 집합. 둘 다 **집합**
# 이다: 앞은 use case 생성자에서 도출한 포트 집합(이 파일의 목록은 그 도출과 대조하는
# 관측 등식일 뿐 정본이 아니다), 뒤는 classpath 전체에서 도출한 참조자 집합이다.
# ---------------------------------------------------------------------------

# 포트의 정의는 `app.http.use-case-type` 의 생성자 매개변수 타입 가운데 인터페이스인 것이다.
# 아래 목록은 그 도출 결과와 **같아야** 한다 — 포트가 늘거나 줄면 게이트가 RED 가 되어
# 분류(능력/주변)를 다시 보게 한다. 능력·주변의 구분은 손이 아니라 구조 술어가 한다
# (무인자 메서드로 java.time 값만 내면 주변 — 오늘은 Clock 하나).
app.http.package=bidvector.app.http
app.http.use-case-type=bidvector.workflow.strategy.EditStrategyWorkflow
