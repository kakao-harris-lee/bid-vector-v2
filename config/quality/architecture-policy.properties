# (i) F2-2(verifier r2) — 리플렉션으로 원문 값을 얻는 길(`javaClass.getMethod("getSourceText").invoke(...)`)은 원문 타입을 이름
# 붙이지 않아 (g) 가 못 본다. 값 획득을 **타입 이름이 아니라 반사 표면**으로도 닫는다: ① 아래 패키지의 타입 참조와
# ② `Class` 의 멤버 접근을 **등재된 쌍으로만** 허용한다. 서드파티 반사 도구(Spring `BeanWrapper`·`ReflectionUtils`,
# Jackson `convertValue`)는 타입 이름 목록이 되어 (g) 와 같은 열거가 되므로 넣지 않았다 — 알려진 제한(checklist).
#
# **A-2(운영자 결정 2026-10-03, D-6G2b-6)** — 앞 판은 뿌리가 (g) 와 같아(`workflow`·`app`) 반사를 `adapters` 로 한
# 걸음 옮기면 게이트 밖이었다. 뿌리를 `adapters` 까지 넓히고 걸리는 기존 참조를 쌍으로 등재한다. 뿌리는 (g) 의
# 원문 값 획득 뿌리와 **따로 둔다** — 그 게이트의 범위는 다른 결정이다(겹쳐 적으면 한쪽을 넓히는 편집이 다른
# 쪽을 조용히 넓힌다).
#
# 허용이 **쌍**인 이유는 둘이다. 멤버 이름만 전역으로 허용하면(앞 판의 `class-allowed-members=getName`) 어느
# 클래스든 그 이름을 쓸 수 있고, 클래스만 허용하면 등재된 클래스가 **새 반사 멤버를 더 부르는** 길이 열린다.
# 두 쌍 집합은 관측 집합과 같아야 한다(`CollectionArchitectureGateTest`).
