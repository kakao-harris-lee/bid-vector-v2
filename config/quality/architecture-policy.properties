# D-6A2b-41 ③ — **use case 조립 지점**은 구조로 정한다: 생성자 매개변수에 능력 포트를 받는
# `workflow` 타입이다(능력 포트 자체가 편집 use case 생성자에서 도출된 것이라 손 목록이 아니다).
# 그런 타입의 생성자를 app 에서 부르려면 아래 쌍에 있어야 한다. 편집 use case 는 **한 쌍도 없다**
# — 그 조립은 어댑터 트랜잭션 경계에만 있다(D-6A2b-3). dry-run 은 한 호출자에 고정한다.
# D-6A2b-49 — **주입 표면 정확 목록.** 제한 층·② 층 클래스가 **받을 수 있는** 타입이다.
# 참조 축의 허용 접두(`kotlin`·`java.util`)는 여기 적용되지 않는다 — verifier r5 F-r5-1 이 바로
# 그 접두 안의 일반 타입(`() -> Int`)으로 ① 층의 SQL 클로저를 컨트롤러에 건넸다.
# 범용 능력 운반 타입(함수 타입·도메인 뿌리 밖 SAM)은 이 목록에 **오를 수 없다**(게이트가 거부).
