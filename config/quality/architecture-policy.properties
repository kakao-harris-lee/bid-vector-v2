  bidvector.workflow.evaluation.CompetitionSamplePort,\
  bidvector.workflow.evaluation.CorrelationIdFactory,\
  bidvector.workflow.strategy.StrategyReader,\
  bidvector.workflow.strategy.StrategyRepository,\
  bidvector.workflow.strategy.EditSessionRepository,\
  bidvector.workflow.strategy.EventSink

# (호출자, 포트.메서드) 쌍의 허용 목록 — 오늘 production 실측 결과 셋뿐이다(구현 레인
# 확정, 새 예외를 추가할 때마다 사유를 커밋 메시지에 남긴다).
#   EvaluationDryRunFactory -> StrategyReader.load : D-6A3-5 요청당 한 번 읽기
#   StrategyQuery -> StrategyReader.load : D-6A1-4 읽기 전용 조회. M6/6A-2b D-6A2b-8 부터
#     `StrategyReadController` 가 아니라 `app.wiring` 의 조회기가 부른다. D-6A2b-41 이
#     읽기 port 를 갈라낸 뒤 **호출 owner 가 `StrategyReader`** 라 그 이름으로 적는다
#     (N-r5-4 — `StrategyRepository` 로 적혀 있던 동안 이 두 쌍은 죽은 항목이었고, 전략
#     읽기 호출은 이 게이트의 대상 밖이었다). 제한 층은 `StrategyReader` 를 직접 받지
#     못한다 — `app.http.denied-types` 가 그 자리를 진다
#   RequestAuditFilter -> CorrelationIdFactory.newId : D-6A1-7 correlation id 발급(6A-1)
app.port-call.allowed-pairs=bidvector.app.wiring.EvaluationDryRunFactory->bidvector.workflow.strategy.StrategyReader.load,\
  bidvector.app.wiring.StrategyQuery->bidvector.workflow.strategy.StrategyReader.load,\
  bidvector.app.http.RequestAuditFilter->bidvector.workflow.evaluation.CorrelationIdFactory.newId

