# 담고 있었고 그 사유(「dry-run use case 생성자 서술자가 상수 풀에 넣는다」)는 틀렸다 — ArchUnit 의
# 의존 모델은 그 이름을 ② 층 의존으로 내지 않는다(실측). 술어 쪽에도 같은 갈래가 선다
# (`tier2Allows` 의 첫 갈래 = 제한 층과 같은 능력 포트 거부).
#
# 목록은 오늘 실제 참조와 **등식**이다 — r4 의 스물넷 가운데 셋은 죽은 항목이었다.
