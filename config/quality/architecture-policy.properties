# 6A-1 이 남긴 audit 필터 하나가 함수 타입을 생성자로 받는다(`(ApiAuditRecord) -> Unit`). 그 파일은
# 이 slice 의 계약이 **무편집(diff 0)** 으로 묶어 두었으므로 서명을 바꿀 수 없다. 운반 타입 금지의
# 유일한 예외이고 **(클래스, 타입) 쌍**으로 못박는다 — 그 한 자리 말고 어디서도 함수 타입은 못
# 들어온다. 남는 위험은 둘이다: ① 층이 그 자리에 **다른 몸통**의 함수 값을 넘기는 것(알려진 제한
# ⑱ 과 같은 뿌리), 그리고 쌍의 타입이 **소거**라 그 클래스에 한해 `Function1` 의 타입 인자가 무엇이든
# 통과하는 것(N-r6-10). 오늘 그 파일은 D-6A2b-5 로 diff 0 이라 둘 다 실현되지 않는다.
app.injection.carrier-exemptions=bidvector.app.http.RequestAuditFilter|kotlin.jvm.functions.Function1

# N-r5-5 — 제한 층은 읽기 port 를 **직접** 받지 않는다(조회기 경유만). `StrategyReader` 는 허용
# 접두 안이라 목록만으로는 열려 있다 — 이 자리에서 다시 판다.
app.http.denied-types=bidvector.workflow.strategy.StrategyReader

# 주입점을 정하는 애너테이션 — 프레임워크가 정하는 유한 집합이다(생성자 매개변수는 애너테이션
# 없이도 주입점이다).
app.injection.annotations=org.springframework.beans.factory.annotation.Autowired,\
  org.springframework.beans.factory.annotation.Value,\
  jakarta.inject.Inject,\
  jakarta.annotation.Resource

# SAM 이라도 **이름이 곧 계약인 타입**은 운반 타입이 아니다. 이 뿌리 **밖**의 SAM(JDK 의
# `Runnable`·`Supplier`, `bidvector.app.**` 의 자작 `fun interface`)은 운반 타입이다.
#
# 키 이름은 「도메인 port」라 적지만 목록에 `bidvector.adapters` 가 함께 있다(N-r6-9) — 어댑터
# 경계(`StrategyEditTransaction`)가 이름 있는 계약이라 같은 취급을 받는다. 그래서 이 뿌리의 뜻은
# 「도메인 port」가 아니라 **「이 저장소가 이름 붙인 계약의 뿌리」**다. 귀결: `bidvector.adapters.**`
# 의 어떤 SAM 이든 주입 목록에 오를 수 있다 — 그 자리는 어댑터 멤버 호출 쌍이 따로 진다.
app.injection.domain-port-roots=bidvector.workflow,\
  bidvector.strategy,\
  bidvector.sharedkernel,\
  bidvector.procurement,\
  bidvector.decision,\
  bidvector.qualification,\
  bidvector.settlement,\
  bidvector.adapters

app.workflow-root=bidvector.workflow
app.workflow.use-case-construction-pairs=bidvector.app.wiring.EvaluationDryRunFactory|bidvector.workflow.evaluation.EvaluateCandidatesUseCase

app.assembly.tier2.allowed-classes=bidvector.adapters.evaluation.PinnedStrategyRepository,\
  bidvector.adapters.evaluation.RecordingNotificationRequestPort,\
  bidvector.adapters.evaluation.RequestCapacityPort

# 허용 접두 안에 있어도 다시 파는 자리 — 이 층에 SQL 은 있을 수 없다.
app.assembly.tier2.denied-packages=java.sql,javax.sql,org.springframework.jdbc

# D-6A2b-34 — ① 층은 **조립은 하되 HTTP 에 꽂지 못한다.** 확장점의 종류를 세는 대신 그 API 에
# 대한 의존 자체를 막는다 — interceptor·Tomcat valve·`@ControllerAdvice`·argument resolver 가
# 전부 이 접두에서 온다. 애너테이션도 의존으로 센다.
app.assembly.tier1.forbidden-http-packages=org.springframework.web,\
  org.springframework.boot.web,\
  org.springframework.boot.webmvc,\
  org.springframework.boot.tomcat,\
  org.springframework.boot.servlet,\
  jakarta.servlet,\
  org.apache.catalina,\
  org.apache.tomcat

# 예외는 **클래스가 아니라 타입**이다 — 「이 클래스는 통째로 봐준다」로 두면 그 클래스가
# interceptor 를 등록하는 형태(verifier r3 A1)가 그대로 열린다. 오늘 쓰는 타입 하나만 연다:
# 필터 등록(인증·audit 두 필터를 서블릿 컨테이너에 꽂는 자리). 그 등록이 실제로 무엇을 꽂는지는
# 표면 실측(D-6A2b-27)이 Filter 집합 등식으로 잰다.
app.assembly.tier1.http-api-types=org.springframework.boot.web.servlet.FilterRegistrationBean

# D-6A2b-36·43·44 — 어댑터 **멤버** 호출은 이 쌍 목록에 있을 때만이다. 판정은 fail-closed 다:
# 인터페이스든 구체 클래스든 여기 없으면 위반이다(D-6A2b-43 — 「그 밖은 허용」이던 앞 판은
# ② 층의 구체 클래스 호출을 통째로 못 봤고, 오늘 도는 호출 하나가 이미 계약 밖이었다).
# 좌표는 넷 — `호출자|선언 타입|메서드|서술자` 다. 서술자(매개변수 타입)가 없으면 같은 이름의
# 오버로드가 같은 자리로 접힌다(D-6A2b-44, verifier r4 F-r4-3 이 그 통로로 raw SQL 을 불렀다).
# 판정은 6A-3 의 호출 쌍 규칙과 같다 — owner 의 상위 타입까지 훑어 구현을 거쳐 불러도 걸린다.
app.adapter.member-call-pairs=bidvector.app.wiring.StrategyEditExecutor|bidvector.adapters.strategy.StrategyEditTransaction|inTransaction|kotlin.jvm.functions.Function1,\
  bidvector.app.wiring.EvaluationDryRunRun|bidvector.adapters.evaluation.RecordingNotificationRequestPort|requested|

# D-6A2b-37 — 오류 매핑표가 옮기는 어댑터 예외 타입. 이 타입들의 **자기 메서드**는 부를 수 없다
# (`Throwable`·`Object` 가 선언한 멤버만) — A4 가 그 통로였다.
app.adapter.exception-types=bidvector.adapters.strategy.InvalidStoredStrategyException,\
  bidvector.adapters.evaluation.CandidateCapExceededException,\
  bidvector.adapters.evaluation.InvalidEvaluationRequestException

# D-6A2b-10 — `OPEN-6A1-CREDENTIAL-RAW-REINTRODUCTION` 수령·재측정. 새 쓰기 표면이 원문
# 자격증명의 획득 비용을 낮추지 않았는지: 이 두 타입을 참조하는 production 클래스 집합이
# 여전히 {필터, 조립 지점} 인지 집합 등식으로 잰다(6E 로 넘기는 것은 완전 폐쇄뿐이다).
app.secret.operator-credential-types=bidvector.app.http.OperatorCredential,\
  bidvector.app.OperatorCredentialProperties
app.secret.operator-credential-referencers=bidvector.app.http.OperatorCredentialFilter,\
  bidvector.app.BidVectorApplication

# ---------------------------------------------------------------------------
# D-6A2b-27 — **HTTP 로 무엇이 닿는가**의 실측 목록. 출하 조립에서 거둔 handler·Filter·
# Servlet 집합이 아래와 **같아야** 한다(API 포트·관리 포트 각각). 종류를 열거하지 않는다 —
# 등록된 것을 전부 거두고, 모르는 종류를 만나면 표기 하나가 들어와 등식이 깨진다.
# ---------------------------------------------------------------------------

app.surface.api.handlers=bidvector.app.http.StrategyReadController,\
  bidvector.app.http.StrategyEditController,\
  bidvector.app.http.EvaluationDryRunController,\
  org.springframework.boot.webmvc.autoconfigure.error.BasicErrorController
app.surface.api.filters=bidvector.app.http.OperatorCredentialFilter,\
  bidvector.app.http.RequestAuditFilter,\
  org.apache.tomcat.websocket.server.WsFilter,\
  org.springframework.boot.servlet.filter.OrderedCharacterEncodingFilter,\
  org.springframework.boot.servlet.filter.OrderedFormContentFilter,\
  org.springframework.boot.servlet.filter.OrderedRequestContextFilter,\
  org.springframework.web.filter.ServerHttpObservationFilter
app.surface.api.servlets=org.springframework.web.servlet.DispatcherServlet

# M-r3-4 — 진입점 **축**의 목록이다(handler 집합과 다른 축). 두 번째 method mapping 빈이
# 이미 계약에 있는 컨트롤러를 새 경로에 걸면 handler 집합은 그대로라 등식이 깨지지 않는다.
# 오늘 둘이다: 우리 어노테이션 매핑과, Boot 가 「health 추가 경로」용으로 올리는 매핑(추가
# 경로가 설정돼 있지 않아 handler 0 이고, 설정되는 순간 handler 집합 등식이 먼저 붉어진다).
app.surface.api.method-mapping-beans=healthEndpointWebMvcHandlerMapping:\
org.springframework.boot.webmvc.actuate.endpoint.web.AdditionalHealthEndpointPathsWebMvcHandlerMapping,\
  requestMappingHandlerMapping:org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping
# 마지막 항목 `알 수 없는 종류: …CompositeHandlerMapping` 은 **풀지 않고 수용한 항목**이다
# (D-6A2b-38 / L-r3-5). 그것은 handler 를 스스로 만들지 않고 자기 컨텍스트와 조상의
# `HandlerMapping` 빈에게 넘기기만 하므로, 위임 대상은 census 가 두 컨텍스트에서 이미 도는
# 빈들이다. 그 근거는 문장으로 두지 않고 census test 의 「위임할 수 있는 mapping 빈」 단언이
# 잠근다. 관리 포트 노출 자체는 D-6A2a 의 잠금이 따로 지킨다.
# N-r4-9 — 관리 포트의 진입점 축. API 포트와 같은 모양으로 둔다(빈 이름:타입).
app.surface.management.method-mapping-beans=controllerEndpointHandlerMapping:org.springframework.boot.webmvc.actuate.endpoint.web.ControllerEndpointHandlerMapping,\
  managementHealthEndpointWebMvcHandlerMapping:org.springframework.boot.webmvc.actuate.endpoint.web.AdditionalHealthEndpointPathsWebMvcHandlerMapping,\
  requestMappingHandlerMapping:org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping,\
  webEndpointServletHandlerMapping:org.springframework.boot.webmvc.actuate.endpoint.web.WebMvcEndpointHandlerMapping

app.surface.management.handlers=org.springframework.boot.webmvc.actuate.endpoint.web.AbstractWebMvcEndpointHandlerMapping$OperationHandler,\
  org.springframework.boot.webmvc.autoconfigure.actuate.web.ManagementErrorEndpoint,\
  알 수 없는 종류: org.springframework.boot.webmvc.autoconfigure.actuate.web.CompositeHandlerMapping
app.surface.management.filters=org.apache.tomcat.websocket.server.WsFilter
app.surface.management.servlets=org.springframework.web.servlet.DispatcherServlet

# ---------------------------------------------------------------------------
# M6/6F-8 D-6F8-1~4 — 수집 배선의 구조 게이트(위협 모델 ① ② ③ ④ ⑤). 전부 **집합**이다 — 이름 목록·패키지 하나가
# 아니라 classpath 전체에서 도출한 참조·접근 집합의 부분집합 검사이고 허용 집합은 이 파일이 갖는다.
# ---------------------------------------------------------------------------

# (a) 우회 5(app 쪽) — 수집 포트·정규화 함수를 호출할 수 있는 것은 use case(workflow) 하나다. 위
# `app.port-call.ports` 에 수집 포트 넷과 `canonicalize`(파일 클래스 `CanonicalizeKt`)를 더했고 허용 쌍은
# 더하지 않았다 — app production 은 어느 클래스도 이 다섯의 메서드를 직접 부르지 못한다(러너·배선은
# use case 만 부른다).

# (b) 우회 1 — 수집 use case 패키지가 procurement 에서 참조해도 되는 **최상위 타입** 집합. 여기에 원문 키 접근
# 타입(`KonepsFieldContract`·`KonepsFieldContractRegistry`·`RawKey`·`RawValue`·`FieldPresence`·`FieldConcept`)이
# 없다 — 그 타입을 이름 붙이지 않고는 `RawNoticeObservation.valueOf`·`presenceOf` 를 부를 수 없다.
workflow.collection.package=bidvector.workflow.collection
workflow.collection.allowed-procurement-types=bidvector.procurement.AttemptKind,\
  bidvector.procurement.AttemptOutcome,\
  bidvector.procurement.CollectionAttempt,\
  bidvector.procurement.CollectionAttemptLedgerKt,\
  bidvector.procurement.NoticeSourcePort,\
  bidvector.procurement.RawObservationStore,\
  bidvector.procurement.NoticeRepository,\
  bidvector.procurement.CollectionRunStore,\
  bidvector.procurement.CollectionRunMeta,\
  bidvector.procurement.CollectionReferenceDate,\
  bidvector.procurement.PageCursor,\
  bidvector.procurement.SourceBatch,\
  bidvector.procurement.CollectionAccounting,\
  bidvector.procurement.CollectionDropReason,\
  bidvector.procurement.TruncationCause,\
  bidvector.procurement.SourceEndpoint,\
  bidvector.procurement.CanonicalizationOutcome,\
  bidvector.procurement.CanonicalizeKt,\
  bidvector.procurement.KonepsCollectionPolicyData,\
  bidvector.procurement.RawNoticeObservation,\
  bidvector.procurement.PersistOutcome,\
  bidvector.procurement.BusinessDivision,\
  bidvector.procurement.OpeningResultSourcePort,\
  bidvector.procurement.NoticeId,\
  bidvector.procurement.NoticeIdentityKt,\
  bidvector.procurement.DetailFetchKt,\
  bidvector.procurement.DetailFetchDecision,\
  bidvector.procurement.DetailFetchGates,\
  bidvector.procurement.NoticeNumber,\
  bidvector.procurement.CollectedAxisStore,\
  bidvector.procurement.BudgetLimit,\
  bidvector.procurement.AttemptLedger,\
  bidvector.procurement.AttemptHistory,\
  bidvector.procurement.CollectionCallBudgetKt

# M6/6G D-6G-19 — 개찰결과 갈래(`CollectOpeningResultsUseCase`)가 더하는 여섯. 상세 포트
# (`OpeningResultSourcePort`)와 그 호출 증거(`DetailFetchDecision`·`DetailFetchGates`·
# `decideDetailFetch`)는 **포트 서명이 요구하는** 타입이다 — 조회 가치 술어를 거치지 않은 호출을
# 컴파일로 막는 장치라, 그것을 쓰려면 이름을 붙일 수밖에 없다. `NoticeId`·`noticeIdIn` 은 표본틀이
# (공고번호,차수)만 얻는 자리다 — **원문 키 접근 타입은 여전히 이 목록에 없다**(그것이 이 게이트가
# 겨누는 것이고, 키를 고르는 일은 계약을 소유한 procurement 안에 남는다).
#
# 대분류 축 여섯(`CONSTRUCTION`·`SERVICE`·`GOODS`·`FOREIGN`·`values`·`ordinal`)은 「공사만 A값을
# 더 부른다」는 **소진 `when`** 이 만든다(D-6G-12). 값을 새로 짓는 자리가 아니라 이미 얻은 값으로
# 갈래를 고르는 자리이고, 소진이라 대분류가 하나 늘면 컴파일이 깨진다.
#
# M6/6G D-6G-11 — `BusinessDivision` 이 이 목록에 든 것은 **층화 표본의 층 축**이 업무 대분류이기 때문이다
# (`SampleStratum`). 값을 얻는 자리가 아니라 **운반 슬롯**이다 — 표본 후보가 자기 층을 들고 다닐 뿐, 이 패키지에
# 대분류를 문자열·URL·응답에서 짓는 코드는 없다(acquisition-pairs 가 그것을 따로 잰다).
#
# 이 목록은 관측 집합과 **같아야** 한다(`CollectionArchitectureGateTest` — 낡은 항목이 게이트를 느슨하게 두지
# 않는다). `NoticeCollected`·`ObservationKey` 는 use case 가 이름 붙이지 않고 포트 사이로 옮기기만 해서(추론
# 타입) 여기 없다 — 그 타입을 이름 붙이거나 멤버를 건드리면 아래 통과 전용 규칙과 이 목록 밖 참조 규칙이 함께 걸린다.

# 통과 전용 타입 — 이름은 붙여도(시그니처) 멤버는 건드리지 못한다: 원문(`RawNoticeObservation`)·정책
# (`KonepsCollectionPolicyData`)·정규화 결과(`NoticeCollected`)는 use case 가 포트와 `canonicalize` 사이로
# 옮기기만 한다. 이 타입들은 결과 타입의 필드도 될 수 없다(결과가 원문·키를 나르지 않는다).
workflow.collection.pass-through-types=bidvector.procurement.RawNoticeObservation,\
  bidvector.procurement.KonepsCollectionPolicyData,\
  bidvector.procurement.NoticeCollected
workflow.collection.forbidden-field-types=bidvector.procurement.RawNoticeObservation,\
  bidvector.procurement.KonepsCollectionPolicyData,\
  bidvector.procurement.NoticeCollected,\
  bidvector.procurement.ObservationKey

# (c) 우회 2 — 공고명 원시 키 리터럴(값은 `NOTICE_TITLE` 필드 계약이 정하고 게이트가 정책에서 읽는다)을 상수
# 풀에 가진 production 클래스 집합. 계약 데이터를 실은 정책 파일 클래스 하나뿐이다.
collection.title-key.allowed-classes=bidvector.procurement.CollectionPolicyKt

# (c') M6/6F-9 D-6F9-2 우회 4 — 업무구분 세부 분류 원시 키 리터럴(용역구분·공공조달분류 번호·명·주공종). 위 (c) 와 같은 형태이되 **개념
# 집합**이다 — 키 문자열은 이 파일에도 코드에도 없고 게이트가 개념의 필드 계약에서 읽는다. 허용 클래스 = 그 계약 행을 실은 파일
# 클래스 하나(`CollectionPolicy.kt` 가 500줄 한도라 새 파일에 산다). 개념 집합은 허용 클래스가 상수 풀에 가진 운영 계약 키의
# 개념과 **같아야** 한다(`CollectionArchitectureGateTest` — 새 계약 행이 이 게이트 밖에 남지 않는다).
collection.classification-key.concepts=PUBLIC_PROCUREMENT_CLASS_CODE,PUBLIC_PROCUREMENT_CLASS_NAME,SERVICE_DIVISION,\
  MAIN_CONSTRUCTION_TYPE
collection.classification-key.allowed-classes=bidvector.procurement.KonepsClassificationFieldContractsKt

# (c'') M6/6F-9 D-6F9-1 우회 1 — 업무 대분류는 관측이 구조로 나른다(설정 표 한 행 → 어댑터 생성 인자 → 관측 → `canonicalize`).
# **verifier r1 F-1 뒤 개정**: 이전 판은 변환 멤버 넷(`fromLabel`·`valueOf`·`values`·`getEntries`)의 호출만 보아 enum 상수 읽기·
# 새 companion 멤버·`java.lang.Enum.valueOf(Class, String)` 셋이 전체 `check` 를 초록으로 통과했다. 이제 멤버 이름을 열거하지 않고
# **값이 생기는 자리 전부**를 세 축으로 닫는다(술어는 `DivisionValueRules`, 전부 관측 == 허용 양방향):
#   ① type-access-pairs  — 타입 자신의 **모든** 멤버 접근 `호출자->멤버`(상수 필드·companion·entries·새 멤버 무엇이든).
#   ② acquisition-pairs  — 값을 **얻는** 자리 `호출자->소유자#멤버`(반환 타입이 대분류인 호출 + 대분류 필드 읽기). 운반 슬롯의
#      getter 가 여기 드는 것은 의도다 — 대분류가 닿는 자리를 늘리는 변경은 이 목록 한 줄을 명시적으로 더하게 된다.
#   ③ class-object-referencers — 대분류 **클래스 리터럴**(`::class.java`) 참조자. `Enum.valueOf`·`Class.getEnumConstants` 는 호출
#      소유자가 JDK 타입이라 ①②에 안 걸린다 — 리터럴이 그 길의 입구다(오늘 production 참조자 0).
# 허용의 근거: 저장 라벨 복원(영속 — DB CHECK 가 어휘를 지킨다) · 정책의 문서 열거 어휘 파생 · 설정 기본 표 한 행 · 운반 슬롯
# (관측 → canonicalize → 공고 → 감시 텍스트·영속 행)뿐이다. `SnapshotExtractionRunner->name` 은 그 운반 슬롯의 마지막 칸이다
# (D-6G-66) — 확정 범위 파일의 업무 집합을 manifest `sample_scope_divisions` 로 싣는다. 여기서 어휘를 **짓지 않고** 이미
# 확정된 집합의 이름을 적을 뿐이라, 이 쌍이 늘어도 대분류를 새로 판정하는 자리는 생기지 않는다.
# **닫는 범위**(verifier r2 실측): URL·오퍼레이션 이름·응답 문자열에서 대분류를 짓는 코드는 관용적인 Kotlin 표기 — 상수 읽기·
# 새 companion 멤버·`entries`/`values`/`valueOf`·typealias·함수 참조·reified 제네릭 헬퍼·분해 선언·`Enum.valueOf(Class,·)`·
# `ConversionService` — 가운데 무엇으로 써도 세 축 하나를 바꾼다.
# **닫지 못하는 범위**: 제네릭이 **소멸된** 자리에서 얻은 값은 세 축에 보이지 않는다 — 대분류를 담은 컨테이너
# (`Map`·`List` 원소 읽기), `Class.getEnumConstants`, 역직렬화기의 타입 토큰. 리터럴이 아닌 `Class` 획득(인스턴스의
# `javaClass`, 문자열의 `Class.forName`)도 축 ③ 밖이다. 6F-8 리플렉션·`Class` 멤버 게이트가 이 길을 덮는 root 는
# `collection.raw-access.roots`(= `workflow`·`app`)뿐이었다. **`adapters` 는 M6/6G-2b 의
# `collection.reflection.roots` 가 덮는다**(D-6G2b-11) — 남은 것은 `procurement`(domain 계열)이고 그쪽은
# `OPEN-6G2B-REFLECTION-ROOT-DOMAIN`(D-6G2b-20) 소관이다. 구조로 닫는 방향은
# `OPEN-6F9-DIVISION-REFLECTION`(evidence 알려진 제한).
