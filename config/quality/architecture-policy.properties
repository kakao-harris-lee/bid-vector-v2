# 아키텍처 경계 정책 — v2-지침서.md §3.1 · ADR 0006 D-2·D-3·D-4·D-6 · milestone-1.md 「구현 규칙」
#
# 같은 규칙이 **세 층에서 강제된다**(ADR 0006 §4).
#   1차 = 빌드 의존 선언  — 모듈의 의존 그래프를 보고 컴파일 전에 실패한다
#                           (moduleDependencyGate: project 의존 + 금지 group)
#   2차 = architecture test — 실제 타입 참조를 바이트코드에서 본다
#                           (ArchitectureGateTest: package.forbidden 등)
#   3차 = 소스 참조 게이트 — domain main 소스가 **이름으로** 부르는 좌표를 PSI 에서 본다
#                           (domainSourceReferenceGate: SourceReferencePolicy 가 아래 네 키를
#                           읽는다). 컴파일 시 인라인되는 상수·class literal 은 2차가 놓치는
#                           자리라 3차가 덮는다 — 이름과 결합의 분담이지 목록이 늘어난 것이
#                           아니다.
# 세 층은 같은 규칙의 다른 표현이므로 목록도 이 한 파일이 갖는다.
#
# v6 — T-D 를 손 열거에서 **효과 표면 도출**로 바꿨다(`effect.surface.*` · `memberEffectGate`).
# v7(M1/1A-b ④(b), D-2) — 모듈이 가질 수 있는 source set 집합을 정책 키로 승격
# (`module.expected-source-sets`) — `packageOwnershipGate`·`sourceSetLayoutGate` 두 자리의
# `setOf("main", "test")` 리터럴이 이제 이 값 하나에서 나온다. `java-test-fixtures`를 전
# 모듈에서 허용하지 않는다(D-2)는 사실이 이 값이 `main,test` 뿐이라는 데도 반영된다 —
# 이 값을 늘리는 것 자체가 D-2 를 뒤집는 편집이라 ADR 개정 없이는 손대지 않는다.
# v8(M6/6G-2b, D-6G2b-1~6·22·28·34) — 허용의 모양이 **집합에서 쌍으로**, 그리고 바깥 참조는 **기본 거부
# 허용 목록**으로 바뀐 판이다. 바깥 참조 허용은 `collection.external.allowed-packages.<module>` 모듈별 키
# 셋이고, **판정 대상 모듈 목록은 키가 아니라 `layer.application`·`layer.adapters`·`layer.app` 도출**이다
# (모집단 단언과 같은 자리를 읽는다 — 모듈을 빠뜨리면 둘이 함께 붉다). ① 전송 표면 게이트 둘(HTTP
# 클라이언트 보유자 집합 · 우회 타입 금지 집합)을 `collection.transport.*` 하나로 합쳤다 — 금지가 타입 이름
# 열거에서 **패키지 뿌리**로, 허용이 클래스 집합에서 **(클래스, 타입) 쌍**으로. ② 반사 게이트(A-2, 운영자
# 결정)의 뿌리에 `adapters` 를 더하고 허용을 **(클래스, 타입)·(클래스, 멤버) 쌍**으로 바꿨다. 앞 판의
# `collection.http-client.*`·`collection.transport-bypass.*`·`collection.reflection.allowed-referencers`·
# `collection.reflection.class-allowed-members` 는 이 판에 없다.
policy.version=8

# 루트 패키지. 모듈 이름 → 패키지 세그먼트 변환 규칙은 **하이픈 제거** 하나다
# (`shared-kernel` → `bidvector.sharedkernel`). 두 이름을 따로 열거하지 않는다.
package.root=bidvector

# 모듈이 가질 수 있는 source set 이름 집합(D-2, ④(b)). `java-test-fixtures`가 추가하는
# `testFixtures` source set 은 이 집합 밖이라 그 플러그인이 constructive 가드(④(a))를
# 우회해 손으로 등록되더라도(예: 같은 이름의 source set 을 직접 만드는 경로) 소유·레이아웃
# 게이트가 집합 불일치로 잡는다(방어 심층).
module.expected-source-sets=main,test

# 층과 그 층의 모듈(Gradle project 이름). 층 순서는 아래 layer.order 가 정한다.
layer.order=domain,application,adapters,app
layer.domain=shared-kernel,procurement,qualification,strategy,decision,settlement
layer.application=workflow
layer.adapters=adapters
layer.app=app

# 업무 모듈이 서로를 직접 참조하지 못한다(ADR 0006 D-4). domain 안에서 공유 가능한 유일한 모듈.
# 허용 project 의존은 이 둘에서 유도된다 — 자기보다 아래 층 전부 + domain 안에서는 이것만.
layer.domain.shareable=shared-kernel

# ---------------------------------------------------------------------------
# domain 이 볼 수 있는 것 — **네 층. 각 층의 실패 방향을 고정한다**
# ---------------------------------------------------------------------------
# 설계 근거는 `scope.md` 「계약 갱신」이 든다. 요지: 열거를 **없앨 수는 없고**(기계적 유도가
# String·List·BigDecimal 까지 탈락시킨다) 고를 수 있는 것은 **열거의 방향** = 실패 방향뿐이다.
#
#   T-A 하위까지 허용 : bidvector          — 방향은 layer.* 가 따로 잰다
#   T-B 정확 패키지    : 동질 패키지(값·계산만)  — 실패 방향 **닫힘**
#   T-C 클래스 단위    : 이질 패키지(java.lang·java.util) — 목록에 없으면 금지. **닫힘**
#   T-D 멤버 단위 금지 : 필수 클래스 안의 효과 멤버 — **도출 + 분류 래칫**(미분류는 빌드 실패)
#
# `class.forbidden` 은 **없앴다.** T-C 가 그 자리를 대신하고 방향이 반대라 「생각해 내지 못한
# 좌표」가 자동으로 닫힌다. 실측: java.lang+java.util 217 종 중 deny 16 종만 분류돼 201 종이
# 열려 있었다 — 열거의 방향이 반대라 미분류가 조용히 통과했다.
package.allowed.subtree=bidvector

# T-B. 정확 패키지. 하위는 열리지 않는다.
#   java.math / java.time / java.time.temporal — 금액(ADR 0002)·시간(v2-지침서 §3.1)·날짜 간격
#   kotlin.* 계열 — 언어 표준 중 순수 계산. `kotlin.enums`·`kotlin.math` 가 없으면 모든
#     `enum class` 와 반올림이 막힌다(1C·1D reason code, 1B RoundingPolicy).
#   kotlin.jvm* · org.jetbrains.annotations — 컴파일러 삽입 산출물. 사용자 코드가 아니다.
# `java.text` 는 뺐다 — 승인 문서가 요구하지 않고, 형식화는 표현 관심사라 adapters 의 일이며,
# 로케일 자원을 로드하는 이질 패키지다.
package.allowed.exact=java.math,java.time,java.time.temporal,\
  kotlin,kotlin.collections,kotlin.text,kotlin.ranges,kotlin.sequences,kotlin.comparisons,\
  kotlin.enums,kotlin.math,\
  kotlin.jvm,kotlin.jvm.internal,kotlin.jvm.functions,org.jetbrains.annotations

# T-C. 이질 패키지 — 순수 타입과 위험 타입이 섞여 있어 패키지로 가를 수 없다.
# 아래 class.allowed.* 에 없는 클래스는 **전부 금지**다.
package.allowed.byclass=java.lang,java.util

# (a) 도메인이 **직접 이름 붙이는** 타입.
class.allowed.api=\
  java.lang.Object,java.lang.String,java.lang.CharSequence,java.lang.Comparable,\
  java.lang.Iterable,java.lang.Number,java.lang.Enum,java.lang.Cloneable,\
  java.lang.Math,java.lang.StrictMath,\
  java.lang.Byte,java.lang.Short,java.lang.Integer,java.lang.Long,\
  java.lang.Float,java.lang.Double,java.lang.Character,java.lang.Boolean,java.lang.Void,\
  java.lang.Throwable,java.lang.Exception,java.lang.RuntimeException,\
  java.lang.IllegalArgumentException,java.lang.IllegalStateException,\
  java.lang.UnsupportedOperationException,java.lang.ArithmeticException,\
  java.lang.NumberFormatException,java.lang.NullPointerException,\
  java.lang.IndexOutOfBoundsException,java.lang.ClassCastException,\
  java.lang.Deprecated,java.lang.Override,java.lang.SuppressWarnings,java.lang.FunctionalInterface,\
  java.util.Collection,java.util.List,java.util.Set,java.util.Map,java.util.Map$Entry,\
  java.util.Iterator,java.util.ListIterator,java.util.RandomAccess,\
  java.util.SortedMap,java.util.SortedSet,java.util.NavigableMap,java.util.NavigableSet,\
  java.util.Comparator,java.util.Collections,java.util.Arrays,java.util.Objects,\
  java.util.EnumMap,java.util.EnumSet,\
  java.util.NoSuchElementException,java.util.ConcurrentModificationException

# (b) 컴파일러·stdlib 이 **고르는** 구현 타입. 사용자 코드가 이름 붙이지 않는다 —
# `filter` 가 ArrayList 를, `associateWith` 가 LinkedHashMap 을, 문자열 템플릿이 StringBuilder 를
# 고른다. 위반 메시지가 「내가 쓴 적 없는 타입」을 지목할 때 출처를 알 수 있도록 갈라 적는다.
class.allowed.runtime=\
  java.lang.StringBuilder,\
  java.util.ArrayList,java.util.HashMap,java.util.LinkedHashMap,\
  java.util.HashSet,java.util.LinkedHashSet,java.util.TreeMap,java.util.TreeSet

# **일부러 넣지 않은 것과 그 이유** — 이것도 정책의 일부다.
#   UUID · Random · Date · Calendar : 비결정성·레거시 시간. 1A 는 금지 정책을 세우는 것이 아니라
#     목록에 넣지 않을 뿐이다. 1B 가 필요하면 사유와 함께 연다.
#   Optional : Kotlin 은 nullable 로 표현한다. 두 관용구 공존은 §5 「중복 금지」와 마찰.
#   Class · Thread · System · Runtime · ProcessBuilder · StackWalker · ClassLoader : 예전
#     class.forbidden 의 대상. **이제 「목록에 없어서」 닫힌다.**
#   Formatter · Scanner · ResourceBundle · Properties · Timer · TimerTask · ServiceLoader ·
#     Locale · TimeZone · Currency · Base64 : 파일·자원 I/O·환경·스레드.

# T-D. 허용된 클래스 **안**의 효과 멤버. 클래스 단위로 가를 수 없는 자리다 —
# `Integer.valueOf`(필수)와 `Integer.getInteger`(시스템 프로퍼티 읽기)가 같은 클래스이고,
# `Throwable.printStackTrace` 는 허용된 예외 계층이 상속으로 들고 다닌다.
#
# **이 층은 더 이상 손 열거가 아니다.** 아래 두 줄이 「금지 표면」을 효과 어휘로 고정하고,
# `memberEffectGate` 가 허용 클래스의 public/protected 멤버 가운데 그 표면에 닿는 것을
# **도출**한다(서명 ∪ depth-1 본문). 도출 결과는 `member-effects.generated.properties` 로
# 커밋되고, 분류는 `member-effects.properties` 가 갖는다. **미분류 후보가 남으면 빌드가
# 실패하므로** 생각해 내지 못한 멤버가 조용히 열리지 않는다.
#
# **여집합(허용 목록 밖에 닿으면 불순)은 쓰지 못한다** — JDK 내부가 `System#arraycopy` ·
# `jdk.internal` 로 촘촘히 엮여 있어 `ArrayList#add` · `String#substring` · `Integer#valueOf` 가
# 전부 불순이 된다(설계 검토 실측). 그래서 표면을 **효과 쪽에서** 적는다.
#
# 목록의 출처는 승인 문면의 어휘다 — `milestone-1.md` 「구현 규칙」의 *"domain은 I/O가 없는
# 입력→출력 함수/객체다"* 와 `v2-지침서.md` §3.1 의 경계(I/O · 프로세스 · 스레드 · 환경 ·
# 리플렉션). 손으로 적는 멤버 목록과 달리 이 어휘는 문면이 이미 고정했다.
effect.surface.packages=java.io,java.nio,java.net,java.sql,\
  java.lang.reflect,java.lang.invoke,java.lang.ref,\
  java.util.concurrent,java.util.logging,java.util.zip,java.util.jar,java.util.prefs

# `java.lang.StackTraceElement` 은 실행 스택 — 환경·리플렉션 축이며 `StackWalker` 와 같은 이유로
# 든다. 나머지는 위 「일부러 넣지 않은 것」 목록과 같은 좌표들이다: 그쪽은 도메인이 그 타입을
# **이름 붙이는 것**을 막고, 여기서는 허용 클래스의 멤버가 **그 타입에 닿는 것**을 잡는다.
effect.surface.classes=java.lang.System,java.lang.Thread,java.lang.Runtime,\
  java.lang.Process,java.lang.ProcessBuilder,java.lang.ProcessHandle,\
  java.lang.ClassLoader,java.lang.Class,java.lang.StackWalker,java.lang.StackTraceElement,\
  java.util.Random,java.util.Timer,java.util.ServiceLoader,java.util.ResourceBundle,\
  java.util.Locale,java.util.TimeZone,java.util.Currency,java.util.Formatter,\
  java.util.Scanner,java.util.Properties

# domain **main** 이 볼 수 있는 외부 좌표(1차 게이트). group deny 가 아니라 allow 다 —
# 실측(`./gradlew :settlement:dependencies --configuration compileClasspath`)으로 둘뿐이다.
external.allowed.domain=org.jetbrains.kotlin:kotlin-stdlib,org.jetbrains:annotations

# ---------------------------------------------------------------------------
# 1차 게이트 — 의존 **선언** 수준의 조기 차단
# ---------------------------------------------------------------------------
# 위 allow-list 는 바이트코드의 **참조**를 본다. 이 목록은 그보다 앞서 **의존 그래프**를 보고
# domain 모듈의 classpath 에 프레임워크가 오르는 순간 컴파일 전에 끊는다(ADR 0006 D-3 —
# *"의존 선언은 Gradle 빌드 스크립트가 1차 강제 수단"*). 참조가 아직 없어도 잡히므로
# allow-list 가 대체하지 못하고, JDK 가족은 Maven group 이 없어 여기 오르지 못한다.
# 두 층의 사각이 서로 반대라는 사실은 그대로다 — evidence 의 가족별 표가 그 분담을 든다.
group.forbidden=\
  org.springframework,\
  jakarta.persistence,jakarta.transaction,jakarta.servlet,jakarta.validation,\
  org.hibernate,jakarta.jms,\
  com.fasterxml.jackson,tools.jackson,org.jetbrains.kotlinx:kotlinx-serialization,com.google.code.gson,org.json,\
  com.squareup.okhttp3,com.squareup.retrofit2,org.apache.httpcomponents,io.ktor,\
  io.grpc,com.google.protobuf,\
  org.postgresql,\
  org.apache.kafka,com.rabbitmq,io.nats,org.apache.pulsar,\
  io.micrometer,org.flywaydb,org.testcontainers,com.github.kagkarlsson,io.github.resilience4j

# 모듈 안의 패키지 규약(scope.md D-3). 모듈 경계가 이미 계층을 표현하므로 모듈 안에
# 기술 계층을 또 만들지 않는다. `util`·`common` 은 ADR 0006 A-6 이 경고한 자석의 이름이다.
package.segment.forbidden=util,utils,helper,helpers,impl,common,misc,base,service,manager,dto,vo

# M6/6A-3+6F-3 D-6A3-9 — 위 T-A~T-D 축(domain 이 무엇을 볼 수 있는가)과 다른 축이다. 이
# 키는 **누가 `bidvector.strategy.TextKt.assemble*`(감시 텍스트 조립 커널)를 부를 수
# 있는가**의 허용 목록이다 — 배선이 호출자를 더할 때마다(예: 다른 어댑터가 같은 텍스트를
# 또 이어붙이면) 이 목록에 추가해야 `AssembleCallerGateTest`가 통과한다(검사 대상 목록을
# 게이트 코드 안이 아니라 이 계약 파일에서 관리한다). `EvaluationAdapterDependencyTest`
# (adapters 모듈)가 이 목록의 유일한 원소가 실제로 그 커널을 참조하는지(존재 쪽)를 따로
# 잠근다 — 이 키는 부재 쪽(그 밖에는 아무도 안 부른다)만 진다.
app.allowed.assemble-callers=bidvector.adapters.evaluation.NoticeWatchSubjectPortKt

# M6/6A-3+6F-3 D-6A3-17(검토 라운드 1, HIGH-1·3·4 시정) — app production 전체를 대상으로
# 한 세 ArchUnit 게이트의 허용 목록. 전부 **집합**이다(이름 목록·패키지 하나·파일명 접두가
# 아니라 classpath 전체에서 도출한 구현/참조 집합의 부분집합 검사) — `ArchitectureRules.
# notificationPortMustBeStructurallyClosed`·`appMustOnlyReferenceMlTypes`·
# `appPortCallsMustBeAllowedPairs`(app/src/test/.../architecture/ArchitectureRules.kt — (c) 는
# D-6A3-25 가 옛 `app.http` 한정 규칙을 대체했다).

# (a) D-6A3-3 우회 1·2 — dry-run 이 outbox 에 닿지 않는다. 포트 타입과 app 이 참조해도 되는
# 유일한 구현. `RecordingNotificationRequestPort` 자신이 persistence·java.sql 을 참조하지
# 않는다는 것은 이 키가 아니라 `EvaluationAdapterDependencyTest`(adapters 모듈)의 상수 풀
# 허용 목록이 진다(그 클래스 내부의 문제라 app 게이트의 범위 밖).
app.notification.port-type=bidvector.workflow.evaluation.NotificationRequestPort
app.notification.allowed-impls=bidvector.adapters.evaluation.RecordingNotificationRequestPort

# outbox 쓰기 타입 전수(구현 레인 전수, D-6A3-17(a)③) — `OutboxPort`(인터페이스)·그 유일한
# production 구현 `JdbcOutboxPort`·outbox 에 직접 쓰는 두 sink(`OutboxNotificationRequestPort`
# 는 위 포트 구현이기도 하지만 outbox 축에서도 다시 잠근다 — 우회가 한 축만 피하면 다른 축이
# 잡도록 이중화한다, `OutboxEventSink`는 전략 이벤트 발행 축이라 이름이 다르지만 같은
# `OutboxPort.register` 를 호출하는 sink 다).
app.forbidden.outbox-types=bidvector.workflow.event.OutboxPort,\
  bidvector.adapters.event.JdbcOutboxPort,\
  bidvector.workflow.evaluation.OutboxNotificationRequestPort,\
  bidvector.workflow.event.OutboxEventSink

# (b) D-6A3-2 우회 6 — app production 전체(루트 패키지 포함, `app.wiring` 으로 좁히지 않는다)가
# `adapters.ml` 에서 참조해도 되는 유일한 타입. `OpportunityAnalysis`·`GrpcBidPredictionGateway`·
# `GrpcEmbeddingGateway`는 실 ML 배선(`OPEN-ML-ANALYSIS-WIRING`)이 열기 전까지 여기 오르지 않는다.
app.ml.package=bidvector.adapters.ml
app.ml.allowed-types=bidvector.adapters.ml.UnavailableMlAnalysis

# (c) D-6A3-25(검토 라운드 2 HIGH 시정, 우회 5) — 이전 판은 「app.http 패키지 하나 ×
# 포트 인터페이스 이름 등식」 두 축에 걸려 있었다: 호출이 구체 구현 타입을 거치면
# (verifier N6, owner != 인터페이스 FQCN) 또는 헬퍼가 app.http 밖(app.wiring 등)에
# 있으면(verifier N5) 조용히 통과했다. 새 판은 **app production 전체**에서 포트
# **메서드를 호출하는 접근**을 owner 의 `isAssignableTo`(구현 타입 전부, classpath 계층
# 해석)로 판정하고 (호출자, 포트.메서드) 쌍이 아래 허용 쌍의 부분집합인지만 본다 —
# 패키지·인터페이스 이름 등식이 아니다.
app.port-call.ports=bidvector.procurement.NoticeSourcePort,\
  bidvector.procurement.RawObservationStore,\
  bidvector.procurement.NoticeRepository,\
  bidvector.procurement.CollectionRunStore,\
  bidvector.procurement.CanonicalizeKt,\
  bidvector.workflow.evaluation.CandidateSourcePort,\
  bidvector.workflow.evaluation.WatchSubjectPort,\
  bidvector.workflow.evaluation.LicenseGatePort,\
