# 아키텍처 경계 정책 — v2-지침서.md §3.1 · ADR 0006 D-2·D-3·D-4
#
# 같은 규칙이 **두 층에서 강제된다**(ADR 0006 §4).
#   1차 = 빌드 의존 선언  — domain 모듈의 classpath 에 아래 group 이 있으면 컴파일 전에 실패한다
#                           (domainDependencyGate task, group.forbidden)
#   2차 = architecture test — 실제 타입 참조를 바이트코드에서 본다
#                           (ArchitectureGateTest, package.forbidden)
# 두 층은 같은 규칙의 다른 표현이므로 목록도 이 한 파일이 갖는다.
policy.version=1

# 루트 패키지와 모듈 → 층 대응. 모듈 순서는 의미가 없다.
package.root=bidvector

layer.domain=sharedkernel,procurement,qualification,strategy,decision,settlement
layer.application=workflow
layer.adapters=adapters
layer.app=app

# 업무 모듈이 서로를 직접 참조하지 못한다(ADR 0006 D-4). domain 안에서 공유 가능한 유일한 모듈.
layer.domain.shareable=sharedkernel

# domain 모듈 안에서 보이면 안 되는 패키지(2차 그물). v2-지침서.md §3.1 —
# "domain은 Spring, JPA, JSON, HTTP, broker를 import하지 않는다".
package.forbidden=org.springframework,jakarta.persistence,jakarta.servlet,com.fasterxml.jackson,kotlinx.serialization,java.net.http,java.sql,javax.sql,io.micrometer,org.flywaydb,org.testcontainers,com.github.kagkarlsson,io.github.resilience4j

# domain 모듈의 의존 그래프에 있으면 안 되는 Maven group(1차 강제).
# 위 package.forbidden 과 같은 규칙이며 좌표계만 다르다 — JDK 내장 패키지는 group 이 없어 빠진다.
group.forbidden=org.springframework,jakarta.persistence,jakarta.servlet,com.fasterxml.jackson,org.jetbrains.kotlinx:kotlinx-serialization,io.micrometer,org.flywaydb,org.testcontainers,com.github.kagkarlsson,io.github.resilience4j

# 모듈 안의 패키지 규약(scope.md D-3). 모듈 경계가 이미 계층을 표현하므로 모듈 안에
# 기술 계층을 또 만들지 않는다. `util`·`common` 은 ADR 0006 A-6 이 경고한 자석의 이름이다.
package.segment.forbidden=util,utils,helper,helpers,impl,common,misc,base,service,manager,dto,vo
