# 프레임워크가 자동 구성으로 올린 빈(JDBC 클라이언트 등)이나 다른 모듈의 구현 타입이
# 핸들러에 새로 들어오면 목록을 늘리기 전까지 RED 다. 목록 안에서도 저장·발행 능력 포트
