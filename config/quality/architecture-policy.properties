# (e) 우회 4 — 서비스 키 원문 설정 타입을 참조하는 클래스 집합.
app.secret.service-key-type=bidvector.app.collection.KonepsCredentialProperties
# M6/6G — **셋이다**(code-review M-9 문면 정정 — 앞 판의 「하나로 줄었다」는 사실이 아니었다).
# 원문을 `ServiceKey` 로 **감싸는** 자리는 `CollectionWiringSupportKt` 한 곳이지만, 두 배선이 그 값을
# 빈 인자로 **이름 붙여** 넘기므로 참조 집합에는 셋이 든다. 「감싸는 곳」과 「이름 붙이는 곳」은 다르고,
# 이 게이트가 세는 것은 뒤쪽이다.
app.secret.service-key-readers=bidvector.app.wiring.CollectionWiring,bidvector.app.wiring.OpeningCollectionWiring,bidvector.app.wiring.CollectionWiringSupportKt

# (f) 우회 4 — 로거를 쓰는 app 클래스 집합. 수집 러너의 한 줄 출구(`CollectionLog`)를 만드는 배선 한 곳뿐이다 —
# 그 줄들은 건수·조회일·업종·원인 코드만 실을 수 있는 타입에서 만들어진다.
# M6/6G-2b D-6G2b-1·2·3·4·5 — **관문 밖으로 바이트를 내는 길**을 (클래스, 전송 표면 타입) 쌍의 정확
# 집합으로 닫는다. 6G 의 두 게이트(HTTP 클라이언트 보유자 집합 · 우회 타입 금지 집합)를 이 하나가
# 대신한다 — 둘의 대상은 아래 쌍 등식의 부분집합이다.
#
# 6G 의 구멍은 둘이었다. ⓐ 술어가 **호출 대상의 소유 타입**만 봐서 `uri.toURL().readText()` 처럼 타입을
# 쥐지 않고 호출 사슬로만 지나는 길이 보이지 않았다. ⓑ 금지가 **타입 이름 열거**라 목록 밖 전송
# API(비동기 채널 · 프로세스 실행 · Spring 클라이언트 · `java.beans` 반사 호출)는 처음부터 대상이
# 아니었다. ⓐ 는 술어가 호출 대상의 **인자·반환 타입**까지 모으는 것으로, ⓑ 는 금지를 **패키지
# 뿌리**로 두는 것으로 닫는다 — 뿌리 안에 새 타입이 생겨도 닫혀 있다.
# ---------------------------------------------------------------------------
# M6/6G-2g D-6G2g-11 — **참조 수집 깊이, 축마다**(운영자 결정 B-4 (나))
# ---------------------------------------------------------------------------
# 어휘는 닫힌 둘이다. `OWNER_ONLY` 는 ArchUnit 의존 그래프 그대로(호출 대상의 **소유 타입**까지),
# `FULL` 은 거기에 호출 대상의 **인자·반환 타입**과 필드 접근의 필드 타입을 더한다.
#
# 깊이를 코드 안의 상수로 두면 「어느 게이트가 얼마나 깊게 보는가」가 읽히지 않고, 바꿔도
# 아무것도 막지 못한다. 값을 여기 두고 **구현의 관측 == 이 표**를 test 가 양방향으로 잰다
# (`CollectionDepthGateTest`) — 키를 바꾸면 등재가 함께 움직여야 초록이고, 구현만 바꾸면
# 그 test 가 붉는다.
#
# 축마다 다른 이유:
#   transport·reflection   — 6G-2b 가 FULL 로 올린 자리(KA1 류 `uri.toURL().readText()` 가
#                            소유 타입만 보는 수집에 보이지 않았다).
#   collection-procurement — **OWNER_ONLY**. 착수 실측의 「FULL 이 타입 둘을 더한다」는 정적 근사의
#                            과소 추정이었고, ArchUnit 실측에서는 `RawNoticeObservation` ·
#                            `KonepsCollectionPolicyData` · `ObservationKey` · `RawKey` 계열을 포함해
#                            열 몇 종이 더 들어온다. 그 셋은 이 게이트가 **이름 붙이지 못하게 하려는
#                            바로 그 타입들**이라, 허용 집합에 담으면 ① 층이 뜻을 잃는다(② 멤버 접근
#                            금지와 ③ 필드 금지는 남지만 ① 이 「원문 키 타입을 이름 붙이지 못한다」를
#                            더 이상 말하지 못한다). raw-access 참조자 축과 같은 이유로 얕게 둔다.
#   usecase·key-hash·runner·service-key·logging·operator-credential
#                          — FULL 로 올려도 관측이 같다(여섯 축 전부 더하는 것 0, 착수 실측).
#                            올려 두는 편이 형제 축과 같은 깊이라 읽기 쉽고, 나중에 생기는 간접
#                            참조를 잡는다.
#   raw-access             — **참조자 축은 OWNER_ONLY 로 둔다**(D-6G2g-11). FULL 로 올리면
#                            허용 집합이 ∅ 에서 둘로 늘고(`CollectionWiring`·`OpeningCollectionWiring`,
#                            둘 다 멤버 접근 축에는 이미 있다) 「아무도 참조하지 않는다」는 성질이
#                            「둘만 참조한다」로 약해진다. 멤버 접근 축이 그 둘을 이미 들고 있다.
#   domain-purity          — OWNER_ONLY. FULL 은 `java.lang.Class` 를 domain 클래스 스물여덟에
#                            더하는데 전부 **컴파일러 산출**이다(`enum class` 마다 생기는
#                            `Enum.valueOf(Class, String)` 스물일곱 + 함수 참조 합성 하나).
#                            저자가 쓴 좌표가 아니라 허용 목록에 담을 것이 아니다.
collection.depth.transport=FULL
collection.depth.reflection=FULL
collection.depth.collection-procurement=OWNER_ONLY
collection.depth.usecase=FULL
collection.depth.key-hash=FULL
collection.depth.runner=FULL
collection.depth.service-key=FULL
collection.depth.logging=FULL
collection.depth.operator-credential=FULL
collection.depth.raw-access=OWNER_ONLY
collection.depth.domain-purity=OWNER_ONLY

collection.transport.roots=bidvector

# 전송 표면 **패키지 뿌리** — 뿌리 안의 모든 타입이 대상이다.
#   `java.net`(`java.net.http` 포함) · `javax.net` · `java.nio.channels` — JDK 전송.
#   `java.rmi` · `javax.naming` — 이름 하나로 원격 객체를 받아 오는 길.
#   `java.beans` — `Expression`·`Statement` 가 대상 메서드를 문자열로 지어 부른다.
#   `java.lang.reflect` · `java.lang.invoke` — 6G 가 타입 둘만 열거했던 자리. **`collection.reflection.packages`
#     에도 같은 둘이 있고 그것이 맞다** — 두 게이트의 **뿌리가 다르기** 때문이다(전송 표면은 production
#     전체, 반사는 `layer.*` 도출 셋). 뿌리 안에 새 참조가 생기면 **둘 다** 등재해야 한다. `kotlin.reflect` 는
#     전송 표면에 넣지 않았다 — 반사 게이트의 쌍 등식이 그 축을 따로 들고, 그 뿌리 범위는 다른 결정이다.
#   `com.sun.net` · `sun.net` — JDK 내부·부가 전송(내장 HTTP 서버 · 프로토콜 핸들러).
#   `jakarta.websocket` · `org.apache.tomcat.websocket` — 클래스패스에 실제로 있는 양방향 전송.
#   `org.springframework.web.client` · `org.springframework.web.reactive` · `org.springframework.http.client`
#     — Spring 의 **나가는** 클라이언트. 들어오는 서블릿·MVC 표면은 바이트를 밖으로 내지 않아 대상이
#     아니다(음성 fixture 의 과잉 대조가 그것을 잰다).
#   `io.grpc` · `io.netty` — ML gRPC 와 그 전송.
collection.transport.surface-packages=java.net,\
  javax.net,\
  java.nio.channels,\
  java.rmi,\
  javax.naming,\
  java.beans,\
  java.lang.reflect,\
  java.lang.invoke,\
  com.sun.net,\
  sun.net,\
  jakarta.websocket,\
  org.apache.tomcat.websocket,\
  org.springframework.web.client,\
  org.springframework.web.reactive,\
  org.springframework.http.client,\
  io.grpc,\
  io.netty

# 뿌리로 금지할 수 없는 자리의 낱개 타입 — `java.lang`·`java.util` 은 뿌리로 둘 수 없다(언어와 컬렉션의
# 기본 타입이 전부 그 안에 있고, 아래 바깥 참조 허용 집합이 그 둘을 허용한다). 바깥 호출을 프로세스에
# 맡기는 넷과, 바깥 구현을 이름으로 실어 오는 `ServiceLoader` 다. 새 낱개 타입을 더할 때는 계약을 갱신한다.
collection.transport.surface-types=java.lang.Process,\
  java.lang.ProcessBuilder,\
  java.lang.ProcessHandle,\
  java.lang.Runtime,\
  java.util.ServiceLoader

# 등재 쌍의 **용도 어휘**(닫힌 집합). `collection.transport.holders.<용도>` 키 집합이 이 목록과 같아야
# 하고 한 쌍이 두 용도에 들 수도 없다 — 새 용도 키를 조용히 더하는 길을 막는다.
# `koneps-gate` 밖의 용도가 **KONEPS 주소로** 호출하지 않는다는 것은 이 게이트가 재지 못한다(정적
# 분석은 목적지를 모른다). 그 통제는 위 (e) 「서비스 키 원문 설정은 배선 한 곳만 참조한다」다.
collection.transport.purposes=koneps-gate,attachment,llm,ml-grpc,run-state-lock

# 등재는 (클래스, 타입) **쌍**이다. 클래스만 등재하면 그 클래스가 새 전송 타입을 더 쥐어도 초록이다.
# 「값 타입이라 안전하다」는 무해 타입 예외는 두지 않는다 — 그 목록에 오른 타입은 **모든 클래스에서**
# 자유로워진다. 관측 쌍 전수를 용도와 함께 적는 편이 목록은 길어도 빠져나갈 자리가 없다.
#   `koneps-gate` — 관문(클라이언트를 쥐고 호출을 내는 유일한 자리) · 관문이 부르는 전송 원시 ·
#     주소를 짓는 자리들 · 클라이언트를 만들어 관문에 넘기는 배선. 여기 없는 이름이 클라이언트를
#     쥐면 붉어진다.
#   `attachment` · `llm` — 첨부 내려받기와 LLM 호출. KONEPS 호출 상한 밖의 바깥 호출이고 관문을
#     지나지 않는다 — 이 게이트는 그 사실을 **등재로 드러낸다**(숨기지 않는다).
#   `ml-grpc` — ML 추론·임베딩 gRPC 어댑터.
#   `run-state-lock` — 실행 상태 파일의 잠금·내구성 쓰기. 소켓이 아니라 파일 채널이다.
collection.transport.holders.koneps-gate=\
  bidvector.adapters.koneps.KonepsCallGate->java.net.URI,\
  bidvector.adapters.koneps.KonepsCallGate->java.net.http.HttpClient,\
  bidvector.adapters.koneps.KonepsLicenseLimitDocumentSource->java.net.URI,\
  bidvector.adapters.koneps.KonepsOpenApiNoticeSource->java.net.URI,\
  bidvector.adapters.koneps.KonepsOpenApiNoticeSourceKt->java.net.URI,\
  bidvector.adapters.koneps.KonepsOpeningResultSource->java.net.URI,\
  bidvector.adapters.koneps.KonepsOpeningResultSourceKt->java.net.URI,\
  bidvector.adapters.koneps.KonepsOperationDescriptorKt->java.net.URI,\
  bidvector.adapters.koneps.KonepsPageUriBuilder->java.net.URI,\
  bidvector.adapters.koneps.KonepsPageUriBuilderKt->java.net.URI,\
  bidvector.adapters.koneps.KonepsResilientCallKt->java.net.URI,\
  bidvector.adapters.koneps.KonepsSourceConfigKt->java.net.URI,\
  bidvector.adapters.koneps.KonepsTransportOutcomeKt->java.net.URI,\
  bidvector.adapters.koneps.KonepsTransportOutcomeKt->java.net.http.HttpClient,\
  bidvector.adapters.koneps.KonepsTransportOutcomeKt->java.net.http.HttpRequest,\
  bidvector.adapters.koneps.KonepsTransportOutcomeKt->java.net.http.HttpResponse,\
  bidvector.adapters.koneps.KonepsTransportOutcomeKt->java.net.http.HttpTimeoutException,\
  bidvector.adapters.koneps.ServiceKey->java.net.URLEncoder,\
  bidvector.app.wiring.CollectionWiring->java.net.URI,\
