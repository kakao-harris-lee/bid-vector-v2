# 아키텍처 경계 정책 — v2-지침서.md §3.1 · ADR 0006 D-2·D-3·D-4·D-6 · milestone-1.md 「구현 규칙」
#
# 같은 규칙이 **두 층에서 강제된다**(ADR 0006 §4).
#   1차 = 빌드 의존 선언  — 모듈의 의존 그래프를 보고 컴파일 전에 실패한다
#                           (moduleDependencyGate: project 의존 + 금지 group)
#   2차 = architecture test — 실제 타입 참조를 바이트코드에서 본다
#                           (ArchitectureGateTest: package.forbidden 등)
# 두 층은 같은 규칙의 다른 표현이므로 목록도 이 한 파일이 갖는다.
policy.version=4

# 루트 패키지. 모듈 이름 → 패키지 세그먼트 변환 규칙은 **하이픈 제거** 하나다
# (`shared-kernel` → `bidvector.sharedkernel`). 두 이름을 따로 열거하지 않는다.
package.root=bidvector

# 층과 그 층의 모듈(Gradle project 이름). 층 순서는 아래 layer.order 가 정한다.
layer.order=domain,application,adapters,app
layer.domain=shared-kernel,procurement,qualification,strategy,decision,settlement
layer.application=workflow
layer.adapters=adapters
layer.app=app

# 업무 모듈이 서로를 직접 참조하지 못한다(ADR 0006 D-4). domain 안에서 공유 가능한 유일한 모듈.
# 허용 project 의존은 이 둘에서 유도된다 — 자기보다 아래 층 전부 + domain 안에서는 이것만.
layer.domain.shareable=shared-kernel

# ---------------------------------------------------------------------------
# domain 이 볼 수 없는 것 — **가족 단위로 적는다**
# ---------------------------------------------------------------------------
# 좌표를 하나씩 더하는 방식은 두 번 실패했다: `java.net.http` 만 적어 `java.net.HttpURLConnection`
# 이, `com.fasterxml.jackson` 만 적어 `tools.jackson`(Jackson 3)이 빠져나갔다. 그래서
# **가족을 승인 문서에서 뽑고, 좌표는 그 가족의 뿌리 패키지로 적는다** — 잎을 적으면 형제 잎이
# 늘 남는다. 이 표를 `build-logic` 의 출처 대조 테스트가 지킨다(기대 집합의 출처는 정책 파일이
# 아니라 승인 문서다).
#
# | 가족        | 승인 문서 근거                                    | Maven group |
# | ---         | ---                                               | --- |
# | Spring      | 지침서 §3.1 · ADR 0006 D-3                        | 있다 |
# | JPA         | 지침서 §3.1 · ADR 0006 D-3                        | 있다 |
# | JSON        | 지침서 §3.1 · ADR 0006 D-3                        | 있다 |
# | HTTP        | 지침서 §3.1 · ADR 0006 D-3                        | 일부(JDK 는 없다) |
# | broker      | 지침서 §3.1                                       | 일부(JDK 는 없다) |
# | gRPC        | **ADR 0006 D-3 · D-6**                            | 있다 |
# | Protobuf    | **ADR 0006 D-6**                                  | 있다 |
# | SQL         | 지침서 §3.1(JPA·DB) · 아래 I/O 와 같은 문면       | 일부(JDK 는 없다) |
# | I/O         | **milestone-1.md 「구현 규칙」** — "domain은 I/O가 없는 입력→출력 함수/객체다" | 없다(전부 JDK) |
# | 운영 라이브러리 | ADR 0005 D-5~D-7 이 adapters/app 소유로 못박음  | 있다 |
package.forbidden=\
  org.springframework,\
  jakarta.persistence,javax.persistence,jakarta.transaction,javax.transaction,org.hibernate,\
  jakarta.servlet,javax.servlet,jakarta.validation,\
  com.fasterxml.jackson,tools.jackson,kotlinx.serialization,com.google.gson,org.json,javax.json,jakarta.json,\
  java.net,javax.net,okhttp3,retrofit2,org.apache.http,org.apache.hc,io.ktor,\
  jakarta.jms,javax.jms,org.apache.kafka,com.rabbitmq,io.nats,org.apache.pulsar,\
  io.grpc,com.google.protobuf,\
  java.sql,javax.sql,org.postgresql,\
  java.io,java.nio,\
  io.micrometer,org.flywaydb,org.testcontainers,com.github.kagkarlsson,io.github.resilience4j

# 위와 **같은 가족을 group 좌표계로** 적는다. JDK 가족(java.*)은 Maven group 이 없어 여기 없고,
# 그래서 1차 게이트가 그 가족을 볼 수 없다 — 2차가 맡는다. 그 분담은 evidence 의 가족별 표가 낸다.
group.forbidden=\
  org.springframework,\
  jakarta.persistence,jakarta.transaction,jakarta.servlet,jakarta.validation,\
  org.hibernate,jakarta.jms,\
  com.fasterxml.jackson,tools.jackson,org.jetbrains.kotlinx:kotlinx-serialization,com.google.code.gson,org.json,\
  com.squareup.okhttp3,com.squareup.retrofit2,org.apache.httpcomponents,io.ktor,\
  io.grpc,com.google.protobuf,\
  org.postgresql,\
  org.apache.kafka,com.rabbitmq,io.nats,org.apache.pulsar,\
  io.micrometer,org.flywaydb,org.testcontainers,com.github.kagkarlsson,io.github.resilience4j

# 모듈 안의 패키지 규약(scope.md D-3). 모듈 경계가 이미 계층을 표현하므로 모듈 안에
# 기술 계층을 또 만들지 않는다. `util`·`common` 은 ADR 0006 A-6 이 경고한 자석의 이름이다.
package.segment.forbidden=util,utils,helper,helpers,impl,common,misc,base,service,manager,dto,vo
