# ---------------------------------------------------------------------------
# M6/6G-2b D-6G2b-22(vr H-1) — **바깥 참조의 기본 거부.** 위 전송 표면 게이트는 금지를 패키지 뿌리로 두어
# 열거의 단위를 키웠을 뿐 방향은 거부 목록이었다. 그래서 목록 밖 패키지가 네트워크를 열면 처음부터 대상이
# 아니었다 — verifier 가 `java.util.logging.SocketHandler`(TCP) · `javax.xml.parsers.DocumentBuilder.parse(String)`
# (HTTP GET) · `javax.management.remote.JMXConnectorFactory`(RMI) · `javax.swing.JEditorPane(String)`(HTTP GET)
# 넷을 production 에 심고 전체 `check` 가 초록임을 실측했다.
#
# 방향을 뒤집는다. `app`·`workflow`·`adapters` production 이 참조하는 `bidvector..` 밖 타입은 그 **패키지**가
# 아래 집합에 있어야 하고, 두 방향 등식(관측 ⊂ 허용 · 허용 ⊂ 관측)으로 잠근다 — 쓰이지 않는 허용 패키지도
# RED 다. 전송 표면 타입은 이 층을 **지나지 않고** 위 (클래스, 타입) 쌍 등식만 본다(두 층).
#
# **허용은 정확한 패키지 이름이다**(접두 뿌리가 아니다). 접두로 두면 `java.util` 이 `java.util.logging` 을,
# `javax.xml` 이 `javax.xml.parsers` 를 끌고 들어와 거부 하위를 또 열거해야 한다 — 그 열거가 H-1 이 벌한
# 방향이다. 정확 패키지는 거부 목록이 필요 없다(관측에 없으면 거부).
#
# **모듈별이다**(공통 집합이 아니다). 양방향 등식에서 공통은 `허용 == ∪관측` 이라 한 모듈이 다른 모듈만 쓰는
# 패키지를 참조해도 초록이다. 모듈별은 `허용(m) == 관측(m)` 이라 그 길이 닫힌다 — 목록은 127 대 82 로 길지만
# 조이는 쪽이다. 새 바깥 의존을 들이는 편집은 해당 모듈 줄을 고쳐야 통과한다.
#
# **판정 대상 모듈 목록은 여기 적지 않는다** — 위 `layer.application`·`layer.adapters`·`layer.app` 에서
# 도출한다(domain 계열을 뺀 셋). 별도 키로 적으면 그 키에서 모듈 하나를 빼는 것만으로 그 모듈이 판정 밖이
# 되는데, `layer.*` 는 모집단 단언(`allModules`)과 다른 층 게이트가 같이 읽는 자리라 빠뜨리면 **함께 붉다**.
# 아래 키 집합(`allowed-packages.<module>`)이 그 도출 결과와 같아야 한다는 단언이 양쪽을 묶는다.

