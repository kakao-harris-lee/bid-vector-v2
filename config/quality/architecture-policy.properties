# M6/6F-8 D-6F8-6 — 원문 값 획득의 **모듈 전체** 봉쇄. 위 (b) 는 use case 패키지 하나만 입력으로 봐서, 원문 키
# 읽기를 이웃 패키지 헬퍼로 한 걸음 옮기면(`workflow.collectionx` 변이 — 6F-8 verifier F-1) 전체 `check` 가 초록이었다.
# 아래 규칙은 root 아래 production **전체**를 입력으로 삼고 허용은 참조자·접근자 **집합**이다. 각 허용 집합은
# 관측 집합과 같아야 한다(`CollectionArchitectureGateTest` — 낡은 항목이 게이트를 느슨하게 두지 않는다).
# ---------------------------------------------------------------------------

# (g) 원문 키 접근 타입(계약·레지스트리·원문 키·값·존재 판별·개념 토큰)과 원문 관측을 직접 읽는 공개 해석 함수의 파일
# 클래스(`resolveAmount`·`instantFrom` — 정규화 함수를 use case 옆에서 다시 조립하는 길) 참조와 통과 전용 타입(위 (b))의 멤버 접근은
# root 아래 어느 production 클래스도 하지 못한다 — 허용은 아래 둘뿐이다. 값 획득 경로는 `RawNoticeObservation` 의 멤버
# (`valueOf` 는 계약 인자를 요구한다)이므로 이 둘이 닫히면 procurement(정규화)·adapters(원문 저장·매핑) 밖에는 길이 없다.
# `CollectionWiring` 은 정책이 든 필드 계약 레지스트리를 원문 저장 어댑터(`JdbcRawObservationStore`)에 그대로 넘기는
# 조립 자리다 — 값을 읽지 않는다.
