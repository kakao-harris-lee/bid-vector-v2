# M7/7F-local — **web 정적 이미지** 위생 게이트 정책 데이터(계약 산출물 1 의 「6C 기준」, 운영자
# 결정 D-7F-1 로 in_scope 에 들어왔다). ml-serving·app 정책과 같은 파서·같은 공통 술어(태그·실
# 프로세스 사용자·베이스 layer 체인·크기)를 쓰고 「금지」 판정만 갈라진다. 값 없는 키·CRLF·허용
# 문자 밖 원소는 정책 오류다(`tools/image-hygiene-check.sh` 의 `_policy_value`).
# 정본 문서: reports/evidence/m7/7f/scope.md.
policy.version=1

# 술어 갈래 선택. **proxy 정책과 같은 값을 쓴다** — 두 이미지의 판정 *형태*가 같고(같은 베이스·
# 같은 비-root 규율·실행 파일 축 + 내용 축) 다른 것은 **값**뿐이라, 갈래를 둘로 쪼개면 같은 코드가
# 두 벌이 되고 한 자리의 교정이 다른 자리를 놓친다. 스크립트의 `case` 가 이 값을 소진하고 모르는
# 값은 정책 오류로 끊는다(열거 방어가 아니라 분기 소진).
runtime.kind=caddy-site

# 2026-10-16 실측(`docker image inspect .Size`, 베이스 2.11.7) — **66,693,821 바이트**(상한의 74%). 상한이 잡는
# 사고는 「런타임 이미지가 빌드 이미지가 되는 것」이다: 빌더 stage 의 `node_modules`(수백 MB)나
# 소스 트리가 런타임으로 새면 이 축이 먼저 붉어진다. 7E 가 화면을 들여 번들이 커지는 여유는 둔다.
size.cap.bytes=90000000

# non-root UID 하한 — app·ml-serving 정책과 같은 값·같은 근거(0=root 는 항상 거부, 1000 미만은
# 데몬/패키지 예약대). 판정은 **실 ENTRYPOINT 로 띄운 컨테이너의 모든 프로세스 uid** 다.
nonroot.uid.min=1000

# 베이스 다이제스트 고정 — 값은 layer 목록이 아니라 **다이제스트 하나**이고 게이트가 그것을
# `docker buildx imagetools inspect` 로 풀어 실제 layer 체인을 파생한다(D-6C-10 ②). 이 값은
# `docker/web.Dockerfile` 의 **runtime stage `FROM`** 과 글자 그대로 같다(builder stage 의 node
# 베이스는 런타임 이미지의 layer 체인에 들어오지 않으므로 이 축의 대상이 아니다 — 그쪽이 새는
# 경우를 잡는 축은 아래 `forbidden.executables` 다). 알려진 제한은 기존 두 정책과 같다:
# 레지스트리 네트워크 접근이 필요하고 linux/amd64 선택이 하드코딩이다(`OPEN-6C-MULTIARCH`).
base.image.repo=caddy
base.image.digest=sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af

# ① 금지 실행 파일 — 이 kind 의 「금지」는 **빌더 누출과 베이스 교체**를 잡는 축이다. 이름 대조가
# 아니라 실행 시도 + PATH 조회 둘로 잰다(app 정책과 같은 helper, 변이 ⑦ 의 사유도 같다).
# 2026-10-16 실측: 아홉 다 부재.
#   · node·npm·npx·yarn·pnpm — **multi-stage 경계**다. 런타임 stage 는 `dist` 만 받는다(`COPY
#     --from=builder …/dist /srv`). 이 중 하나라도 보이면 빌더가 런타임으로 샜거나 베이스가
#     node 이미지로 바뀐 것이다.
#   · gcc·cc·make — 런타임 이미지가 빌드 이미지가 된 경우. alpine 베이스에는 없다.
forbidden.executables=node,npm,npx,yarn,pnpm,gcc,cc,make

# **`apk`(패키지 관리자)를 금지 목록에 넣지 않는다 — 예외이고 그 사유는 둘이다.**
#   ⓐ 보상 통제가 이미 있다: 런타임 사용자는 uid 10001 이고 `/usr`·`/lib` 에 쓸 수 없으며
#     compose 가 `no-new-privileges` 로 띄운다 — 설치가 성립하지 않는다.
#   ⓑ 더 중요한 쪽: `apk` 를 지우면 보통 `/lib/apk/db/installed` 까지 함께 지우게 되고, 그러면
#     **취약점 스캐너가 OS 패키지를 열거하지 못한다**. 그 상태의 「차단 0」은 깨끗하다는 뜻이
#     아니라 맞춰 보지 않았다는 뜻이고, `scan.os.family.web` 축이 그것을 판정 불가로 끊는다.
#     위생을 위해 스캔을 눈멀게 하는 거래는 하지 않는다.

# ①' **필수** 실행 파일 — compose 의 web healthcheck 가 이미지 안 `curl` 로 자기 포트를 묻는다.
# 그 전제가 주석에만 있으면 베이스 상향으로 사라졌을 때 증상이 「healthy 로 수렴하지 않음」
# (타임아웃)이라 원인이 보이지 않는다. 이름 있는 축으로 만들어 그 자리에서 실패시킨다
# (app 정책의 같은 축과 같은 근거). 2026-10-16 실측: 이 베이스에 `curl` 이 있다.
required.executables=curl

# ② 이미지가 **싣고 있는 내용**. app 정책의 「풀린 의존 layer」 축과 같은 형태다.
content.path=/srv
# **양성 대조** — 경로가 틀리거나 `COPY` 가 비면 아래 금지 패턴의 「위반 0」이 공허하게 참이 된다
# (6C 가 같은 계열을 세 라운드에 걸쳐 냈다: 게이트가 틀린 답을 내는 게 아니라 **아무 일도 하지
# 않게** 됐다). 하한의 뜻은 「셸 하나 + 자산 하나 이상」이다. 2026-10-16 실측 3(셸·JS·CSS).
content.min-entries=2
# 필수 내용 — SPA 셸. 프록시의 기본 경로가 이것을 서브하고, `try_files` 의 fallback 목적지다.
required.content.patterns=index.html
# 금지 내용 — 서브되는 트리로 새면 안 되는 것들. 판정은 파일 목록에 대한 대소문자 무시 부분
# 문자열이다(app 의 금지 좌표 축과 같은 형태).
#   · .map — 소스맵. vite 는 기본으로 내지 않지만 설정 한 줄로 켜지고, 그 순간 소스가 공개 트리에
#     실린다. 켜졌는지를 이 축이 잰다.
#   · .ts·.tsx — 원본 소스. 번들이 아니라 소스가 서브되는 상태.
#   · .env — 빌드 입력 환경 파일. 공개 트리에 있을 이유가 없다.
#   · node_modules — 빌더 설치본 누출(실행 파일 축의 보완 — 바이너리 없이 디렉터리만 새는 경우).
forbidden.content.patterns=.map,.ts,.tsx,.env,node_modules

# ②' **키·인증서 재료 탐색**(검토 r1 F-2) — proxy 정책의 같은 자리와 **같은 값·같은 사유**다.
# 이 이미지에는 `tls internal` 이 없지만 축을 좁히지 않는다: 잡는 것이 「이 이미지에 키가 생겼다」
# 이고, 그 사고는 운영 인증서를 굽는 편집에서 두 이미지에 똑같이 온다. 위 금지 내용 축이 `/srv`
# 만 보는 것과 달리 이 축은 파일시스템 전체를 본다(`-xdev` 로 런타임 마운트는 밖).
secret.material.scan-paths=/
secret.material.exclude-prefixes=/etc/ssl/,/usr/share/ca-certificates/
secret.material.patterns=.pem,.key,.crt,.p12,.pfx
# 양성 대조 — 2026-10-19 실측: 전체 243 · 제외 뒤 117. 하한은 그 70%(내림)다. 이 수를 **제외를
# 적용한 뒤에** 세기 때문에, 제외 접두를 넓혀 축을 끄는 편집이 여기서 판정 불가로 끊긴다.
secret.material.min-entries=81
