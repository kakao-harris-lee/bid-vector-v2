# M2/2D — 계약 게이트 정책 데이터. 값 없는 키는 정책 오류다(1A 관례 — 기본값을 두지 않는다).
# 정본 문서: reports/evidence/m2/2d/scope.md, ADR 0003 D-6·D-7, ADR 0010 D-7.
policy.version=1

# D-2D-1(a) — `buf breaking`의 `against` 기준은 운영자가 태그한 승인 커밋(2A~2C 승인 시점).
# 이름 규칙을 정규식으로 고정해 임의 브랜치·커밋 해시가 "승인 태그" 행세를 못 하게 한다.
approved.tag.pattern=^contracts/v[0-9]+-approved-[0-9]{4}-[0-9]{2}-[0-9]{2}$
approved.tag=contracts/v1-approved-2026-09-07

# 최대 메시지 크기(바이트) — 2B `CalculateOptimalBidRequest`의 실측 상한(D-2D-6, 경계 쌍의
# 기준값). 계산(재현: reports/evidence/m2/2d/commands.md) —
#   envelope+features 고정 오버헤드 182B(canonical bytes, testdata 표본에서 competition_samples
#   를 비우고 실측)
#   + CompetitionSample worst-case(reserve_draw 15개+선택번호 4개 포함) 301B/건 × 500건
#   = 150,682B.
# 500건의 근거는 legacy 의 유일한 "경쟁 표본 건수 상한" 실측치다(commit `ed4b06c` 고정,
# read-only — verifier r1 F-12: legacy 좌표는 이 commit 에 못박혀 있어 이후 legacy 편집으로
# 밀리지 않는다) —
# `bid-vector@ed4b06c:app/schemas/paper_bidding.py:62`·
# `bid-vector@ed4b06c:app/schemas/task_payloads.py:262`
# `history_limit: int = Field(default=80, ge=1, le=500)`. 150,682B 에 ~74% 여유를 더해
# 262144(256 KiB, 2^18)로 반올림한다 — 필드 추가(D-7 호환 추가)·wire 오버헤드 변동을 흡수한다.
max.message.bytes=262144

# breaking mutation 집합(콤마 구분, 순서 무관) — milestone-2.md 완료 조건 「compatibility gate가
# 실제 breaking mutation을 잡는지」 · ADR 0010 D-7. 11종 전부 이 저장소의 buf 1.72.0
# STANDARD 규칙집합에서 실측으로 잡힘이 확인됐다(reports/evidence/m2/2d/commands.md) —
# `optional` 제거(cardinality 변경)도 별도 대체 검출 없이 buf 가 직접 잡는다.
breaking.mutations=field-delete,field-number-change,type-change,enum-value-delete,enum-value-number-change,oneof-field-remove,rpc-delete,rpc-streaming-change,package-rename,reserved-number-reuse,optional-removal
breaking.mutations.min=11

# verifier r2 F-14 — buf 는 breaking **위반**과 `.proto` **컴파일 오류**를 exit code 로
# 가르지 않는다(둘 다 100, 실측: `buf breaking <구문 깨진 사본>` → 100, `buf lint <구문
# 깨진 사본>` → 100). `--error-format=json` 의 `"type"` 필드만 가른다 — 진짜 breaking
# 규칙은 `FIELD_NO_DELETE` 같은 규칙 이름이고, 컴파일 오류는 전부 이 값이다. sed 가
# mutation 을 잘못 적용해 구문을 깨도 exit 100 이 나므로, 이 값을 정책 데이터로 두고
# breaking-mutations.sh 가 대조한다 — 이 값과 일치하는 finding 만 있으면 "위반이 아니라
# 도구/스크립트 오류"로 판정해 exit 2 로 스윕을 멈춘다.
breaking.compile-error.type=COMPILE

# 도구 버전 리터럴 — codex 바이너리 핀(2026-09-01, codex-review-gate)과 같은 재현성 사유.
# `contractGate`(buf 런타임 실측 + 버전 카탈로그 대조)와 `ml-engine` pytest(pyproject.toml 대조)
# 양쪽이 이 하나의 정책을 읽는다 — 값을 각자 다시 적지 않는다.
tool.buf.version=1.72.0
tool.protoc=3.25.9
tool.protoc.gen.grpc.kotlin=1.5.0
# verifier r1 F-13 — 생성물의 다른 절반(Java/gRPC 서버·stub 코드)을 만드는 플러그인.
# `ml-contract/build.gradle.kts`가 `io.grpc:protoc-gen-grpc-java:${grpc-java}`로 참조해
# grpc-java 카탈로그 버전과 1:1 로 묶여 있다 — 카탈로그 값이 곧 이 플러그인의 버전이다.
tool.protoc.gen.grpc.java=1.84.0
tool.grpcio.tools=1.83.1
tool.protobuf.python=7.36.1

# ⑥ deadline/cancellation/retry test 표본 — **운영 재시도 정책이 아니다**. 그 정본은 M4 4D의
# `adapters` versioned 정책 데이터다(ADR 0010 D-1). 여기서는 "retryable 인 경우만 상한 안에서
# 재시도"라는 규칙을 fake servicer 위에서 증명하는 test 표본 상한일 뿐이다.
retry.sample.max-attempts=3
