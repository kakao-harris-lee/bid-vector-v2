# detekt 2.0 설정. **2.0 키만 쓴다** — 1.x 의 `threshold` 계열은 2.0 에서 조용히 무시된다.
# `buildUponDefaultConfig = true` 이므로 여기 없는 규칙은 도구 기본값으로 돈다.
#
# **승인된 임계는 축마다 한 자리에만 산다.** 승인 문서가 수치로 정한 것은 둘이고
# (v2-지침서.md §5 「크기와 결합도」) 강제하는 주체가 다르므로 자리도 다르다:
#   - 함수 50줄·파일 500줄 → **둘 다 config/quality/size-policy.properties** 이고 도구 없이 서는
#     sizeGate 가 든다(ADR 0007 D-7 이 요구한 자체 검사). 함수 축은 Kotlin PSI 로 직접 재므로
#     detekt 의 억제가 그 임계에 영향을 주지 못한다 — 그래서 아래 LongMethod 는 비활성이다.
# 같은 수를 두 자리에 적지 않으므로 옮겨 쓰는 생성 단계가 필요 없고, 이 파일 하나로
# 애플리케이션 아홉 모듈과 build-logic 이 같은 임계를 받는다.
#
# 나머지 축은 **켜기만 하고 수치는 도구 기본값**을 쓴다 — 승인 문서가 정하지 않은 수를
# 1A 가 지어내지 않는다.

complexity:
  # **비활성이다.** 함수 50줄 축의 정본은 config/quality/size-policy.properties 이고
  # sizeGate 가 Kotlin PSI 로 직접 잰다 — detekt 을 경유하지 않으므로 `@Suppress` 표기에
  # 영향받지 않는다. 같은 수를 두 자리에 두지 않기 위해 여기서는 끈다.
  LongMethod:
    active: false
  CognitiveComplexMethod:
    active: true
  ComplexInterface:
    active: true
  MethodOverloading:
    active: true

exceptions:
  # business control flow 에 exception 을 쓰지 않는다(v2-지침서.md §5). 명시적 result type 을 쓴다.
  TooGenericExceptionCaught:
    active: true
  SwallowedException:
    active: true

potential-bugs:
  UnsafeCallOnNullableType:
    active: true
