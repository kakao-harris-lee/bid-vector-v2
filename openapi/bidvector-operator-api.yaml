            type: string
        focusRegionTerms:
          type: array
          items:
            type: string
        excludeRegionTerms:
          type: array
          items:
            type: string
        requiredKeywordTerms:
          type: array
          items:
            type: string
        excludeKeywordTerms:
          type: array
          items:
            type: string
        minBudgetWon:
          type: integer
          format: int64
          nullable: true
        minBudgetCurrency:
          type: string
          nullable: true
        minBudgetVatTreatment:
          type: string
          nullable: true
        minBudgetProvenance:
          type: string
          nullable: true
        maxBudgetWon:
          type: integer
          format: int64
          nullable: true
        maxBudgetCurrency:
          type: string
          nullable: true
        maxBudgetVatTreatment:
          type: string
          nullable: true
        maxBudgetProvenance:
          type: string
          nullable: true
        minimumMatchScore:
          type: number
          nullable: true
        minimumProbabilityScore:
          type: number
          nullable: true
        bidNowThreshold:
          type: number
          nullable: true
        reviewThreshold:
          type: number
          nullable: true
        candidateLimit:
          type: integer
          nullable: true
        maxActiveBids:
          type: integer
          nullable: true
    EvaluationDryRunRequest:
      type: object
      required:
        - currentActiveBids
      properties:
        currentActiveBids:
          type: integer
          format: int32
          minimum: 0
    # D-6A3-6 — 평탄하다. 결과별 공고 ID 배열 + 건수만 싣는다(후보별 사유 상세는
    # OPEN-6A3-EVALUATION-DETAIL). 공고명·기관명 원문은 없다(privacy).
    EvaluationDryRunResponse:
      type: object
      required:
        - strategyRevision
        - candidateCount
        - currentActiveBids
        - maxActiveBids
        - bidNowNoticeIds
        - reviewNoticeIds
        - skipNoticeIds
        - notReachedNoticeIds
        - wouldNotifyNoticeIds
      properties:
        strategyRevision:
          type: integer
        candidateCount:
          type: integer
        currentActiveBids:
          type: integer
        maxActiveBids:
          type: integer
        bidNowNoticeIds:
          type: array
          items:
            type: string
        reviewNoticeIds:
          type: array
          items:
            type: string
        skipNoticeIds:
          type: array
          items:
            type: string
        notReachedNoticeIds:
          type: array
          items:
            type: string
        wouldNotifyNoticeIds:
          type: array
          items:
            type: string
    # D-6A3-20(검토 라운드 1 contract-keeper V2) — code 는 ErrorMapping.forThrowable 이 낼 수
    # 있는 전 코드의 열거다. `OpenApiContractTest`가 app.http.ErrorCode 의 상수 집합과 이
    # 목록을 양방향(부분집합 아니라 등식)으로 대조한다 — 한쪽에만 코드를 더하면 RED.
    # `type: string` + `enum` 은 D-6A1-38 평탄 술어의 NON_FLAT_KEYS 밖이라 게이트는 그대로
    # 초록이다.
    # M6/6A-2b D-6A2b-1 — 편집 요청·응답 다섯. 전부 평탄하다(D-6A1-20 ⓑ). `field` 의 enum 은
    # 구현의 필드 어휘 전수와 **집합 등식**으로 대조된다(`OpenApiEditSessionContractTest`) —
    # 새 필드를 코드에만 더하거나 문서에만 더하면 RED 다.
    EditSessionBeginRequest:
      type: object
      required:
        - field
      properties:
        field:
          type: string
          enum:
            - FOCUS_CATEGORY
            - FOCUS_REGION
            - EXCLUDE_REGION
            - REQUIRED_KEYWORD
            - EXCLUDE_KEYWORD
            - MIN_BUDGET
            - MAX_BUDGET
            - MINIMUM_MATCH_SCORE
            - MINIMUM_PROBABILITY_SCORE
            - BID_NOW_THRESHOLD
            - REVIEW_THRESHOLD
            - CANDIDATE_LIMIT
            - MAX_ACTIVE_BIDS
    # 값 칸 넷 가운데 `field` 가 이름하는 하나만 싣는다 — 다른 칸이 함께 오면 400 이다
    # (조용히 무시하지 않는다). 칸 배정: 업종·지역·키워드 다섯 → terms, 예산 둘 → amountWon,
    # 임계 넷 → number, 후보 상한·여력 상한 → count.
    # L-3 — 「`field` 가 이름하는 칸 **하나**가 필수」는 이 스키마 형태로 표현할 수 없다
    # (`oneOf` 는 평탄 게이트에 걸린다). 구현은 엄격하게 강제한다: 그 칸이 없으면 400 이고,
    # 다른 칸이 함께 오거나 알려진 키 밖이 오면 역시 400 이다. 칸 배정은 위 `field` enum 순서와
    # 같다 — 업종·지역·키워드 다섯은 `terms`, 예산 둘은 `amountWon`, 임계 넷은 `number`,
    # 후보 상한·여력 상한은 `count`.
    EditSessionValueRequest:
      type: object
      required:
        - commandId
        - field
      properties:
        commandId:
          type: string
        field:
          type: string
          enum:
            - FOCUS_CATEGORY
            - FOCUS_REGION
            - EXCLUDE_REGION
            - REQUIRED_KEYWORD
            - EXCLUDE_KEYWORD
            - MIN_BUDGET
            - MAX_BUDGET
            - MINIMUM_MATCH_SCORE
            - MINIMUM_PROBABILITY_SCORE
            - BID_NOW_THRESHOLD
            - REVIEW_THRESHOLD
            - CANDIDATE_LIMIT
            - MAX_ACTIVE_BIDS
        terms:
          type: array
          items:
            type: string
        amountWon:
          type: integer
          format: int64
          minimum: 0
        number:
          type: number
        count:
          type: integer
          format: int32
    EditSessionConfirmRequest:
      type: object
      required:
        - commandId
        - seenRevision
      properties:
        commandId:
          type: string
        seenRevision:
          type: integer
          format: int32
          minimum: 0
    EditSessionEditRequest:
      type: object
      required:
        - commandId
        - field
      properties:
        commandId:
          type: string
        field:
          type: string
          enum:
            - FOCUS_CATEGORY
            - FOCUS_REGION
            - EXCLUDE_REGION
            - REQUIRED_KEYWORD
            - EXCLUDE_KEYWORD
            - MIN_BUDGET
            - MAX_BUDGET
            - MINIMUM_MATCH_SCORE
            - MINIMUM_PROBABILITY_SCORE
            - BID_NOW_THRESHOLD
            - REVIEW_THRESHOLD
            - CANDIDATE_LIMIT
            - MAX_ACTIVE_BIDS
    EditSessionCancelRequest:
      type: object
      required:
        - commandId
      properties:
        commandId:
          type: string
    # 초안(draft) 전체는 싣지 않는다 — 확인 중인 값은 방금 보낸 값이고 현재 전략은
    # `GET /api/strategy` 가 낸다.
    EditSessionResponse:
      type: object
      required:
        - sessionId
        - state
        - sessionVersion
        - expiresAt
      properties:
        sessionId:
          type: string
        state:
          type: string
          enum:
            - WAITING_FOR_VALUE
            - WAITING_FOR_CONFIRMATION
            - APPLIED
            - CANCELLED
            - EXPIRED
        field:
          type: string
          nullable: true
          # C-4 — 종단 상태에서 실제로 `null` 이 나간다. 엄격한 검증기가 그 값을 거부하지
          # 않도록 어휘에 함께 싣는다(대조 test 는 `null` 을 뺀 집합으로 등식을 잰다).
          enum:
            - null
            - FOCUS_CATEGORY
            - FOCUS_REGION
            - EXCLUDE_REGION
            - REQUIRED_KEYWORD
            - EXCLUDE_KEYWORD
            - MIN_BUDGET
            - MAX_BUDGET
            - MINIMUM_MATCH_SCORE
            - MINIMUM_PROBABILITY_SCORE
            - BID_NOW_THRESHOLD
            - REVIEW_THRESHOLD
            - CANDIDATE_LIMIT
            - MAX_ACTIVE_BIDS
        sessionVersion:
          type: integer
        expiresAt:
          type: string
          format: date-time
        strategyRevision:
          type: integer
          nullable: true
        baseRevision:
          type: integer
          nullable: true
    # M7/7C ① — 공고 요약 하나. **평탄하다**(D-6A1-20 ⓑ — 모든 속성이 스칼라다). 응답 본문이
    # 이 스키마의 **배열**인 이유는 목록 자체가 답이고(legacy `GET /projects/` 가 채택 가능으로
    # 남긴 계약 형태), 총수·빈 결과 사유는 헤더가 나르기 때문이다 — 평탄 술어를 넓히지 않는다.
    #
    # 금액은 값만 싣지 않고 **basis·통화·과세·provenance 와 함께** 싣는다(R-BASIS-06).
    # 원시 관측(`raw_observation`)·감사 행·개찰 축·투찰자 이름은 이 스키마에 없다 —
    # `OpenApiNoticeSearchContractTest` 가 키 집합 등식으로 그 사실을 잠근다.
    NoticeSummary:
      type: object
      required:
        - noticeNumber
        - noticeRound
        - status
      properties:
        noticeNumber:
          type: string
        noticeRound:
          type: string
        status:
          type: string
        title:
          type: string
          nullable: true
        demandAgencyName:
          type: string
          nullable: true
        noticeAgencyName:
          type: string
          nullable: true
        baseAmountWon:
          type: integer
          format: int64
          nullable: true
        baseAmountCurrency:
          type: string
          nullable: true
        baseAmountBasis:
          type: string
          nullable: true
        baseAmountVatTreatment:
          type: string
          nullable: true
        baseAmountProvenance:
          type: string
          nullable: true
        deadlineAt:
          type: string
          format: date-time
          nullable: true
    # M7/7C①b — 제안 하나. `NoticeSummary` 의 속성을 **같은 정의로** 갖고(`$ref`·`allOf` 는 평탄 계약
    # D-6A1-38 이 거부한다 — 같음은 `OpenApiSuggestionContractTest` 의 정의 등식이 잰다) 면허 축 판정을 더한다.
    SuggestedNotice:
      type: object
      required:
        - noticeNumber
        - noticeRound
        - status
        - licenseVerdict
        - unjudgedAxes
      properties:
        noticeNumber:
          type: string
        noticeRound:
          type: string
        status:
          type: string
        title:
          type: string
          nullable: true
        demandAgencyName:
          type: string
          nullable: true
        noticeAgencyName:
          type: string
          nullable: true
        baseAmountWon:
          type: integer
          format: int64
          nullable: true
        baseAmountCurrency:
          type: string
          nullable: true
        baseAmountBasis:
          type: string
          nullable: true
        baseAmountVatTreatment:
          type: string
          nullable: true
        baseAmountProvenance:
          type: string
          nullable: true
        deadlineAt:
          type: string
          format: date-time
          nullable: true
        licenseVerdict:
          type: string
          enum:
            - ELIGIBLE
            - UNCERTAIN
        licenseUncertainReason:
          type: string
          nullable: true
          # C-4 와 같은 관례 — `ELIGIBLE` 카드에서 실제로 `null` 이 나간다. OpenAPI 3.0 에서 nullable 과
          # enum 을 함께 쓰면 enum 에 `null` 이 있어야 그 값이 유효하다(7C①b 수정 라운드 1, cr L-2).
          enum:
            - null
            - REQUIREMENT_DATA_ABSENT
            - REQUIREMENT_UNPARSABLE
            - OPERATOR_LICENSES_NOT_DECLARED
            - COLLECTION_FAILED
            - PERMITTED_INDUSTRY_COMBINATION_RULE_UNDECIDED
        unjudgedAxes:
          type: array
          items:
            type: string
            enum:
              - QUAL_08_REGION
              - QUAL_10_PERFORMANCE
              - QUAL_11_CONSTRUCTION_CAPACITY
    BidPriceRequestBody:
      type: object
      required:
        - noticeNumber
        - noticeRound
        - currentActiveBids
      properties:
        noticeNumber:
          type: string
          maxLength: 200
          description: >-
            공고번호. 정규화(trim · ASCII 대문자화 · 내부 공백을 `-` 로 합침)는 서버가 한다.
            공백만·제어 문자·길이 상한 초과는 400 이다.
        noticeRound:
          type: string
          maxLength: 200
          description: 차수 — 제로패딩 3자리 숫자(KONEPS `bidNtceOrd`). 그 밖은 400 이다.
        currentActiveBids:
          type: integer
          format: int32
          minimum: 0
          description: >-
            진행 중 투찰 건수. **호출자가 선언한다**(`evaluateDryRun` 과 같은 규약, D-6A3-3)
            — 서버가 0 으로 지어내지 않는다. 사다리의 여력 축이 이 값을 쓴다.
    BidPriceRequestResponse:
      type: object
      required:
        - noticeNumber
        - noticeRound
        - correlationId
        - strategyRevision
        - currentActiveBids
        - maxActiveBids
        - outcome
        - verdictReasonCodes
        - noticeStatus
        - failedWatchRuleIds
        - wouldNotify
        - inboxRecordState
        - licenseVerdict
        - licenseRequirementSourceFields
        - licenseGroupsSatisfied
        - licenseGroupsMissing
        - licenseMissingLicenses
        - licenseMissingDetailState
        - licenseUnparsableRowCount
        - licenseValidity
        - licensePolicySource
        - unjudgedAxes
        - floorRateGroundsState
        - floorShortfallState
        - floorShortfallNotComputedReason
        - mlAnalysisState
        - confidenceState
        - confidenceNotAvailableReason
        - bidPriceMenuState
        - bidPriceMenuNotComputedReason
        - disclosures
      properties:
        noticeNumber:
          type: string
        noticeRound:
          type: string
        correlationId:
          type: string
          description: 이 평가의 상관 ID — audit 행·오류 본문과 같은 어휘다.
        strategyRevision:
          type: integer
          format: int32
        currentActiveBids:
          type: integer
          format: int32
        maxActiveBids:
          type: integer
          format: int32
        outcome:
          type: string
          enum:
            - REACHED
            - NOT_REACHED
          description: 판정 사다리에 이르렀는가. 이르지 못하면 `dropStage`·`dropReasonCode` 가 어디서 왜 멈췄는지 말한다.
        verdict:
          type: string
          nullable: true
          enum:
            - null
            - BID_NOW
            - REVIEW
            - SKIP
          description: 판정. `outcome` 이 `NOT_REACHED` 면 없다.
        verdictReasonCodes:
          type: array
          items:
            type: string
          description: >-
            판정 사유 코드. 출하 조립에서는 ML 이 항상 미가용이라 사다리에 이른 공고가
            `REVIEW` · `ML_UNAVAILABLE` 로 내려온다 — 「낮은 추천」이 아니라 「추천 없음」이다.
        dropStage:
          type: string
          nullable: true
          description: 멈춘 단계(수명·감시·자격·임계 미설정·분석 예산·ML 가용성·점수 임계).
        dropReasonCode:
          type: string
          nullable: true
          description: 멈춘 사유. 단계와 사유는 한 쌍이다(사유 하나는 늘 정확히 한 단계에 속한다).
        noticeStatus:
          type: string
        failedWatchRuleIds:
          type: array
          items:
            type: string
          description: 감시 거절에서 걸린 규칙 ID. 그 밖의 경우 빈 배열이다.
        watchUndeterminableReason:
          type: string
          nullable: true
        scoreThreshold:
          type: string
          nullable: true
          description: 점수 미달 사유의 임계값 — 10진 문자열이다(부동소수로 내지 않는다).
        scoreActual:
          type: string
          nullable: true
          description: 같은 사유의 실제값 — 10진 문자열.
        wouldNotify:
          type: boolean
          description: >-
            이 판정이 알림 요청을 낳았는가. **요청까지**이고 배달·기록은 하지 않는다
            (`evaluateDryRun` 과 같은 경계).
        inboxRecordState:
          type: string
          enum:
            - NOT_RECORDED_YET
          description: >-
            알림함 기록 상태(R-4). 쓰기 포트가 아직 머지되지 않아 **기록하지 않는다** — 가짜
            포트·임시 표를 두지 않고 그 사실을 계약에 드러낸다. 포트가 서면 값이 늘어난다.
        inboxRecordNotRecordedReason:
          type: string
          nullable: true
          enum:
            - null
            - INBOX_WRITE_PORT_NOT_MERGED
        licenseVerdict:
          type: string
          enum:
            - ELIGIBLE
            - INELIGIBLE
            - UNCERTAIN
          description: >-
            면허 자격 판정(QUAL-01 · 03). **`UNCERTAIN` 은 `INELIGIBLE` 이 아니다**(U-5) —
            판정 불가와 미달을 한 값으로 접지 않는다.
        licenseUncertainReason:
          type: string
          nullable: true
          enum:
            - null
            - REQUIREMENT_DATA_ABSENT
            - REQUIREMENT_UNPARSABLE
            - OPERATOR_LICENSES_NOT_DECLARED
            - COLLECTION_FAILED
            - PERMITTED_INDUSTRY_COMBINATION_RULE_UNDECIDED
          description: 판정 불가 사유(요건 데이터 부재·파싱 불가·프로필 미선언·수집 실패·허용업종 결합 규칙 미결).
        licenseRequiredLicenses:
          type: array
          nullable: true
          items:
            type: string
          description: 공고가 요구한 면허명 — **근거 원문의 「무엇을 요구했나」**(QUAL-05).
        licenseRequirementSourceFields:
          type: array
          items:
            type: string
          description: 요건이 온 공고 필드 — **근거 원문의 「어느 필드에서」**(QUAL-05).
        licenseGroupsSatisfied:
          type: array
          items:
            type: string
          description: 충족한 제한그룹 라벨. 그룹 간 OR · 그룹 내 AND 다(QUAL-03).
        licenseGroupsMissing:
          type: array
          items:
            type: string
          description: 충족하지 못한 제한그룹 라벨.
        licenseMissingLicenses:
          type: array
          items:
            type: string
          description: >-
            미보유 면허명. **미충족 그룹이 둘 이상이면 비운다** — 그룹 간 OR 을 합집합으로
            접으면 「이 면허들이 다 필요하다」로 읽힌다. 그 경우는
            `licenseMissingDetailState` 가 말한다.
        licenseMissingDetailState:
          type: string
          enum:
            - NOT_APPLICABLE
            - SINGLE_GROUP
            - MULTIPLE_GROUPS_NOT_FLATTENED
        licenseUnparsableRowCount:
          type: integer
          format: int32
          description: 파싱하지 못한 요건 행 수 — 0 이 아니면 판정이 일부 요건을 보지 못했다는 뜻이다.
        licenseValidity:
          type: string
          enum:
            - NOT_VERIFIED
          description: >-
            면허 **유효기간 미검증**(U-7) — V2 는 유효기간을 보지 않는다. 그 사실이 판정 결과에
            드러나야 한다는 요구를 이 칸이 집행한다.
        licensePolicySource:
          type: string
          description: >-
            판정에 쓴 어휘 테이블 version 의 출처(QUAL-05 — 규칙이 바뀌면 과거 판정이 어느
            version 에서 나왔는지 재현된다).
        licensePolicyEffectiveFrom:
          type: string
          nullable: true
          description: >-
            그 version 의 시행일. 정책의 **최초 판**이면 시행일이라는 값 자체가 없어 `null`
            이다 — 출처와 시행일을 한 문자열로 합치지 않는다(구분자를 지어내지 않는다).
        unjudgedAxes:
          type: array
          items:
            type: string
            enum:
              - QUAL_08_REGION
              - QUAL_10_PERFORMANCE
              - QUAL_11_CONSTRUCTION_CAPACITY
          description: >-
            **아직 판정하지 않는 자격 축**(QUAL-08 지역 · QUAL-10 수행실적 · QUAL-11
            시공능력평가금액). 「판정했고 통과」와 「판정하지 않음」을 구분하게 한다 — 자격
            카드가 「면허만 보면 끝」으로 읽히지 않게 한다. 판정이 생기는 slice 가 그 값을 뺀다.
        baseAmountWon:
          type: integer
          format: int64
          nullable: true
        baseAmountCurrency:
          type: string
          nullable: true
        baseAmountBasis:
          type: string
          nullable: true
        baseAmountVatTreatment:
          type: string
          nullable: true
        baseAmountProvenance:
          type: string
          nullable: true
        baseAmountResolution:
          type: string
          nullable: true
          enum:
            - null
            - DIRECT
            - FALLBACK_FROM_BUDGET
            - DERIVED_FROM_OPENING
          description: >-
            기초금액이 **어떻게 정해졌나**(DEC-01) — 게시값 그대로인지, 예산 키 폴백인지, 개찰
            역산인지. 파생이 원본을 덮지 않는다는 사실이 이 칸으로 보인다.
        publishedFloorRateFraction:
          type: string
          nullable: true
          description: >-
            게시 낙찰하한율 — fraction 의 10진 문자열이다(percent 가 아니고 부동소수가 아니다).
            **근거로 설 수 있을 때만 싣는다** — 출처가 게시값이 아니거나 개연 밴드 밖이면 비우고
            `floorRateGroundsState` 가 사유를 말한다.
        publishedFloorRateOrigin:
          type: string
          nullable: true
          enum:
            - null
            - NOTICE_VALUE
            - STATUTORY_TABLE
        publishedFloorRateNoticeRound:
          type: string
          nullable: true
          description: 게시값 출처의 공고 차수.
        floorRateGroundsState:
          type: string
          enum:
            - USABLE
            - ABSENT
            - IMPLAUSIBLE
            - ORIGIN_NOT_PUBLISHED
          description: >-
            게시 하한율이 근거로 설 수 있는가 — 「없다」(ABSENT)·「게시값이 아니다」
            (ORIGIN_NOT_PUBLISHED)·「게시값이지만 개연 밴드 밖이다」(IMPLAUSIBLE)를 가른다
            (운영자 결정 2026-10-15 게시값만 근거 · DEC-10 신뢰 밴드).
            `IMPLAUSIBLE` 은 **값을 고치지 않는다** — 밴드 끝으로 접거나 클램프하지 않고 근거로
            쓰지 않을 뿐이다. 그 원값은 근거 칸에 실리지 않고 이 상태가 그 사실을 말한다.
        floorShortfallState:
          type: string
          enum:
            - NOT_COMPUTED
          description: >-
            하한 미달 빈도(DEC-04)를 **이 공고에서 잴 수 있는가**. 지금은 재지 못한다 —
            커널은 있으나 출하 정본 정책 표와 표본 공급 경로가 없다. 값이 서는 slice 가 빈도
            칸과 상태 값을 더한다.
        floorShortfallNotComputedReason:
          type: string
          enum:
            - SHORTFALL_POLICY_NOT_PUBLISHED
          description: >-
            재지 못한 사유. 「재려 했으나 재지 못했다」(표본 부족 등)와 **다른 어휘**다 —
            표본을 보지 않았으므로 표본 수를 적지 않는다.
        mlAnalysisState:
          type: string
          enum:
            - ANALYZED
            - UNAVAILABLE
            - SIMILARITY_PROJECTION_NOT_READY
            - NOT_REACHED
          description: >-
            커널이 ML 단계에서 받은 것. `NOT_REACHED` 는 **거기까지 가지 않았다**는 뜻이고
            `UNAVAILABLE`(갔으나 미가용)과 다른 사실이다.
        mlUnavailableReason:
          type: string
          nullable: true
          enum:
            - null
            - SCORE_NOT_PROVIDED
            - DEADLINE_EXCEEDED
            - CIRCUIT_OPEN
            - RETRY_BUDGET_EXHAUSTED
            - TRANSPORT_FAILED
            - MODEL_NOT_READY
            - RELEASE_MISMATCH
            - CONTRACT_VIOLATION
            - UNSUPPORTED_SCHEMA
            - UNSUPPORTED_RELEASE
            - INVALID_REQUEST
          description: 미가용 사유. 출하 조립에서는 점수 provider 가 없어 `SCORE_NOT_PROVIDED` 다.
        confidenceState:
          type: string
          enum:
            - NOT_AVAILABLE
          description: >-
            신뢰도(ML-03). 값이 서는 날 그것은 **가격 적합도이고 확률이 아니다** — 그 고지가
            `disclosures` 의 `PRICE_FITNESS_IS_NOT_PROBABILITY` 다. 이 응답에 확률 칸은 없다.
        confidenceNotAvailableReason:
          type: string
          enum:
            - ML_SCORE_NOT_PROVIDED
            - ML_UNAVAILABLE
            - SIMILARITY_PROJECTION_NOT_READY
            - EVALUATION_NOT_REACHED_ML_STAGE
        bidPriceMenuState:
          type: string
          enum:
            - NOT_COMPUTED
          description: >-
            3안(안전·추천·공격) 상태(DEC-05 · ML-01). **빈 배열이 아니라 이유 있는 상태**다 —
            화면이 가짜 숫자를 그리지 않게 한다. 값이 서는 slice 가 태도별 칸과 상태 값을 더한다.
        bidPriceMenuNotComputedReason:
          type: string
          enum:
            - MENU_PATH_NOT_WIRED
          description: >-
            산출하지 않은 사유 — **이 배선에 산출 경로가 없다**는 사실 하나만 말한다. 커널을
            불러 「출처가 없었다」를 받은 것이 아니다(부르지 않았다).
        disclosures:
          type: array
          items:
            type: string
            enum:
              - YEGA_DRAWN_PRIVATELY
              - NOT_AUTO_SUBMITTED
              - STATUTORY_FLOOR_RATE_NOT_INTERPRETED
              - PRICE_FITNESS_IS_NOT_PROBABILITY
          description: >-
            **전수를 늘 싣는다** — 예정가격은 개찰 전 비공개 추첨으로 결정되어 정확한 낙찰하한을
            보장할 수 없음 · 자동 제출·확정 낙찰이 아님 · 법정 하한율 미해석 · 가격 적합도는
            확률이 아님. 코드만 나르고 **문장은 표면이 짓는다**(계산이 바뀐 뒤에도 옛 문구가
            남는 것을 막는다).
    # M7/7C⑤-a — 공고 하나의 개찰 결과. **평탄하다**(D-6A1-20 ⓑ — 모든 속성이 스칼라다).
    # 잠정 축과 확정 축을 중첩 object 로 가르지 않고 **접두사와 상태**로 가른다(평탄 술어를
    # 넓히지 않는다). 업체 상호·사업자등록번호·대표자명 칸이 **없다**(D-7C5-3) —
    # `OpenApiOpeningResultContractTest` 가 키 집합 등식과 어휘 교집합 공집합으로 잠근다.
    OpeningResultView:
      type: object
      required:
        - noticeNumber
        - noticeRound
        - state
        - provisionalRankOneState
      properties:
        noticeNumber:
          type: string
        noticeRound:
          type: string
        state:
          type: string
          enum:
            - NOTICE_ABSENT
            - NOT_OPENED_YET
            - NOT_COLLECTED
            - OBSERVED_NOT_PROMOTED
            - OPENED
            - FAILED_BID
            - REBID
            - PROGRESS_UNRECOGNIZED
            - PROGRESS_ABSENT
        participantCount:
          type: integer
          format: int32
          nullable: true
        actualOpeningAt:
          type: string
          format: date-time
          nullable: true
        observedAt:
          type: string
          format: date-time
          nullable: true
        confirmedAwardAmountWon:
          type: integer
          format: int64
          nullable: true
        confirmedAwardAmountCurrency:
          type: string
          nullable: true
        confirmedAwardAmountBasis:
          type: string
          nullable: true
        confirmedAwardAmountVatTreatment:
          type: string
          nullable: true
        confirmedAwardAmountProvenance:
          type: string
          nullable: true
        provisionalRankOneState:
          type: string
          enum:
            - NOT_OBSERVED
            - RANK_MISSING
            - RANK_DUPLICATED
            - DETERMINED
        provisionalRankOneDuplicateCount:
          type: integer
          format: int32
          nullable: true
        provisionalRankOneBidAmountWon:
          type: integer
          format: int64
          nullable: true
        provisionalRankOneBidAmountCurrency:
          type: string
          nullable: true
        provisionalRankOneBidAmountVatTreatment:
          type: string
          nullable: true
        provisionalRankOneBidRateFraction:
          type: string
          nullable: true
        provisionalRankOneObservedAt:
          type: string
          format: date-time
          nullable: true
    # =========================================================================
    # M7/7C④ — 운영자 프로필. 전부 **평탄하다**(중첩 object 속성 없음, D-6A1-20 ⓑ).
    #
    # 요청 · 응답 어디에도 **없는** 것이 이 계약의 절반이다:
    #  · accountId — 주체는 인증 필터가 적은 값에서만 온다(요청 바인딩은 AccountId 를 짓지 못한다)
    #  · updatedAt — 시각은 서버 시계가 싣는다
    #  · 사업자번호 · 대표자명 · 인증서 원문 — 표에 열이 없다
    #  · 체크리스트 진행 상태 — 저장하지 않는다(서버가 매번 판정한다. 그 operation 은 7C② 뒤에 선다)
    # =========================================================================
    Profile:
      type: object
      required:
        - qualificationDeclared
        - businessTypes
        - licensesDeclared
        - licenseNames
        - regionTerms
        - naraRegistration
        - naraRegisteredFields
        - unjudgedAxes
      properties:
        qualificationDeclared:
          type: boolean
          description: >-
            V12 자격 사실 행이 있는가. `false` 면 「프로필 미설정」이고, 그때의 빈 목록은
            **신고된 빈 값이 아니다**.
        businessTypes:
          type: array
          items:
            type: string
        licensesDeclared:
          type: boolean
          description: >-
            면허를 **신고했는가**. `qualificationDeclared` 와 짝으로 세 상태를 가른다
            (미설정 · 미신고 · 신고). 신고했고 면허가 없으면 `true` + 빈 `licenseNames` 다.
        licenseNames:
          type: array
          items:
            type: string
        regionTerms:
          type: array
          items:
            type: string
          description: V12 의 자유 어휘(텍스트 합성용). `headquartersRegion`(구조화 입력)과 다른 축이다.
        tradeName:
          type: string
          nullable: true
          maxLength: 100
          description: >-
            입력 원문 그대로(앞뒤 공백 포함). null 은 「미설정」이다. 길이는 **코드포인트 수**로 센다
            (`maxLength` 는 그 근사다 — 서버는 코드포인트로 거부한다).
        headquartersRegion:
          type: string
          nullable: true
          enum: [SEOUL, BUSAN, DAEGU, INCHEON, GWANGJU, DAEJEON, ULSAN, SEJONG, GYEONGGI, GANGWON, CHUNGBUK, CHUNGNAM, JEONBUK, JEONNAM, GYEONGBUK, GYEONGNAM, JEJU]
        naraRegistration:
          type: string
          enum: [UNANSWERED, REGISTERED, NOT_REGISTERED]
          description: >-
            **「미응답」이 값이다** — null 이나 「미등록」으로 접지 않는다(화면의 경고가 다르다).
        naraRegisteredFields:
          type: array
          items:
            type: string
            enum: [GOODS, SERVICE, CONSTRUCTION]
        businessCertificateExpiresOn:
          type: string
          format: date
          nullable: true
          description: 사업자용(전자서명) 인증서 만료일. 등록 상태에서만 값이 있을 수 있다.
        unjudgedAxes:
          type: array
          items:
            type: string
            enum: [QUAL_08_REGION, QUAL_10_PERFORMANCE, QUAL_11_CONSTRUCTION_CAPACITY]
          description: >-
            **아직 판정하지 않는 자격 축**(M7 완료 조건 G2). 입력이 있든 없든 V2 에 판정이 없는 축이고,
            화면은 이 목록에서 「아직 판정하지 않음」을 그린다(클라이언트가 추론하지 않는다).
    ConstructionCapacity:
      type: object
      required:
        - licenseName
        - amountWon
        - assessmentYear
      properties:
        licenseName:
          type: string
          minLength: 1
          maxLength: 100
        amountWon:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000000
          description: 원 단위 정수. 0 을 받지 않는다(「모름」의 기본값으로 흘러들기 쉬운 값이다).
        assessmentYear:
          type: integer
          minimum: 2000
          maximum: 2100
          description: 어느 해 평가액인지는 **필수**다(연 1회 갱신되는 값이라 기준 해가 없으면 해석이 갈린다).
    QualificationFactsRequest:
      type: object
      required:
        - businessTypes
        - licensesDeclared
        - licenseNames
        - regionTerms
      description: >-
        세 배열 모두 **원소가 공백뿐일 수 없고**(400), 원소 길이 · 배열 크기에 상한이 있으며 **중복을
        받지 않는다**. V12 에는 이 축의 표 제약이 없어 경계가 요청 판독에만 있다.
      properties:
        businessTypes:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 100
        licensesDeclared:
          type: boolean
        licenseNames:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 100
          description: "`licensesDeclared` 가 거짓이면 비어 있어야 한다(아니면 400)."
        regionTerms:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 100
    BusinessDetailsRequest:
      type: object
      required:
        - naraRegistration
      properties:
        tradeName:
          type: string
          nullable: true
          maxLength: 100
          description: >-
            **공백뿐인 값은 400 이다** — 「미설정」은 키를 빼거나 `null` 이다(절 단위 교체라 공백이
            조용히 「지우기」가 되지 않게 한다).
        headquartersRegion:
          type: string
          nullable: true
          enum: [SEOUL, BUSAN, DAEGU, INCHEON, GWANGJU, DAEJEON, ULSAN, SEJONG, GYEONGGI, GANGWON, CHUNGBUK, CHUNGNAM, JEONBUK, JEONNAM, GYEONGBUK, GYEONGNAM, JEJU]
        naraRegistration:
          type: string
          enum: [UNANSWERED, REGISTERED, NOT_REGISTERED]
        naraRegisteredFields:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [GOODS, SERVICE, CONSTRUCTION]
          description: "`naraRegistration` 이 `REGISTERED` 일 때만 실을 수 있고, 그때는 **필수**다(빈 배열 가능). 중복은 400 이다."
        businessCertificateExpiresOn:
          type: string
          format: date
          nullable: true
          description: "`naraRegistration` 이 `REGISTERED` 일 때만 실을 수 있다."
    ConstructionCapacityRequest:
      type: object
      required:
        - licenseName
        - amountWon
        - assessmentYear
      properties:
        licenseName:
          type: string
          minLength: 1
          maxLength: 100
        amountWon:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000000
        assessmentYear:
          type: integer
          minimum: 2000
          maximum: 2100
    RemoveConstructionCapacityRequest:
      type: object
      required:
        - licenseName
      properties:
        licenseName:
          type: string
          minLength: 1
          maxLength: 100
    # M7/7C④-3 — **이 계약의 유일한 깊이 1 object**(`awaiting` 의 아이템). 계약 게이트의 평탄
    # 술어가 D-7C4C-6 으로 그 한 겹까지 허용한다: 그 object 의 속성은 전부 스칼라여야 하고 키는
    # `type`·`properties`·`required`·`description` 안이어야 한다. 깊이 2 · 자유 맵 · 합성 어휘 ·
    # `$ref` 는 여전히 거부다 — 그래서 항목 어휘를 공유 스키마로 빼지 않고 **네 자리에 인라인**
    # 한다(`$ref` 가 깊이를 숨기는 길이라 술어가 막는다). 네 벌이 갈리지 않는 근거는 Kotlin
    # `OnboardingItem` 과의 양방향 등식 test 다(`OpenApiOnboardingChecklistContractTest`).
    MyBidResults:
      type: object
      required:
        - cases
        - aggregate
      properties:
        cases:
          type: array
          description: "투찰 기록이 있는 **실투찰** 건. 페이퍼(가상) 건은 들지 않는다. 순서는 확인 시각 내림차순이다."
          items:
            type: object
            required:
              - caseId
              - noticeNumber
              - noticeRound
              - recordedState
              - submittedAmountWon
              - submittedAmountCurrency
              - submittedAmountVatTreatment
              - submittedAmountOrigin
              - chosenOptionRef
              - submittedAt
              - confirmedAt
              - openingState
              - confirmedAwardAmountWon
              - confirmedAwardAmountCurrency
              - confirmedAwardAmountBasis
              - confirmedAwardAmountVatTreatment
              - confirmedAwardAmountProvenance
              - reconciledOutcome
              - reconciliationBlocker
              - outcomeAgreement
              - gapState
              - gapWon
              - gapCurrency
            properties:
              caseId:
                type: integer
                format: int32
                description: "입찰 건 식별자."
              noticeNumber:
                type: string
                description: "공고번호(건이 담을 때 적은 사본)."
              noticeRound:
                type: string
                description: "공고 차수."
              recordedState:
                type: string
                description: "**운영자가 적은** 건 상태. 서버 대사와 다른 칸이다."
                enum:
                  - WATCHING
                  - DEFERRED
                  - PRICE_RECEIVED
                  - BID_PLANNED
                  - BID_RECORDED
                  - AWAITING_OPENING
                  - OPENED_PROVISIONAL_FIRST
                  - OPENED_OUT_OF_RANK
                  - UNDER_QUALIFICATION_REVIEW
                  - WON
                  - LOST
                  - FAILED_OR_REBID
                  - SKIPPED
                  - DEADLINE_PASSED_UNRECORDED
              submittedAmountWon:
                type: integer
                format: int64
                description: "내 투찰 금액(원)."
              submittedAmountCurrency:
                type: string
                description: "투찰 금액의 통화."
              submittedAmountVatTreatment:
                type: string
                description: "투찰 금액의 과세 처리."
              submittedAmountOrigin:
                type: string
                description: "투찰 금액의 출처. **오늘은 언제나 OPERATOR_ENTERED 다** — 투찰가 메뉴가 출하 경로에 없어 PRICE_MENU 를 만들 길이 없다(알려진 제한)."
                enum:
                  - OPERATOR_ENTERED
                  - PRICE_MENU
              chosenOptionRef:
                type: string
                nullable: true
                description: "메뉴에서 고른 안의 참조. 출처가 PRICE_MENU 일 때만 값이 있고, 오늘은 **언제나 null** 이다."
              submittedAt:
                type: string
                format: date-time
                description: "운영자가 나라장터에 낸 시각(진술)."
              confirmedAt:
                type: string
                format: date-time
                description: "그 사실을 이 시스템에 확인한 시각(서버 시계)."
              openingState:
                type: string
                description: "개찰 결과 상태. 공고 단위 개찰 조회(readOpeningResult)와 **같은 어휘**다."
                enum:
                  - NOTICE_ABSENT
                  - NOT_OPENED_YET
                  - NOT_COLLECTED
                  - OBSERVED_NOT_PROMOTED
                  - OPENED
                  - FAILED_BID
                  - REBID
                  - PROGRESS_UNRECOGNIZED
                  - PROGRESS_ABSENT
              confirmedAwardAmountWon:
                type: integer
                format: int64
                nullable: true
                description: "**확정** 낙찰가(원). 잠정 1위 금액이 아니다."
              confirmedAwardAmountCurrency:
                type: string
                nullable: true
                description: "확정 낙찰가의 통화."
              confirmedAwardAmountBasis:
                type: string
                nullable: true
                description: "확정 낙찰가의 금액 축."
              confirmedAwardAmountVatTreatment:
                type: string
                nullable: true
                description: "확정 낙찰가의 과세 처리. 상류가 선언하지 않아 언제나 UNKNOWN 이다."
              confirmedAwardAmountProvenance:
                type: string
                nullable: true
                description: "확정 낙찰가의 출처."
              reconciledOutcome:
                type: string
                description: "**서버 대사 판정**. UNDECIDABLE 은 패찰이 아니다 — 견줄 상호나 개찰 결과가 아직 없다는 뜻이다."
                enum:
                  - WON
                  - LOST
                  - FAILED_BID
                  - REBID
                  - UNDECIDABLE
              reconciliationBlocker:
                type: string
                nullable: true
                description: "판정이 서지 않은 사유. reconciledOutcome 이 UNDECIDABLE 일 때만 값이 있다."
                enum:
                  - NOTICE_ABSENT
                  - NOT_OPENED_YET
                  - NOT_COLLECTED
                  - OBSERVED_NOT_PROMOTED
                  - PROGRESS_UNRECOGNIZED
                  - PROGRESS_ABSENT
                  - OPERATOR_NAME_NOT_DECLARED
                  - OPERATOR_NAME_NORMALIZES_TO_EMPTY
                  - WINNER_NAME_NOT_PUBLISHED
                  - WINNER_NAME_NORMALIZES_TO_EMPTY
              outcomeAgreement:
                type: string
                description: "운영자 기록과 서버 대사의 관계. DISAGREE 는 **어긋났다는 사실**일 뿐 어느 쪽이 틀렸다는 판정이 아니다."
                enum:
                  - AGREE
                  - DISAGREE
                  - NOT_COMPARABLE
              gapState:
                type: string
                description: "차이의 상태. 확정 낙찰가가 없으면 AWARD_ABSENT 이고 **잠정 금액으로 채우지 않는다**."
                enum:
                  - COMPUTED
                  - AWARD_ABSENT
              gapWon:
                type: integer
                format: int64
                nullable: true
                description: "내 투찰가 − 확정 낙찰가(원). 음수는 내가 더 낮게 냈다는 뜻이다. 두 금액의 과세 축이 같다는 보장은 없다."
              gapCurrency:
                type: string
                nullable: true
                description: "차이의 통화."
        aggregate:
          type: object
          description: "투찰 대비 낙찰률 — **두 축을 병기**한다. 목록과 **같은 판정 패스**에서 난다."
          required:
            - sampleSize
            - recordedRateState
            - recordedAwardRate
            - recordedWonCount
            - recordedLostCount
            - recordedDenominator
            - recordedFailedOrRebidCount
            - recordedUndecidedCount
            - reconciledRateState
            - reconciledAwardRate
            - reconciledWonCount
            - reconciledLostCount
            - reconciledDenominator
            - reconciledFailedOrRebidCount
            - reconciledUndecidedCount
            - reconciliationBlockers
          properties:
            sampleSize:
              type: integer
              format: int32
              description: "투찰 기록이 있는 실투찰 건의 수. 두 축이 같은 표본을 센다."
            recordedRateState:
              type: string
              description: "운영자가 적은 결과 축의 비율 상태. 분모가 0 이면 ABSENT_NO_RECORDED_BIDS(셀 것이 없다) 또는 ABSENT_NO_DECIDED_CASES(전부 분모 밖)이고 **0% 가 아니다**."
              enum:
                - MEASURED
                - ABSENT_NO_RECORDED_BIDS
                - ABSENT_NO_DECIDED_CASES
            recordedAwardRate:
              type: string
              nullable: true
              description: "운영자가 적은 결과 축의 낙찰률(분자/분모). 상태가 MEASURED 일 때만 값이 있다. 배정밀도를 피하려고 문자열이다."
            recordedWonCount:
              type: integer
              format: int32
              description: "운영자가 적은 결과 축의 낙찰 건 수(분자)."
            recordedLostCount:
              type: integer
              format: int32
              description: "운영자가 적은 결과 축의 패찰 건 수."
            recordedDenominator:
              type: integer
              format: int32
              description: "운영자가 적은 결과 축의 분모(낙찰 + 패찰)."
            recordedFailedOrRebidCount:
              type: integer
              format: int32
              description: "운영자가 적은 결과 축의 유찰·재입찰 건 수(분모 밖)."
            recordedUndecidedCount:
              type: integer
              format: int32
              description: "운영자가 적은 결과 축의 미확정·판정 불가 건 수(분모 밖)."
            reconciledRateState:
              type: string
              description: "서버 대사 축의 비율 상태. 분모가 0 이면 ABSENT_NO_RECORDED_BIDS(셀 것이 없다) 또는 ABSENT_NO_DECIDED_CASES(전부 분모 밖)이고 **0% 가 아니다**."
              enum:
                - MEASURED
                - ABSENT_NO_RECORDED_BIDS
                - ABSENT_NO_DECIDED_CASES
            reconciledAwardRate:
              type: string
              nullable: true
              description: "서버 대사 축의 낙찰률(분자/분모). 상태가 MEASURED 일 때만 값이 있다. 배정밀도를 피하려고 문자열이다."
            reconciledWonCount:
              type: integer
              format: int32
              description: "서버 대사 축의 낙찰 건 수(분자)."
            reconciledLostCount:
              type: integer
              format: int32
              description: "서버 대사 축의 패찰 건 수."
            reconciledDenominator:
              type: integer
              format: int32
              description: "서버 대사 축의 분모(낙찰 + 패찰)."
            reconciledFailedOrRebidCount:
              type: integer
              format: int32
              description: "서버 대사 축의 유찰·재입찰 건 수(분모 밖)."
            reconciledUndecidedCount:
              type: integer
              format: int32
              description: "서버 대사 축의 미확정·판정 불가 건 수(분모 밖)."
            reconciliationBlockers:
              type: array
              description: "표본에 나타난 판정 불가 사유 전수. 대사 분모가 0 이면 **이것이 그 사유다**."
              items:
                type: string
    OnboardingChecklist:
      type: object
      required:
        - completed
        - pending
        - awaiting
      properties:
        completed:
          type: array
          description: 걸리면서 **완료된** 항목. 선언 순서를 유지한다.
          items:
            type: string
            enum: [TRADE_NAME, NARA_READINESS, BUSINESS_TYPES, LICENSES, HEADQUARTERS_REGION, CONSTRUCTION_CAPACITY, BUDGET_RANGE, WATCH_CONDITIONS]
        pending:
          type: array
          description: 걸리지만 **아직 완료되지 않은** 항목. 선언 순서를 유지한다.
          items:
            type: string
            enum: [TRADE_NAME, NARA_READINESS, BUSINESS_TYPES, LICENSES, HEADQUARTERS_REGION, CONSTRUCTION_CAPACITY, BUDGET_RANGE, WATCH_CONDITIONS]
        awaiting:
          type: array
          description: >-
            **선행 대기** — 항목이 걸리는지가 선행 항목의 답에 달려 있다. 완료·미완 어느 목록에도
            들지 않고 진행률에도 들어가지 않는다. 짝을 자리로 묶지 않고 한 object 로 낸다
            (스칼라 배열 둘로 내면 길이가 어긋난 응답이 표현 가능해진다, D-7C4C-1).
          items:
            type: object
            required:
              - item
              - prerequisite
            properties:
              item:
                type: string
                enum: [TRADE_NAME, NARA_READINESS, BUSINESS_TYPES, LICENSES, HEADQUARTERS_REGION, CONSTRUCTION_CAPACITY, BUDGET_RANGE, WATCH_CONDITIONS]
              prerequisite:
                type: string
                enum: [TRADE_NAME, NARA_READINESS, BUSINESS_TYPES, LICENSES, HEADQUARTERS_REGION, CONSTRUCTION_CAPACITY, BUDGET_RANGE, WATCH_CONDITIONS]
    ErrorBody:
      type: object
