        면허명이 같은 행이 있으면 금액 · 기준 연도를 바꾸고, 없으면 더한다. 응답은 **다시 읽은 목록**이다.


        한 계정의 행 수에는 상한이 있다 — 넘기면 409 다(상한은 앱이 집행한다. 검사와 삽입 사이의
