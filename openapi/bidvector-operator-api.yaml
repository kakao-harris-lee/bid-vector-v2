  /api/suggestions:
    get:
      operationId: listSuggestions
      summary: 제안 목록(STR-06·STR-07) — 현재 전략의 감시를 통과한 후보, 읽기 전용, 마감 임박 순
      description: >-
        열린 공고 가운데 **현재 전략의 감시 조건을 통과하고 면허 자격이 미달이 아닌** 공고를 낸다
        (M7/7C①b). 쓰기 경로가 없고 전략을 바꾸지 않는다. 질의 매개변수가 없다.

        **조회가 곧 계산이다** — 영속 스냅샷이 없으므로 낡을 대상이 없다. 계산에 쓴 전략과 프로필을
        계산이 끝난 뒤 현재 값과 비교해 다르면 그 결과를 버리고 한 번 다시 계산한다. 또 다르면 409
        (`STRATEGY_CHANGED_DURING_COMPUTATION`)다 — 계산 중에 바뀐 전략의 결과를 채택하지 않는다.
        `X-Strategy-Revision` 은 이 결과를 계산한 전략 개정이다.

        **표시 상한은 전략의 `candidateLimit` 이고 계산 예산과 독립이다**(STR-06). 계산은 열린 후보 전부
        (운영 설정의 스캔 상한 이내 — 넘으면 409 `CANDIDATE_CAP_EXCEEDED`, 조용히 자르지 않는다)에 게이트를
        돌린 **뒤** 마감 임박 순으로 앞에서부터 상한만큼 낸다. 상한이 미설정이면 자르지 않는다.
        `X-Total-Count` 는 자르기 전 통과 건수다.

        **자격은 면허 축만 판정한다.** `licenseVerdict` 는 `ELIGIBLE`·`UNCERTAIN`(미결 — 미보유가 아니다)
        둘이고, 지역·실적 자격은 판정하지 않는다 — `unjudgedAxes` 가 그 축을 늘 싣는다.
      responses:
        "200":
          description: >-
            제안 배열(마감 임박 순). 신선도는 `X-Strategy-Revision`·`X-Computed-At`, 총수는
            `X-Total-Count`, 빈 결과의 뜻은 `X-Result-State` 가 나른다.
          headers:
            X-Strategy-Revision:
              description: 이 결과를 계산한 전략 개정 번호.
              required: true
              schema:
                type: integer
                format: int32
                minimum: 0
            X-Computed-At:
              description: 계산 시각(ISO-8601 instant, 원값).
              required: true
              schema:
                type: string
                format: date-time
            X-Total-Count:
              description: 게이트를 통과한 **전체** 건수(표시 상한을 적용하기 전).
              required: true
              schema:
                type: integer
                format: int64
                minimum: 0
            X-Result-State:
              description: >-
                MATCHED(통과가 1 건 이상) | NO_OPEN_NOTICES(입찰 가능한 열린 공고가 없다) |
                WATCH_NOT_CONFIGURED(감시 조건이 설정되지 않아 어떤 공고도 통과하지 않는다) |
                NO_MATCH(열린 공고는 있으나 통과가 없다)
              required: true
              schema:
                type: string
                enum:
                  - MATCHED
                  - NO_OPEN_NOTICES
                  - WATCH_NOT_CONFIGURED
                  - NO_MATCH
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SuggestedNotice"
        "401":
          description: "자격증명 없음 또는 틀림(D-6A1-6). code: UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: >-
            계산하는 동안 전략 또는 프로필이 두 번 연속 바뀌었다(code: STRATEGY_CHANGED_DURING_COMPUTATION)
            또는 후보 스캔이 상한 초과(code: CANDIDATE_CAP_EXCEEDED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: >-
            내부 오류(저장된 전략이 유효하지 않음 포함) 또는 감사 기록 실패(D-6A1-17,
            fail-closed). code: INVALID_STORED_STRATEGY | INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/opening-results:
    get:
      operationId: readOpeningResult
      summary: 공고 단위 개찰 결과 조회(SET-02 표시 절반 · COL-02 표면) — 읽기 전용
      description: >-
        공고 하나의 개찰 결과를 **읽기만** 한다(M7/7C⑤-a). 쓰기 경로가 없고 수집을 일으키지
        않는다.

        **답은 `state` 가 가르는 아홉 갈래 중 하나다** — 「데이터가 없다」·「결과가 없다」·
        「아직 개찰 전이다」를 한 값으로 접지 않는다. `NOTICE_ABSENT`(그 공고 자체를 수집한 적이
        없다) · `NOT_OPENED_YET`(개찰 결과가 없고 투찰 마감이 아직 지나지 않았다 — 개찰은 마감
        뒤라는 도메인 사실에서만 유도한다) · `NOT_COLLECTED`(개찰 축 원문도 결과도 없다) ·
        `OBSERVED_NOT_PROMOTED`(개찰 축 **원문은 적재됐으나** 결과로 승격되지 않았다) ·
        `OPENED`·`FAILED_BID`(유찰)·`REBID`(재입찰) · `PROGRESS_UNRECOGNIZED`(진행구분 라벨이
        등재 어휘 밖이다 — 조용히 개찰완료로 접지 않는다) · `PROGRESS_ABSENT`(결과 행은 있으나
        진행구분이 없다).

        **잠정과 확정은 다른 칸이다.** 확정 낙찰금액은 `confirmedAwardAmount*` 가 나르고 잠정
        1위는 `provisionalRankOne*` 가 나른다 — 잠정 1위 관측이 확정 칸을 바꾸지 않는다(SET-02).
        잠정 축의 상태는 `NOT_OBSERVED`(투찰 행 미관측) · `RANK_MISSING`(어느 행도 순위 1이
        아니다) · `RANK_DUPLICATED`(순위 1이 둘 이상 — 동값을 임의로 깨지 않는다, 건수는
        `provisionalRankOneDuplicateCount`) · `DETERMINED` 다. 순위를 투찰금액으로 재계산하지
        않는다.

        **다른 업체의 식별 정보를 싣지 않는다** — 사업자등록번호·대표자명은 수집 경계에서
        버려져 저장 자체가 없고, 업체 **상호**는 이 응답의 어느 칸에도 없다(조회 질의가 그 열을
        읽지 않는다). 낙찰/패찰 판정은 서버가 하고 그 결과만 내보낸다(후속 slice).

        금액은 값만 싣지 않고 **통화·basis·과세·provenance 와 함께** 싣는다. 투찰율은 표기
        그대로의 **문자열**이다(JSON 수치의 배정밀도로 소수 자리를 잃지 않는다). 시각은 모두
        관측 시각이고, 잠정 축은 자기 관측 시각을 따로 나른다(소비자가 낡음을 스스로 판정한다).

        `noticeNumber`·`noticeRound` 는 **둘 다 필수**다(차수를 기본값으로 접지 않는다). 차수는
        제로패딩 3자리이고 그 밖의 표기·제어 문자·길이 초과·같은 매개변수의 반복·잘못된 퍼센트
        인코딩은 조용히 고치지 않고 400 이다(어느 입력이 틀렸는지는 응답에 싣지 않는다).
      parameters:
        - name: noticeNumber
          in: query
          required: true
          description: 공고번호. 수집이 저장할 때 쓰는 같은 정규화를 지난다(대문자화·공백 합침).
          schema:
            type: string
            maxLength: 200
        - name: noticeRound
          in: query
          required: true
          description: 차수(제로패딩 3자리). 형식을 어기면 400 이다.
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: 그 공고에 대해 아는 것 — `state` 가 아홉 갈래를 가른다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpeningResultView"
        "400":
          description: >-
            질의 값이 유효하지 않다 — 필수 칸 부재, 제어 문자, 길이 상한 초과, 차수 형식 위반,
            같은 매개변수의 반복, 잘못된 퍼센트 인코딩(UTF-8 로 디코딩되지 않는 바이트열 포함).
            어느 입력이 틀렸는지는 싣지 않는다.
            code: INVALID_REQUEST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: "자격증명 없음 또는 틀림(D-6A1-6). code: UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: >-
            내부 오류 또는 감사 기록 실패(D-6A1-17, fail-closed). code: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/notifications:
    get:
      operationId: listNotifications
      summary: 알림함 목록 — 읽음/안읽음 · 건별 묶음(M7/7C③, NOTI-10)
      description: >-
        운영자의 알림함을 최신 순으로 읽는다. **계정 전용**이다 — 인증 경로 둘 중 계정을 내는
        것은 브라우저 세션뿐이라(운영자 자격 헤더의 주체는 계정 행이 없다) 자격 헤더로 오면
        401 이다. 읽기 메서드라 CSRF 를 요구하지 않는다.

        **항목은 평탄하고 묶음은 계수로 나른다.** 같은 공고의 항목이 몇 개이고 그중 몇 개가
        안읽음인지를 항목마다 `noticeItemCount`·`noticeUnreadCount` 로 싣고, 클라이언트가
        공고 쌍(`noticeNumber`+`noticeRound`)으로 묶는다. 정렬이 묶음을 **연속**시키므로
        클라이언트가 재정렬할 필요가 없다 — 묶음의 최신 사실 시각 역순으로 묶음이 서고 묶음
        안에서도 역순이다. `noticeItemCount` 는 **페이지와 무관한 묶음 전체 크기**라 묶음이
        페이지 경계에 걸쳐도 「더 있다」를 알 수 있다.

        **한 공고·한 종류에 항목은 하나다**(중복 억제). 같은 사실이 다시 기록되면 그 항목이
        갱신되고 행이 늘지 않는다 — 제목 문구가 바뀌어도 흔들리지 않는다(알림함은 표시 문구를
        저장하지 않는다).

        **공고 정보는 저장된 값이 아니라 합쳐 온 값이다.** `noticeKnown` 이 `false` 면 그 키의
        공고 행이 없다는 뜻이고(보존 기한이 지나 파기됐거나 아직 수집되지 않았다 — **둘을
        구분하지 않는다**) `noticeTitle`·`noticeStatus`·`noticeDeadlineAt` 가 전부 `null` 이다.
        항목 자체는 남는다. `noticeKnown` 이 `true` 인데 `noticeTitle` 이 `null` 인 것은 다른
        사실이다(공고 행은 있고 제목 칸이 비었다).

        `X-Total-Count` 는 **필터를 지난 집합**의 건수이고 `X-Unread-Count` 는 `unreadOnly`
        와 무관한 **계정의 안읽음 전수**다(화면 배지가 읽는 값이라 목록 필터에 흔들리지 않는다).

        상한을 넘는 `size`·음수 `page`·형식 오류는 조용히 절삭·변환하지 않고 400 이다.
        `unreadOnly` 는 `true`·`false` 두 리터럴만 받는다 — 알 수 없는 값을 조용히 `false` 로
        접지 않는다. **같은 매개변수를 두 번 보내면 거부한다**.
      security:
        - browserSession: []
      parameters:
        - name: page
          in: query
          required: false
          description: 0부터 세는 페이지 번호. 음수면 400 이다.
          schema:
            type: integer
            format: int32
            minimum: 0
        - name: size
          in: query
          required: false
          description: 페이지 크기(1 이상 100 이하). 범위를 벗어나면 400 이다.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: unreadOnly
          in: query
          required: false
          description: 안읽음만 보기. `true`·`false` 만 받는다(그 밖은 400).
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: >-
            알림함 한 페이지(비었을 수 있다). 헤더 `X-Total-Count`(필터를 지난 전체 건수) ·
            `X-Unread-Count`(계정의 안읽음 전수)
          headers:
            X-Total-Count:
              description: 필터를 지난 전체 건수 — 페이지 길이와 다른 값이다.
              required: true
              schema:
                type: integer
                format: int64
            X-Unread-Count:
              description: 계정의 안읽음 전수 — 목록 필터와 무관하다.
              required: true
              schema:
                type: integer
                format: int64
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationItem"
        "400":
          description: "질의 형식·범위 오류(어느 입력이 틀렸는지 싣지 않는다). code: INVALID_REQUEST"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: >-
            인증 실패 또는 **계정 주체 없음**(자격 헤더 경로) — 구분하지 않는다. code: UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: "내부 오류 또는 감사 기록 실패. code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/notifications/read:
    post:
      operationId: markNotificationRead
      summary: 알림 하나를 읽음으로(M7/7C③)
      description: >-
        항목의 신원은 **종류와 공고 쌍**이다(합성 id 가 없다 — 호출자가 목록에서 이미 본 값이고,
        열거할 불투명 id 가 없다). 계정은 **본문에서 받지 않는다**: 세션이 낸다.

        **멱등이다.** 이미 읽은 항목에 다시 쏘면 `markedCount` 가 0 이고 처음 읽은 시각이 그대로
        남는다. 항목이 없거나 **남의 항목**이어도 같은 0 이다 — 그 셋을 구분하지 않는다(남의
        항목의 존재 여부를 알리지 않는 것이 목적이다).

        읽은 시각은 **서버가 정한다**(본문에 시각 칸이 없다). 상태를 바꾸는 메서드라 세션 경로
        에서 CSRF 헤더를 요구한다. 계정 전용이므로 자격 헤더로 오면 401 이다.
      security:
        - browserSession: []
          operatorCsrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkNotificationReadRequest"
      responses:
        "200":
          description: 처리 결과 — 바뀐 항목 수와 처리 뒤 안읽음 전수
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkNotificationReadResponse"
        "400":
          description: >-
            본문 형식 오류 — 알려진 키 밖, 종류 어휘 밖, 공고 키 형식 위반. code: INVALID_REQUEST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: >-
            인증 실패 · CSRF 불일치 · **계정 주체 없음** — 구분하지 않는다. code: UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "415":
          description: "지원하지 않는 미디어 타입. code: UNSUPPORTED_MEDIA_TYPE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: "내부 오류 또는 감사 기록 실패. code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/notifications/read-notice:
    post:
      operationId: markNoticeNotificationsRead
      summary: 한 공고의 알림 묶음 전체를 읽음으로(M7/7C③)
      description: >-
        그 공고의 **안읽음 항목 전부**를 읽음으로 바꾼다. 이미 읽은 항목은 세지 않으므로
        `markedCount` 가 그 묶음의 안읽음이었던 수다. 다른 공고의 항목은 바뀌지 않는다.

        단건 경로와 **갈라 둔다** — 한 operation 의 선택적 `kind` 가 뜻을 바꾸는 모양(있으면
        단건 · 없으면 묶음)은 조용히 잘못 맞는다. 그 밖의 규약(멱등 · 남의 것은 0 · 서버가 정하는
        시각 · CSRF · 계정 전용)은 단건 경로와 같다.
      security:
        - browserSession: []
          operatorCsrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkNoticeNotificationsReadRequest"
      responses:
        "200":
          description: 처리 결과 — 바뀐 항목 수와 처리 뒤 안읽음 전수
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkNotificationReadResponse"
        "400":
          description: "본문 형식 오류 — 알려진 키 밖, 공고 키 형식 위반. code: INVALID_REQUEST"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: >-
            인증 실패 · CSRF 불일치 · **계정 주체 없음** — 구분하지 않는다. code: UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "415":
          description: "지원하지 않는 미디어 타입. code: UNSUPPORTED_MEDIA_TYPE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: "내부 오류 또는 감사 기록 실패. code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/profile:
    get:
      operationId: readProfile
      summary: 운영자 프로필 한 벌 — 자격 사실 · 사업 정보 · 판정 대기 축(M7/7C④)
      description: >-
        **평탄하다**(D-6A1-20 ⓑ) — 시평액 목록은 이 응답에 없고
        `/api/profile/construction-capacities` 의 최상위 배열로 나간다.


        면허의 **세 상태**가 응답에서 구별된다: `qualificationDeclared=false` 가 「미설정」(V12 행
        없음), `true`+`licensesDeclared=false` 가 「미신고」, 둘 다 `true` 가 「신고」다(빈 목록도 답이다).
        세 상태를 두 상태로 접지 않는다.
      security:
        - browserSession: []
      responses:
        "200":
          description: 프로필 한 벌(미설정 필드는 null · 지어낸 기본값 없음)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: "인증 실패 또는 **계정 주체가 아닌 인증**(프로필은 계정 경로 전용이다). 사유를 나누지 않는다(D-6A1-6). code: UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: "내부 오류 또는 감사 기록 실패(D-6A1-17, fail-closed). code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/profile/qualification-facts:
    post:
      operationId: replaceQualificationFacts
      summary: 자격 사실(업종 · 면허 · 지역어) 절 교체(M7/7C④)
      description: >-
        **이 operation 은 계정 경계 밖이다** — 어느 계정의 세션이 쓰든 **모든 계정이 보는** 자격 사실을
        바꾼다. V12 는 아직 싱글턴이고(계정 단위 전환은 R-2 남은 절반) 이 쓰기는 그 한 행을 덮는다.
        경로는 계정 범위라 세션 주체가 없으면 401 이고, 요청에 `accountId` 자리는 없다 — 그러나 그 둘이
        소유 경계를 만들지는 않는다.


        다른 operation 넷(사업 정보 · 시평액)은 계정 소유다.
      security:
        - browserSession: []
          operatorCsrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QualificationFactsRequest"
      responses:
        "200":
          description: 교체 뒤 다시 읽은 프로필
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: "요청 본문 형식 오류(알 수 없는 키 포함). code: INVALID_REQUEST"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: "인증 실패 또는 계정 주체가 아닌 인증. code: UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "415":
          description: "요청 본문이 application/json 이 아니다. code: UNSUPPORTED_MEDIA_TYPE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: "내부 오류 또는 감사 기록 실패(D-6A1-17, fail-closed). code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/profile/business-details:
    post:
      operationId: replaceBusinessDetails
      summary: 사업 정보(상호 · 본사 소재지 · 나라장터 준비) 절 교체(M7/7C④)
      description: >-
        절을 **통째로** 교체한다 — 부분 갱신이 다른 필드를 지우는 모양을 계약에서 없앤다.
        상호는 **입력 원문 그대로** 저장된다(앞뒤 공백도 자르지 않는다 — 정규화는 대사 시점의 커널이
        한 번만 한다).


        `naraRegistration` 이 `REGISTERED` 가 아니면 `naraRegisteredFields` ·
        `businessCertificateExpiresOn` 을 실을 수 없다(400) — 받아 두고 버리지 않는다.


        사업자번호 · 대표자명 · 인증서 원문은 **자리가 없다**(표에 열이 없다).
      security:
        - browserSession: []
          operatorCsrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessDetailsRequest"
      responses:
        "200":
          description: 교체 뒤 다시 읽은 프로필
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: "요청 본문 형식 오류(알 수 없는 키 · 어휘 밖 값 · 상태와 모순되는 필드) 또는 저장 층의 제약 거부. 어느 값이 틀렸는지는 싣지 않는다. code: INVALID_REQUEST"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: "인증 실패 또는 계정 주체가 아닌 인증. code: UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "415":
          description: "요청 본문이 application/json 이 아니다. code: UNSUPPORTED_MEDIA_TYPE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: "내부 오류 또는 감사 기록 실패(D-6A1-17, fail-closed). code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/profile/construction-capacities:
    get:
      operationId: listConstructionCapacities
      summary: 면허별 시공능력평가액 목록(M7/7C④)
      description: >-
        **맨 위가 배열**이다 — 배열을 감싼 object 는 평탄 규칙(D-6A1-20 ⓑ)에 걸린다. 면허명 순이다.
      security:
        - browserSession: []
      responses:
