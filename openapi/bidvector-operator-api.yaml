    get:
      operationId: unmatchedPath
      summary: 미매핑 경로 — 계약 문서화 목적(D-6A1-21, 실제로는 어떤 controller도 이 경로를 다루지 않는다)
      responses:
        "404":
          description: "등록된 endpoint가 없음. code: NOT_FOUND"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
components:
  parameters:
    # M7/7B — 건 식별자. 숫자가 아니거나 0 이하면 400 이다(`IllegalArgumentException` 이
    # 500 으로 새지 않게 형식 오류로 옮긴다, D-6A2b-7 과 같은 관례).
    BidCaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    operatorCredential:
      type: apiKey
      in: header
      name: X-Operator-Credential
    # M7/7D — 브라우저 경로. 쿠키는 `HttpOnly` 라 화면 스크립트가 읽지 않는다(브라우저가 싣는다).
    # 이름의 `__Host-` 접두는 브라우저가 `Secure`·`Path=/`·`Domain` 없음을 **강제**하게 해서
    # 하위·형제 도메인이 같은 이름을 덮어쓰지 못하게 한다(쿠키 그림자 방어). 접두는 `Secure` 와
    # 한 몸이라 **로컬 http 개발 실행에서만** 접두 없는 `bidvector_session` 을 쓴다 — 운영 반입은
    # 접두 이름이 정본이고 이 문서는 그것을 적는다.
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-bidvector_session
    # 상태를 바꾸는 메서드에서 **세션 경로와 함께** 요구된다(읽기 메서드는 면제).
    operatorCsrf:
      type: apiKey
      in: header
      name: X-Operator-Csrf
  schemas:
    # =========================================================================
    # M7/7B — 입찰 건(`BID-01`). 전부 **평탄하다**(중첩 object 속성 없음, D-6A1-20 ⓑ).
    #
    # 요청 스키마에 **없는** 것이 이 계약의 절반이다:
    #  · provenance · chosenOptionRef — 금액 출처는 서버가 싣는다(메뉴 값 위장 금지)
    #  · retroactive — 소급은 출발 상태가 정한다(Q-11)
    #  · evidenceRetainUntil — 보관 기한은 정책이 정한다(R-5 3년)
    #  · 공고 스냅샷 — 서버가 공고에서 뜬다(초안 스냅샷 변조 차단)
    #  · caseVersion · accountId — 서버가 쥔다
    # =========================================================================
    BidCase:
      type: object
      required:
        - caseId
        - noticeNumber
        - noticeRound
        - bidKind
        - state
        - caseVersion
        - nextCheckpointKind
        - overdue
        - reconciliationCandidate
      properties:
        caseId:
          type: integer
          format: int64
        noticeNumber:
          type: string
        noticeRound:
          type: string
        bidKind:
          type: string
          enum: [REAL, PAPER]
        state:
          type: string
          enum: [WATCHING, DEFERRED, PRICE_RECEIVED, BID_PLANNED, BID_RECORDED, AWAITING_OPENING, OPENED_PROVISIONAL_FIRST, OPENED_OUT_OF_RANK, UNDER_QUALIFICATION_REVIEW, WON, LOST, FAILED_OR_REBID, SKIPPED, DEADLINE_PASSED_UNRECORDED]
          description: >-
            「보류」는 **어휘에 없다** — 「나중에(DEFERRED)」와 「건너뜀(SKIPPED)」으로 갈렸다.
        caseVersion:
          type: integer
        nextCheckpointKind:
          type: string
          enum: [DEADLINE, OPENING, DOCUMENT_DUE, NOTICE_EXPECTED, REMINDER, NONE]
          description: >-
            **항상 값이 있다.** 「없음」은 빈 값이 아니라 `NONE` 이라는 **답**이다(§6.1
            「없으면 「없음」이 명시된다 — 빈 값 금지」). 시각 하나로 접으면 화면이 「아직 안
            정했다」와 「없는 것이 맞다」를 구별할 수 없다.
        nextCheckpointAt:
          type: string
          format: date-time
          nullable: true
          description: "`nextCheckpointKind` 가 `NONE` 이면 null 이다."
        overdue:
          type: boolean
          description: 지난 일정 경고 — **서버가 한 시각 기준으로** 판정한다.
        reconciliationCandidate:
          type: boolean
          description: >-
            개찰 대사(SET-02)의 후보인가 — 「투찰 기록됨」 **실투찰** 건만 참이다.
            페이퍼 건은 항상 거짓이다(타입이 막는다).
    BidTimelineEntry:
      type: object
      required:
        - caseVersion
        - toState
        - command
        - actorKind
        - retroactive
        - occurredAt
      properties:
        caseVersion:
          type: integer
        fromState:
          type: string
          nullable: true
          description: 생성 전이만 null 이다(출발 상태가 없다).
        toState:
          type: string
        command:
          type: string
        actorKind:
          type: string
          enum: [USER, SYSTEM]
        actorDetail:
          type: string
          nullable: true
          description: >-
            SYSTEM 일 때만 값이 있고 **경로의 이름**이다(사람의 이름이 아니다). USER 의 주체는
            건의 소유 계정이다.
        reason:
          type: string
          nullable: true
          description: 건너뜀·정정만 값을 갖는다. **메모 본문이 들어오는 자리가 아니다.**
        retroactive:
          type: boolean
        occurredAt:
          type: string
          format: date-time
    AddBidCaseRequest:
      type: object
      required:
        - noticeNumber
        - noticeRound
        - bidKind
      properties:
        noticeNumber:
          type: string
        noticeRound:
          type: string
        bidKind:
          type: string
          enum: [REAL, PAPER]
    DeferRequest:
      type: object
      required:
        - remindAt
      properties:
        remindAt:
          type: string
          format: date-time
    SkipRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          maxLength: 500
          description: 건너뜀 사유 — 지울 수 없는 타임라인에 남는다(500자 상한).
    DraftBidRequest:
      type: object
      required:
        - amountWon
        - vatTreatment
        - presentedAt
      properties:
        amountWon:
          type: integer
          format: int64
          description: 원 단위 정수.
        vatTreatment:
          type: string
          enum: [INCLUSIVE, EXCLUSIVE, UNKNOWN]
        presentedAt:
          type: string
          format: date-time
          description: >-
            제시 시각 — 기록의 확인 시각과 다른 축이다. 공고 스냅샷은 요청에 자리가 없다 — 서버가
            초안을 만드는 순간의 공고에서 뜬다.
    RecordBidRequest:
      type: object
      required:
        - amountWon
        - vatTreatment
        - submittedAt
      properties:
        amountWon:
          type: integer
          format: int64
        vatTreatment:
          type: string
          enum: [INCLUSIVE, EXCLUSIVE, UNKNOWN]
        submittedAt:
          type: string
          format: date-time
          description: 운영자가 나라장터에 낸 시각(진술). 확인 시각은 서버가 찍는다.
        drawNumbers:
          type: array
          items:
            type: integer
        evidenceRef:
          type: string
          nullable: true
          maxLength: 128
          description: >-
            제출확인서 등 증빙의 **참조(식별자)** 다 — 파일도 경로도 본문도 아니다.
            PDF 저장소는 이 slice 밖이다.
        memo:
          type: string
          nullable: true
          maxLength: 2000
          description: 자유 텍스트(2000자 상한). 로그·audit 어디에도 실리지 않는다.
    AwaitOpeningRequest:
      type: object
      required:
        - openingAt
      properties:
        openingAt:
          type: string
          format: date-time
    RecordOpeningRequest:
      type: object
      required:
        - provisionalFirst
      properties:
        provisionalFirst:
          type: boolean
          description: 순위 숫자를 받지 않는다 — 「몇 위보다 낙찰 여부」(§6.1).
    QualificationReviewRequest:
      type: object
      required:
        - documentDueAt
      properties:
        documentDueAt:
          type: string
          format: date-time
    RecordOutcomeRequest:
      type: object
      required:
        - outcome
      properties:
        outcome:
          type: string
          enum: [WON, LOST, FAILED_OR_REBID]
    CorrectOutcomeRequest:
      type: object
      required:
        - outcome
        - reason
      properties:
        outcome:
          type: string
          enum: [WON, LOST, FAILED_OR_REBID]
        reason:
          type: string
          maxLength: 500
          description: 정정은 **사유가 필수**다 — 원본은 타임라인에 남는다(500자 상한).
    # M7/7D — 로그인 요청. 두 키뿐이고 알려진 키 밖은 400 이다(D-6A2b-25 와 같은 규율).
    SignInRequest:
      type: object
      required:
        - loginName
        - passphrase
      properties:
        loginName:
          type: string
        passphrase:
          type: string
    # M7/7D — 세션 응답. 평탄하다(중첩 object 속성 없음). `csrf` 는 세션 값에서 유도된 값이고
    # `expiresAt` 는 **절대 만료** 시각이다(유휴 만료는 서버가 민다 — 화면이 알 필요가 없다).
    SessionResponse:
      type: object
      required:
        - csrf
        - expiresAt
      properties:
        csrf:
          type: string
        expiresAt:
          type: string
          format: date-time
    # D-6A1-20 ⓑ — 평탄하다는 것을 이 스키마 자신이 단언한다: 모든 속성이 string·integer·
    # number·array<string> 중 하나이고 중첩 object 속성이 없다(`OpenApiContractTest`가
    # 이 문서에서 object 타입 속성이 새로 생기면 실패하도록 재확인한다).
    StrategyReadResponse:
      type: object
      required:
        - revision
        - focusCategories
        - focusRegionTerms
        - excludeRegionTerms
        - requiredKeywordTerms
        - excludeKeywordTerms
      properties:
        revision:
          type: integer
        focusCategories:
          type: array
          items:
            type: string
        focusRegionTerms:
          type: array
          items:
            type: string
        excludeRegionTerms:
          type: array
          items:
            type: string
        requiredKeywordTerms:
          type: array
          items:
            type: string
        excludeKeywordTerms:
          type: array
          items:
            type: string
        minBudgetWon:
          type: integer
          format: int64
          nullable: true
        minBudgetCurrency:
          type: string
          nullable: true
        minBudgetVatTreatment:
          type: string
          nullable: true
        minBudgetProvenance:
          type: string
          nullable: true
        maxBudgetWon:
          type: integer
          format: int64
          nullable: true
        maxBudgetCurrency:
          type: string
          nullable: true
        maxBudgetVatTreatment:
          type: string
          nullable: true
        maxBudgetProvenance:
          type: string
          nullable: true
        minimumMatchScore:
          type: number
          nullable: true
        minimumProbabilityScore:
          type: number
          nullable: true
        bidNowThreshold:
          type: number
          nullable: true
        reviewThreshold:
          type: number
          nullable: true
        candidateLimit:
          type: integer
          nullable: true
        maxActiveBids:
          type: integer
          nullable: true
    EvaluationDryRunRequest:
      type: object
      required:
        - currentActiveBids
      properties:
        currentActiveBids:
          type: integer
          format: int32
          minimum: 0
    # D-6A3-6 — 평탄하다. 결과별 공고 ID 배열 + 건수만 싣는다(후보별 사유 상세는
    # OPEN-6A3-EVALUATION-DETAIL). 공고명·기관명 원문은 없다(privacy).
    EvaluationDryRunResponse:
      type: object
      required:
        - strategyRevision
        - candidateCount
        - currentActiveBids
        - maxActiveBids
        - bidNowNoticeIds
        - reviewNoticeIds
        - skipNoticeIds
        - notReachedNoticeIds
        - wouldNotifyNoticeIds
      properties:
        strategyRevision:
          type: integer
        candidateCount:
          type: integer
        currentActiveBids:
          type: integer
        maxActiveBids:
          type: integer
        bidNowNoticeIds:
          type: array
          items:
            type: string
        reviewNoticeIds:
          type: array
          items:
            type: string
        skipNoticeIds:
          type: array
          items:
            type: string
        notReachedNoticeIds:
          type: array
          items:
            type: string
        wouldNotifyNoticeIds:
          type: array
          items:
            type: string
    # D-6A3-20(검토 라운드 1 contract-keeper V2) — code 는 ErrorMapping.forThrowable 이 낼 수
    # 있는 전 코드의 열거다. `OpenApiContractTest`가 app.http.ErrorCode 의 상수 집합과 이
    # 목록을 양방향(부분집합 아니라 등식)으로 대조한다 — 한쪽에만 코드를 더하면 RED.
    # `type: string` + `enum` 은 D-6A1-38 평탄 술어의 NON_FLAT_KEYS 밖이라 게이트는 그대로
    # 초록이다.
    # M6/6A-2b D-6A2b-1 — 편집 요청·응답 다섯. 전부 평탄하다(D-6A1-20 ⓑ). `field` 의 enum 은
    # 구현의 필드 어휘 전수와 **집합 등식**으로 대조된다(`OpenApiEditSessionContractTest`) —
    # 새 필드를 코드에만 더하거나 문서에만 더하면 RED 다.
    EditSessionBeginRequest:
      type: object
      required:
        - field
      properties:
        field:
          type: string
          enum:
            - FOCUS_CATEGORY
            - FOCUS_REGION
            - EXCLUDE_REGION
            - REQUIRED_KEYWORD
            - EXCLUDE_KEYWORD
            - MIN_BUDGET
            - MAX_BUDGET
            - MINIMUM_MATCH_SCORE
            - MINIMUM_PROBABILITY_SCORE
            - BID_NOW_THRESHOLD
            - REVIEW_THRESHOLD
            - CANDIDATE_LIMIT
            - MAX_ACTIVE_BIDS
    # 값 칸 넷 가운데 `field` 가 이름하는 하나만 싣는다 — 다른 칸이 함께 오면 400 이다
    # (조용히 무시하지 않는다). 칸 배정: 업종·지역·키워드 다섯 → terms, 예산 둘 → amountWon,
    # 임계 넷 → number, 후보 상한·여력 상한 → count.
    # L-3 — 「`field` 가 이름하는 칸 **하나**가 필수」는 이 스키마 형태로 표현할 수 없다
    # (`oneOf` 는 평탄 게이트에 걸린다). 구현은 엄격하게 강제한다: 그 칸이 없으면 400 이고,
    # 다른 칸이 함께 오거나 알려진 키 밖이 오면 역시 400 이다. 칸 배정은 위 `field` enum 순서와
    # 같다 — 업종·지역·키워드 다섯은 `terms`, 예산 둘은 `amountWon`, 임계 넷은 `number`,
    # 후보 상한·여력 상한은 `count`.
    EditSessionValueRequest:
      type: object
      required:
        - commandId
        - field
      properties:
        commandId:
          type: string
        field:
          type: string
          enum:
            - FOCUS_CATEGORY
            - FOCUS_REGION
            - EXCLUDE_REGION
            - REQUIRED_KEYWORD
            - EXCLUDE_KEYWORD
            - MIN_BUDGET
            - MAX_BUDGET
            - MINIMUM_MATCH_SCORE
            - MINIMUM_PROBABILITY_SCORE
            - BID_NOW_THRESHOLD
            - REVIEW_THRESHOLD
            - CANDIDATE_LIMIT
            - MAX_ACTIVE_BIDS
        terms:
          type: array
          items:
            type: string
        amountWon:
          type: integer
          format: int64
          minimum: 0
        number:
          type: number
        count:
          type: integer
          format: int32
    EditSessionConfirmRequest:
      type: object
      required:
        - commandId
        - seenRevision
      properties:
        commandId:
          type: string
        seenRevision:
          type: integer
          format: int32
          minimum: 0
    EditSessionEditRequest:
      type: object
      required:
        - commandId
        - field
      properties:
        commandId:
          type: string
        field:
          type: string
          enum:
            - FOCUS_CATEGORY
            - FOCUS_REGION
            - EXCLUDE_REGION
            - REQUIRED_KEYWORD
            - EXCLUDE_KEYWORD
            - MIN_BUDGET
            - MAX_BUDGET
            - MINIMUM_MATCH_SCORE
            - MINIMUM_PROBABILITY_SCORE
            - BID_NOW_THRESHOLD
            - REVIEW_THRESHOLD
            - CANDIDATE_LIMIT
            - MAX_ACTIVE_BIDS
    EditSessionCancelRequest:
      type: object
      required:
        - commandId
      properties:
        commandId:
          type: string
    # 초안(draft) 전체는 싣지 않는다 — 확인 중인 값은 방금 보낸 값이고 현재 전략은
    # `GET /api/strategy` 가 낸다.
    EditSessionResponse:
      type: object
      required:
        - sessionId
        - state
        - sessionVersion
        - expiresAt
      properties:
        sessionId:
          type: string
        state:
          type: string
          enum:
            - WAITING_FOR_VALUE
            - WAITING_FOR_CONFIRMATION
            - APPLIED
            - CANCELLED
            - EXPIRED
        field:
          type: string
          nullable: true
          # C-4 — 종단 상태에서 실제로 `null` 이 나간다. 엄격한 검증기가 그 값을 거부하지
          # 않도록 어휘에 함께 싣는다(대조 test 는 `null` 을 뺀 집합으로 등식을 잰다).
          enum:
            - null
            - FOCUS_CATEGORY
            - FOCUS_REGION
            - EXCLUDE_REGION
            - REQUIRED_KEYWORD
            - EXCLUDE_KEYWORD
            - MIN_BUDGET
            - MAX_BUDGET
            - MINIMUM_MATCH_SCORE
            - MINIMUM_PROBABILITY_SCORE
            - BID_NOW_THRESHOLD
            - REVIEW_THRESHOLD
            - CANDIDATE_LIMIT
            - MAX_ACTIVE_BIDS
        sessionVersion:
          type: integer
        expiresAt:
          type: string
          format: date-time
        strategyRevision:
          type: integer
          nullable: true
        baseRevision:
          type: integer
          nullable: true
    # M7/7C ① — 공고 요약 하나. **평탄하다**(D-6A1-20 ⓑ — 모든 속성이 스칼라다). 응답 본문이
    # 이 스키마의 **배열**인 이유는 목록 자체가 답이고(legacy `GET /projects/` 가 채택 가능으로
    # 남긴 계약 형태), 총수·빈 결과 사유는 헤더가 나르기 때문이다 — 평탄 술어를 넓히지 않는다.
    #
    # 금액은 값만 싣지 않고 **basis·통화·과세·provenance 와 함께** 싣는다(R-BASIS-06).
    # 원시 관측(`raw_observation`)·감사 행·개찰 축·투찰자 이름은 이 스키마에 없다 —
    # `OpenApiNoticeSearchContractTest` 가 키 집합 등식으로 그 사실을 잠근다.
    NoticeSummary:
      type: object
      required:
        - noticeNumber
        - noticeRound
        - status
      properties:
        noticeNumber:
          type: string
        noticeRound:
          type: string
        status:
          type: string
        title:
          type: string
          nullable: true
        demandAgencyName:
          type: string
          nullable: true
        noticeAgencyName:
          type: string
          nullable: true
        baseAmountWon:
          type: integer
          format: int64
          nullable: true
        baseAmountCurrency:
          type: string
          nullable: true
        baseAmountBasis:
          type: string
          nullable: true
        baseAmountVatTreatment:
          type: string
          nullable: true
        baseAmountProvenance:
          type: string
          nullable: true
        deadlineAt:
          type: string
          format: date-time
          nullable: true
    # M7/7C①b — 제안 하나. `NoticeSummary` 의 속성을 **같은 정의로** 갖고(`$ref`·`allOf` 는 평탄 계약
    # D-6A1-38 이 거부한다 — 같음은 `OpenApiSuggestionContractTest` 의 정의 등식이 잰다) 면허 축 판정을 더한다.
    SuggestedNotice:
      type: object
      required:
        - noticeNumber
        - noticeRound
        - status
        - licenseVerdict
        - unjudgedAxes
      properties:
        noticeNumber:
          type: string
        noticeRound:
          type: string
        status:
          type: string
        title:
          type: string
          nullable: true
        demandAgencyName:
          type: string
          nullable: true
        noticeAgencyName:
          type: string
          nullable: true
        baseAmountWon:
          type: integer
          format: int64
          nullable: true
        baseAmountCurrency:
          type: string
          nullable: true
        baseAmountBasis:
          type: string
          nullable: true
        baseAmountVatTreatment:
          type: string
          nullable: true
        baseAmountProvenance:
          type: string
          nullable: true
        deadlineAt:
          type: string
          format: date-time
          nullable: true
        licenseVerdict:
          type: string
          enum:
            - ELIGIBLE
            - UNCERTAIN
        licenseUncertainReason:
          type: string
          nullable: true
          # C-4 와 같은 관례 — `ELIGIBLE` 카드에서 실제로 `null` 이 나간다. OpenAPI 3.0 에서 nullable 과
          # enum 을 함께 쓰면 enum 에 `null` 이 있어야 그 값이 유효하다(7C①b 수정 라운드 1, cr L-2).
          enum:
            - null
            - REQUIREMENT_DATA_ABSENT
            - REQUIREMENT_UNPARSABLE
            - OPERATOR_LICENSES_NOT_DECLARED
            - COLLECTION_FAILED
            - PERMITTED_INDUSTRY_COMBINATION_RULE_UNDECIDED
        unjudgedAxes:
          type: array
          items:
            type: string
            enum:
              - QUAL_08_REGION
              - QUAL_11_CONSTRUCTION_CAPACITY
    # =========================================================================
    # M7/7C④ — 운영자 프로필. 전부 **평탄하다**(중첩 object 속성 없음, D-6A1-20 ⓑ).
    #
    # 요청 · 응답 어디에도 **없는** 것이 이 계약의 절반이다:
    #  · accountId — 주체는 인증 필터가 적은 값에서만 온다(요청 바인딩은 AccountId 를 짓지 못한다)
    #  · updatedAt — 시각은 서버 시계가 싣는다
    #  · 사업자번호 · 대표자명 · 인증서 원문 — 표에 열이 없다
    #  · 체크리스트 진행 상태 — 저장하지 않는다(서버가 매번 판정한다. 그 operation 은 7C② 뒤에 선다)
    # =========================================================================
    Profile:
      type: object
      required:
        - qualificationDeclared
        - businessTypes
        - licensesDeclared
        - licenseNames
        - regionTerms
        - naraRegistration
        - naraRegisteredFields
        - unjudgedAxes
      properties:
        qualificationDeclared:
          type: boolean
          description: >-
            V12 자격 사실 행이 있는가. `false` 면 「프로필 미설정」이고, 그때의 빈 목록은
            **신고된 빈 값이 아니다**.
        businessTypes:
          type: array
          items:
            type: string
        licensesDeclared:
          type: boolean
          description: >-
            면허를 **신고했는가**. `qualificationDeclared` 와 짝으로 세 상태를 가른다
            (미설정 · 미신고 · 신고). 신고했고 면허가 없으면 `true` + 빈 `licenseNames` 다.
        licenseNames:
          type: array
          items:
            type: string
        regionTerms:
          type: array
          items:
            type: string
          description: V12 의 자유 어휘(텍스트 합성용). `headquartersRegion`(구조화 입력)과 다른 축이다.
        tradeName:
          type: string
          nullable: true
          maxLength: 100
          description: >-
            입력 원문 그대로(앞뒤 공백 포함). null 은 「미설정」이다. 길이는 **코드포인트 수**로 센다
            (`maxLength` 는 그 근사다 — 서버는 코드포인트로 거부한다).
        headquartersRegion:
          type: string
          nullable: true
          enum: [SEOUL, BUSAN, DAEGU, INCHEON, GWANGJU, DAEJEON, ULSAN, SEJONG, GYEONGGI, GANGWON, CHUNGBUK, CHUNGNAM, JEONBUK, JEONNAM, GYEONGBUK, GYEONGNAM, JEJU]
        naraRegistration:
          type: string
          enum: [UNANSWERED, REGISTERED, NOT_REGISTERED]
          description: >-
            **「미응답」이 값이다** — null 이나 「미등록」으로 접지 않는다(화면의 경고가 다르다).
        naraRegisteredFields:
          type: array
          items:
            type: string
            enum: [GOODS, SERVICE, CONSTRUCTION]
        businessCertificateExpiresOn:
          type: string
          format: date
          nullable: true
          description: 사업자용(전자서명) 인증서 만료일. 등록 상태에서만 값이 있을 수 있다.
        unjudgedAxes:
          type: array
          items:
            type: string
            enum: [QUAL_08_REGION, QUAL_10_PERFORMANCE, QUAL_11_CONSTRUCTION_CAPACITY]
          description: >-
            **아직 판정하지 않는 자격 축**(M7 완료 조건 G2). 입력이 있든 없든 V2 에 판정이 없는 축이고,
            화면은 이 목록에서 「아직 판정하지 않음」을 그린다(클라이언트가 추론하지 않는다).
    ConstructionCapacity:
      type: object
      required:
        - licenseName
        - amountWon
        - assessmentYear
      properties:
        licenseName:
          type: string
          minLength: 1
          maxLength: 100
        amountWon:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000000
          description: 원 단위 정수. 0 을 받지 않는다(「모름」의 기본값으로 흘러들기 쉬운 값이다).
        assessmentYear:
          type: integer
          minimum: 2000
          maximum: 2100
          description: 어느 해 평가액인지는 **필수**다(연 1회 갱신되는 값이라 기준 해가 없으면 해석이 갈린다).
    QualificationFactsRequest:
      type: object
      required:
        - businessTypes
        - licensesDeclared
        - licenseNames
        - regionTerms
      description: >-
        세 배열 모두 **원소가 공백뿐일 수 없고**(400), 원소 길이 · 배열 크기에 상한이 있으며 **중복을
        받지 않는다**. V12 에는 이 축의 표 제약이 없어 경계가 요청 판독에만 있다.
      properties:
        businessTypes:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 100
        licensesDeclared:
          type: boolean
        licenseNames:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 100
          description: "`licensesDeclared` 가 거짓이면 비어 있어야 한다(아니면 400)."
        regionTerms:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 100
    BusinessDetailsRequest:
      type: object
      required:
        - naraRegistration
      properties:
        tradeName:
          type: string
          nullable: true
          maxLength: 100
          description: >-
            **공백뿐인 값은 400 이다** — 「미설정」은 키를 빼거나 `null` 이다(절 단위 교체라 공백이
            조용히 「지우기」가 되지 않게 한다).
        headquartersRegion:
          type: string
          nullable: true
          enum: [SEOUL, BUSAN, DAEGU, INCHEON, GWANGJU, DAEJEON, ULSAN, SEJONG, GYEONGGI, GANGWON, CHUNGBUK, CHUNGNAM, JEONBUK, JEONNAM, GYEONGBUK, GYEONGNAM, JEJU]
        naraRegistration:
          type: string
          enum: [UNANSWERED, REGISTERED, NOT_REGISTERED]
        naraRegisteredFields:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [GOODS, SERVICE, CONSTRUCTION]
          description: "`naraRegistration` 이 `REGISTERED` 일 때만 실을 수 있고, 그때는 **필수**다(빈 배열 가능). 중복은 400 이다."
        businessCertificateExpiresOn:
          type: string
          format: date
          nullable: true
          description: "`naraRegistration` 이 `REGISTERED` 일 때만 실을 수 있다."
    ConstructionCapacityRequest:
      type: object
      required:
        - licenseName
        - amountWon
        - assessmentYear
      properties:
        licenseName:
          type: string
          minLength: 1
          maxLength: 100
        amountWon:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000000
        assessmentYear:
          type: integer
          minimum: 2000
          maximum: 2100
    RemoveConstructionCapacityRequest:
      type: object
      required:
        - licenseName
      properties:
        licenseName:
          type: string
          minLength: 1
          maxLength: 100
    ErrorBody:
      type: object
      required:
        - code
        - message
        - correlationId
      properties:
        code:
          type: string
          enum:
            - UNAUTHENTICATED
            - NOT_FOUND
            - INVALID_STORED_STRATEGY
            - INTERNAL_ERROR
            - MAX_ACTIVE_BIDS_NOT_CONFIGURED
            - CANDIDATE_CAP_EXCEEDED
            - INVALID_REQUEST
            - STRATEGY_CHANGED_DURING_COMPUTATION
            - SESSION_NOT_FOUND
            - SESSION_EXPIRED
            - IDEMPOTENCY_CONFLICT
            - ACTOR_MISMATCH
            - SYSTEM_ACTOR_NOT_PERMITTED
            - STALE_REVISION
            - INVALID_TRANSITION
            - SESSION_ALREADY_ACTIVE
            - EDIT_SESSION_CONFLICT
            - STRATEGY_VALUE_INVALID
            - METHOD_NOT_ALLOWED
            - UNSUPPORTED_MEDIA_TYPE
            - NOTICE_SNAPSHOT_UNAVAILABLE
            - CAPACITY_ROWS_EXCEEDED
        message:
          type: string
        correlationId:
          type: string
