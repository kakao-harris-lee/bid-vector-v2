  /api/session:
    post:
      operationId: signIn
      summary: 로그인 — 세션 쿠키 발급(M7/7D)
      description: >-
        **무인증으로 열리는 유일한 operation 이다**(기본 거부 필터의 허용 목록 하나). 성공하면
        `Set-Cookie` 로 `__Host-bidvector_session`(HttpOnly·Secure·SameSite=Strict·Path=/·Domain 없음)을 내고, 본문으로
        CSRF 값을 준다 — 그 값은 세션 값에서 단방향으로 유도된 것이라 새어도 세션이 되지 않는다.
        로그인은 **늘 새 값을 발급하고 그 계정의 기존 세션을 폐기한다**(세션 고정 방어).
        로그인 CSRF 대책은 둘이다: 이 operation 은 `application/json` 만 받으므로 교차 사이트
        HTML form 이 닿지 못하고(preflight 없는 form 은 그 Content-Type 을 쓸 수 없다),
        발급 쿠키가 `SameSite=Strict` 다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "201":
          description: 세션 발급
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: "요청 본문 형식 오류(알 수 없는 키·빈 값 포함). code: INVALID_REQUEST"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: >-
            로그인 실패 — 계정 부재·비밀 문구 불일치·연속 실패 잠금을 **구분하지 않는다**(D-6A1-6).
            code: UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "415":
          description: "요청 본문이 application/json 이 아니다. code: UNSUPPORTED_MEDIA_TYPE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: "내부 오류 또는 감사 기록 실패(D-6A1-17, fail-closed). code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    get:
      operationId: readSession
      summary: 지금 내 세션 — CSRF 값 재전달(M7/7D)
      description: >-
        화면이 새로 뜰 때 CSRF 값을 다시 받는 자리다. 읽기 메서드라 CSRF 를 요구하지 않는다.
        쿠키가 없거나 세션이 살아 있지 않으면 404 다 — 이 요청은 이미 인증을 지났고(쿠키 또는
        운영자 자격 헤더), 없는 것은 자격이 아니라 **브라우저 세션이라는 자원**이다.
      responses:
        "200":
          description: 살아 있는 세션
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: "인증 실패(사유 구분 없음). code: UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: "브라우저 세션이 없다. code: NOT_FOUND"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: "내부 오류 또는 감사 기록 실패. code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    delete:
      operationId: signOut
      summary: 로그아웃 — 서버 쪽 세션 폐기(M7/7D)
      description: >-
        **서버 쪽 폐기가 본체**이고 쿠키 삭제가 뒤따른다(쿠키만 지우면 그 값으로 다시 통한다).
        상태를 바꾸는 메서드라 CSRF 헤더를 요구한다. 쿠키가 없는 요청(운영자 자격 헤더 경로)도
        같은 204 다 — 멱등이고 「세션이 있었는지」를 응답으로 알리지 않는다.
      security:
        - operatorCredential: []
        - browserSession: []
          operatorCsrf: []
      responses:
        "204":
          description: 폐기 완료(본문 없음)
        "401":
          description: >-
            인증 실패 — 쿠키 없음·폐기·만료·CSRF 불일치를 **구분하지 않는다**. code: UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: "내부 오류 또는 감사 기록 실패. code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/notices:
    get:
      operationId: searchNotices
      summary: 공고 검색(STR-16 검색 절반) — 읽기 전용, 마감 임박 순
      description: >-
        수집된 공고를 **감시 조건과 무관하게** 조회한다(M7/7C ①). 쓰기 경로가 없고 전략을
        바꾸지 않는다.

        **금액 범위의 basis 는 기초금액이다**(`amountMin`/`amountMax` — `Basis.BASE_AMOUNT`,
        원 단위, 부가세 **포함**(`INCLUSIVE`), 운영자 선언 provenance). 감시 경로의 예산
        한계값과 **같은 규약**이라 같은 쌍이 두 경로에서 같은 답을 낸다. 추정가격과 비교하지
        않는다. 금액 범위를 주면 **비교가 성립하는 기초금액을 가진 공고만** 남는다 — 금액이
        없거나 과세가 다르거나 provenance 가 선언되지 않은 공고는 결과에서 빠진다(0 으로
        간주하지 않는다). 금액 범위를 주지 않으면 그 공고들도 모두 나온다.

        **빈 결과의 두 뜻은 `X-Result-State` 가 가른다** — 수집된 공고가 아직 없는 것과
        조건이 좁은 것이 다른 값이다. 마지막 페이지 뒤를 물으면 본문은 비지만
        `X-Total-Count` 가 1 이상이고 상태는 `MATCHED` 다.

        `q`·`agency` 는 **리터럴 부분 일치**다(대소문자 무시). `%`·`_`·`!`·`\` 는 와일드카드도
        이스케이프도 아니라 그대로 찾을 글자다. 두 칸 모두 **제어 문자(U+0000 포함)를 거부**한다 — 양끝
        공백류는 먼저 걷어내므로 공백만인 질의는 조건이 아니다. **같은 매개변수를 두 번 보내면
        거부한다**(조용히 합치지 않는다). 정수 칸은 숫자와 선택적 `-` 만 받는다(앞뒤 공백·`+`
        부호 거부). 상한을 넘는 `size`·길이·역전된 범위·형식 오류는 조용히 절삭·변환하지 않고
        400 이다(어느 입력이 틀렸는지는 응답에 싣지 않는다).
      parameters:
        - name: q
          in: query
          required: false
          description: >-
            공고명·공고번호 부분 일치(리터럴, 대소문자 무시). 공백만이면 조건이 아니고 제어
            문자가 들어 있으면 400 이다.
          schema:
            type: string
            maxLength: 200
        - name: agency
          in: query
          required: false
          description: >-
            수요기관명·공고기관명 부분 일치(리터럴, 대소문자 무시). 제어 문자가 들어 있으면
            400 이다.
          schema:
            type: string
            maxLength: 200
        - name: amountMin
          in: query
          required: false
          description: 기초금액 하한(원, 이상). basis·과세·provenance 규약은 operation description.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: amountMax
          in: query
          required: false
          description: 기초금액 상한(원, 이하). `amountMin` 보다 작으면 400 이다.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: deadlineFrom
          in: query
          required: false
          description: 마감 하한(이상). 마감이 없는 공고는 이 조건이 있으면 빠진다.
          schema:
            type: string
            format: date-time
        - name: deadlineTo
          in: query
          required: false
          description: 마감 상한(이하). `deadlineFrom` 보다 앞서면 400 이다.
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          required: false
          description: 0 기반 페이지 번호.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: 페이지 크기. 상한을 넘으면 절삭이 아니라 400 이다.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: >-
            조건에 맞는 공고 요약 배열(마감 임박 순 — 마감 없는 공고는 뒤). 전체 건수는
            `X-Total-Count`, 빈 결과의 두 뜻은 `X-Result-State` 가 나른다.
          headers:
            X-Total-Count:
              description: 조건에 맞는 **전체** 건수(이 페이지의 길이가 아니다).
              required: true
              schema:
                type: integer
                format: int64
                minimum: 0
            X-Result-State:
              description: >-
                MATCHED(조건에 맞는 공고가 있다 — 이 페이지가 비어 있어도 전체 건수가 1
                이상) | NO_MATCH(수집된 공고는 있으나 조건에 맞는 것이 없다) |
                NOTHING_COLLECTED(수집된 공고가 아직 하나도 없다)
              required: true
              schema:
                type: string
                enum:
                  - MATCHED
                  - NO_MATCH
                  - NOTHING_COLLECTED
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NoticeSummary"
        "400":
          description: >-
            질의 값이 유효하지 않다 — 텍스트 길이 상한 초과, 텍스트의 제어 문자(U+0000 포함),
            정수·시각 형식 오류(정수 칸의 앞뒤 공백·`+` 부호 포함), 음수 금액, 역전된 금액·마감
            범위, 음수 `page`, 범위 밖 `size`, 같은 매개변수의 반복, **잘못된 퍼센트 인코딩**
            (`%` 뒤에 16진 두 자리가 없는 이스케이프 문법 오류와, UTF-8 로 디코딩되지 않는
            바이트열 — 어느 매개변수에서 나든 같다). 어느 입력이 틀렸는지는 싣지
            않는다(편집 경로의 `STRATEGY_VALUE_INVALID` 와 같은 관례).
            code: INVALID_REQUEST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: "자격증명 없음 또는 틀림(D-6A1-6). code: UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: >-
            내부 오류 또는 감사 기록 실패(D-6A1-17, fail-closed). code: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /{unmatched}:
    get:
      operationId: unmatchedPath
      summary: 미매핑 경로 — 계약 문서화 목적(D-6A1-21, 실제로는 어떤 controller도 이 경로를 다루지 않는다)
      responses:
        "404":
          description: "등록된 endpoint가 없음. code: NOT_FOUND"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
components:
  securitySchemes:
    operatorCredential:
      type: apiKey
      in: header
      name: X-Operator-Credential
    # M7/7D — 브라우저 경로. 쿠키는 `HttpOnly` 라 화면 스크립트가 읽지 않는다(브라우저가 싣는다).
    # 이름의 `__Host-` 접두는 브라우저가 `Secure`·`Path=/`·`Domain` 없음을 **강제**하게 해서
    # 하위·형제 도메인이 같은 이름을 덮어쓰지 못하게 한다(쿠키 그림자 방어). 접두는 `Secure` 와
    # 한 몸이라 **로컬 http 개발 실행에서만** 접두 없는 `bidvector_session` 을 쓴다 — 운영 반입은
    # 접두 이름이 정본이고 이 문서는 그것을 적는다.
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-bidvector_session
    # 상태를 바꾸는 메서드에서 **세션 경로와 함께** 요구된다(읽기 메서드는 면제).
    operatorCsrf:
      type: apiKey
      in: header
      name: X-Operator-Csrf
  schemas:
    # M7/7D — 로그인 요청. 두 키뿐이고 알려진 키 밖은 400 이다(D-6A2b-25 와 같은 규율).
    SignInRequest:
      type: object
      required:
        - loginName
        - passphrase
      properties:
        loginName:
          type: string
        passphrase:
          type: string
    # M7/7D — 세션 응답. 평탄하다(중첩 object 속성 없음). `csrf` 는 세션 값에서 유도된 값이고
    # `expiresAt` 는 **절대 만료** 시각이다(유휴 만료는 서버가 민다 — 화면이 알 필요가 없다).
    SessionResponse:
      type: object
      required:
        - csrf
        - expiresAt
      properties:
        csrf:
          type: string
        expiresAt:
          type: string
          format: date-time
    # D-6A1-20 ⓑ — 평탄하다는 것을 이 스키마 자신이 단언한다: 모든 속성이 string·integer·
    # number·array<string> 중 하나이고 중첩 object 속성이 없다(`OpenApiContractTest`가
    # 이 문서에서 object 타입 속성이 새로 생기면 실패하도록 재확인한다).
    StrategyReadResponse:
      type: object
      required:
        - revision
        - focusCategories
        - focusRegionTerms
        - excludeRegionTerms
        - requiredKeywordTerms
        - excludeKeywordTerms
      properties:
        revision:
          type: integer
        focusCategories:
          type: array
          items:
            type: string
        focusRegionTerms:
          type: array
          items:
            type: string
        excludeRegionTerms:
          type: array
          items:
            type: string
        requiredKeywordTerms:
          type: array
          items:
            type: string
        excludeKeywordTerms:
          type: array
          items:
            type: string
        minBudgetWon:
          type: integer
          format: int64
          nullable: true
        minBudgetCurrency:
          type: string
          nullable: true
        minBudgetVatTreatment:
          type: string
          nullable: true
        minBudgetProvenance:
          type: string
          nullable: true
        maxBudgetWon:
          type: integer
          format: int64
          nullable: true
        maxBudgetCurrency:
          type: string
          nullable: true
        maxBudgetVatTreatment:
          type: string
          nullable: true
        maxBudgetProvenance:
          type: string
          nullable: true
        minimumMatchScore:
          type: number
          nullable: true
        minimumProbabilityScore:
          type: number
          nullable: true
        bidNowThreshold:
          type: number
          nullable: true
        reviewThreshold:
          type: number
          nullable: true
        candidateLimit:
          type: integer
          nullable: true
        maxActiveBids:
          type: integer
          nullable: true
    EvaluationDryRunRequest:
      type: object
      required:
        - currentActiveBids
      properties:
        currentActiveBids:
          type: integer
          format: int32
          minimum: 0
    # D-6A3-6 — 평탄하다. 결과별 공고 ID 배열 + 건수만 싣는다(후보별 사유 상세는
    # OPEN-6A3-EVALUATION-DETAIL). 공고명·기관명 원문은 없다(privacy).
    EvaluationDryRunResponse:
      type: object
      required:
        - strategyRevision
        - candidateCount
        - currentActiveBids
        - maxActiveBids
        - bidNowNoticeIds
        - reviewNoticeIds
        - skipNoticeIds
        - notReachedNoticeIds
        - wouldNotifyNoticeIds
      properties:
        strategyRevision:
          type: integer
        candidateCount:
          type: integer
        currentActiveBids:
          type: integer
        maxActiveBids:
          type: integer
        bidNowNoticeIds:
          type: array
          items:
            type: string
        reviewNoticeIds:
          type: array
          items:
            type: string
        skipNoticeIds:
          type: array
          items:
            type: string
        notReachedNoticeIds:
          type: array
          items:
            type: string
        wouldNotifyNoticeIds:
          type: array
          items:
            type: string
    # D-6A3-20(검토 라운드 1 contract-keeper V2) — code 는 ErrorMapping.forThrowable 이 낼 수
    # 있는 전 코드의 열거다. `OpenApiContractTest`가 app.http.ErrorCode 의 상수 집합과 이
    # 목록을 양방향(부분집합 아니라 등식)으로 대조한다 — 한쪽에만 코드를 더하면 RED.
    # `type: string` + `enum` 은 D-6A1-38 평탄 술어의 NON_FLAT_KEYS 밖이라 게이트는 그대로
    # 초록이다.
    # M6/6A-2b D-6A2b-1 — 편집 요청·응답 다섯. 전부 평탄하다(D-6A1-20 ⓑ). `field` 의 enum 은
    # 구현의 필드 어휘 전수와 **집합 등식**으로 대조된다(`OpenApiEditSessionContractTest`) —
    # 새 필드를 코드에만 더하거나 문서에만 더하면 RED 다.
    EditSessionBeginRequest:
      type: object
      required:
        - field
      properties:
        field:
          type: string
          enum:
            - FOCUS_CATEGORY
            - FOCUS_REGION
            - EXCLUDE_REGION
            - REQUIRED_KEYWORD
            - EXCLUDE_KEYWORD
            - MIN_BUDGET
            - MAX_BUDGET
            - MINIMUM_MATCH_SCORE
            - MINIMUM_PROBABILITY_SCORE
            - BID_NOW_THRESHOLD
            - REVIEW_THRESHOLD
            - CANDIDATE_LIMIT
            - MAX_ACTIVE_BIDS
    # 값 칸 넷 가운데 `field` 가 이름하는 하나만 싣는다 — 다른 칸이 함께 오면 400 이다
    # (조용히 무시하지 않는다). 칸 배정: 업종·지역·키워드 다섯 → terms, 예산 둘 → amountWon,
    # 임계 넷 → number, 후보 상한·여력 상한 → count.
    # L-3 — 「`field` 가 이름하는 칸 **하나**가 필수」는 이 스키마 형태로 표현할 수 없다
    # (`oneOf` 는 평탄 게이트에 걸린다). 구현은 엄격하게 강제한다: 그 칸이 없으면 400 이고,
    # 다른 칸이 함께 오거나 알려진 키 밖이 오면 역시 400 이다. 칸 배정은 위 `field` enum 순서와
    # 같다 — 업종·지역·키워드 다섯은 `terms`, 예산 둘은 `amountWon`, 임계 넷은 `number`,
    # 후보 상한·여력 상한은 `count`.
    EditSessionValueRequest:
      type: object
      required:
        - commandId
        - field
      properties:
        commandId:
          type: string
        field:
          type: string
          enum:
            - FOCUS_CATEGORY
            - FOCUS_REGION
            - EXCLUDE_REGION
            - REQUIRED_KEYWORD
            - EXCLUDE_KEYWORD
            - MIN_BUDGET
            - MAX_BUDGET
            - MINIMUM_MATCH_SCORE
            - MINIMUM_PROBABILITY_SCORE
            - BID_NOW_THRESHOLD
            - REVIEW_THRESHOLD
            - CANDIDATE_LIMIT
            - MAX_ACTIVE_BIDS
        terms:
          type: array
          items:
            type: string
        amountWon:
          type: integer
          format: int64
          minimum: 0
        number:
          type: number
        count:
          type: integer
          format: int32
    EditSessionConfirmRequest:
      type: object
      required:
        - commandId
        - seenRevision
      properties:
        commandId:
          type: string
        seenRevision:
          type: integer
          format: int32
          minimum: 0
    EditSessionEditRequest:
      type: object
      required:
        - commandId
        - field
      properties:
        commandId:
          type: string
        field:
          type: string
          enum:
            - FOCUS_CATEGORY
            - FOCUS_REGION
            - EXCLUDE_REGION
            - REQUIRED_KEYWORD
            - EXCLUDE_KEYWORD
            - MIN_BUDGET
            - MAX_BUDGET
            - MINIMUM_MATCH_SCORE
            - MINIMUM_PROBABILITY_SCORE
            - BID_NOW_THRESHOLD
            - REVIEW_THRESHOLD
            - CANDIDATE_LIMIT
            - MAX_ACTIVE_BIDS
    EditSessionCancelRequest:
      type: object
      required:
        - commandId
      properties:
        commandId:
          type: string
    # 초안(draft) 전체는 싣지 않는다 — 확인 중인 값은 방금 보낸 값이고 현재 전략은
    # `GET /api/strategy` 가 낸다.
    EditSessionResponse:
      type: object
      required:
        - sessionId
        - state
        - sessionVersion
        - expiresAt
      properties:
        sessionId:
          type: string
        state:
          type: string
          enum:
            - WAITING_FOR_VALUE
            - WAITING_FOR_CONFIRMATION
            - APPLIED
            - CANCELLED
            - EXPIRED
        field:
          type: string
          nullable: true
          # C-4 — 종단 상태에서 실제로 `null` 이 나간다. 엄격한 검증기가 그 값을 거부하지
          # 않도록 어휘에 함께 싣는다(대조 test 는 `null` 을 뺀 집합으로 등식을 잰다).
          enum:
            - null
            - FOCUS_CATEGORY
            - FOCUS_REGION
            - EXCLUDE_REGION
            - REQUIRED_KEYWORD
            - EXCLUDE_KEYWORD
            - MIN_BUDGET
            - MAX_BUDGET
            - MINIMUM_MATCH_SCORE
            - MINIMUM_PROBABILITY_SCORE
            - BID_NOW_THRESHOLD
            - REVIEW_THRESHOLD
            - CANDIDATE_LIMIT
            - MAX_ACTIVE_BIDS
        sessionVersion:
          type: integer
        expiresAt:
          type: string
          format: date-time
        strategyRevision:
          type: integer
          nullable: true
        baseRevision:
          type: integer
          nullable: true
    # M7/7C ① — 공고 요약 하나. **평탄하다**(D-6A1-20 ⓑ — 모든 속성이 스칼라다). 응답 본문이
    # 이 스키마의 **배열**인 이유는 목록 자체가 답이고(legacy `GET /projects/` 가 채택 가능으로
    # 남긴 계약 형태), 총수·빈 결과 사유는 헤더가 나르기 때문이다 — 평탄 술어를 넓히지 않는다.
    #
    # 금액은 값만 싣지 않고 **basis·통화·과세·provenance 와 함께** 싣는다(R-BASIS-06).
    # 원시 관측(`raw_observation`)·감사 행·개찰 축·투찰자 이름은 이 스키마에 없다 —
    # `OpenApiNoticeSearchContractTest` 가 키 집합 등식으로 그 사실을 잠근다.
    NoticeSummary:
      type: object
      required:
        - noticeNumber
        - noticeRound
        - status
      properties:
        noticeNumber:
          type: string
        noticeRound:
          type: string
        status:
          type: string
        title:
          type: string
          nullable: true
        demandAgencyName:
          type: string
          nullable: true
        noticeAgencyName:
          type: string
          nullable: true
        baseAmountWon:
          type: integer
          format: int64
          nullable: true
        baseAmountCurrency:
          type: string
          nullable: true
        baseAmountBasis:
          type: string
          nullable: true
        baseAmountVatTreatment:
          type: string
          nullable: true
        baseAmountProvenance:
          type: string
          nullable: true
        deadlineAt:
          type: string
          format: date-time
          nullable: true
    BidPriceRequestBody:
      type: object
      required:
        - noticeNumber
        - noticeRound
        - currentActiveBids
      properties:
        noticeNumber:
          type: string
          maxLength: 200
          description: >-
            공고번호. 정규화(trim · ASCII 대문자화 · 내부 공백을 `-` 로 합침)는 서버가 한다.
            공백만·제어 문자·길이 상한 초과는 400 이다.
        noticeRound:
          type: string
          maxLength: 200
          description: 차수 — 제로패딩 3자리 숫자(KONEPS `bidNtceOrd`). 그 밖은 400 이다.
        currentActiveBids:
          type: integer
          format: int32
          minimum: 0
          description: >-
            진행 중 투찰 건수. **호출자가 선언한다**(`evaluateDryRun` 과 같은 규약, D-6A3-3)
            — 서버가 0 으로 지어내지 않는다. 사다리의 여력 축이 이 값을 쓴다.
    BidPriceRequestResponse:
      type: object
      required:
        - noticeNumber
        - noticeRound
        - correlationId
        - strategyRevision
        - currentActiveBids
        - maxActiveBids
        - outcome
        - verdictReasonCodes
        - noticeStatus
        - failedWatchRuleIds
        - wouldNotify
        - inboxRecordState
        - licenseVerdict
        - licenseRequirementSourceFields
        - licenseGroupsSatisfied
        - licenseGroupsMissing
        - licenseMissingLicenses
        - licenseMissingDetailState
        - licenseUnparsableRowCount
        - licenseValidity
        - licensePolicySource
        - unjudgedAxes
        - floorRateGroundsState
        - floorShortfallState
        - floorShortfallNotComputedReason
        - mlAnalysisState
        - confidenceState
        - confidenceNotAvailableReason
        - bidPriceMenuState
        - bidPriceMenuNotComputedReason
        - disclosures
      properties:
        noticeNumber:
          type: string
        noticeRound:
          type: string
        correlationId:
          type: string
          description: 이 평가의 상관 ID — audit 행·오류 본문과 같은 어휘다.
        strategyRevision:
          type: integer
          format: int32
        currentActiveBids:
          type: integer
          format: int32
        maxActiveBids:
          type: integer
          format: int32
        outcome:
          type: string
          enum:
            - REACHED
            - NOT_REACHED
          description: 판정 사다리에 이르렀는가. 이르지 못하면 `dropStage`·`dropReasonCode` 가 어디서 왜 멈췄는지 말한다.
        verdict:
          type: string
          nullable: true
          enum:
            - BID_NOW
            - REVIEW
            - SKIP
          description: 판정. `outcome` 이 `NOT_REACHED` 면 없다.
        verdictReasonCodes:
          type: array
          items:
            type: string
          description: >-
            판정 사유 코드. 출하 조립에서는 ML 이 항상 미가용이라 사다리에 이른 공고가
            `REVIEW` · `ML_UNAVAILABLE` 로 내려온다 — 「낮은 추천」이 아니라 「추천 없음」이다.
        dropStage:
          type: string
          nullable: true
          description: 멈춘 단계(수명·감시·자격·임계 미설정·분석 예산·ML 가용성·점수 임계).
        dropReasonCode:
          type: string
          nullable: true
          description: 멈춘 사유. 단계와 사유는 한 쌍이다(사유 하나는 늘 정확히 한 단계에 속한다).
        noticeStatus:
          type: string
        failedWatchRuleIds:
          type: array
          items:
            type: string
          description: 감시 거절에서 걸린 규칙 ID. 그 밖의 경우 빈 배열이다.
        watchUndeterminableReason:
          type: string
          nullable: true
        scoreThreshold:
          type: string
          nullable: true
          description: 점수 미달 사유의 임계값 — 10진 문자열이다(부동소수로 내지 않는다).
        scoreActual:
          type: string
          nullable: true
          description: 같은 사유의 실제값 — 10진 문자열.
        wouldNotify:
          type: boolean
          description: >-
            이 판정이 알림 요청을 낳았는가. **요청까지**이고 배달·기록은 하지 않는다
            (`evaluateDryRun` 과 같은 경계).
        inboxRecordState:
          type: string
          enum:
            - NOT_RECORDED_YET
          description: >-
            알림함 기록 상태(R-4). 쓰기 포트가 아직 머지되지 않아 **기록하지 않는다** — 가짜
            포트·임시 표를 두지 않고 그 사실을 계약에 드러낸다. 포트가 서면 값이 늘어난다.
        inboxRecordNotRecordedReason:
          type: string
          nullable: true
          enum:
            - INBOX_WRITE_PORT_NOT_MERGED
        licenseVerdict:
          type: string
          enum:
            - ELIGIBLE
            - INELIGIBLE
            - UNCERTAIN
          description: >-
            면허 자격 판정(QUAL-01 · 03). **`UNCERTAIN` 은 `INELIGIBLE` 이 아니다**(U-5) —
            판정 불가와 미달을 한 값으로 접지 않는다.
        licenseUncertainReason:
          type: string
          nullable: true
          description: 판정 불가 사유(요건 데이터 부재·파싱 불가·프로필 미선언·수집 실패·허용업종 결합 규칙 미결).
        licenseRequiredLicenses:
          type: array
          nullable: true
          items:
            type: string
          description: 공고가 요구한 면허명 — **근거 원문의 「무엇을 요구했나」**(QUAL-05).
        licenseRequirementSourceFields:
          type: array
          items:
            type: string
          description: 요건이 온 공고 필드 — **근거 원문의 「어느 필드에서」**(QUAL-05).
        licenseGroupsSatisfied:
          type: array
          items:
            type: string
          description: 충족한 제한그룹 라벨. 그룹 간 OR · 그룹 내 AND 다(QUAL-03).
        licenseGroupsMissing:
          type: array
          items:
            type: string
          description: 충족하지 못한 제한그룹 라벨.
        licenseMissingLicenses:
          type: array
          items:
            type: string
          description: >-
            미보유 면허명. **미충족 그룹이 둘 이상이면 비운다** — 그룹 간 OR 을 합집합으로
            접으면 「이 면허들이 다 필요하다」로 읽힌다. 그 경우는
            `licenseMissingDetailState` 가 말한다.
        licenseMissingDetailState:
          type: string
          enum:
            - NOT_APPLICABLE
            - SINGLE_GROUP
            - MULTIPLE_GROUPS_NOT_FLATTENED
        licenseUnparsableRowCount:
          type: integer
          format: int32
          description: 파싱하지 못한 요건 행 수 — 0 이 아니면 판정이 일부 요건을 보지 못했다는 뜻이다.
        licenseValidity:
          type: string
          enum:
            - NOT_VERIFIED
          description: >-
            면허 **유효기간 미검증**(U-7) — V2 는 유효기간을 보지 않는다. 그 사실이 판정 결과에
            드러나야 한다는 요구를 이 칸이 집행한다.
        licensePolicySource:
          type: string
          description: >-
            판정에 쓴 어휘 테이블 version 의 출처(QUAL-05 — 규칙이 바뀌면 과거 판정이 어느
            version 에서 나왔는지 재현된다).
        licensePolicyEffectiveFrom:
          type: string
          nullable: true
          description: >-
            그 version 의 시행일. 정책의 **최초 판**이면 시행일이라는 값 자체가 없어 `null`
            이다 — 출처와 시행일을 한 문자열로 합치지 않는다(구분자를 지어내지 않는다).
        unjudgedAxes:
          type: array
          items:
            type: string
          description: >-
            **아직 판정하지 않는 자격 축**(QUAL-08 지역 · QUAL-10 수행실적 · QUAL-11
            시공능력평가금액). 「판정했고 통과」와 「판정하지 않음」을 구분하게 한다 — 자격
            카드가 「면허만 보면 끝」으로 읽히지 않게 한다. 판정이 생기는 slice 가 그 값을 뺀다.
        baseAmountWon:
          type: integer
          format: int64
          nullable: true
        baseAmountCurrency:
          type: string
          nullable: true
        baseAmountBasis:
          type: string
          nullable: true
        baseAmountVatTreatment:
          type: string
          nullable: true
        baseAmountProvenance:
          type: string
          nullable: true
        baseAmountResolution:
          type: string
          nullable: true
          enum:
            - DIRECT
            - FALLBACK_FROM_BUDGET
            - DERIVED_FROM_OPENING
          description: >-
            기초금액이 **어떻게 정해졌나**(DEC-01) — 게시값 그대로인지, 예산 키 폴백인지, 개찰
            역산인지. 파생이 원본을 덮지 않는다는 사실이 이 칸으로 보인다.
        publishedFloorRateFraction:
          type: string
          nullable: true
          description: >-
            게시 낙찰하한율 — fraction 의 10진 문자열이다(percent 가 아니고 부동소수가 아니다).
            출처가 게시값이 아니면 **싣지 않는다**.
        publishedFloorRateOrigin:
          type: string
          nullable: true
          enum:
            - NOTICE_VALUE
            - STATUTORY_TABLE
        publishedFloorRateNoticeRound:
          type: string
          nullable: true
          description: 게시값 출처의 공고 차수.
        floorRateGroundsState:
          type: string
          enum:
            - USABLE
            - ABSENT
            - ORIGIN_NOT_PUBLISHED
          description: >-
            게시 하한율이 근거로 설 수 있는가 — 「없다」와 「게시값이 아니다」를 가른다
            (운영자 결정 2026-10-15: 게시값만 근거).
        floorShortfallState:
          type: string
          enum:
            - NOT_COMPUTED
          description: >-
            하한 미달 빈도(DEC-04)를 **이 공고에서 잴 수 있는가**. 지금은 재지 못한다 —
            커널은 있으나 출하 정본 정책 표와 표본 공급 경로가 없다. 값이 서는 slice 가 빈도
            칸과 상태 값을 더한다.
        floorShortfallNotComputedReason:
          type: string
          enum:
            - SHORTFALL_POLICY_NOT_PUBLISHED
          description: >-
            재지 못한 사유. 「재려 했으나 재지 못했다」(표본 부족 등)와 **다른 어휘**다 —
            표본을 보지 않았으므로 표본 수를 적지 않는다.
        mlAnalysisState:
          type: string
          enum:
            - ANALYZED
            - UNAVAILABLE
            - SIMILARITY_PROJECTION_NOT_READY
            - NOT_REACHED
          description: >-
            커널이 ML 단계에서 받은 것. `NOT_REACHED` 는 **거기까지 가지 않았다**는 뜻이고
            `UNAVAILABLE`(갔으나 미가용)과 다른 사실이다.
        mlUnavailableReason:
          type: string
          nullable: true
          description: 미가용 사유. 출하 조립에서는 점수 provider 가 없어 `SCORE_NOT_PROVIDED` 다.
        confidenceState:
          type: string
          enum:
            - NOT_AVAILABLE
          description: >-
            신뢰도(ML-03). 값이 서는 날 그것은 **가격 적합도이고 확률이 아니다** — 그 고지가
            `disclosures` 의 `PRICE_FITNESS_IS_NOT_PROBABILITY` 다. 이 응답에 확률 칸은 없다.
        confidenceNotAvailableReason:
          type: string
          enum:
            - ML_SCORE_NOT_PROVIDED
            - ML_UNAVAILABLE
            - SIMILARITY_PROJECTION_NOT_READY
            - EVALUATION_NOT_REACHED_ML_STAGE
        bidPriceMenuState:
          type: string
          enum:
            - NOT_COMPUTED
          description: >-
            3안(안전·추천·공격) 상태(DEC-05 · ML-01). **빈 배열이 아니라 이유 있는 상태**다 —
            화면이 가짜 숫자를 그리지 않게 한다. 값이 서는 slice 가 태도별 칸과 상태 값을 더한다.
        bidPriceMenuNotComputedReason:
          type: string
          enum:
            - MENU_PATH_NOT_WIRED
          description: >-
            산출하지 않은 사유 — **이 배선에 산출 경로가 없다**는 사실 하나만 말한다. 커널을
            불러 「출처가 없었다」를 받은 것이 아니다(부르지 않았다).
        disclosures:
          type: array
          items:
            type: string
          description: >-
            **전수를 늘 싣는다** — 예정가격은 개찰 전 비공개 추첨으로 결정되어 정확한 낙찰하한을
            보장할 수 없음 · 자동 제출·확정 낙찰이 아님 · 법정 하한율 미해석 · 가격 적합도는
            확률이 아님. 코드만 나르고 **문장은 표면이 짓는다**(계산이 바뀐 뒤에도 옛 문구가
            남는 것을 막는다).
    ErrorBody:
      type: object
      required:
        - code
        - message
        - correlationId
      properties:
        code:
          type: string
          enum:
            - UNAUTHENTICATED
            - NOT_FOUND
            - NOTICE_NOT_FOUND
            - INVALID_STORED_STRATEGY
            - INTERNAL_ERROR
            - MAX_ACTIVE_BIDS_NOT_CONFIGURED
            - CANDIDATE_CAP_EXCEEDED
            - INVALID_REQUEST
            - SESSION_NOT_FOUND
            - SESSION_EXPIRED
            - IDEMPOTENCY_CONFLICT
            - ACTOR_MISMATCH
            - SYSTEM_ACTOR_NOT_PERMITTED
            - STALE_REVISION
            - INVALID_TRANSITION
            - SESSION_ALREADY_ACTIVE
            - EDIT_SESSION_CONFLICT
            - STRATEGY_VALUE_INVALID
            - METHOD_NOT_ALLOWED
            - UNSUPPORTED_MEDIA_TYPE
        message:
          type: string
        correlationId:
          type: string
