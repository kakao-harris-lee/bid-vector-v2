      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConstructionCapacityRequest"
      responses:
        "200":
          description: 쓴 뒤 다시 읽은 시평액 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConstructionCapacity"
        "400":
          description: "요청 본문 형식 오류(알 수 없는 키 · 값 규칙 위반) 또는 저장 층의 제약 거부. code: INVALID_REQUEST"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: "인증 실패 또는 계정 주체가 아닌 인증. code: UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: "그 계정의 시평액 행 수가 상한에 닿았다. code: CAPACITY_ROWS_EXCEEDED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "415":
          description: "요청 본문이 application/json 이 아니다. code: UNSUPPORTED_MEDIA_TYPE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: "내부 오류 또는 감사 기록 실패(D-6A1-17, fail-closed). code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/profile/construction-capacities/remove:
    post:
      operationId: removeConstructionCapacity
      summary: 시평액 한 행 삭제(M7/7C④)
      description: >-
        **POST 다**(DELETE 가 아니다) — 쓰기 메서드를 하나로 모아 CSRF 요구를 메서드로 받는다.
        지울 행이 없으면 404 이고, 다른 계정의 같은 면허명은 **없는 것과 같다**(존재 여부를 흘리지 않는다).
      security:
        - browserSession: []
          operatorCsrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveConstructionCapacityRequest"
      responses:
        "200":
          description: 지운 뒤 다시 읽은 시평액 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConstructionCapacity"
        "400":
          description: "요청 본문 형식 오류(알 수 없는 키 포함). code: INVALID_REQUEST"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: "인증 실패 또는 계정 주체가 아닌 인증. code: UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: "그 면허명의 행이 없다. code: NOT_FOUND"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "415":
          description: "요청 본문이 application/json 이 아니다. code: UNSUPPORTED_MEDIA_TYPE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: "내부 오류 또는 감사 기록 실패(D-6A1-17, fail-closed). code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/onboarding-checklist:
    get:
      operationId: readOnboardingChecklist
      summary: 시작하기 체크리스트 — 항목별 진행 상태를 **서버가 판정한다**(M7/7C④-3)
      description: >-
        세 목록이다(D-7C4C-8): 완료 · 미완 · **선행 대기**(`awaiting`). 클라이언트가 항목의 적용
        여부나 완료 여부를 추론하지 않는다 — 요구표 A 「체크리스트 진행 상태」가 서버 판정을 요구한다.


        `awaiting` 은 「이 항목이 걸리는지가 **선행 항목의 답에 달려 있다**」는 상태이고, 짝으로 그
        선행 항목을 함께 싣는다. 완료로도 미완으로도 세지 않는다 — 진행률의 분자에도 분모에도 들지
        않는다(막지도 채우지도 않는다, D-7C4-2).


        **어느 목록에도 없는 항목은 「해당 없음」이다**(그 계정에 걸리지 않는다 — 예: 공사로 입찰하지
        않는 계정의 시평액). 어휘가 닫혀 있으므로 클라이언트는 세 목록의 여집합으로 그것을 안다.
        항목 순서는 체크리스트 선언 순서다(서버가 정한다).


        진행 상태를 저장하지 않는다(D-7C4-1 P1) — 매 요청이 저장된 원천에서 다시 판정하므로 원천과
        어긋난 둘째 사본이 없다.
      security:
        - browserSession: []
      responses:
        "200":
          description: 세 목록(완료 · 미완 · 선행 대기 짝)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingChecklist"
        "401":
          description: "인증 실패 또는 **계정 주체가 아닌 인증**(체크리스트는 계정 경로 전용이다). 사유를 나누지 않는다(D-6A1-6). code: UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: >-
            내부 오류(저장된 전략이 유효하지 않음 포함) 또는 감사 기록 실패(D-6A1-17,
            fail-closed). code: INVALID_STORED_STRATEGY | INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/bid-results:
    get:
      operationId: readMyBidResults
      summary: 내 입찰 결과 — 건별 대사와 투찰 대비 낙찰률을 **서버가 판정한다**(M7/7C⑤-b)
      description: >-
        투찰 기록이 있는 **실투찰** 건마다 내 투찰가 · 개찰 결과 요약 · 서버 대사 판정 ·
        확정 낙찰가와의 차이를 내고, 투찰 대비 낙찰률을 **두 축으로 병기**한다.


        **운영자가 적은 결과(`recordedState`)와 서버 대사(`reconciledOutcome`)는 다른 칸이다.**
        어느 쪽도 다른 쪽을 덮지 않고, 둘이 어긋나면 `outcomeAgreement` 가 그 사실만 나른다 —
        어느 쪽이 틀렸다는 판정이 아니다.


        **판정 불가는 패찰이 아니다.** 낙찰자 상호가 공개되지 않았거나 개찰 결과가 아직
        승격되지 않은 건은 `UNDECIDABLE` 이고 `reconciliationBlocker` 가 사유를 든다. 그 건들은
        낙찰률의 **분모에 들지 않는다**.


        **분모가 0 이면 비율 칸이 비고 상태가 「부재」다**(0% 가 아니다). 「투찰 기록이 없다」와
        「표본은 있으나 전부 분모 밖이다」를 다른 상태로 가른다.


        **다른 업체의 상호 · 사업자등록번호 · 대표자명은 어느 칸에도 없다.** 낙찰자 상호는 서버
        안에서 대사 판정에만 쓰이고 응답에 실리지 않는다. 내 메모 · 증빙 참조도 없다.


        비율은 문자열이다 — JSON 수치는 클라이언트에서 배정밀도로 읽힌다. 분자와 분모를 함께
        내므로 더 정밀한 값이 필요하면 그 둘로 다시 센다.


        읽기 전용이다 — 대사 판정을 저장하지 않고 매 요청 원천에서 다시 판정한다.
      security:
        - browserSession: []
      responses:
        "200":
          description: 건별 목록과 집계(같은 판정 패스에서 함께 난다)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyBidResults"
        "401":
          description: "인증 실패 또는 **계정 주체가 아닌 인증**(결과 조회는 계정 경로 전용이다). 사유를 나누지 않는다(D-6A1-6). code: UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "406":
          description: "받아들일 수 없는 Accept — 협상이 매핑 단계에서 끊긴다. code: NOT_ACCEPTABLE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: "내부 오류 또는 감사 기록 실패(D-6A1-17, fail-closed). code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /{unmatched}:
    get:
      operationId: unmatchedPath
      summary: 미매핑 경로 — 계약 문서화 목적(D-6A1-21, 실제로는 어떤 controller도 이 경로를 다루지 않는다)
      responses:
        "404":
          description: "등록된 endpoint가 없음. code: NOT_FOUND"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
components:
  parameters:
    # M7/7B — 건 식별자. 숫자가 아니거나 0 이하면 400 이다(`IllegalArgumentException` 이
    # 500 으로 새지 않게 형식 오류로 옮긴다, D-6A2b-7 과 같은 관례).
    BidCaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    operatorCredential:
      type: apiKey
      in: header
      name: X-Operator-Credential
    # M7/7D — 브라우저 경로. 쿠키는 `HttpOnly` 라 화면 스크립트가 읽지 않는다(브라우저가 싣는다).
    # 이름의 `__Host-` 접두는 브라우저가 `Secure`·`Path=/`·`Domain` 없음을 **강제**하게 해서
    # 하위·형제 도메인이 같은 이름을 덮어쓰지 못하게 한다(쿠키 그림자 방어). 접두는 `Secure` 와
    # 한 몸이라 **로컬 http 개발 실행에서만** 접두 없는 `bidvector_session` 을 쓴다 — 운영 반입은
    # 접두 이름이 정본이고 이 문서는 그것을 적는다.
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-bidvector_session
    # 상태를 바꾸는 메서드에서 **세션 경로와 함께** 요구된다(읽기 메서드는 면제).
    operatorCsrf:
      type: apiKey
      in: header
      name: X-Operator-Csrf
  schemas:
    # M7/7C③ — 알림함 항목. **평탄하다**(중첩 object 속성 없음) — 그래서 「건별 묶음」을 중첩이
    # 아니라 항목마다의 계수로 나른다.
    #
    # 저장된 값과 **합쳐 온 값**이 한 모양에 있다: 앞의 일곱(종류·detail·공고 쌍·사실 시각·
    # 읽음)은 알림함 표의 값이고, `noticeKnown` 뒤 넷은 읽을 때 공고 표에서 합쳐 온 값이다.
    # 알림함 표에는 **자유 문자열 칸이 없다**(표시 문구를 저장하지 않는다) — 그래서 이 응답의
    # 자유 문면은 전부 공개 조달 데이터인 공고 칸뿐이고, 운영자 PII 가 실릴 자리가 없다.
    NotificationItem:
      type: object
      required:
        - kind
        - detail
        - noticeNumber
        - noticeRound
        - occurredAt
        - read
        - readAt
        - noticeItemCount
        - noticeUnreadCount
        - noticeKnown
        - noticeTitle
        - noticeStatus
        - noticeDeadlineAt
      properties:
        kind:
          type: string
          description: >-
            알림 종류. 여덟 어휘이고 저장 층의 CHECK 와 **같은 집합**이다(한쪽만 늘면 빌드가 붉다).
          enum:
            - NEW_CANDIDATE
            - BID_DEADLINE_IMMINENT
            - BID_DEADLINE_TODAY
            - DOCUMENT_DEADLINE_IMMINENT
            - OPENING_COMPLETED
            - AWARD_DECIDED
            - NOTICE_REVISED
            - BID_PRICE_REQUEST_RECORDED
        detail:
          type: string
          nullable: true
          description: >-
            종류가 싣는 부가 사실. **`OPENING_COMPLETED` 와 `AWARD_DECIDED` 만** 값을 갖고 나머지
            여섯은 `null` 이다(짝은 저장 층의 CHECK 가 함께 진다).
          enum:
            - PROVISIONAL_FIRST
            - NOT_PROVISIONAL_FIRST
            - AWARDED
            - NOT_AWARDED
        noticeNumber:
          type: string
          description: 공고번호 — 클릭 → 워크시트의 키 절반이다.
        noticeRound:
          type: string
          description: 공고 차수(제로패딩 세 자리).
        occurredAt:
          type: string
          format: date-time
          description: >-
            **사실의 시각**이다(알림함에 적재된 시각이 아니다). 같은 사실이 다시 기록되면 최신
            관측 시각으로 이동한다.
        read:
          type: boolean
          description: 읽었는가 — `readAt` 이 있는지와 같은 값이다(화면이 둘을 따로 보지 않아도 되게).
        readAt:
          type: string
          format: date-time
          nullable: true
          description: 처음 읽은 시각. 안읽음이면 `null` 이다. 다시 읽어도 움직이지 않는다.
        noticeItemCount:
          type: integer
          format: int32
          description: >-
            이 공고 묶음의 **전체** 항목 수 — 페이지와 안읽음 필터에 무관하다(묶음이 페이지
            경계에 걸쳐도 「더 있다」를 알 수 있다).
        noticeUnreadCount:
          type: integer
          format: int32
          description: 이 공고 묶음의 안읽음 항목 수.
        noticeKnown:
          type: boolean
          description: >-
            그 키의 공고 행이 저장소에 있는가. `false` 면 아래 세 칸이 전부 `null` 이다 —
            보존 기한이 지나 파기됐거나 아직 수집되지 않은 것이고 **둘을 구분하지 않는다**
            (묘비를 남기지 않으므로 가를 근거가 없다). 항목 자체는 남는다.
            `true` 인데 `noticeTitle` 이 `null` 인 것은 **다른 사실**이다(행은 있고 제목 칸이 비었다).
        noticeTitle:
          type: string
          nullable: true
          description: 공고명(합쳐 온 값). 공고 행이 없거나 그 칸이 비면 `null`.
        noticeStatus:
          type: string
          nullable: true
          description: 공고 상태(합쳐 온 값). 공고 행이 없으면 `null`.
        noticeDeadlineAt:
          type: string
          format: date-time
          nullable: true
          description: 공고 마감(합쳐 온 값). 공고 행이 없거나 마감이 없으면 `null`.
    # M7/7C③ — 읽음 처리(단건) 요청. 세 키뿐이고 알려진 키 밖은 400 이다. **계정 칸이 없다**:
    # 소유 경계는 세션이 정하고 요청이 자기 계정을 말할 수 없다. **시각 칸도 없다**: 읽은 시각은
    # 서버가 정한다(요청이 정하면 요청자가 「언제 읽었는지」를 말할 수 있다).
    MarkNotificationReadRequest:
      type: object
      required:
        - kind
        - noticeNumber
        - noticeRound
      properties:
        kind:
          type: string
          description: 알림 종류. 어휘 밖이면 400 이다.
          enum:
            - NEW_CANDIDATE
            - BID_DEADLINE_IMMINENT
            - BID_DEADLINE_TODAY
            - DOCUMENT_DEADLINE_IMMINENT
            - OPENING_COMPLETED
            - AWARD_DECIDED
            - NOTICE_REVISED
            - BID_PRICE_REQUEST_RECORDED
        noticeNumber:
          type: string
        noticeRound:
          type: string
    # M7/7C③ — 읽음 처리(묶음) 요청. 종류 축만 없는 같은 모양이다.
    MarkNoticeNotificationsReadRequest:
      type: object
      required:
        - noticeNumber
        - noticeRound
      properties:
        noticeNumber:
          type: string
        noticeRound:
          type: string
    # M7/7C③ — 읽음 처리 결과. `markedCount` 가 0 인 것은 **이미 읽었거나 항목이 없거나 남의
    # 것**이라는 뜻이고 그 셋을 구분하지 않는다. `unreadCount` 는 처리 뒤 계정의 안읽음 전수다
    # (화면이 배지를 다시 묻지 않게).
    MarkNotificationReadResponse:
      type: object
      required:
        - markedCount
        - unreadCount
      properties:
        markedCount:
          type: integer
          format: int32
        unreadCount:
          type: integer
          format: int64
    # =========================================================================
    # M7/7B — 입찰 건(`BID-01`). 전부 **평탄하다**(중첩 object 속성 없음, D-6A1-20 ⓑ).
    #
    # 요청 스키마에 **없는** 것이 이 계약의 절반이다:
    #  · provenance · chosenOptionRef — 금액 출처는 서버가 싣는다(메뉴 값 위장 금지)
    #  · retroactive — 소급은 출발 상태가 정한다(Q-11)
    #  · evidenceRetainUntil — 보관 기한은 정책이 정한다(R-5 3년)
    #  · 공고 스냅샷 — 서버가 공고에서 뜬다(초안 스냅샷 변조 차단)
    #  · caseVersion · accountId — 서버가 쥔다
    # =========================================================================
    BidCase:
      type: object
      required:
        - caseId
        - noticeNumber
        - noticeRound
        - bidKind
        - state
        - caseVersion
        - nextCheckpointKind
        - overdue
        - reconciliationCandidate
      properties:
        caseId:
          type: integer
          format: int64
        noticeNumber:
          type: string
        noticeRound:
          type: string
        bidKind:
          type: string
          enum: [REAL, PAPER]
        state:
          type: string
          enum: [WATCHING, DEFERRED, PRICE_RECEIVED, BID_PLANNED, BID_RECORDED, AWAITING_OPENING, OPENED_PROVISIONAL_FIRST, OPENED_OUT_OF_RANK, UNDER_QUALIFICATION_REVIEW, WON, LOST, FAILED_OR_REBID, SKIPPED, DEADLINE_PASSED_UNRECORDED]
          description: >-
            「보류」는 **어휘에 없다** — 「나중에(DEFERRED)」와 「건너뜀(SKIPPED)」으로 갈렸다.
        caseVersion:
          type: integer
        nextCheckpointKind:
          type: string
          enum: [DEADLINE, OPENING, DOCUMENT_DUE, NOTICE_EXPECTED, REMINDER, NONE]
          description: >-
            **항상 값이 있다.** 「없음」은 빈 값이 아니라 `NONE` 이라는 **답**이다(§6.1
            「없으면 「없음」이 명시된다 — 빈 값 금지」). 시각 하나로 접으면 화면이 「아직 안
            정했다」와 「없는 것이 맞다」를 구별할 수 없다.
        nextCheckpointAt:
          type: string
          format: date-time
          nullable: true
          description: "`nextCheckpointKind` 가 `NONE` 이면 null 이다."
        overdue:
          type: boolean
          description: 지난 일정 경고 — **서버가 한 시각 기준으로** 판정한다.
        reconciliationCandidate:
          type: boolean
          description: >-
            개찰 대사(SET-02)의 후보인가 — 「투찰 기록됨」 **실투찰** 건만 참이다.
            페이퍼 건은 항상 거짓이다(타입이 막는다).
    BidTimelineEntry:
      type: object
      required:
        - caseVersion
        - toState
        - command
        - actorKind
        - retroactive
        - occurredAt
      properties:
        caseVersion:
          type: integer
        fromState:
          type: string
          nullable: true
          description: 생성 전이만 null 이다(출발 상태가 없다).
        toState:
          type: string
        command:
          type: string
        actorKind:
          type: string
