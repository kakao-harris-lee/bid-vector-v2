openapi: 3.0.3
info:
  title: bid-vector operator API
  version: "6a2b"
  description: >-
    단일 운영자 소비자 전용(운영자 결정 2026-09-16 ①). 이 문서가 단일 출처다(D-6A1-8,
    수작성) — `OpenApiContractTest`가 구현과 대조한다. M6/6A-1이 전략 조회(읽기 전용)를,
    M6/6A-3+6F-3(D-6A3-11)이 평가 dry-run endpoint를 연다 — 둘 다 커밋을 만들지 않는다
    (실행·명령 경로 없음). M6/6A-2b(D-6A2b-1)가 편집 세션 endpoint 여섯을 열어 전략을
    **쓰는** 길을 낸다 — 모든 쓰기는 편집 세션을 지나고 한 트랜잭션에서 커밋된다.

    **405 와 406 은 어느 operation 아래에도 적지 않는다.** 405 는 operation 의 응답이 아니라
    「그 경로에 그 메서드가 없다」는 사실이라 적을 자리가 없다. 406 은 operation 의 응답이
    맞지만 **본문이 없다**(D-6A2b-29) — 클라이언트가 JSON 을 받지 않겠다고 한 요청이라
    `ErrorBody` 를 쓸 수 없고, 그래서 `ErrorBody.code` 어휘에도 그 코드를 두지 않는다.
    구현은 매핑된 모든 경로에서 미선언 메서드에 405 `ErrorBody` 를, 받아들일 수 없는 `Accept`
    에 본문 없는 406 을 낸다 — `ProductionHttpSurfaceTest` 가 출하 조립의 등록된 매핑 전수로
    두 축을 함께 잰다.
servers:
  - url: /
# 기본 인증 요구 — **읽기 operation 의 기본값**이다. 상태를 바꾸는 operation 은 이 기본을 쓰지
# 않는다(code-review r1 M-3): 여기에는 쿠키 경로만으로 통과하는 대안이 있어서, 그것을 그대로
# 물려받으면 문서가 「쿠키만 있으면 쓰기도 된다」고 말한다 — 구현은 그 반대다(세션 경로의 상태
# 변경은 `X-Operator-Csrf` 를 요구한다). 그래서 그 operation 들은 각자 `operatorCsrf` 를 묶은
# 요구를 선언하고, 무인증으로 열리는 자리는 `security: []` 로 **명시**한다.
# `OpenApiContractTest` 가 그 두 집합을 기본 거부 필터의 허용 목록과 양방향 등식으로 잰다.
security:
  - operatorCredential: []
  - browserSession: []
paths:
  /api/strategy:
    get:
      operationId: readStrategy
      summary: 현재 운영자 전략 조회
      responses:
        "200":
          description: 현재 전략
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyReadResponse"
        "401":
          description: >-
            자격증명 없음 또는 틀림 — 사유를 구분하지 않는다(D-6A1-6).
            code: UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: >-
            내부 오류(저장된 전략이 유효하지 않음 포함) 또는 감사 기록 실패(D-6A1-17,
            fail-closed). code: INVALID_STORED_STRATEGY | INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/evaluation-dry-runs:
    post:
      operationId: evaluateDryRun
      summary: 평가 dry-run(D-6A3-1·6 — 외부 effect 없음, outbox 미접촉)
      security:
        - operatorCredential: []
        - browserSession: []
          operatorCsrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluationDryRunRequest"
      responses:
        "200":
          description: 판정 분포(결과별 공고 ID 배열 + 건수)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationDryRunResponse"
        "400":
          description: >-
            currentActiveBids 가 유효한 JSON 정수(0..2147483647)가 아니다(D-6A3-5·D-6A3-19) —
            음수, 누락, null, 문자열·소수(조용한 강제 변환 없음), 범위 초과, 본문이 JSON
            object 가 아님, 비JSON, 빈 본문을 모두 포함한다. code: INVALID_REQUEST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: "자격증명 없음 또는 틀림(D-6A1-6). code: UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: >-
            전략에 여력 상한 미설정(D-6A3-4, code: MAX_ACTIVE_BIDS_NOT_CONFIGURED) 또는
            후보 스캔이 상한 초과(D-6A3-7, code: CANDIDATE_CAP_EXCEEDED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "415":
          description: >-
            요청 본문이 application/json 이 아니다(M6/6A-2b D-6A2b-7).
            code: UNSUPPORTED_MEDIA_TYPE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: >-
            내부 오류(저장된 전략이 유효하지 않음 포함) 또는 감사 기록 실패(D-6A1-17,
            fail-closed). code: INVALID_STORED_STRATEGY | INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/bid-price-requests:
    post:
      operationId: requestBidPrice
      summary: 투찰가 요청 — 공고 단건·운영자 요청 평가(M7/7C ②)
      description: >-
        운영자가 지목한 **공고 하나**를 평가하고 그 근거를 낸다. `evaluateDryRun`(전략 전체
        평가)과 **같은 판정 커널**을 돌아 같은 입력에서 같은 결과를 낸다 — 다른 점은 후보가
        지목된 하나라는 것뿐이다.

        **POST 인 이유**: 이 요청의 종착점이 알림함 한 항목 기록(R-4)이고, 읽기로 출하한 뒤
        쓰기로 바꾸면 이미 출하된 계약을 깨야 한다. CSRF 요구도 메서드 집합으로 성립한다.
        공고 식별자는 **본문**이다(경로가 아니다).

        **분석 예산을 적용하지 않는다.** 전략의 후보 상한은 전건 스캔의 비용 통제이고 운영자가
        지목한 공고 하나의 허가 조건이 아니다 — 상한이 1 인 전략에서도 요청한 공고는 평가된다.
        이것이 `evaluateDryRun` 과 **의도적으로 어긋나는 유일한 축**이다.

        **가격 세 축은 아직 값이 서지 않는다.** 3안(`bidPriceMenuState`)·신뢰도
        (`confidenceState`)·하한 미달 빈도(`floorShortfallState`)는 **상태와 사유**만 낸다 —
        출하 조립의 ML 분석 포트가 항상-미가용 고정이고(`OPEN-ML-ANALYSIS-WIRING` 보류) 하한
        미달 정책의 출하 정본 표가 없다. 값 칸을 미리 두지 않는 이유는 「없음」이 「0」으로
        읽히지 않게 하는 것이다 — 값이 서는 slice 가 칸을 더한다.

        **하한율은 게시값만 근거다**(운영자 결정 2026-10-15). 법정 하한율을 해석하지 않으며 그
        사실을 `disclosures` 가 `STATUTORY_FLOOR_RATE_NOT_INTERPRETED` 로 고지한다. 게시
        하한율이 아닌 출처의 값은 근거 칸에 싣지 않고 `floorRateGroundsState` 가 말한다.

        **「근거 원문」은 (출처 필드 + 요건 면허명 + 정책 version)이다** — 원시 관측 blob·
        공고명·기관명·사업자번호는 이 응답에 자리가 없다.
      security:
        - operatorCredential: []
        - browserSession: []
          operatorCsrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidPriceRequestBody"
      responses:
        "200":
          description: 공고 하나의 판정과 근거(축별 자격·금액 basis·게시 하한율·고지)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BidPriceRequestResponse"
        "400":
          description: >-
            요청 본문이 유효하지 않다 — 본문이 JSON object 가 아님, `noticeNumber`·
            `noticeRound` 의 누락·null·비문자열·공백·제어 문자·길이 상한 초과, `noticeRound`
            가 제로패딩 3자리 숫자가 아님, `currentActiveBids` 가 0 이상의 JSON 정수(Int 범위)가
            아님(문자열·소수의 조용한 강제 변환 없음). 어느 입력이 틀렸는지는 싣지 않는다.
            code: INVALID_REQUEST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: "자격증명·세션·CSRF 가 없거나 틀림(D-6A1-6). code: UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: >-
            요청한 공고가 없다(평가를 시작하지 않았다). 경로가 없는 경우(`NOT_FOUND`)와 다른
            코드다. code: NOTICE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: >-
            전략에 여력 상한 미설정(D-6A3-4 와 같은 fail-closed — 여력 상한 없이 사다리를
            돌리지 않는다). code: MAX_ACTIVE_BIDS_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "415":
          description: "요청 본문이 application/json 이 아니다. code: UNSUPPORTED_MEDIA_TYPE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: >-
            내부 오류(저장된 전략이 유효하지 않음 포함) 또는 감사 기록 실패(D-6A1-17,
            fail-closed). code: INVALID_STORED_STRATEGY | INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/strategy/edit-sessions:
    post:
      operationId: beginEditSession
      summary: 편집 세션 시작(D-6A2b-1) — 세션 id 는 서버가 만든다
      description: >-
        409 `SESSION_ALREADY_ACTIVE` 는 선언하지 않는다(C-3) — 세션 id 를 서버가 UUID 로
        만들므로 「같은 id 에 이미 비종단 세션」 가드에 HTTP 로 닿을 길이 없다. 그 코드는
        use case 의 전수 `when` 을 총(total)으로 유지하려고 남아 있을 뿐이고, 도달 불가는
        알려진 제한으로 등재돼 있다. 버려진 세션의 처분은 `OPEN-6A2B-ABANDONED-SESSIONS`.
      security:
        - operatorCredential: []
        - browserSession: []
          operatorCsrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditSessionBeginRequest"
      responses:
        "201":
          description: 새 세션(state=WAITING_FOR_VALUE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditSessionResponse"
        "400":
          description: "본문 형식 오류·알 수 없는 field 토큰. code: INVALID_REQUEST"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: "자격증명 없음 또는 틀림(D-6A1-6). code: UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "415":
          description: "요청 본문이 application/json 이 아니다. code: UNSUPPORTED_MEDIA_TYPE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: >-
            내부 오류(저장된 전략이 유효하지 않음 포함) 또는 감사 기록 실패(D-6A1-17).
            code: INVALID_STORED_STRATEGY | INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/strategy/edit-sessions/{sessionId}:
    get:
      operationId: readEditSession
      summary: 편집 세션 조회 — 접근 시점에 만료를 먼저 접는다(D-6A2b-11)
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 세션 상태
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditSessionResponse"
        "401":
          description: "자격증명 없음 또는 틀림. code: UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "400":
          description: >-
            경로 변수가 비어 있다(`%20` 등 — 디코딩 뒤 공백). code: INVALID_REQUEST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: "그 id 의 세션이 없다. code: SESSION_NOT_FOUND"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: >-
            조회가 접는 만료 fold 의 영속이 동시 전진과 부딪쳤다(C-2).
            code: EDIT_SESSION_CONFLICT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: "내부 오류. code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/strategy/edit-sessions/{sessionId}/value:
    post:
      operationId: provideEditSessionValue
      summary: 값 제출(D-6A2b-2) — 현재 전략에서 그 필드 하나만 바꾼 초안을 만든다
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      security:
        - operatorCredential: []
        - browserSession: []
          operatorCsrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditSessionValueRequest"
      responses:
        "200":
          description: 세션 상태(값이 유효하면 WAITING_FOR_CONFIRMATION)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditSessionResponse"
        "400":
          description: >-
            본문 형식 오류(code: INVALID_REQUEST) 또는 전략 값 불변식 위반
            (code: STRATEGY_VALUE_INVALID — 어느 불변식인지는 싣지 않는다,
            OPEN-6A2B-VIOLATION-DETAIL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: "자격증명 없음 또는 틀림. code: UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: "그 id 의 세션이 없다. code: SESSION_NOT_FOUND"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: >-
            세션이 이 명령을 받을 수 없다. code: SESSION_EXPIRED | IDEMPOTENCY_CONFLICT |
            ACTOR_MISMATCH | SYSTEM_ACTOR_NOT_PERMITTED | STALE_REVISION |
            INVALID_TRANSITION | SESSION_ALREADY_ACTIVE | EDIT_SESSION_CONFLICT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "415":
          description: "요청 본문이 application/json 이 아니다. code: UNSUPPORTED_MEDIA_TYPE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: "내부 오류. code: INVALID_STORED_STRATEGY | INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/strategy/edit-sessions/{sessionId}/confirm:
    post:
      operationId: confirmEditSession
      summary: 확인 — seenRevision 이 지금 전략과 다르면 거부한다(우회 3)
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      security:
        - operatorCredential: []
        - browserSession: []
          operatorCsrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditSessionConfirmRequest"
      responses:
        "200":
          description: 세션 상태(적용되면 APPLIED · strategyRevision 이 1 오른다)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditSessionResponse"
        "400":
          description: "본문 형식 오류. code: INVALID_REQUEST"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: "자격증명 없음 또는 틀림. code: UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: "그 id 의 세션이 없다. code: SESSION_NOT_FOUND"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: >-
            세션이 이 명령을 받을 수 없다(사유 코드는 value 와 같은 목록).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "415":
          description: "요청 본문이 application/json 이 아니다. code: UNSUPPORTED_MEDIA_TYPE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: "내부 오류. code: INVALID_STORED_STRATEGY | INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/strategy/edit-sessions/{sessionId}/edit:
    post:
      operationId: requestEditSessionEdit
      summary: 확인 화면에서 (같거나 다른) 필드로 되돌아간다
      description: >-
        **확인 대기(WAITING_FOR_CONFIRMATION) 에서만 유효하다**(L-r2-4). 값 대기 상태에서
        필드를 바꿀 길은 없다 — `POST /{sessionId}/value` 는 세션이 기다리는 필드만 받고
        (D-6A2b-25), 되돌아가기는 확인 대기에서만 전이표에 있다. 잘못 연 세션은 취소하고
        다시 연다. 그 밖의 상태에서는 409 `INVALID_TRANSITION` 이다.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      security:
        - operatorCredential: []
        - browserSession: []
          operatorCsrf: []
