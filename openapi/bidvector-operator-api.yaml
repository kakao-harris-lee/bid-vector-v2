openapi: 3.0.3
info:
  title: bid-vector operator API
  version: "6a2b"
  description: >-
    단일 운영자 소비자 전용(운영자 결정 2026-09-16 ①). 이 문서가 단일 출처다(D-6A1-8,
    수작성) — `OpenApiContractTest`가 구현과 대조한다. M6/6A-1이 전략 조회(읽기 전용)를,
    M6/6A-3+6F-3(D-6A3-11)이 평가 dry-run endpoint를 연다 — 둘 다 커밋을 만들지 않는다
    (실행·명령 경로 없음). M6/6A-2b(D-6A2b-1)가 편집 세션 endpoint 여섯을 열어 전략을
    **쓰는** 길을 낸다 — 모든 쓰기는 편집 세션을 지나고 한 트랜잭션에서 커밋된다.

    **405 와 406 은 어느 operation 아래에도 적지 않는다.** 405 는 operation 의 응답이 아니라
    「그 경로에 그 메서드가 없다」는 사실이라 적을 자리가 없다. 406 은 operation 의 응답이
    맞지만 **본문이 없다**(D-6A2b-29) — 클라이언트가 JSON 을 받지 않겠다고 한 요청이라
    `ErrorBody` 를 쓸 수 없고, 그래서 `ErrorBody.code` 어휘에도 그 코드를 두지 않는다.
    구현은 매핑된 모든 경로에서 미선언 메서드에 405 `ErrorBody` 를, 받아들일 수 없는 `Accept`
    에 본문 없는 406 을 낸다 — `ProductionHttpSurfaceTest` 가 출하 조립의 등록된 매핑 전수로
    두 축을 함께 잰다.
servers:
  - url: /
# 기본 인증 요구 — **읽기 operation 의 기본값**이다. 상태를 바꾸는 operation 은 이 기본을 쓰지
# 않는다(code-review r1 M-3): 여기에는 쿠키 경로만으로 통과하는 대안이 있어서, 그것을 그대로
# 물려받으면 문서가 「쿠키만 있으면 쓰기도 된다」고 말한다 — 구현은 그 반대다(세션 경로의 상태
# 변경은 `X-Operator-Csrf` 를 요구한다). 그래서 그 operation 들은 각자 `operatorCsrf` 를 묶은
# 요구를 선언하고, 무인증으로 열리는 자리는 `security: []` 로 **명시**한다.
# `OpenApiContractTest` 가 그 두 집합을 기본 거부 필터의 허용 목록과 양방향 등식으로 잰다.
security:
  - operatorCredential: []
  - browserSession: []
paths:
  /api/strategy:
    get:
      operationId: readStrategy
      summary: 현재 운영자 전략 조회
      responses:
        "200":
          description: 현재 전략
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyReadResponse"
        "401":
          description: >-
            자격증명 없음 또는 틀림 — 사유를 구분하지 않는다(D-6A1-6).
            code: UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: >-
            내부 오류(저장된 전략이 유효하지 않음 포함) 또는 감사 기록 실패(D-6A1-17,
            fail-closed). code: INVALID_STORED_STRATEGY | INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/evaluation-dry-runs:
    post:
      operationId: evaluateDryRun
      summary: 평가 dry-run(D-6A3-1·6 — 외부 effect 없음, outbox 미접촉)
      security:
        - operatorCredential: []
        - browserSession: []
          operatorCsrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluationDryRunRequest"
      responses:
        "200":
          description: 판정 분포(결과별 공고 ID 배열 + 건수)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationDryRunResponse"
        "400":
          description: >-
            currentActiveBids 가 유효한 JSON 정수(0..2147483647)가 아니다(D-6A3-5·D-6A3-19) —
            음수, 누락, null, 문자열·소수(조용한 강제 변환 없음), 범위 초과, 본문이 JSON
            object 가 아님, 비JSON, 빈 본문을 모두 포함한다. code: INVALID_REQUEST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: "자격증명 없음 또는 틀림(D-6A1-6). code: UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: >-
            전략에 여력 상한 미설정(D-6A3-4, code: MAX_ACTIVE_BIDS_NOT_CONFIGURED) 또는
            후보 스캔이 상한 초과(D-6A3-7, code: CANDIDATE_CAP_EXCEEDED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "415":
          description: >-
            요청 본문이 application/json 이 아니다(M6/6A-2b D-6A2b-7).
            code: UNSUPPORTED_MEDIA_TYPE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: >-
            내부 오류(저장된 전략이 유효하지 않음 포함) 또는 감사 기록 실패(D-6A1-17,
            fail-closed). code: INVALID_STORED_STRATEGY | INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/strategy/edit-sessions:
    post:
      operationId: beginEditSession
      summary: 편집 세션 시작(D-6A2b-1) — 세션 id 는 서버가 만든다
      description: >-
        409 `SESSION_ALREADY_ACTIVE` 는 선언하지 않는다(C-3) — 세션 id 를 서버가 UUID 로
        만들므로 「같은 id 에 이미 비종단 세션」 가드에 HTTP 로 닿을 길이 없다. 그 코드는
        use case 의 전수 `when` 을 총(total)으로 유지하려고 남아 있을 뿐이고, 도달 불가는
        알려진 제한으로 등재돼 있다. 버려진 세션의 처분은 `OPEN-6A2B-ABANDONED-SESSIONS`.
      security:
        - operatorCredential: []
        - browserSession: []
          operatorCsrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditSessionBeginRequest"
      responses:
        "201":
          description: 새 세션(state=WAITING_FOR_VALUE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditSessionResponse"
        "400":
          description: "본문 형식 오류·알 수 없는 field 토큰. code: INVALID_REQUEST"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: "자격증명 없음 또는 틀림(D-6A1-6). code: UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "415":
          description: "요청 본문이 application/json 이 아니다. code: UNSUPPORTED_MEDIA_TYPE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: >-
            내부 오류(저장된 전략이 유효하지 않음 포함) 또는 감사 기록 실패(D-6A1-17).
            code: INVALID_STORED_STRATEGY | INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/strategy/edit-sessions/{sessionId}:
    get:
      operationId: readEditSession
      summary: 편집 세션 조회 — 접근 시점에 만료를 먼저 접는다(D-6A2b-11)
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 세션 상태
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditSessionResponse"
        "401":
          description: "자격증명 없음 또는 틀림. code: UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "400":
          description: >-
            경로 변수가 비어 있다(`%20` 등 — 디코딩 뒤 공백). code: INVALID_REQUEST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: "그 id 의 세션이 없다. code: SESSION_NOT_FOUND"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: >-
            조회가 접는 만료 fold 의 영속이 동시 전진과 부딪쳤다(C-2).
            code: EDIT_SESSION_CONFLICT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: "내부 오류. code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/strategy/edit-sessions/{sessionId}/value:
    post:
      operationId: provideEditSessionValue
      summary: 값 제출(D-6A2b-2) — 현재 전략에서 그 필드 하나만 바꾼 초안을 만든다
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      security:
        - operatorCredential: []
        - browserSession: []
          operatorCsrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditSessionValueRequest"
      responses:
        "200":
          description: 세션 상태(값이 유효하면 WAITING_FOR_CONFIRMATION)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditSessionResponse"
        "400":
          description: >-
            본문 형식 오류(code: INVALID_REQUEST) 또는 전략 값 불변식 위반
            (code: STRATEGY_VALUE_INVALID — 어느 불변식인지는 싣지 않는다,
            OPEN-6A2B-VIOLATION-DETAIL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: "자격증명 없음 또는 틀림. code: UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: "그 id 의 세션이 없다. code: SESSION_NOT_FOUND"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: >-
            세션이 이 명령을 받을 수 없다. code: SESSION_EXPIRED | IDEMPOTENCY_CONFLICT |
            ACTOR_MISMATCH | SYSTEM_ACTOR_NOT_PERMITTED | STALE_REVISION |
            INVALID_TRANSITION | SESSION_ALREADY_ACTIVE | EDIT_SESSION_CONFLICT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "415":
          description: "요청 본문이 application/json 이 아니다. code: UNSUPPORTED_MEDIA_TYPE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: "내부 오류. code: INVALID_STORED_STRATEGY | INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/strategy/edit-sessions/{sessionId}/confirm:
    post:
      operationId: confirmEditSession
      summary: 확인 — seenRevision 이 지금 전략과 다르면 거부한다(우회 3)
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      security:
        - operatorCredential: []
        - browserSession: []
          operatorCsrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditSessionConfirmRequest"
      responses:
        "200":
          description: 세션 상태(적용되면 APPLIED · strategyRevision 이 1 오른다)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditSessionResponse"
        "400":
          description: "본문 형식 오류. code: INVALID_REQUEST"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: "자격증명 없음 또는 틀림. code: UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: "그 id 의 세션이 없다. code: SESSION_NOT_FOUND"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: >-
            세션이 이 명령을 받을 수 없다(사유 코드는 value 와 같은 목록).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "415":
          description: "요청 본문이 application/json 이 아니다. code: UNSUPPORTED_MEDIA_TYPE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: "내부 오류. code: INVALID_STORED_STRATEGY | INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/strategy/edit-sessions/{sessionId}/edit:
    post:
      operationId: requestEditSessionEdit
      summary: 확인 화면에서 (같거나 다른) 필드로 되돌아간다
      description: >-
        **확인 대기(WAITING_FOR_CONFIRMATION) 에서만 유효하다**(L-r2-4). 값 대기 상태에서
        필드를 바꿀 길은 없다 — `POST /{sessionId}/value` 는 세션이 기다리는 필드만 받고
        (D-6A2b-25), 되돌아가기는 확인 대기에서만 전이표에 있다. 잘못 연 세션은 취소하고
        다시 연다. 그 밖의 상태에서는 409 `INVALID_TRANSITION` 이다.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      security:
        - operatorCredential: []
        - browserSession: []
          operatorCsrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditSessionEditRequest"
      responses:
        "200":
          description: 세션 상태(WAITING_FOR_VALUE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditSessionResponse"
        "400":
          description: "본문 형식 오류·알 수 없는 field 토큰. code: INVALID_REQUEST"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: "자격증명 없음 또는 틀림. code: UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: "그 id 의 세션이 없다. code: SESSION_NOT_FOUND"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: "세션이 이 명령을 받을 수 없다(사유 코드는 value 와 같은 목록)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "415":
          description: "요청 본문이 application/json 이 아니다. code: UNSUPPORTED_MEDIA_TYPE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: "내부 오류. code: INVALID_STORED_STRATEGY | INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/strategy/edit-sessions/{sessionId}/cancel:
    post:
      operationId: cancelEditSession
      summary: 취소 — 종단 상태다(재개는 새 세션, D-4A-4)
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      security:
        - operatorCredential: []
        - browserSession: []
          operatorCsrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditSessionCancelRequest"
      responses:
        "200":
          description: 세션 상태(CANCELLED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditSessionResponse"
        "400":
          description: "본문 형식 오류. code: INVALID_REQUEST"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: "자격증명 없음 또는 틀림. code: UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: "그 id 의 세션이 없다. code: SESSION_NOT_FOUND"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: "세션이 이 명령을 받을 수 없다(사유 코드는 value 와 같은 목록)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "415":
          description: "요청 본문이 application/json 이 아니다. code: UNSUPPORTED_MEDIA_TYPE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: "내부 오류. code: INVALID_STORED_STRATEGY | INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/session:
    post:
      operationId: signIn
      summary: 로그인 — 세션 쿠키 발급(M7/7D)
      description: >-
        **무인증으로 열리는 유일한 operation 이다**(기본 거부 필터의 허용 목록 하나). 성공하면
        `Set-Cookie` 로 `__Host-bidvector_session`(HttpOnly·Secure·SameSite=Strict·Path=/·Domain 없음)을 내고, 본문으로
        CSRF 값을 준다 — 그 값은 세션 값에서 단방향으로 유도된 것이라 새어도 세션이 되지 않는다.
        로그인은 **늘 새 값을 발급하고 그 계정의 기존 세션을 폐기한다**(세션 고정 방어).
        로그인 CSRF 대책은 둘이다: 이 operation 은 `application/json` 만 받으므로 교차 사이트
        HTML form 이 닿지 못하고(preflight 없는 form 은 그 Content-Type 을 쓸 수 없다),
        발급 쿠키가 `SameSite=Strict` 다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "201":
          description: 세션 발급
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: "요청 본문 형식 오류(알 수 없는 키·빈 값 포함). code: INVALID_REQUEST"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: >-
            로그인 실패 — 계정 부재·비밀 문구 불일치·연속 실패 잠금을 **구분하지 않는다**(D-6A1-6).
            code: UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "415":
          description: "요청 본문이 application/json 이 아니다. code: UNSUPPORTED_MEDIA_TYPE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: "내부 오류 또는 감사 기록 실패(D-6A1-17, fail-closed). code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    get:
      operationId: readSession
      summary: 지금 내 세션 — CSRF 값 재전달(M7/7D)
      description: >-
        화면이 새로 뜰 때 CSRF 값을 다시 받는 자리다. 읽기 메서드라 CSRF 를 요구하지 않는다.
        쿠키가 없거나 세션이 살아 있지 않으면 404 다 — 이 요청은 이미 인증을 지났고(쿠키 또는
        운영자 자격 헤더), 없는 것은 자격이 아니라 **브라우저 세션이라는 자원**이다.
      responses:
        "200":
          description: 살아 있는 세션
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: "인증 실패(사유 구분 없음). code: UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: "브라우저 세션이 없다. code: NOT_FOUND"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: "내부 오류 또는 감사 기록 실패. code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    delete:
      operationId: signOut
      summary: 로그아웃 — 서버 쪽 세션 폐기(M7/7D)
      description: >-
        **서버 쪽 폐기가 본체**이고 쿠키 삭제가 뒤따른다(쿠키만 지우면 그 값으로 다시 통한다).
        상태를 바꾸는 메서드라 CSRF 헤더를 요구한다. 쿠키가 없는 요청(운영자 자격 헤더 경로)도
        같은 204 다 — 멱등이고 「세션이 있었는지」를 응답으로 알리지 않는다.
      security:
        - operatorCredential: []
        - browserSession: []
          operatorCsrf: []
      responses:
        "204":
          description: 폐기 완료(본문 없음)
        "401":
          description: >-
            인증 실패 — 쿠키 없음·폐기·만료·CSRF 불일치를 **구분하지 않는다**. code: UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: "내부 오류 또는 감사 기록 실패. code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/notices:
    get:
      operationId: searchNotices
      summary: 공고 검색(STR-16 검색 절반) — 읽기 전용, 마감 임박 순
      description: >-
        수집된 공고를 **감시 조건과 무관하게** 조회한다(M7/7C ①). 쓰기 경로가 없고 전략을
        바꾸지 않는다.

        **금액 범위의 basis 는 기초금액이다**(`amountMin`/`amountMax` — `Basis.BASE_AMOUNT`,
        원 단위, 부가세 **포함**(`INCLUSIVE`), 운영자 선언 provenance). 감시 경로의 예산
        한계값과 **같은 규약**이라 같은 쌍이 두 경로에서 같은 답을 낸다. 추정가격과 비교하지
        않는다. 금액 범위를 주면 **비교가 성립하는 기초금액을 가진 공고만** 남는다 — 금액이
        없거나 과세가 다르거나 provenance 가 선언되지 않은 공고는 결과에서 빠진다(0 으로
        간주하지 않는다). 금액 범위를 주지 않으면 그 공고들도 모두 나온다.

        **빈 결과의 두 뜻은 `X-Result-State` 가 가른다** — 수집된 공고가 아직 없는 것과
        조건이 좁은 것이 다른 값이다. 마지막 페이지 뒤를 물으면 본문은 비지만
        `X-Total-Count` 가 1 이상이고 상태는 `MATCHED` 다.

        `q`·`agency` 는 **리터럴 부분 일치**다(대소문자 무시). `%`·`_`·`!`·`\` 는 와일드카드도
        이스케이프도 아니라 그대로 찾을 글자다. 두 칸 모두 **제어 문자(U+0000 포함)를 거부**한다 — 양끝
        공백류는 먼저 걷어내므로 공백만인 질의는 조건이 아니다. **같은 매개변수를 두 번 보내면
        거부한다**(조용히 합치지 않는다). 정수 칸은 숫자와 선택적 `-` 만 받는다(앞뒤 공백·`+`
        부호 거부). 상한을 넘는 `size`·길이·역전된 범위·형식 오류는 조용히 절삭·변환하지 않고
        400 이다(어느 입력이 틀렸는지는 응답에 싣지 않는다).
      parameters:
        - name: q
          in: query
          required: false
          description: >-
            공고명·공고번호 부분 일치(리터럴, 대소문자 무시). 공백만이면 조건이 아니고 제어
            문자가 들어 있으면 400 이다.
          schema:
            type: string
            maxLength: 200
        - name: agency
          in: query
          required: false
          description: >-
            수요기관명·공고기관명 부분 일치(리터럴, 대소문자 무시). 제어 문자가 들어 있으면
            400 이다.
          schema:
            type: string
            maxLength: 200
        - name: amountMin
          in: query
          required: false
          description: 기초금액 하한(원, 이상). basis·과세·provenance 규약은 operation description.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: amountMax
          in: query
          required: false
          description: 기초금액 상한(원, 이하). `amountMin` 보다 작으면 400 이다.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: deadlineFrom
          in: query
          required: false
          description: 마감 하한(이상). 마감이 없는 공고는 이 조건이 있으면 빠진다.
          schema:
            type: string
            format: date-time
        - name: deadlineTo
          in: query
          required: false
          description: 마감 상한(이하). `deadlineFrom` 보다 앞서면 400 이다.
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          required: false
          description: 0 기반 페이지 번호.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: 페이지 크기. 상한을 넘으면 절삭이 아니라 400 이다.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: >-
            조건에 맞는 공고 요약 배열(마감 임박 순 — 마감 없는 공고는 뒤). 전체 건수는
            `X-Total-Count`, 빈 결과의 두 뜻은 `X-Result-State` 가 나른다.
          headers:
            X-Total-Count:
              description: 조건에 맞는 **전체** 건수(이 페이지의 길이가 아니다).
              required: true
              schema:
                type: integer
                format: int64
                minimum: 0
            X-Result-State:
              description: >-
                MATCHED(조건에 맞는 공고가 있다 — 이 페이지가 비어 있어도 전체 건수가 1
                이상) | NO_MATCH(수집된 공고는 있으나 조건에 맞는 것이 없다) |
                NOTHING_COLLECTED(수집된 공고가 아직 하나도 없다)
              required: true
              schema:
                type: string
                enum:
                  - MATCHED
                  - NO_MATCH
                  - NOTHING_COLLECTED
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NoticeSummary"
        "400":
          description: >-
            질의 값이 유효하지 않다 — 텍스트 길이 상한 초과, 텍스트의 제어 문자(U+0000 포함),
            정수·시각 형식 오류(정수 칸의 앞뒤 공백·`+` 부호 포함), 음수 금액, 역전된 금액·마감
            범위, 음수 `page`, 범위 밖 `size`, 같은 매개변수의 반복, **잘못된 퍼센트 인코딩**
            (`%` 뒤에 16진 두 자리가 없는 이스케이프 문법 오류와, UTF-8 로 디코딩되지 않는
            바이트열 — 어느 매개변수에서 나든 같다). 어느 입력이 틀렸는지는 싣지
            않는다(편집 경로의 `STRATEGY_VALUE_INVALID` 와 같은 관례).
            code: INVALID_REQUEST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: "자격증명 없음 또는 틀림(D-6A1-6). code: UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: >-
            내부 오류 또는 감사 기록 실패(D-6A1-17, fail-closed). code: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/bid-cases:
    get:
      operationId: listBidCases
      summary: 내 입찰함 — 상태 탭별 목록(M7/7B)
      description: >-
        `kind` 가 **필수**다. 페이퍼(가상) 투찰과 실투찰을 한 응답에 함께 내는 길이 없다
        (§6.1 「같은 목록에 섞이지 않는다」) — 그 분리는 질의 인자의 선택이 아니라 **계약의
        모양**이다. 다음 확인 시점과 지난 일정 경고는 **서버가 한 시각 기준으로 판정해** 싣는다.
      security:
        - browserSession: []
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum: [REAL, PAPER]
        - name: state
          in: query
          required: false
          description: 상태 탭. 생략하면 전부.
          schema:
            type: string
            enum: [WATCHING, DEFERRED, PRICE_RECEIVED, BID_PLANNED, BID_RECORDED, AWAITING_OPENING, OPENED_PROVISIONAL_FIRST, OPENED_OUT_OF_RANK, UNDER_QUALIFICATION_REVIEW, WON, LOST, FAILED_OR_REBID, SKIPPED, DEADLINE_PASSED_UNRECORDED]
      responses:
        "200":
          description: >-
            그 종류의 내 건 목록. **맨 위가 배열**이다 — 배열을 감싼 object 는 평탄 규칙
            (D-6A1-20 ⓑ)에 걸리고, `searchNotices` 도 같은 모양으로 배열을 바로 낸다.
            요청이 `kind` 를 지정했으므로 응답이 그것을 되풀이하지 않는다.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BidCase"
        "400":
          description: "요청 본문·질의 형식 오류(알 수 없는 키 포함). code: INVALID_REQUEST"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: "인증 실패 또는 **계정 주체가 아닌 인증**(입찰함은 계정 경로 전용이다). 사유를 나누지 않는다(D-6A1-6). code: UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: "내부 오류 또는 감사 기록 실패(D-6A1-17, fail-closed). code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    post:
      operationId: addBidCase
      summary: 관심 담기 — 입찰함에 건을 연다(M7/7B)
      description: >-
        pull 모델(§0.7)에서 **사용자가 담은 것만** 입찰함에 들어온다. 같은 (공고, 종류)에
        건은 하나이므로 이미 있으면 그 건을 그대로 돌려준다 — 새로 담았으면 201, 이미 담긴 건이면
        200 이다(화면이 「담겼습니다」와 「이미 담긴 건입니다」를 가른다).
      security:
        - browserSession: []
          operatorCsrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddBidCaseRequest"
      responses:
        "200":
          description: 이미 담긴 건 — 그 건을 그대로 돌려준다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BidCase"
        "201":
          description: 건이 새로 열렸다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BidCase"
        "400":
          description: "요청 본문·질의 형식 오류(알 수 없는 키 포함). code: INVALID_REQUEST"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: "인증 실패 또는 **계정 주체가 아닌 인증**(입찰함은 계정 경로 전용이다). 사유를 나누지 않는다(D-6A1-6). code: UNAUTHENTICATED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "415":
          description: "요청 본문이 application/json 이 아니다. code: UNSUPPORTED_MEDIA_TYPE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: "내부 오류 또는 감사 기록 실패(D-6A1-17, fail-closed). code: INTERNAL_ERROR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
