        evidenceRef:
          type: string
          nullable: true
          maxLength: 128
          description: >-
            제출확인서 등 증빙의 **참조(식별자)** 다 — 파일도 경로도 본문도 아니다.
            PDF 저장소는 이 slice 밖이다.
        memo:
          type: string
          nullable: true
          maxLength: 2000
          description: 자유 텍스트(2000자 상한). 로그·audit 어디에도 실리지 않는다.
    AwaitOpeningRequest:
      type: object
      required:
        - openingAt
      properties:
        openingAt:
          type: string
          format: date-time
    RecordOpeningRequest:
      type: object
      required:
        - provisionalFirst
      properties:
        provisionalFirst:
          type: boolean
          description: 순위 숫자를 받지 않는다 — 「몇 위보다 낙찰 여부」(§6.1).
    QualificationReviewRequest:
      type: object
      required:
        - documentDueAt
      properties:
        documentDueAt:
          type: string
