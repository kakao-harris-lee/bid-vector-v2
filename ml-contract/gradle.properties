# included build 는 루트의 gradle.properties 를 상속하지 않는다(`build-logic`과 같은 사실).
# `build-logic/build.gradle.kts`는 이 사실을 파일 파싱으로 우회하지만, 이 빌드는 손으로 쓴
# 소스가 0(D-2A-6)이라 그 우회를 정당화할 만한 나머지 로직이 없다 — 값 자체를 정본
# `../gradle.properties`와 나란히 복제한다. 정본이 바뀌면 이 파일도 함께 고친다.
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g
org.gradle.caching=true

kotlin.code.style=official

bidvector.jvmToolchain=21
