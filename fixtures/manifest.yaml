          data-dictionary.md §5.2 규칙 · §1.2(배정예산 = `AllocatedBudget`, basis 배정예산, 과세 `Unknown`) ·
          §1.2.1(정의상 기본값 자동 태깅 금지 · `Unknown` 금액의 산술 비교 차단) · §5.1(`FilledFromBudgetKey`) ·
          v2-지침서.md §4.1
    expected_reasoning: |-
      data-dictionary.md §5.2 *"derived fact가 canonical fact의 자리를 차지할 수 없다. 자리가 같아야 한다면 **타입이 달라야 한다**
      — `ResolvedBaseAmount.Direct` vs `.FallbackFromBudget(sourceKey)`"*. `variant`·`targetSlot`이 그 **해석 결과와 대상
      역할**을 나른다.

      **그 역할이 값의 원천 표기를 덮지 않는다.** §1.2의 배정예산 행이 *"`asignBdgtAmt`·`bdgtAmt` | `AllocatedBudget` |
      원 / 배정예산 | `Unknown` — 정해진 바 없다"*이므로 폴백된 값의 basis 는 `ALLOCATED_BUDGET`, 과세는 `UNKNOWN`이다.
      **`BASE_AMOUNT`로 다시 표기하면 §1.2 머리가 legacy 결함으로 든 *"한 basis 태그가 두 개념을 덮고"*를 그대로 재현하고,**
      §1.2.1의 *"legacy 유래 행은 정의상 기본값으로 **자동 태깅하지 않는다**"*를 어긴다. 값이 딛는 provenance 는 §5.1의
      `FilledFromBudgetKey(key)`이며 §5.1 계승 규율 1이 그것을 **권위가 아닌 것**으로 둔다.

      `arithmeticComparisonWithBaseAmountBasisAllowed: false`의 근거는 둘이다 — §1.2.1 *"**`Unknown` 금액은 다른 과세
      처리의 금액과 산술 비교에 들어갈 수 없다**(타입 차단)"* + `v2-지침서.md` §4.1 *"`BaseAmount`, `EstimatedAmount`,
      `YegaAmount`, `BidAmount`를 원시 숫자로 상호 대입하지 못하게 한다"*. **이 항이 basis·과세 보존의 실제 결과다** —
      보존이 표기에만 남고 결과가 없으면 laundering 을 막지 못한다.
