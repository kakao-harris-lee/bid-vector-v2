          조달청 공공데이터 개방 OpenAPI 참고자료 — 나라장터 입찰공고정보서비스 v1.2 (`official_documents` 의 `koneps-openapi-reference`) — 물품·공사·용역 **기초금액조회** 세 오퍼레이션의 응답 항목 명세에 `bssamt`(기초금액, 항목크기 21, 옵션) 행이 있다.
