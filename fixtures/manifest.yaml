        **23 오퍼레이션**의 요청·응답 메시지 명세 — 항목명(영문) · 항목명(국문) · 항목크기 ·
        항목구분(필수 `1` / 옵션 `0`) · 샘플데이터 · 항목설명. `koneps-openapi-reference` 와 같은 형식이며
        **개찰·낙찰·복수예비가격 축의 항목 명세가 이 문서에 있다** — `reports/evidence/m3/3a/policy-values.md`
        §1.7(개찰·예비가격 필드 계약)과 §1.9(오퍼레이션 계약)가 이 문서를 인용하는 절이고, 그 두 절이 이
        저장소 안의 인용 정본이다.
        문서가 문면으로 주는 운영 한계는 **23 오퍼레이션 전부 동일**하다 — 최대 메시지 사이즈 · 평균 응답
        시간 · 초당 최대 트랜잭션(값은 §1.9 가 싣는다).
        **「OPEN API 에러코드별 조치방안」 16 코드 표가 이 문서 끝에도 있다** — `pps-openapi-guide`(2019
        활용가이드)의 그 절과 코드 집합·순서·이름이 같다. 이것이 그 표를 **공공데이터포털 공통 절**로 보는
        방증을 `observed`/`legacy-behavior` 에서 **조달청 참고자료 문면**으로 올린다(P-4 의 적용 범위 물음).
      what_it_does_not_contain: |-
        ① **조회 기간 상한을 선언하지 않는다** — `inqryBgnDt`/`inqryEndDt` 는 형식(`YYYYMMDDHHMM`)과 「조회구분이
        1·2·3 일 경우 필수」만 적고 창의 최대 길이가 없다. (같은 조달청의 `pps-opnstd-reference` 는 자기
        서비스에 대해 상한을 적는다 — 서비스가 다르므로 전이하지 않는다.)
        ② **개찰 축 금액의 과세를 선언하지 않는다** — 최종낙찰금액·예정가격·기초예정가격 항목설명이 `(원화,원)`
        만 적는다. `OPEN-REG-05` 와 같은 갈래로 열린 채 남는다.
        ③ **일시의 출처 타임존이 없다** — 형식이 `YYYY-MM-DD HH:MM:SS` 고 항목크기가 그것을 꽉 채워 offset
        자리가 없다. `OPEN-3A-SOURCE-TZ` 가 그대로 적용된다.
        ④ **`resultCode` 의 범주(재시도 가능/불가·quota·입력 오류·데이터 없음)가 없다** — 위 16 코드 표는
        사람이 읽는 조치방안이고 그 판정은 `pps-openapi-guide` 와 마찬가지로 이 문서도 하지 않는다.
        ⑤ **업무구분 코드 전체 체계가 없다** — 업종은 오퍼레이션 이름(`…Thng`·`…Cnstwk`·`…Servc`·`…Frgcpt`)으로
        갈리고 코드표가 실리지 않는다. `OPEN-COL-03` 은 열린 채다.
