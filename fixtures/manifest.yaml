      sha256: 1d79e0bc23b2ff253212e47c4421141b4624c2496bba4513127aeb986dd75a8d
      accessed: "2026-09-07 — read-only (M3/3A curator 레인). legacy 저장소를 수정하지 않았다."
      what_it_declares: |-
        23 오퍼레이션의 요청·응답 메시지 명세 — **항목명(영문) · 항목명(국문) · 항목크기 ·
        항목구분(필수 `1` / 옵션 `0` / `1..n` / `0..n`) · 샘플데이터 · 항목설명**. 금액·율 항목의
        항목설명이 **단위와 과세를 문면으로 적는 자리**가 여기다(예: 추정가격의 *"부가가치세 및 조달
        수수료를 제외한 금액(원화,원)"* · 낙찰하한율의 *"개찰시 사용하는 낙찰하한율(%)"*).
        `koneps-collection-010`~`018` 이 이 표를 인용한다.
      what_it_does_not_contain: |-
        **`resultCode` 의 17 범주 분류표(「OPEN API 에러코드별 조치방안」)가 이 문서에 없다.**
        `resultCode` 는 응답 항목 명세에 **항목크기 2 · 항목구분 필수 · 샘플 `00`** 으로만 실리고,
        코드값의 의미·조치 표는 어느 절에도 없다. 저장소 전체 검색으로도 다른 사본을 찾지 못했다.
        그래서 **`OPEN-COL-02` 가 결정으로는 해소됐으나 표 본문은 여전히 미확보**이고,
        `uncovered_axes` 의 「KONEPS — `resultCode` 분류표」 축은 열린 채로 남는다.
      privacy: |-
        문서에는 실제 기관명·담당자 성명·전화번호·이메일과 실제 공고번호가 실려 있다.
        **fixture 에 옮기지 않았다** — 인용 대상은 항목 명세 행(영문 키 · 국문 개념 · 크기 · 구분 ·
