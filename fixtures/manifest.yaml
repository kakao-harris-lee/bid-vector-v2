          v2-지침서.md §4.1
    expected_reasoning: |-
      v2-지침서.md §4.1 *"`Rate`는 내부 fraction 표현 하나만 사용한다. percent 입력은 adapter에서 명시적으로 변환하며 원문 unit을
      기록한다"* + *"unit/basis/provenance가 없거나 모르는 값은 추측하지 않고 거부 또는 `Unmeasurable`로 반환한다"*. 변환 제수 `100`은
      data-dictionary.md §12.1이 `authoritative`(단위 정의)로 등재한 유일한 율 관련 수다.
      **결과 토큰의 어휘는 운영자 결정 2026-09-05 decision 19 가 정한다** — 상태는 `Fact.Known`/
      `Fact.Absent`(`data-dictionary.md` §1.1), 사유는 `ReasonCode` enum 이름이다. **V2 산출을 근거로
      들지 않았다** — 재추출한 값은 위 승인 문면과 그 결정에서만 나왔고, 이 case 가 주장하는 규칙은
      재추출 전후로 같다.
      **`{"representable": false}` 라는 형태의 근거 — 계약 정정 첫째(2026-09-05).** §4.1 이 요구하는
      *"추측하지 않고 거부"* 를 1B 계약은 **런타임 거부가 아니라 구성상 불가**로 지켰다: `Rate` 의
      생성자가 `internal` 이고 모듈 밖 공개 경로는 **단위를 이름에 담은 `ofPercent`·`ofFraction`
      둘뿐**이라, 단위를 모르는 값으로 `Rate` 를 만들 함수가 없다(`@ConsistentCopyVisibility` 가
      `copy()` 우회도 막는다). 그러므로 거부 객체·사유 코드가 **생기지 않고**, 이 case 가 적을 수 있는
      기대값은 「그 조합은 **표현 불가**」 하나다. **`money-basis-001`·`004` 와 같은 형태이고 같은
      근거 구조**다 — 그쪽은 basis 교차, 이쪽은 단위 미선언이며 둘 다 컴파일 fixture 가 실행자다.
      **운영자 결정 decision 21** 이 「승인된 계약이 이긴다」로 이 형태의 재작성을 승인했다.
      **V2 산출을 근거로 들지 않았다** — 근거는 §4.1 문면과 `Rate` 선언의 가시성, 그리고 그 결정이다.
