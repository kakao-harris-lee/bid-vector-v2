      `resultCode` 분류표는 운영자 결정 `OPEN-COL-02`가 소유한다고 §4.3.2가 적으나 **표의 내용이
      이 저장소의 문서에 실려 있지 않다.** 인코딩·구분자 정규화 규칙은 승인된 명세가 없다.
    owning_open:
      - "OPEN-COL-02 — **활성 아님. 2026-08-26 해소**(분류표 등재 결정은 내려졌다). 그럼에도 **표의 내용이 이 저장소 문서에 없어** 이 축은 막혀 있고, 그 자리를 소유한 활성 `OPEN`도 없다 · (인코딩·구분자) 소유 `OPEN` 없음 — 명세 부재"
    unblocks_when: 분류표 본문이 명세에 등재되고 정규화 규칙이 정해진다.

  - axis: ML — 피처 스키마 version · artifact checksum · LightGBM 오류 · KDE singular · deterministic seed
    domain: ml-boundary
    why_blocked: |-
      `data-dictionary.md` §6.3이 *"피처 계약은 M2 gRPC 스키마가 소유하고, 이 문서는 피처 이름이
      참조하는 도메인 개념만 정의한다"*로 소유를 M2에 둔다. **그 계약이 아직 없다.**
    owning_open:
      - "(소유 OPEN 없음) — M2 계약 slice 의 산출물 대기"
    what_is_covered_instead: |-
      `ml-boundary-001`~`004`가 **경계**(업무 판정은 Kotlin, 결측 사유, 누수 차단 시그니처)만
      고정한다. **⚠ `-003`·`-004`는 `insufficient-evidence` 다** — `authoritative` 로 남는 것은
      `v2-지침서.md` §3.2 가 직접 떠받치는 `-001`·`-002`의 판정 경계뿐이다.
    unblocks_when: M2 gRPC 피처 계약이 작성된다.

  - axis: "`SkipReason` 어휘의 전수성"
    domain: verdict
    why_blocked: "최소 두 값은 확인되나 목록이 닫혔는지는 미확인. 지금 닫으면 게이트 사다리를 옮기며 발견될 사유가 갈 곳을 잃는다."
    owning_open:
      - "OPEN-DIC-03 (활성)"
    what_is_covered_instead: |-
      **덮이지 않는다.** 이 자리를 덮던 `verdict-001`·`002`(확인된 두 값으로 「문장이 아니라 reason
      code 로 구분된다」를 고정)가 **둘 다 `insufficient-evidence` 로 내려갔다** — 그 두 값 자체가
      승인된 어휘가 아니라는 것이 강등 사유다(아래 「승인 부재로 authoritative 덮개를 잃은 축 —
      verdict」). 그래서 **전수성 이전에 어휘 자체가 미승인**이고, 두 축은 이제 겹쳐 있다.
    unblocks_when: |-
      전수성은 M1 에서 게이트 사다리를 옮길 때 `OPEN-DIC-03` 이 닫는다. 다만 그 전에 어휘 축의
      승인이 필요하다 — 아래 verdict 축의 `unblocks_when` 이 지목하는 문면.

  - axis: 반올림 — `RoundingPolicy`의 `mode` · 금액 축 밖 `scaleDigits` · 첫 `effectiveFrom`
    domain: money-basis / floor-shortfall
    why_blocked: "승인 명세가 요구하는 것은 **형태**(`RoundingPolicy`와 version)뿐이고 값을 고를 근거가 없다."
    owning_open:
