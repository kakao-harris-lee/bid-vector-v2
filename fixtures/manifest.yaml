# 2026-09-02 · uncovered_axes 서사 정합 (Codex B11 medium)
#   `rate-unit` 휴리스틱 축의 `note` · 「승인된 피연산자 부재」 축의 `what_is_covered_instead` ·
#   「검증 주장에서 내린」 축의 `why_blocked`/`what_is_covered_instead` 넷이 **강등 이전 상태**를
#   현재형으로 말하고 있었다(그 자리를 지던 case 들이 2026-09-02 동결+강등으로 내려갔다).
#   현재 상태는 **분류의 정본(각 case 의 `classification` · F-7 · C-15)을 가리키는 규칙형**으로 바꾸고,
#   앞 라운드 시점의 상태는 **과거형·시점 표기로 분리**했다. 「case 를 내리지 않았다」와 강등 인정이
#   한 축 안에서 부딪히던 자리도 그 분리로 풀었다. **case 목록·건수를 산문에 다시 박지 않았다.**
#   **분류·계약·스윕 무접촉** — 21/42 불변, 해시 126, 스윕 통과 0. 재발 검사는 `commands.md` **C-12b**.
uncovered_axes:

  - axis: 과세/비과세 경계 쌍 (기초금액 ↔ 추정가격)
    domain: money-basis
    why_blocked: |-
      **유보 사유가 「정의 미결」에서 「저장 값 비일관」으로 바뀌었다.** 정의는 운영자 결정
      U-1(추정가격 `Exclusive`)·U-1b(기초금액 `Inclusive`)로 정해졌다. 그러나
      `data-dictionary.md` §1.2.1이 *"저장된 legacy 값의 실제 과세 처리는 여전히 행마다 다르다"*를
      legacy 자신의 공시로 적는다 — 수집 키가 공고마다 달라 legacy 데이터로는 **행별 라벨을 붙일
      수 없다.** 지금 만들면 미결 과세 의미로 corpus 경계가 굳는다.
    owning_open:
      - "OPEN-REG-05 (활성) — ① 두 금액 차이의 **잔차 성분**(사정률 등) ② **저장 값의 행별 실제 과세 처리**"
    what_is_covered_instead: |-
      **열릴 당시에는** `money-basis-001`·`004`가 **basis 태그가 다른 값 쌍**을 고정하고(두 값의 수치를
      같게 두어 어느 쪽이 크다는 전제를 넣지 않는다 — `regression-ledger.md` §10.1 인계의 요구),
      `money-basis-006`이 legacy 유래 행의 자동 태깅 금지를 고정했다. **그 case 들이 2026-09-02 의
      동결+강등으로 내려가 지금 이 축에 `authoritative` 덮개가 없다.** 어느 case 가 어느 층인지는
      **각 case 의 `classification` 이 정본**이고 셈은 **F-7**·**C-15** 가 낸다.
    unblocks_when: OPEN-REG-05 가 닫히고 행별 과세 판정 근거가 생긴다.

  - axis: "`기초금액 ÷ 추정가격` 신뢰 상한의 경계값"
    domain: base-amount-provenance
    why_blocked: |-
      legacy 임계 `1.15`의 구성은 부가세 배수 `1.1` + 마진 `0.05`이고 **그 마진이 활성
      `OPEN-DEC-07`의 재유도 대상이며 값이 아직 산출되지 않았다**(capability-map.md DEC-02 결정).
      legacy 값으로 경계를 굳히면 재유도 뒤에 틀린 값이 남는다.
    owning_open:
      - "OPEN-DEC-07 (활성) — 신뢰 비율 마진의 재유도. **값 미산출**"
    what_is_covered_instead: |-
      `base-amount-provenance-002`·`003`이 **판정 순서**만 고정한다 — 같은 rule hit 에 두 정책
      순서를 넣어 결과가 갈리는 것으로 「순서가 load-bearing 이고 정책 데이터로 외부화된다」만
      재고, **어느 순서가 옳은지는 재지 않는다.**
    unblocks_when: OPEN-DEC-07 이 마진 값을 낸다.

  - axis: provenance 판정의 허용 오차와 배수 (정수 `1e-6` · 예정가 역산 `1.0`원 · VAT `0.01` · 배수 `1.1`)
    domain: base-amount-provenance
    why_blocked: |-
      `data-dictionary.md` §12.1이 넷 모두 `legacy-behavior`로 등재한다. 승격 결정이 없으므로
      **정수 원화 후보 / 예정가 역산형 소수 / VAT 파생형 / 추정가격과 모순되는 비율**의 실제
      경계 case(`data-extract.md` §4 최소 corpus 넷)를 만들 수 없다.
    owning_open:
      - "(소유 OPEN 없음) — 승격에는 운영자 결정이 필요하다. `OPEN-DIC-05`가 인접 축(라벨 다섯의 덮개)을 소유한다"
    unblocks_when: 허용 오차·배수를 정책 데이터로 승격하는 운영자 결정이 나온다.

  - axis: "`BaseAmountProvenance`의 미판정(`NULL`) 상태와 여섯째 라벨 `suspect-fractional`"
    domain: base-amount-provenance
    why_blocked: |-
      *"아직 판정하지 않음"이 "신뢰함"으로 접히면 안 된다*는 요구는 확정이나, 그것을 승인 명세의
      어느 variant 가 나르는지(`Unknown`에 접는가, 별도 variant 를 더하는가)가 미결이다.
      `suspect-fractional`도 승인 명세에 대응 이름이 없다.
    owning_open:
      - "OPEN-DIC-05 (활성)"
    unblocks_when: 라벨 집합 변경을 승인하는 별도 결정이 나온다.

  - axis: 밴드 경계 corpus (§1.4.3 B1~B7의 실제 값과 경계 포함성)
    domain: floor-shortfall / rate
    why_blocked: |-
      일곱 밴드 전부 `legacy-behavior`다(§12.1). `data-dictionary.md` §13.1이 *"밴드 경계 fixture 는
      §1.4.3의 일곱 밴드를 **축별로 나눠** 만든다. 값이 같고 축이 다른 **B4·B5를 한 case 에 섞지
      않는다**"*를 지시하나, **축을 나누는 것과 값을 정답으로 고정하는 것은 다르다** — 값을 쓰려면
      승격 결정이 필요하다.
    owning_open:
      - "(B7만) OPEN-ML-05 (활성) — 근거 없는 미분류 상수"
      - "(B1~B6) 소유 OPEN 없음 — 승격에 운영자 결정이 필요하다"
    what_is_covered_instead: |-
      `floor-shortfall-005`가 **synthetic 밴드**로 「밴드 밖 표본이 분모에서 빠지고 표본 부족으로
      전이된다」는 규칙만 고정한다. B4·B5는 축이 다른 별도 사본이므로 **같은 case 에 넣지 않았고**,
      이 corpus 는 둘 중 어느 것도 값으로 쓰지 않는다.
    unblocks_when: 밴드 값·경계 포함성을 정책 데이터로 승격하는 결정이 나온다.

  - axis: 법정 하한율 표의 값과 추정가격 구간 경계
    domain: floor-applicability
    why_blocked: 신율·구율 여섯과 구간 경계 셋이 전부 `legacy-behavior`이고 V2 값의 확정을 활성 OPEN 이 소유한다.
    owning_open:
      - "OPEN-DEC-10 (활성)"
    what_is_covered_instead: |-
      `floor-applicability-003`·`004`가 **synthetic 시행일 표**로 「경계 전후 하루 차이로 다른 tier,
      소급 없음」만 고정하고, `-002`가 「기준일 미상이면 표를 적용하지 않는다」를 고정한다.
      **표 대상 범위를 벗어난 추정가격 구간의 판정 생략**은 구간 경계 값이 필요해 덮지 못했다.
      **⚠ 셋 다 2026-08-31 로 `insufficient-evidence` 다** — 이 「덮개」는 `authoritative` corpus 의
      덮개가 아니다. 그 축은 아래 「승인 부재로 authoritative 덮개를 잃은 축 — floor-applicability」가 받는다.
    unblocks_when: OPEN-DEC-10 이 V2 값을 확정한다.

  - axis: 면허 — 별칭 · 포괄 코드 · 지역 · 협회 조건
    domain: license
    why_blocked: |-
      `v2-지침서.md` §4.2가 넷을 versioned policy data 로 요구하나 **그 정책 데이터가 아직 없고**,
      면허 축이 정책 version 을 싣는지 자체가 미결이다. 협회·기술부문 어휘 테이블은 legacy 실물이
      세그먼트 편향(`TECH_FIELD_TERMS` 넷이 전부 해양 계열)이라 그대로 쓸 수 없다.
    owning_open:
      - "OPEN-DIC-01 (활성) — 면허·지역 축이 정책 version 을 싣는가"
      - "OPEN-QUAL-07 (활성) — 어휘 테이블의 세그먼트 편향"
    unblocks_when: 면허 정책 데이터의 소유와 version 축이 정해진다.

  - axis: "면허 — 허용업종(`permsnIndstrytyList`) 단독 보유의 결합 규칙"
    domain: license
    why_blocked: |-
      조달청 문서가 결합 규칙을 말하지 않는다(0A2 라운드 5 재확인). **운영자 판정 2026-08-30 —
      지금 답하지 않고 다시 열어 둔다. M1 자격 slice(1C)가 실제 공고로 관측해 닫는다.**
    owning_open:
      - "OPEN-QUAL-11 (활성)"
    what_is_covered_instead: |-
      `license-011`이 결정 전 임시 처리(사유 있는 `Uncertain`)를 `provisional`로 든다.
      **⚠ 그 case 는 2026-08-31 로 `insufficient-evidence` 다** — 활성 `OPEN` 의 임시 처리를
      `authoritative` golden 으로 고정하지 않는다(Codex 리뷰 B `findings[2]`). **이 축은 `authoritative`
      corpus 에서 덮이지 않는다.**
    unblocks_when: M1 slice 1C 의 관측.

  - axis: 면허 유효기간
    domain: license
    why_blocked: "U-7이 **V2는 보지 않는다**로 확정했다. 판정 자체를 만들 수 없다."
    owning_open:
      - "OPEN-QUAL-05 — **활성 아님. 0E 가 해소했다**(2026-08-30). 이 축을 소유한 활성 `OPEN`은 없다: U-7이 「V2는 다루지 않는다」로 닫았고 남는 것은 알려진 제한(`data-dictionary.md` §8 제한 2)이다"
    what_is_covered_instead: "`license-012`가 「유효기간을 보지 않으며 결과에 「유효기간 미검증」이 드러난다」를 고정한다."
    known_conflict: |-
      **지침서 쪽 어긋남은 해소됐다.** `v2-지침서.md` §4.2 의 원 문면이 유효기간을 versioned policy
      data 요구에 함께 넣어 U-7 과 어긋나 있었고, 0E 의 spec-writer 레인이 **유효기간 축만 뺐다**
      (커밋 `1fe87eb` — 이 manifest 커밋보다 먼저 들어왔다). 별칭·포괄 코드·지역·협회 조건은 그대로다.
      **남은 어긋남은 `data-dictionary.md` §8 제한 7 · §13.5 가 그 해소를 아직 반영하지 않은 것이며,
      두 자리는 이 slice 의 `out_of_scope` 라 낡은 채 남는다.**

  - axis: 시공능력평가금액 요건과 보유액의 실제 비교
    domain: capacity-gate
    why_blocked: |-
      ① 공고 게시 요건 필드(`cnstrtnAbltyEvlAmtList` 계열)를 legacy 가 **수집하지 않는다**
      (`ed4b06c`에 키가 없다) — 비교 대상이 없다. ② 게시값의 **단위·과세**가 조달청 문서에 없어
      관측으로만 알 수 있다. ③ 요건 미달의 처리(즉시 실격 vs 적격심사 감점)가 미결이다.
    owning_open:
      - "OPEN-QUAL-10 (활성) — 게시 요건 축의 unit·과세·기준 시점"
      - "OPEN-QUAL-09 (활성) — 미달의 처리"
      - "OPEN-DIC-02 (활성) — 시공능력평가액 공시의 갱신 주기가 역년 경계인가"
    what_is_covered_instead: |-
      `capacity-gate-001`~`004`가 무조건 acceptance 넷(미입력 ≠ 0, 명시 0 은 `Known(0원)`, 도급한도는
      자격 어휘 아님, 요건 없음 중립)을 고정한다. **⚠ 그중 `-001`·`-002`·`-004`는 `insufficient-evidence`
      다** — 그 셋이 재는 부재·중립 상태의 산출 형태는 `OPEN-QUAL-08` **분할 확정** 문면이 정하지
      않고 `capability-map.md` QUAL-11 의 자체 도출이다. 그 몫은 `authoritative` 덮개에 세지 않으며
      아래 「승인 부재로 authoritative 덮개를 잃은 축 — capacity-gate」가 받는다. `authoritative` 로
      남는 것은 **분할 확정 문면의 재진술**인 `-003`(도급한도·연매출은 자격 어휘 아님)뿐이다.
    unblocks_when: M1 이후 수집 신설 + OPEN-QUAL-09/10 결정.

  - axis: KONEPS — rate limit · timeout · partial page · out-of-order · 중복/수정 이벤트
    domain: koneps-collection
    why_blocked: |-
      늦은 관측의 **적용**은 필드별 fold 가 내는데 그 fold 의 순서 술어(총순서 키·tie-break)가
      미결이고, 전송 멱등 키와 재관측 키의 **구성**도 미결이다. legacy 에 답이 없다 — 전달 순서대로
      in-place mutate 하고 순서 키를 읽지 않으며 `observed_at`이 nullable 이다.
    owning_open:
      - "OPEN-DIC-09 (활성) — fold 의 순서 술어"
      - "OPEN-DIC-07 (활성) — 전송 멱등 키와 재관측 키의 구성"
      - "OPEN-OPS-01 / OPEN-REG-01 (활성) — 재시도 정책과 그 측정"
    unblocks_when: 위 셋이 닫힌다.

  - axis: KONEPS — HTML fallback 경로
    domain: koneps-collection
    why_blocked: |-
      브라우저 경로의 존치 자체가 `근거 부족`으로 분류돼 있다(COL-09). *"브라우저 경로로만 얻을 수
      있는 필드 목록"*을 조사가 특정하지 못했다.
    owning_open:
      - "OPEN-COL-04 (활성)"
    note: |-
      **결정 전이라도 확정된 제약은 있다** — 값 크기·위치 휴리스틱으로 basis 를 추측하는 경로는
      V2에 도입하지 않는다. **다만 그 제약을 지금 `authoritative` 로 고정하는 case 는 없다** —
      그 몫을 지던 자리가 **2026-09-02 동결+강등**으로 내려갔다. **제약의 선언은 남고 기계 덮개만
      비었으며**, 되돌림은 「계약 술어 부재로 `authoritative` 를 유지하지 못한 축」이 지목한다.
      `koneps-collection-002`도 같은 제약을 다른 축에서 들지만 **2026-08-31 로 `insufficient-evidence`**
      이므로 그 몫도 `authoritative` 덮개에 세지 않는다.
      **어느 case 가 어느 층인지는 여기서 열거하지 않는다** — 각 case 의 `classification` 이 정본이고
      셈은 **F-7**·**C-15** 가 낸다.

  - axis: KONEPS — 잘못된 인코딩 · 천 단위 구분자 (**`resultCode` 축은 2026-09-07 해소**)
    domain: koneps-collection
    why_blocked: |-
      `resultCode` 분류표는 운영자 결정 `OPEN-COL-02`가 소유한다고 §4.3.2가 적으나 **표의 내용이
      이 저장소의 문서에 실려 있지 않다.** 인코딩·구분자 정규화 규칙은 승인된 명세가 없다.

      **2026-09-07 오전 — 입찰공고정보서비스 참고자료에는 없음을 확인했다.** `official_documents` 의
      `koneps-openapi-reference` 를 전수 검색했고 `resultCode` 는 **응답 항목 명세에 항목크기 2 ·
      항목구분 필수 · 샘플 `00` 으로만** 실린다. 「OPEN API 에러코드별 조치방안」 절이 그 문서에 없다.

      **2026-09-07 오후 — 표 본문이 확보됐다.** 오케스트레이터가 **조달청 OpenAPI 활용가이드 —
      나라장터 공공데이터개방표준서비스 v1.2(2019.06)** 를 확보했고 그 문서 끝의 「OPEN API 에러코드별
      조치방안」 절이 표다(`official_documents` 의 `pps-openapi-guide`). curator 레인이 docx 원문에서
      **독립 재추출**해 인수본과 대조했다(16행 일치). **코드 16 + `00` = 17** 이 `OPEN-COL-02` 문면의
      「17」과 맞는다. `koneps-collection-027` 이 표를 인용하고 **그 입력 파일이 16행 전문의 커밋된
      정본**이다(원 docx 는 `_workspace/` 아래라 저장소에 없다).

      **그리고 같은 날 오후 남은 둘도 승인됐다 — `resultCode` 축은 해소된다.** 운영자가 P-4 에 답했다.
      ① **적용 범위**: 이 표가 `BidPublicInfoService` 에도 적용된다고 본다(방증 둘 — 두 문서의
      `resultCode` 선언 일치, legacy 가 대상 서비스에서 관측한 `08` 의 문면 일치).
      ② **범주 매핑**: `policy-values.md` §3.2 의 「V2 범주 후보」 열을 정책 데이터 초기값으로 채택 —
