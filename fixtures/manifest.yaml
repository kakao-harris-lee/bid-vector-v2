# =============================================================================
# M1 계약 대조 — 1B 가 세운 shared-kernel 타입 계약과 이 corpus 의 대조 (운영자 결정 C13)
# =============================================================================
# 각 case 의 `contract_binding` 이 이 절을 가리킨다. **정본은 여기 하나**이고 case 는 포인터다.
m1_contract_binding:
  decision: |-
    **운영자 결정 C13 (2026-09-04)** — 「M1 계약 술어 설계」의 소유 slice 를 1B 로 둔다.
    `uncovered_axes` 의 「계약 술어 부재로 **authoritative 를 유지하지 못한** 축」이 그 되돌림을
    *"M1 계약 설계가 필요한 술어를 갖추면 그 case 에 계약을 달고 `authoritative` 로 되돌린다"* 로
    적었고, 이 절이 그 대조를 실행한 결과다.
  method: |-
    1B 가 `shared-kernel` 에 들인 값 타입(`Money` 여섯 · `Rate` · `Basis` · `VatTreatment` ·
    `Provenance` · `Fact` · `Measurement` · `ReasonCode` · `Derived`)의 **실제 선언**을 읽고,
    `rate-unit`·`money-basis` 11 case 의 `verifies` 가 주장하는 축이 그 계약의 **어느 경로에
    실리는가**를 case 마다 적었다. 읽은 것은 커밋된 Kotlin 선언과 그 회귀 테스트의 성질이며,
    **기대값·입력 파일·해시는 열지도 바꾸지도 않았다.**
  result: |-
    **아래는 1B 레인(2026-09-04)의 기록이다** — 그 시점의 판정이고 현재 상태가 아니다.
    **2026-09-05 갱신(1B-c)**: 운영자 결정 18·19·21 이 ①②를 풀었고 열하나 가운데 열이
    재추출·재정의로 `authoritative` 로 돌아왔다(`money-basis-003` 은 이월). **현재 분류의
    정본은 각 case 의 `classification` 이고 셈은 C-5 가 낸다** — 아래 문단을 현재형으로 읽지 않는다.

    **되돌린 case 는 0 건이다.** 11 case 전부 `insufficient-evidence` 인 채로 있다.
    막은 것은 둘이고 **둘 다 이 레인의 쓰기 범위 밖**이다.

    **① 술어 어휘의 동결이 풀리지 않았다.** 술어를 늘리는 자리는 `schema.extensions` 의 정의와
    그 정의를 실행하는 `fixtures/tools/manifest_contract.py` **둘 다**이고, 뒤엣것은 1B 의
    `in_scope` 가 아니다. 정의만 늘리면 스윕이 `ManifestFormatError` 로 멈춘다 —
    「동결된 어휘 밖의 술어」가 그 자리다. **분류를 정하는 것은 산문이 아니라 스윕**이라
    (`authoritative` = 확장 적대 집합에서 위반 변이체 통과 0), 돌릴 수 없는 술어로는
    되돌림을 **증명할 수단이 없다.** 그래서 설계만 아래 `predicate_design` 에 남긴다.

    **② 결과 토큰이 M1 계약에 **없다** — 「승인 문면 부재」보다 강한 사실이 드러났다.**
    앞선 강등은 `Accepted`·`Rejected` 를 *"승인 문면이 하나도 없는 가족 B 자작 토큰"* 으로
    적었다. 1B 계약이 선 지금 그 진술은 **더 좁혀진다**: 그 축을 1B 가 **다른 이름으로 채택**했다.
    상태는 `Fact.Known`/`Fact.Absent`(`data-dictionary.md` §1.1) 와
    `Measurement.Measured`/`Measurement.Unmeasurable`(§1.6) 가 나르고, 사유는 `ReasonCode`
    enum 이 나른다. `Accepted`·`Rejected`·`Comparable`·`Uncertain` 은 저장소 전체에서
    `fixtures/` 와 0E evidence 밖에 **한 건도 없다**(2026-09-04 실측).
    그러므로 그 경로를 `verified_paths` 에 넣는 것은 **계약이 채택하지 않은 이름을 M1 golden 으로
    잠그는 것**이라, 2026-09-01 결정(미승인 리터럴은 정확 비교에 두지 않는다)이 그대로 막는다.
  token_alignment: |-
    fixture 가 직렬화하는 토큰과 1B 계약의 대조. **일치 열이 되돌림 가능성의 상한**이다.

    | fixture 토큰 | 1B 계약 | 판정 |
    | --- | --- | --- |
    | `basis: BASE_AMOUNT` | `Basis.BASE_AMOUNT` | 일치 |
    | `basis: ESTIMATED` | `Basis.ESTIMATED` | **해소**(2026-09-07, D-3A-7) — `koneps-collection` 입력·기대값의 `ESTIMATED_PRICE` 를 코드 토큰으로 정합했다 |
    | `vatTreatment: INCLUSIVE`·`EXCLUSIVE`·`UNKNOWN` | `VatTreatment` 세 값 | 일치 |
    | `provenance: OperatorDeclared`·`Published`·`Undeclared` | `Provenance` 세 variant | 일치 |
    | `reasonCode: VatTreatmentMismatch` | `ReasonCode.VAT_TREATMENT_MISMATCH` | 개념 일치·**표기 불일치** |
    | `reasonCode: RateUnitUndeclared` | `ReasonCode.UNIT_NOT_DECLARED` | 개념 일치·**표기 불일치** |
    | `reasonCode: BasisMismatch` | **없다** — basis 혼합을 구성상 불가로 막았다 | **설계 차이** |
    | `reasonCode: LegacyOriginNotPromotable` | 없다 | 부재 |
    | `outcome: Accepted`·`Rejected`·`Comparable`·`Uncertain` | **없다** — 상태는 `Fact`·`Measurement` 가 나른다 | **부재** |

    **표기 불일치는 `normalize: case-fold` 로 덮이지 않는다** — 구분자(`_`)와 단어 경계가 함께
    다르고, `case-fold` 는 대소문자만 접는다. 표기 통일이 M1/M2 로 이월돼 있는 그 자리다.
  design_divergence: |-
    **가장 큰 발견은 표기가 아니라 설계다.** `money-basis-001`·`004` 의 기대값은 basis 가 다른
    두 금액이 만나면 **런타임 객체**(`outcome` + `reasonCode`)로 거부된다고 적는다. 1B 계약은
    그 자리를 **컴파일 차단**으로 지었다 — `Money` 상위 타입에 `Comparable` 도 이항 연산도 두지
    않고, 여섯 금액 타입이 각자 `Comparable<자기 타입>` 만 구현한다. 그래서 `BaseAmount` 와
    `EstimatedAmount` 의 비교는 **애초에 컴파일되지 않고 거부 객체가 생기지 않는다.**
    `ReasonCode` 에 `BASIS_MISMATCH` 가 없는 것이 그 결과다(누락이 아니라 설계).

    **이 차이는 표기 매핑으로 메울 수 없다.** 두 case 를 이 계약 위에서 재사용하려면 기대값을
    「거부 객체」에서 「그 조합이 표현 불가」로 다시 써야 하고, 그것은 되돌림이 아니라 **재추출**이다.
    이 레인은 기대값을 바꾸지 않으므로 **하지 않았고**, 판단을 운영자·spec-writer 에게 올린다.
    `vatTreatment` 축은 다르다 — 그쪽은 값이 같아도 `UNKNOWN` 이면 막아야 해서 타입으로
    가를 수 없고, `sameKnownVat` 전건과 `ReasonCode.VAT_TREATMENT_MISMATCH` 가 **런타임에**
    나른다. 그래서 `money-basis-005` 는 개념이 계약에 그대로 있다.
  predicate_design: |-
    **2026-09-05 갱신 — 정의의 정본이 옮겨갔다.** decision 18 이 셋을 어휘로 채택했고 정의·실행·
    한계는 이제 `schema.extensions.verified_projections` 의 「술어 어휘」 절이 갖는다. 아래는
    **그 채택 이전의 설계문**이며 시점 기록으로만 읽는다(문면은 그 절이 승계했다).

    **설계만 남기고 구현하지 않는다.** 아래 셋은 Codex 재리뷰 B9 가 이름 든 술어를 이 corpus 의
    실제 변이체 위에서 다시 정의한 것이다. **어느 case 에도 달지 않았다** — 달면 현재 도구가
    「동결된 어휘 밖의 술어」로 멈춘다. 구현 자리는 `fixtures/tools/manifest_contract.py` 의
    `holds()` 이고, 스윕이 새 술어마다 (b)(c) 변이체를 만드는 규칙도 함께 넓혀야 한다.

    - **`is-present`** — 경로가 존재하고 값이 `null` 이 아니다. 피연산자 없음.
      **잡는 것**: (a) 주장 필드 삭제 · (b) null 치환. **못 잡는 것**: (a′) 값 변이.
      **왜 승인된 의미인가**: 「값이 있다/없다」는 `Fact.Known`↔`Fact.Absent` 의 축 자체이고
      토큰을 하나도 잠그지 않는다.
    - **`differs-from-path`** — 이 경로의 값이 **같은 기대값 안 다른 경로**의 값과 다르다.
      `uncovered_axes` 가 이름 든 `equals-path` 의 반대쪽이며 같은 확장 소유다.
    - **`differs-from-case`** — 이 경로의 값이 **거울 case 의 같은 경로** 값과 다르다.
      `rate-unit-001`↔`003` 처럼 수용/거부가 쌍으로 선 자리를 겨눈다. **잡는 것**: (a)(a′)(b)(c)
      전부 — 뒤집으면 거울과 같아지고, 삭제·null 은 존재 조건에서 걸린다.
      **왜 승인된 의미인가**: 잠그는 것이 이름이 아니라 **「두 경로가 다른 상태다」** 하나이고,
      그것은 `v2-지침서.md` §4.1 이 직접 말하는 것(선언되면 변환, 미선언이면 거부)이다.
      **미승인 토큰을 한 글자도 문면에 담지 않는다** — 지금 이 corpus 를 막고 있는 바로 그 벽을
      넘는 유일한 설계다.
    **셋 다 전 case 적용 설계가 따라온다** — 스키마 확장이라 한 case 만 보고 넣지 않는다.
  handoff: |-
    **구현 레인이 받을 것 셋.**
    ① 각 case 의 `contract_binding.type_path` 가 example test 가 겨눌 타입 경로다.
    ② `carries` 는 계약이 이미 나르는 축, `does_not_carry` 는 **테스트가 주장하면 안 되는 축**이다 —
    뒤엣것을 단언하면 계약에 없는 이름을 테스트가 굳힌다.
    ③ 이 corpus 의 case 는 `insufficient-evidence` 이므로 example test 의 **입력·기대 방향 참고**로만
    쓰고 「승인된 authoritative corpus 통과」로 계상하지 않는다.

