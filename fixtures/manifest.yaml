      §3.2 문면이다. **결측 provenance 와 누수 차단 시그니처는 `authoritative` corpus 에서 덮이지 않는다.**
    unblocks_when: 운영자가 §6.3 · ML-11.4 F3 를 업무 규칙으로 명시 승인하거나 `v2-지침서.md` 가 그 요구를 싣는다.

  - axis: "면허 — 허용업종 단독 보유의 결정 전 임시 처리를 `authoritative` 로 들 수 없다"
    domain: license
    why_blocked: |-
      `license-011`의 기대값이 **활성 `OPEN-QUAL-11` 결정 전의 임시 처리**(`provisional`)다.
      **활성 `OPEN` 의 임시 처리를 authoritative golden 으로 고정하지 않는다** — 고정하면 M1 이
      미결을 확정으로 딛는다(Codex 리뷰 B `findings[2]`). 이 축은 위 「면허 — 허용업종
      (`permsnIndstrytyList`) 단독 보유의 결합 규칙」과 **같은 미결의 다른 면**이다 — 그쪽은
      **규칙이 없음**을, 이쪽은 **임시 기대값을 승격할 수 없음**을 적는다.
    owning_open:
      - "OPEN-QUAL-11 (활성)"
    what_is_covered_instead: |-
      없다. `license-011`은 `insufficient-evidence` 로 **남아 있고**(지우지 않았다) `provisional`이
      그 임시성을 계속 나른다. 되돌림은 **`OPEN-QUAL-11`이 닫혀 기대값이 교체된 뒤**이며
      **승인만으로는 올라가지 않는다** — `classification_policy.insufficient_evidence` 가 그 예외를 적는다.
    unblocks_when: M1 slice 1C 의 관측으로 `OPEN-QUAL-11`이 닫히고 기대값이 교체된다.

  - axis: 승인 부재로 authoritative 덮개를 잃은 축 — capacity-gate (금액 capacity 게이트의 무조건 acceptance)
    domain: capacity-gate
    why_blocked: |-
      「운영자 보유액 미입력은 `0`·미달로 접히지 않고 사유 있는 `Uncertain`」(`-001`) · 「명시 `0` 은
      `Known(0원)` 이며 미입력과 다른 상태」(`-002`) · 「요건이 없으면 이 축은 중립」(`-004`) 셋의
      근거가 `capability-map.md` **QUAL-11 의 「결정 무관(무조건)」 acceptance 자체 도출**뿐이다.
      인용된 운영자 결정 `OPEN-QUAL-08` 의 문면은 **분할 확정** — *"시공능력평가액은 **자격 축**,
      도급한도·연매출·`capacity_score` 는 **적합도 축**"* — **뿐이고 「무엇을 어느 축에 넣는가」까지만
      정한다.** 셋이 재는 **부재·중립 상태의 산출 형태**는 그 결정에서 나오지 않는다.
    owning_open:
      - "소유 `OPEN` 없음 — 막는 것은 미결이 아니라 **운영자 승인 부재**다"
      - "(요건 값과의 실제 비교) OPEN-QUAL-09 · OPEN-QUAL-10 (둘 다 활성) — 위 「시공능력평가금액 요건과 보유액의 실제 비교」 축이 받는다"
    what_is_covered_instead: |-
      `capacity-gate-003`만 `authoritative` 로 남는다 — 「도급한도·연매출로 인한 판정은 자격 어휘로
      산출되지 않는다」는 `OPEN-QUAL-08` **분할 확정 문면의 재진술**(*"도급한도·연매출·`capacity_score`
      는 **적합도 축**"*)이라 이 축에 들지 않는다. `-001`·`-002`·`-004`는 `insufficient-evidence` 로
      **남아 있고**(지우지 않았다) **그 셋이 재는 부재·중립 상태의 산출 형태는 `authoritative`
      corpus 에서 덮이지 않는다.**
    unblocks_when: 운영자가 `capability-map.md` QUAL-11 의 무조건 acceptance 를 업무 규칙으로 명시 승인한다.

  - axis: 승인 부재로 authoritative 덮개를 잃은 축 — 면허 판정의 「동반 산출」과 요건 provenance
    domain: license
    why_blocked: |-
      「파싱 실패 행 수가 동반 산출된다」(`license-008`) · 「어느 필드에서 온 요건인지가 판정 결과에
      남는다」(`license-010`) · 「판정 결과에 policy version 과 요건 소스 집합이 함께 남는다」
      (`license-001`) 셋의 근거가 `data-dictionary.md` §3.2.1 의 **「동반 산출」 자체 I/O 계약**과
      `capability-map.md` **QUAL-03 의 자체 acceptance** 뿐이다. 세 case 가 인용한 근거는 각각
      **판정 자체까지만** 떠받친다 — `U-5` 는 `UncertainReason` **네 값**, `OPEN-QUAL-02` 는
      *"`permsnIndstrytyList` 를 자격 경로로 **포함**한다"*, 조달청 문서 + `OPEN-QUAL-01` 은
      **그룹 간 OR / 그룹 내 AND**. `v2-지침서.md` §4.2 는 versioned policy data 로 **관리**하라고만
      하고 「결과에 남는다」를 말하지 않는다.
    owning_open:
      - "소유 `OPEN` 없음 — **운영자 승인 부재**"
    what_is_covered_instead: |-
      **판정 자체는 덮인다.** `license-002`~`005`(그룹 결합 의미론) · `license-006`·`007`·`009`
      (`UncertainReason` 세 값) · `license-012`(유효기간 미검증 노출)가 `authoritative` 로 남는다.
      **덮이지 않는 것은 그 판정에 동반되는 관측 요구**다 — 세 case 는 `insufficient-evidence` 로
      남아 있고 지워지지 않았다.
    unblocks_when: 운영자가 §3.2.1 「동반 산출」과 QUAL-03 acceptance 를 업무 규칙으로 명시 승인한다.

  - axis: 승인 부재로 authoritative 덮개를 잃은 축 — `Unknown` 과세 금액의 산술 비교 차단
    domain: money-basis
    why_blocked: |-
      「과세 처리가 `Unknown` 인 금액은 다른 과세 처리의 금액과 산술 비교에 들어갈 수 없다(타입
      차단)」의 근거가 `data-dictionary.md` **§1.2.1 자체 도출**뿐이다. 인용된 운영자 결정 `U-1b` 는
      **기초금액의 과세 처리**(부가세 포함)라는 **정의**를 확정하고 하류 인계도 *"0C 사전은
      `vatTreatment` sealed 를 두되 정의상 기본값과 저장 값의 실측을 구별하라"*까지다 — **차단
      규칙을 세우지 않는다.** `v2-지침서.md` §4.1 의 거부 규칙은 `unit`/`basis`/`provenance` 를
      열거하고 `vatTreatment` 를 들지 않는다.
    owning_open:
      - "소유 `OPEN` 없음 — **운영자 승인 부재**"
    what_is_covered_instead: |-
      **basis 축은 덮인다** — `money-basis-001`·`004`가 「basis 가 다르면 비교·min/max 가 수행되지
      않는다」를 `v2-지침서.md` §4.1 로 고정하고, `-006`이 legacy 유래 행의 자동 태깅 금지를
      `U-1b`·`OPEN-DEC-08` 로 고정한다. **과세(`vatTreatment`) 축의 차단만 덮이지 않는다** —
      `money-basis-005`는 `insufficient-evidence` 로 남아 있고 지워지지 않았다.
    unblocks_when: 운영자가 `data-dictionary.md` §1.2.1 의 타입 차단 규칙을 업무 규칙으로 명시 승인한다.

  - axis: 승인 부재로 authoritative 덮개를 잃은 축 — money-basis (감시 경로와 검색 경로의 basis 일치)
    domain: money-basis
    why_blocked: |-
      「같은 입력 쌍이 감시 경로와 검색 경로에서 같은 답을 낸다」(`money-basis-003`)의 근거가
      `docs/discovery/regression-ledger.md:96-98` R-BASIS-01 의 **「검증 방법 · 결정 무관(무조건)」
      자체 acceptance** 뿐이다 — *"같은 쌍이 감시 경로와 검색 경로(R-BASIS-02)에서 같은 답을 내는지도
      함께 고정한다"*. 인용된 운영자 결정 `OPEN-STR-01` 의 절에는 **「검색」이 한 번도 나오지 않는다**;
      그 결정이 정하는 것은 basis 의 1급 필드 승격과 기존 저장 값의 해석까지다. 검색 경로 축을
      소유한 `STR-16` 은 M0 가 **신규로 만든** capability 다(`capability-map.md:164` *"STR-16(신규)"*).
      `classification_policy.authoritative` ②의 **기록자 bullet 기준으로도 서지 않는다** —
      `regression-ledger.md` 는 커밋된 결정 기록이 아니라 M0 산출 문서다.
    owning_open:
      - "소유 `OPEN` 없음 — 막는 것은 미결이 아니라 **운영자 승인 부재**다"
    what_is_covered_instead: |-
      **basis 축의 비교 차단은 덮인다** — `money-basis-001`·`004`가 「basis 가 다르면 비교·min/max 가
      수행되지 않는다」를 `v2-지침서.md` §4.1 로 고정한다. **덮이지 않는 것은 두 경로가 같은 basis 를
      쓴다는 요구**다 — `money-basis-003`은 `insufficient-evidence` 로 남아 있고 지워지지 않았다.
    unblocks_when: |-
      운영자가 `regression-ledger.md` R-BASIS-01 의 「결정 무관(무조건)」 검증 방법 가운데
      **「같은 쌍이 감시 경로와 검색 경로(R-BASIS-02)에서 같은 답을 내는지도 함께 고정한다」**를
      업무 규칙으로 명시 승인한다(그 축을 소유한 `STR-16` 의 신설 승인을 겸한다).

  - axis: "승인 부재로 authoritative 덮개를 잃은 축 — verdict (`SkipReason` 구체 어휘)"
    domain: verdict
    why_blocked: |-
      「두 보류가 문장이 아니라 사유 코드로 구분된다」는 **규칙**은 운영자 결정 `OPEN-DEC-05` 가
      떠받친다 — 결정 기록의 문면은 *"**(a)** 하나의 `Skip` verdict + **필수** reason code"*
      (`reports/evidence/m0/0a2/decisions.md:287`)이고, 같은 기록의 파급 절이 *"다만 A9 셀은
      **reason 문장으로만 구분되는 형태**를 금지하는 것으로 문면을 정확히 해야 한다(reason
      **code**는 이번 결정이 채택했다)"*(`:334-335`)로 그 금지의 방향을 적는다. 그러나
      `verdict-001`·`002` 의 기대값은 그 규칙만이 아니라 **구체 어휘 두 개**(`CapacityHold` ·
      `LowPriority`)를 `skipReason` 리터럴로 고정한다. **결정은 축만 정하고 어휘를 정하지 않는다** —
      두 값이 나오는 자리는 `data-dictionary.md` §3.6의 *"`SkipReason` **필수**. 최소 두 값:
      `CapacityHold` · `LowPriority`"* 하나이고 그것은 **M0 산출 문서의 자체 정의**다. 조달청 공식
      문서·`v2-지침서.md` 에도 없고, `classification_policy.authoritative` ②의 기록자 bullet
      기준으로도 서지 않는다(`data-dictionary.md` 는 커밋된 결정 기록이 아니다).
      **어휘가 판정 대상이라는 것 자체가 운영자 결정 2026-08-31 이며** 그 물음·답은
      `classification_policy.insufficient_evidence` 가 축어로 갖는다.
    owning_open:
      - "소유 `OPEN` 없음 — 막는 것은 미결이 아니라 **운영자 승인 부재**다"
      - "인접: `OPEN-DIC-03` (활성) — 어휘의 **전수성**을 소유한다. 이 축은 전수성이 아니라 **든 두 값의 근거**다"
    what_is_covered_instead: |-
      **verdict 축이 통째로 비지는 않는다** — `verdict-004`(개연 밴드 밖 override 의 사유 있는 거부)는
      `OPEN-DEC-04` 라는 **커밋된 결정 문면**이 직접 떠받치고 기대값이 사유 코드의 **이름**을 결정
      문면에서 가져오지 않으므로 `authoritative` 로 남는다. **덮이지 않는 것은 「두 보류를 가르는
      사유 코드가 무엇인가」** 이고, 그 어휘를 기대값에 실은 셋이 다 내려가 있다 —
      `verdict-001`·`002`(자기 `verifies` 가 어휘를 잠근다) 와 `verdict-003`(규칙은 `OPEN-STR-03` 이
      떠받치나 기대값이 `LowPriority`·`BidNow` 를 잠근다). **셋 다 지워지지 않았다.**
      위 「`SkipReason` 어휘의 전수성」 축도 이제 이 축에 막혀 있다.
    unblocks_when: |-
      운영자가 `data-dictionary.md` §3.6의 *"`SkipReason` **필수**. 최소 두 값: `CapacityHold` ·
      `LowPriority`"* 에서 **그 두 어휘를 업무 규칙으로 명시 승인**한다(`verdict-003` 은 같은 절의
      `Verdict` sealed 이름 `BidNow` 와 `override.source` 리터럴 `OPERATOR_STRATEGY_FLAG` 승인을
      함께 요구한다 — 뒤의 것은 M0 산출 문서에도 없어 **새로 정해야 한다**). 승인 대상은 규칙이
      아니라 **어휘 리터럴**이다 — 규칙(`Skip` 하나 + 사유 코드 의무)은 이미 `OPEN-DEC-05` 가 갖는다.
      운영자가 대신 **다른 어휘를 지정**하면 그때는 기대값 파일이 바뀌므로 `change_history` 에
      `previous_expected_sha256` 를 함께 싣는다.

  - axis: "계약 술어 부재로 **authoritative 를 유지하지 못한** 축 — 동결된 어휘로 표현되지 않는 주장"
    domain: 여러 축에 걸친다
    why_blocked: |-
      **근거의 층이 아니라 계약 가능성으로 내려간 자리다.** 각 case 의 `verifies` 는 승인 문면 위에 서는데,
      **동결된 술어**(`verified_paths` 정확 비교 · `verified_projections` 의 `not-equals`+`normalize`)로는
      그 주장을 기계로 지킬 수 없다. Codex 재리뷰 **B9(high 2)** 가 막지 못하는 변이 셋을 실증했다 —
      **① `verifies` 가 주장하는 필드의 삭제**(사유 없는 거부가 통과) **② projection 경로의 null 치환**
      (`null != 피연산자` 라 통과) **③ 다른 확정 토큰 치환**(배제 대상이 아닌 확정 값으로 세탁).
      **운영자 결정 2026-09-02** 이 Codex 자신의 fallback 을 택했다 — **술어를 더 발명하지 않고 내린다.**
      **어느 case 가 여기 드는지는 이 산문이 세지 않는다** — 스윕이 낸다(`commands.md` **C-15**).
    owning_open:
      - "소유 `OPEN` 없음 — 막는 것은 미결도 승인 부재도 아니라 **계약 술어의 부재**다"
      - "인접: 바로 아래 「승인된 피연산자 부재」 축 — 그쪽은 **피연산자**가 없고 이쪽은 **술어**가 없다"
    what_is_covered_instead: |-
      **case 를 지우지 않았고 기대값·입력·해시도 그대로다** — 계약 필드만 걷혔다(그 층에는 두지 않는다).
      **`source.kind` 도 그대로**라 근거의 층은 보존된다. 남은 `authoritative` 는 **확장 적대 집합에서
      위반 변이체 통과 0** 을 만족하는 case 뿐이고, 그 수와 목록은 스윕이 낸다.
    unblocks_when: |-
      **M1 계약 설계가 필요한 술어를 갖추면** 그 case 에 계약을 달고 `authoritative` 로 되돌린다.
      B9 가 이름 든 것은 **presence/non-null·형태**(①②)와 **의미 범주**(③ — unknown/non-definitive ·
      measurable 류)이고, 앞선 축이 든 **`equals-path`** 도 같은 자리다. **술어의 확장 소유권이 M1 에
      있다는 것이 동결의 내용**이다(`schema.extensions`). 되돌릴 때 `change_history` 에 그 술어의 좌표를 적는다.

  - axis: "계약이 덮지 못한 축 — **승인된 피연산자 부재**로 잠글 수 없는 결과 토큰"
    domain: 여러 축에 걸친다
    why_blocked: |-
      **B7(2026-09-01, high)의 mutation 실증이 연 축**이다. 열릴 때는 *"`authoritative` 로 **남은** case 의
      `verifies` 가 주장하는데 계약에 넣을 수단이 없어 비는 자리"* 였으나, **2026-09-02 의 동결+강등으로
      그 case 들이 내려갔다** — 이제 이 축은 **바로 위 축과 같은 모집단을 다른 각도에서 적는다**:
      위가 **술어**가 없어 내려간 자리라면 여기는 **피연산자**가 없어 잠글 수 없던 자리다.
      **되돌림 조건이 서로 다르므로 합치지 않는다.**
      **막는 것은 둘 중 하나다** — ① 그 값이 **가족 B 자작 토큰**이라 정확 비교도 projection 도 미승인
      어휘를 잠근다(결과 상태 토큰이 대표다) ② 필요한 술어가 **경로 간 동등**인데
      `schema.extensions.verified_projections` 의 어휘가 `not-equals` 하나다.
      **셋째가 있었으나 전제가 거짓이라 걷혔다** — 「개념은 승인 문면에 있으나 결정 기록이 커밋돼 있지
      않다」로 `money-basis-006` 의 `Inclusive` 를 들었는데, 그 결정은 **커밋된 파일에 있다**
      (`reports/evidence/m0/0c/decisions-2026-08-28.md`). 그 축은 projection 으로 닫혔다(verifier r14 F-1).
      **어느 case 가 여기 드는지는 이 산문이 세지 않는다** — 스윕이 낸다(`reports/evidence/m0/0e/commands.md`
      **C-15**). 열거하면 계약이 바뀔 때마다 낡는다.
    owning_open:
      - "소유 `OPEN` 없음 — 막는 것은 미결이 아니라 **어휘 승인 부재**이거나 **술어 어휘의 좁음**이다"
      - "인접: `pending_user_approval` — 그쪽은 case 단위 비준이고 이쪽은 **계약 가능성**이다"
    what_is_covered_instead: |-
      **각 case 의 나머지 주장은 계약에 있다** — 스윕이 잡은 자리마다 승인된 피연산자나 **불리언**으로
      표현되는 만큼은 이 라운드가 넣었다(`money-basis-006` 의 provenance·corpus 적격,
      `floor-shortfall-001` 의 0% 렌더 여부). **비는 것은 결과 토큰 자체**다.
      **case 를 내리지 않았다** — 근거의 층이 문제가 아니라 **표현 수단**이 없는 것이라 강등의 사유가 다르다.
    unblocks_when: |-
      둘 중 하나가 풀린다 — ① 운영자가 그 **결과 토큰 어휘를 명시 승인**한다(그러면 `floor-shortfall-005`
      의 `$.transitionedFrom` 과 같은 자리가 된다) ② **`equals-path` 술어를 `verified_projections` 에
      신설**한다(스키마 확장이라 전 case 적용 설계가 따라온다).
      둘 다 **M1 계약 설계와 함께 판단할 일**이고 이 slice 는 결정하지 않았다.
      **표기 통일도 그 자리에서 함께 본다** — **대소문자는 `normalize: case-fold` 가 덮지만**
      **대소문자 밖의 표기 변형**(공백·구분자)은 여전히 밖이라 **통일이 필요하다**(4문 4답이 그 통일을
      M1/M2 로 이월했다).

  - axis: "승인 부재로 authoritative 덮개를 잃은 축 — floor-threshold (경계 등가의 미달 판정)"
    domain: floor-threshold
    why_blocked: |-
      「실현 사정률이 임계와 **같으면** 미달이 아니다」(`floor-threshold-002`)의 근거가
      `capability-map.md` DEC-04 결정 무관 acceptance *"임계 사정률이 정확히 경계값인 표본은 미달로 세지
      않는다(초과가 아니므로 적격)"* **하나**이고 그것은 **M0 산출 문서의 자체 도출**이다.
      **인용되던 `v2-지침서.md` §4.4 는 이 선택을 정하지 않는다** — 오히려 *"표본 필터 범위, 최소 표본 수,
      **경계의 포함/제외**는 versioned 정책이다"* 라 적어 **결정을 정책으로 미룬다.** 그런데 **그 정책이 없다**:
      세 `floor-threshold` 입력 어디에도 경계 정책도 policy version 도 없다. 그래서 이 case 는
      `approved-spec` 으로 설 수 없고 `classification_policy.authoritative` ①②③ 어디에도 서지 않는다.
    owning_open:
      - "소유 `OPEN` 없음 — 막는 것은 미결 `OPEN` 이 아니라 **versioned 경계 정책의 부재**다"
      - "인접: `OPEN-DIC-10` (활성) — 반올림 자리수를 소유한다. 이 축은 반올림이 아니라 **경계의 포함/제외**다"
    what_is_covered_instead: |-
      **경계의 양쪽은 덮인다** — `floor-threshold-001`(임계 **미만**) · `003`(임계 **초과**)이 `authoritative`
      로 남는다. 둘의 기대값은 **경계 포함/제외 선택에 의존하지 않으므로** 이 강등이 그 둘을 건드리지 않는다.
      **덮이지 않는 것은 등가점 하나**다 — 실현 = 임계일 때의 판정. `floor-threshold-002` 는
      `insufficient-evidence` 로 남아 있고 **지워지지 않았다**(입력·기대값·해시 그대로).
    unblocks_when: |-
      **경계의 포함/제외가 versioned 정책으로 서고** 이 case 의 기대값이 **그 정책에서 도출**된다. 그 정책의
      결정은 **M1/M2 계약 설계 소관**이다(`v2-지침서.md` §4.4 가 그리로 미뤘다). 되돌릴 때는 policy version 을
      입력에 싣고 `change_history` 에 그 정책의 좌표를 적는다. **운영자가 대신 DEC-04 acceptance 의 그 문장을
      업무 규칙으로 명시 승인**해도 올라가나, 그때도 **정책 version 없는 경계**라는 사실은 남는다.

  - axis: "승인 부재로 **검증 주장에서 내린** 축 — `floor-shortfall` 빈도 결과의 출력 표현 (여섯 항목 묶음 · 유리수 분자/분모)"
    domain: floor-shortfall
    why_blocked: |-
      **이 항목은 위의 「덮개를 잃은 축」들과 형태가 다르다** — case 가 `insufficient-evidence` 로
      내려가서 비는 자리가 아니라, `authoritative` 로 **남은** case 가 자기 `verifies` 에서
      내려놓아 비는 자리다. `floor-shortfall-002`·`003`은 그대로 `authoritative` 이고 `N`/`N+1`
      경계를 계속 고정한다.
      **비는 것은 출력 표현이다.** 「빈도 결과가 여섯 항목(임계 사정률 · 빈도 · 분자 · 분모 ·
      범위 · 정책 version)의 묶음으로 반환된다」와 「빈도를 유리수(분자/분모)로 싣는다」를 정하는
      문면은 `capability-map.md` DEC-04 acceptance *"빈도 결과가 값 단독이 아니라 (임계 사정률,
      빈도, 분자, 분모, 범위, 정책 version) 묶음으로 반환된다"* 하나이고, 그것은 **M0 산출 문서의
      자체 도출**이다. 인용된 운영자 결정이 정하는 것은 다른 데까지다 — `OPEN-DEC-01` 은 최소
      표본 수 `150` 의 유지·근거·정책 데이터 외부화(`reports/evidence/m0/0a2/decisions.md:342`),
      `OPEN-DEC-06` 은 `biasDirection` 을 구조화 필드로 노출(`:288`). `v2-지침서.md` §4.4 도
      표본 부족의 `Unmeasurable` · 비확률 표시 · versioned 정책까지다.
      **처리를 정한 것이 운영자 결정 2026-08-31 이다** — 강등이 아니라 **`verifies` 좁혀 유지**이며
      물음·답 축어는 `classification_policy.insufficient_evidence` 가 갖는다.
    owning_open:
      - "소유 `OPEN` 없음 — 막는 것은 미결이 아니라 **운영자 승인 부재**다"
      - "인접: `OPEN-DIC-10` (활성) — 빈도의 **십진 표현·반올림 자리수**를 소유한다. 이 축은 반올림이 아니라 **표현 묶음 자체의 근거**다"
    what_is_covered_instead: |-
      **경계 의미는 덮인다** — `floor-shortfall-001`(`N-1`) · `floor-shortfall-002`(`N`) ·
      `floor-shortfall-003`(`N+1`) 이 `authoritative` 로 남아 「최소 표본 수 미만이면 값이 아니라
      사유 있는 측정 불가」와 그 경계 포함성을 고정한다. `floor-shortfall-004` 는 빈도 `0.0` 과
      판정 불가의 구별을 고정한다.
      **덮이지 않는 것은 「측정될 때 결과가 어떤 항목 묶음으로, 빈도가 어떤 수 표현으로
      나오는가」** 다. 기대값 파일은 그 형태를 **그대로 나른다** — 지우지 않았고 해시도 그대로다.
      **그 「나르기만 한다」가 이제 기계에도 있다** — 운영자 결정 2026-08-31(assertion path 계약화)로
      두 case 의 `verified_paths` 가 `criticalAssessmentRate` · `frequency` 하위 · `band` ·
      `biasDirection` · `numerator`/`denominator` · `policyVersion` 을 **계약 밖**에 두었다.
      앞서 이 자리는 산문 선언뿐이었고 M1 이 전체 파일을 비교하는 것을 막지 못했다.
      **2026-09-01 결정(projection 으로 좁힘)이 그 목록을 한 번 더 줄였다** — 두 case 에 남는
      정확 비교는 `$.sampleSize` 하나이고, `$.result` 는 `verified_projections` 의
      `not-equals` `Unmeasurable` 로만 계약된다. **이 축이 잃은 덮개는 그대로다** — 줄어든 것은
      출력 표현이 아니라 **결과 상태의 이름**이고, 그 자리는 `next_steps` 의 「어휘·표현 승인」이 받는다.
    unblocks_when: |-
      운영자가 `capability-map.md` DEC-04 acceptance 의 *"빈도 결과가 값 단독이 아니라 (임계
      사정률, 빈도, 분자, 분모, 범위, 정책 version) 묶음으로 반환된다"* 를 **업무 규칙으로 명시
      승인**한다. 승인되면 `floor-shortfall-002`·`003`의 `verifies` 를 그 표현까지 넓히고
      `change_history` 에 승인 기록의 좌표를 적는다. **승인 대상은 규칙이 아니라 출력 표현**이다 —
      규칙(최소 표본 수와 그 경계)은 이미 `OPEN-DEC-01` 이 갖는다. 운영자가 대신 **다른 표현을
      지정**하면 그때는 기대값 파일이 바뀌므로 `change_history` 에 `previous_expected_sha256` 를
      함께 싣는다.

# =============================================================================
# 출처를 확정할 수 없어 fixture 로 만들지 않은 후보 (`data-extract.md` 에러 핸들링)
#
# ⚠ **case 의 `classification: insufficient-evidence` 와 이름은 같고 자리는 다르다.**
#   여기 든 것은 **fixture 가 아예 없는 후보**(입력·기대값이 없다). 그쪽은 **fixture 는 있고
#   `authoritative` corpus 에 들지 못한 case** 다. 둘 다 §6 의 어휘를 빌리고 둘 다 완료 gate 를
#   내리지만, **여기 목록은 `cases` 의 셈에 들지 않고 그쪽은 든다.** 셈은 **F-7** 이 낸다.
# =============================================================================
insufficient_evidence:
  - candidate: 같은 면허 코드를 percent·공백·문장 위치 차이로 표현한 입력의 정규화
    why: |-
      `data-extract.md` §4가 면허 최소 corpus 로 요구하나 **정규화 규칙을 정한 승인 명세가 없다.**
      legacy 의 문자열 매칭 형태를 옮기면 그것이 곧 기대값이 되고 `legacy-behavior`를 정답으로
      승격하는 일이 된다.
    needed: 면허명 정규화 규칙의 도메인 명세 또는 운영자 결정.
  - candidate: 음수 금액 · `Long` overflow 의 처리
    why: |-
      `v2-지침서.md` §4.1이 표현(`Long` 원 단위)만 정하고 **범위 위반의 처리**를 정하지 않는다.
      `base-amount-provenance-004`·`005`가 덮는 NaN·Infinity 는 「그 표현에 존재하지 않는 값」이라
      구성 실패가 따라 나오지만, 음수와 overflow 는 그렇지 않다.
    needed: 금액 범위 계약(음수 허용 여부·overflow 시 거부/포화)의 결정.
  - candidate: 적합도 점수(`capacity_score`)의 산식
    why: "legacy 의 추측 정규화가 `폐기`로 확정됐고 **대체 산식이 없다.**"
    needed: 적합도 산식의 도메인 명세.
  - candidate: "`FloorApplicability`의 기관 패턴 테이블 내용"
    why: |-
      첫 매칭 우선 순서가 도메인 의미를 갖는다는 **규율**은 확정이나 **패턴 목록 자체**는 legacy
      코드뿐이고 세그먼트 편향이 확인되지 않았다. `floor-applicability-001`은 그래서 패턴이 아니라
      `orgType` 열거값을 입력으로 받는다.
    needed: 기관 유형 분류의 정책 데이터.

# =============================================================================
# 접근 승인이 필요한 것 — 이 slice 는 하나도 실행하지 않았다
# =============================================================================
access_approval_required:

  - id: A-1
    what: 운영 DB read — `observed` 층 corpus 의 신설
    why: |-
      이 manifest 의 `observed` 층이 **0건**이다. `data-extract.md` §1이 그 층을 *"기존 운영
      데이터/로그에서 비식별화해 관찰한 실제 형태"*로 정의하므로 **접근 없이는 만들 수 없다.**
      지금 corpus 는 전부 synthetic 이라 **실제 payload 형태의 함정**(누락 필드 조합, 인코딩,
      천 단위 구분자, 실제 키 이름의 변형)을 재현하지 못한다.
    would_need:
      query_scope: "`Project` · `HistoricalData` · `TenderResult`의 컬럼 부분집합"
      columns: 금액·율·차수·기관 유형·수집 시각. **회사/운영자 식별자, Telegram id, 연락처, 원문 개인정보는 제외**
      row_limit: 축별 200행 이하 (경계 근방 표본 우선)
      masking: 식별자는 안정적 합성 id 로 치환하고 **masking 전 값을 로그·리뷰 산출물에 남기지 않는다**
    status: 미요청. **`data-extract.md` §5 말미 — 이 문서만으로 DB 접근 권한이 생기지 않는다.**

  - id: A-2
    what: "`OPEN-REG-05` 해소를 위한 행별 과세 판정 표본"
    why: |-
      과세/비과세 경계 쌍 fixture 를 막는 것이 **저장 값의 행별 실제 과세 처리**다. 그것은 문서로
      풀리지 않고 **행을 봐야** 판정된다. A-1의 부분집합이나 목적이 달라 따로 적는다.
    would_need: A-1과 같은 masking 계획 + 두 금액이 함께 있는 행만, 축별 100행 이하
    status: 미요청

  - id: A-3
    what: legacy Python 의 순수 함수 실행 (`legacy-observation` 수집)
    why: |-
      `data-extract.md` §5 5단계가 허용하는 경로다. 지금 `legacy-behavior` 층 case 가 **0건**이라
      differential 판정(§6)의 한쪽 항이 비어 있다. 다만 이 slice 는 **실행하지 않는 쪽**을
      택했다 — 후보 모듈(`app/services/base_amount_basis.py` 등)이 ORM·설정과 같은 패키지에 있어
      import 부작용 없이 순수 호출만 하는지 확인하지 않았기 때문이다.
    would_need:
      commands: 대상 함수 목록과 정확한 호출 명령
      env: "`ENVIRONMENT=test`, 네트워크·DB 비활성"
      side_effects: import 시점 부작용 조사 결과를 먼저 제출
    status: 미요청. **승인 없이는 실행하지 않는다.**
    note: |-
      실행하더라도 그 출력은 `legacy-behavior`이며 **정답 지위가 없다**(`data-extract.md` §1).
      `authoritative` 승격에는 수작업 판정과 사용자 승인 근거가 별도로 필요하다.

  - id: A-4
    what: "`cnstrtnAbltyEvlAmtList` 계열의 실제 게시값 관측 (KONEPS API)"
    why: "게시 요건 값의 **단위·과세**가 조달청 문서에 없어 **관측으로만** 알 수 있다(`OPEN-QUAL-10`)."
    would_need: KONEPS OpenAPI 호출 승인 + 대상 오퍼레이션·건수·저장 계획
    status: 미요청. M1 이후 수집 신설로 인계돼 있다.

