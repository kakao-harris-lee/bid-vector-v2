      **시그니처**다」의 근거가 `data-dictionary.md` §6.3 과 `capability-map.md` ML-11.4 F3 **자체
      도출**뿐이다. `v2-지침서.md` 에 결측 사유 provenance 를 요구하는 문면이 없고, §3.2 의 경계
