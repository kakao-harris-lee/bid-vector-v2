cases:
  - id: rate-unit-001
    domain: rate-unit
    classification: authoritative
    verifies: |-
        선언된 percent 입력이 fraction으로 명시 변환된다.
    verified_paths:
      - "$.rate.fraction"
    source:
      kind: approved-spec
      reference: |-
          v2-지침서.md §4.1
    expected_reasoning: |-
      v2-지침서.md §4.1 *"`Rate`는 내부 fraction 표현 하나만 사용한다. percent 입력은 adapter에서 명시적으로 변환하며 원문 unit을
      기록한다"* + *"unit/basis/provenance가 없거나 모르는 값은 추측하지 않고 거부 또는 `Unmeasurable`로 반환한다"*. 변환 제수 `100`은
      data-dictionary.md §12.1이 `authoritative`(단위 정의)로 등재한 유일한 율 관련 수다.
      **결과 토큰의 어휘는 운영자 결정 2026-09-05 decision 19 가 정한다** — 상태는 `Fact.Known`/
      `Fact.Absent`(`data-dictionary.md` §1.1), 사유는 `ReasonCode` enum 이름이다. **V2 산출을 근거로
      들지 않았다** — 재추출한 값은 위 승인 문면과 그 결정에서만 나왔고, 이 case 가 주장하는 규칙은
      재추출 전후로 같다.
    input_file: fixtures/input/rate-unit-001.json
    expected_file: fixtures/expected/rate-unit-001.json
    normalization:
      rate_unit: "fraction (원문 percent)"
      money_unit: "해당 없음"
      timezone: "Asia/Seoul"
      source_form: "raw-with-declared-unit"
    privacy:
      contains_personal_data: false
      synthetic: true
      method: not-applicable-synthetic
      note: "운영 DB·API·로그에서 가져온 값이 없다. 식별자는 전부 `SYN-` 접두의 안정적 합성 id 다."
    extracted_at: 2026-08-30
    extraction_method: authored-from-approved-spec
    sha256: 7289b53dde1ef728688cfb54a8c4e883fcf2ec6d4441db22246b1d868901fffc
    expected_sha256: 439e1475fd1a9c02191aab9dc940a52f12bb2fdc19d01a510159f88e54f67b1c
    owning_open: |-
      OPEN-1BC-SOURCE-UNIT (신설 2026-09-05) — 원문 unit 보존. 이 case 는 그 축을 더 이상 주장하지 않는다
    not_covered: |-
      **`$.fact` 와 `$.conversionDivisor` 는 나르기만 한다 — 2026-09-05 정정.** `ofPercent`·`ofFraction`
      은 `Rate` 를 직접 내고 `Fact` 로 감싸는 계약 함수가 없으며, 제수 `100` 은 `Rate.kt` 의
      **`private const`** 라 반환값에 실리지 않는다. 소비 테스트가 그 둘을 만들어 붙이면 **방출자를
      지어내는 것**이라, 「어휘를 나르기만 하는 것은 이 층을 막지 않는다」(운영자 결정 2026-08-31)에
      따라 기대값에는 남기고 `verified_paths` 에서 뺐다. **값 산출은 `$.rate.fraction` 정확 비교가
      잠근다** — `ofPercent` 가 실패하면 `Rate` 자체가 없으므로 그 비교가 성공 상태까지 함께 진다.
      **원문 unit 보존은 이 case 의 주장에서 빠졌다** — `verifies` 가 「원문 unit이 보존된다」를 함께
      주장하던 자리를 「percent→fraction 명시 변환」으로 **좁혔다**. 주장을 지운 것이 아니라 **소유를
      옮긴 것**이고, 받는 자리는 `uncovered_axes` 의 `OPEN-1BC-SOURCE-UNIT`(1C 이후 어댑터 계약)이다.
      `v2-지침서.md` §4.1 의 *"원문 unit을 기록한다"* 는 어댑터 층의 의무이고 `Rate` 의 성분은
      `fraction` 하나뿐이라 값에 실을 자리가 없다. **이 이관 자체가 운영자 승인 대상이었고**
      decision 21 이 승인했다.
      **상태를 방출하는 함수가 1B 계약에 아직 없다.** `Rate.ofPercent`·`ofFraction` 은 `Rate` 를 직접
      내고 `Fact` 로 감싸지 않는다. `$.fact` 가 잠그는 것은 **상태 축에 계약이 채택한 어휘**이고, 그
      상태를 실제로 방출하는 자리는 단위 선언을 읽는 **어댑터**다 — 그 층은 1C 이후다. **소비 테스트는
      그 자리를 testFixtures projection 으로 표현해야 하고 계약에 없는 함수를 지어내면 안 된다.**
      **`$.rate.axis` 는 나르기만 한다** — 축은 `Rate` 가 아니라 축 뉴타입(`BidRate` 등)의 성분이라
      이 case 가 잠그지 않는다.
    contract_binding:
      type_path: "bidvector.sharedkernel.Rate.Companion.ofPercent(BigDecimal)"
      fixed_by: |-
        `RateTest` — percent↔fraction 왕복이 정보를 잃지 않는다(P-1a) · 공개 경로가 단위 이름을
        요구하는 둘뿐이다(P-3a).
      carries: |-
        **percent → fraction 명시 변환.** `ofPercent` 가 승인된 제수 `100` 으로 나누고 결과를
        정규화한다. 기대값의 `$.rate.fraction` 과 `$.conversionDivisor` 가 실리는 자리다.
        **상태 축의 어휘도 계약에 있다** — `Fact.Known`/`Fact.Absent`(`Carrier.kt`)가 그것이고
        decision 19 가 fixture 직렬화 토큰을 그 이름으로 정렬했다.
      does_not_carry: |-
        **① 원문 unit 보존.** `$.preservedSourceUnit` 은 재추출로 기대값에서 **빠졌다** —
        `Rate` 의 성분은 `fraction` 하나뿐이라 원문 unit 을 값에 싣지 않는다. `v2-지침서.md` §4.1 의
        *"원문 unit을 기록한다"* 는 어댑터 층의 의무이고 그 층은 1B 에 없다(1C 이후) —
        `OPEN-1BC-SOURCE-UNIT` 이 받는다.
        **② 축 이름.** `$.rate.axis` 의 `bidRate` — `Rate` 자신은 축을 나르지 않는다.
        **③ 상태와 제수.** `ofPercent` 는 `Rate` 를 직접 내고 `Fact` 로 감싸지 않으며 제수 `100` 은
        `private const` 다 — `$.fact`·`$.conversionDivisor` 는 2026-09-05 정정으로 **나르기만 하는
        자리**가 됐다(`not_covered` 참조).
    change_history:
      - date: 2026-09-02
        change: |-
          `classification` 을 `authoritative` → **`insufficient-evidence`** 로 내리고 `verified_paths` 를
          걷었다. `not_covered` 를 신설했다. **`source.kind` 는 그대로** 두었다(사유가 근거의 층이 아니다).
          **기대값·입력·해시는 바꾸지 않았다.**
        reason: |-
          **0E 수정 라운드 18 — Codex 재리뷰 B12 `findings[0]`(high).** 이 case 의 `verifies` 가
          「변환되어 통과한다」를 주장하는데 `$.outcome` 이 계약에 없어 **`Accepted`→`Rejected` 뒤집기가
          통과**했다. **거울 모집단이 이미 같은 사유로 내려가 있었다** — 거부측 `rate-unit-003`·`004` 가
          그것이다. 앞 라운드가 **「§4.1 은 거부 경로만 정한다」로 수용측을 남긴 해석선**을 심판이
          기각했다: **`verifies` 가 주장하면 주장이다.**

          **스윕에 (a′) 갈래를 신설**해 잡았다 — 삭제와 별도로 **주장 필드의 값을 변이**한다.
          B12 진단 그대로 *"스윕은 존재하는 경로만 검증하고, 경로가 덮지 않는 주장은 탐지 못 한다"*.
          그 갈래를 잔존 `authoritative` 전수에 돌린 결과가 이 강등이다.
        policy_version: |-
          해당 없음 — 분류와 계약의 변경이고 기대값이 effective-dated 정책에 의존하지 않는다.
          입력·기대값 파일이 그대로이므로 `sha256`·`expected_sha256` 도 그대로다(그래서 `previous_*` 항목이 없다).
      - date: 2026-09-04
        change: |-
          `contract_binding` 을 신설했다. **`classification` 은 `insufficient-evidence` 그대로이고
          기대값·입력 파일·`sha256`·`expected_sha256` 도 그대로다** — 되돌리지 못했다.
        reason: |-
          **운영자 결정 C13(2026-09-04)** 이 「M1 계약 술어 설계」의 소유를 1B 에 두어, 이 case 의
          `verifies` 를 1B `shared-kernel` 계약과 대조했다. 되돌림을 막은 둘과 그 근거의 정본은
          `m1_contract_binding` 이 갖는다 — **①** 술어 어휘의 동결이 도구 쪽(`manifest_contract.py`)
          에서 풀리지 않아 새 술어로는 되돌림을 **증명할 수단이 없고**, **②** 이 case 가 주장하는
          결과 토큰을 **1B 계약이 다른 이름으로 채택**했다(앞선 「승인 문면 부재」보다 좁은 사실이다).
        policy_version: |-
          해당 없음 — 문서 포인터의 신설이고 기대값이 effective-dated 정책에 의존하지 않는다.
          입력·기대값 파일이 그대로이므로 `previous_sha256`·`previous_expected_sha256` 가 없다.
      - date: 2026-09-05
        change: |-
          **재추출.** 기대값을 1B 계약 어휘로 다시 썼다 — 상태 `$.outcome`(`Accepted`) 을
          `$.fact`(`Known`) 로 바꾸고 `$.preservedSourceUnit` 을 뺐다. `verifies` 를 「percent→fraction
          명시 변환」으로 **좁히고** 원문 unit 보존 축을 `OPEN-1BC-SOURCE-UNIT` 으로 **이관**했다.
          `verified_paths` 셋을 달고 `classification` 을 **`authoritative`** 로 되돌렸다.
          **입력 파일과 `sha256` 은 그대로다** — 입력 토큰(`percent`)이 계약의 공개 경로 이름
          (`ofPercent`)과 어긋나지 않아 정렬할 것이 없었고, 그래서 `extracted_at` 도 그대로다.
        reason: |-
          **운영자 결정 2026-09-05 — decision 18·19·21.** 18 이 술어 어휘 동결을 풀어 도구 쪽 실행이
          섰고(BLOCK-1 해소), 19 가 결과 토큰 어휘를 **1B 계약 이름 그대로** 채택해 「승인 문면 없는
          자작 토큰」이라는 강등 사유가 사라졌으며(BLOCK-2 해소), 21 이 이 case 의 처분을 —
          **`verifies` 를 좁히는 것과 보존 축 이관을 포함해** — 승인했다.
          **되돌림이 아니라 재추출이다** — 기대값 파일이 실제로 바뀌었다. **자동 생성이 아니다**:
          새 값은 `expected_reasoning` 이 드는 승인 문면에서 나왔고 V2 산출을 복사하지 않았다.
        policy_version: |-
          해당 없음 — 기대값이 effective-dated 정책에 의존하지 않는다. 변환 제수 `100` 은
          `data-dictionary.md` §12.1 의 단위 정의이지 versioned 정책이 아니다.
        previous_expected_sha256: 1937c3ba8fec01bcd8cdf354457fa758ca13a1ecdf500d6116b886fe23e5b5f6
      - date: 2026-09-05
        change: |-
          `verified_paths` 를 **`$.rate.fraction` 하나로 좁혔다** — `$.fact` 와 `$.conversionDivisor` 는 계약 함수가 내는 값이 아니라
          나르기만 하는 자리로 옮겼다.
          **기대값·입력 파일과 해시는 바꾸지 않았다**(뺀 경로의 값은 기대값에 그대로 남아 나르기만
          한다). `classification` 도 `authoritative` 그대로다.
        reason: |-
          **④ 실행자 설계 — 계약이 산출하지 않는 축은 잠그지 않는다**(팀장 판단 2026-09-05,
          `scope.md` 「Phase 3 중 계약 정정」, 운영자 사후 확인 대상). `verified_paths` 의 정의가
          *"M1 소비 테스트는 이 경로만 정확 비교해야 한다"* 이므로, **runner 가 계약 함수를 불러
          만들어 낼 수 없는 경로**는 그 목록에 설 수 없다. 이 레인이 앞선 커밋의 인계문에서 든
