# V2 검증 corpus — case manifest
#
# 기준 문서: `data-extract.md` (단일 기준). 이 파일의 구조는 그 문서 §3의 manifest schema를
# 따르고, 확장 키는 아래 `schema.extensions`가 전부 선언한다.
#
# 이 파일을 읽기 전에 알아야 할 것 넷.
#
#   1. **여기 든 입력은 전부 synthetic이다.** 운영 DB·KONEPS API·로그에서 가져온 행이 하나도
#      없다. `data-extract.md` §7이 금지한 「가상의 fixture를 실운영 샘플이라 표기」를 피하려고
#      모든 식별자를 `SYN-` 접두로 두고 `privacy.synthetic: true`를 case마다 적는다.
#      따라서 **`observed` 층 case는 0건이다** — 그 층은 운영 데이터 접근 승인이 선행한다
#      (`access_approval_required` 참조).
#   2. **legacy 출력을 정답으로 복사한 case가 하나도 없다.** 이 slice는 기존 Python을 실행하지
#      않았고 `tests/goldens/**`의 기대값을 읽어 옮기지 않았다. `legacy_reference`는 **입력 형태와
#      회귀 사례의 출처**로만 달려 있으며 각 항목이 그 사실을 `role`에 적는다.
#   3. **기대값이 legacy 숫자에 의존하지 않는다.** 규율 하나로 강제하고 기계로 확인한다 —
#      *`data-dictionary.md` §12.1이 `legacy-behavior`로 등재한 수를 fixture가 input·expected
#      어느 쪽에도 쓰지 않는다.* 그런 수가 필요한 자리(밴드 경계, 법정 하한율, 신뢰 상한,
#      허용 오차)는 **synthetic 정책 입력**으로 받고, 기대값은 그 값이 아니라 **규칙**에만
#      의존하게 설계했다. §12.1이 `authoritative`로 등재한 수는 셋뿐이고(`100` 변환 제수 ·
#      `150` 최소 표본 수 · `0.10` 부가세율) 이 corpus는 그중 둘을 쓴다.
#      검사 범위와 **검사가 못 보는 자리**는 `numeric_discipline.check`가 적는다.
#   4. **아직 아무것도 승인되지 않았다.** 모든 case의 `review.approved_by_user`가 `false`이고
#      `review.codex_verdict`가 `pending`이다. `review.claude_commit`은 이 파일을 담은 커밋이
#      자기 SHA를 담을 수 없으므로 `pending`이며 리뷰 라운드에서 채운다.
#
# 덮지 못한 축은 숨기지 않는다 — `uncovered_axes`가 전부 적고 소유 `OPEN`을 단다.

manifest_version: 1
base_document: data-extract.md
slice: m0/0e (fixture-curator)
authored_at: 2026-08-30
legacy_repo:
  path: ./bid-vector (symlink, read-only)
  pinned_sha: ed4b06c
  accessed: read-only. 이 slice 는 legacy Python 을 실행하지 않았다.

layout:
  note: |-
    `data-extract.md` §3의 예시는 `expected/<id>.json`을 저장소 루트 형제로 둔다. 이 slice 의
    쓰기 범위가 `fixtures/`로 한정돼 있어 두 디렉터리를 그 아래 두었다. **선언된 이탈이며
    경로 외에 schema 를 바꾸지 않는다.**
  input_dir: fixtures/input/
  expected_dir: fixtures/expected/

schema:
  base: data-extract.md §3
  extensions:
    verifies: 이 fixture 가 **무엇을 검증하는가**. 한 case 는 한 의미만 검증한다(§7 「한 case 의 기대값을 여러 의미에 재사용」 금지).
    expected_reasoning: 기대값이 **어느 문서의 어느 문장**에서 나왔는가. Codex 독립 검토(§5 7단계)의 대상.
    source.kind 어휘: official-doc | operator-decision | approved-spec | legacy-observation. 앞 셋만 `authoritative` 분류를 낼 수 있다.
    expected_sha256: 기대값 파일의 SHA-256. §3은 fixture 해시만 요구하나 기대값도 사후 변경 탐지 대상이다.
    privacy.synthetic: 입력이 합성인지. 운영 데이터 유래가 아님을 case 마다 명시한다.
    privacy.method: 비식별화 방식. 합성 입력은 `not-applicable-synthetic`.
    extracted_at / extraction_method: 추출 시점과 방법. 합성 입력은 `authored-from-approved-spec`.
    normalization.source_form: 정규화 **전** 원본의 형태(§3 「정규화 전 원본과 정규화 후 fixture 구분」).
    provisional: 이 기대값이 어느 활성 `OPEN`의 결정 전 **임시 처리**인가. 그 `OPEN`이 닫히면 교체된다.
    owning_open: 이 case 가 **건드리지 않는** 인접 축을 소유한 활성 `OPEN`.
    not_covered: 이 case 가 덮지 **못하는** 것.
    change_history: 기대값 변경 이력(§3 「기대값 변경 시 case 를 덮어쓰지 말고 변경 이유와 policy version 기록」). 최초 등재에는 비어 있다.

classification_policy:
  authoritative: |-
    출처가 ① 조달청 공식 문서 인용 ② 커밋된 운영자 결정 기록 ③ `v2-지침서.md`(M0 선행 조건으로
    승인된 기준 문서) 중 하나인 case. M0 산출 문서(`capability-map.md`·`regression-ledger.md`·
    `data-dictionary.md`)는 **그 안에 인용된 결정·공식 문서를 가리키는 포인터로만** 쓰고,
    그 문서가 스스로 도출한 규칙은 이 분류를 내지 않는다.
  observed: 0건. 운영 데이터 접근 승인이 선행한다.
  legacy_behavior: 0건. 이 slice 는 legacy Python 을 실행하지 않았고 golden 기대값을 옮기지 않았다.
  pending_user_approval: |-
    **분류가 `authoritative`인 것과 승인된 것은 다르다.** M0 완료 게이트(사용자 승인)가 아직
    열리지 않았으므로 모든 case 의 `review.approved_by_user`는 `false`다.

numeric_discipline:
  rule: |-
    **`docs/discovery/data-dictionary.md` §12.1이 `legacy-behavior`로 등재한 수를 fixture 가 쓰지
    않는다.** input·expected 양쪽에 걸린다 — 입력에 넣어도 그 값이 곧 정책 경계가 되기 때문이다.
    그런 수가 필요한 자리(밴드 경계, 법정 하한율, 신뢰 상한, 허용 오차)는 **synthetic 정책
    입력**으로 받고, 기대값은 그 값이 아니라 **규칙**에만 의존하게 설계했다.
  check:
    what: "§12.1의 `legacy-behavior` 수 가운데 **비정수 율·배수·오차**와 **금액 구간 경계 셋**과 `-1.0`을 모든 fixture JSON에서 문자열·수치 양쪽으로 찾는다."
    exempt: |-
      정수 counts 와 sentinel — `15`(복수예비가격 개수) · `12`(confidence 계수) · `2`·`4`·`6`
      (반올림 자리수) · `0`·`0.0`. 그 수들은 자기 축 밖에서 흔한 셈이라 **문자열 일치가 채택을
      뜻하지 않는다.** 그 축에서의 채택 여부는 사람이 읽는다. (검사가 못 보는 자리를 적어 둔다.)
    result: "0건 (2026-08-30). 재현 명령은 `reports/evidence/m0/0e/fixtures-commands.md` **F-3**."
  authoritative_numbers_used:
    note: "§12.1이 `authoritative`로 등재한 수는 셋뿐이고(`100` · `150` · `0.10`) 이 corpus 는 그중 둘을 쓴다."
    entries:
      - value: 100
        unit: 무차원
        role: percent → fraction 변환 제수 (정의상 `1` percent = `1` ÷ `100`)
        source: "data-dictionary.md §12.1 — 층 `authoritative`(단위 정의)"
        used_in: [rate-unit-001, rate-unit-005]
        note: "`rate-unit-002`는 fraction 입력이라 제수가 `1`이고, `floor-shortfall-006`은 같은 변환을 쓰되 제수를 기대값에 싣지 않는다."
      - value: 150
        unit: 건수
        role: 하한 미달 빈도의 최소 표본 수
        source: "운영자 결정 2026-08-26 (`OPEN-DEC-01` 해소) · data-dictionary.md §12.1 — 층 `authoritative`"
        used_in: [floor-shortfall-001, floor-shortfall-002, floor-shortfall-003, floor-shortfall-004, floor-shortfall-005]
      - value: 0.10
        unit: fraction
        role: 부가세율
        source: "운영자 결정 2026-08-28 (U-1b)의 근거 서술 · data-dictionary.md §12.1 — 층 `authoritative`"
        used_in: []
        note: "쓰지 않았다. 과세 성분을 계산하는 case 가 이 corpus 에 없다 — 그 축은 `OPEN-REG-05`가 막는다."
  synthetic_policy_inputs:
    note: |-
      아래는 fixture 가 **정책 데이터를 입력으로 받는** 자리다. 값은 전부 synthetic 이며 legacy
      값을 옮긴 것이 아니다(위 검사가 그것을 기계로 확인한다). 각 case 의 기대값은 이 값이 아니라
      규칙에만 의존한다.
    entries:
      - "SYN-BAND-assessment-denominator (사정률 분모 필터 밴드) — 실물은 §1.4.3 B1~B3, 전부 `legacy-behavior`"
      - "SYN-BAND-published-floor-rate (게시 하한율 신뢰 밴드) — 실물은 §1.4.3 B6, `legacy-behavior`"
      - "SYN-TABLE-floor-rate (법정 하한율 시행일 표) — 실물 값은 `OPEN-DEC-10` 소유"
      - "SYN-POLICY-agency-regime (기관 유형 → 하한 모델 매핑) — 순서·매핑 모두 정책 데이터"
      - "SYN-POLICY-A/B-2026-08-30 (기초금액 provenance rule order) — 두 순서의 **대조**가 목적이고 어느 쪽도 정답으로 두지 않는다"
      - "SYN-POLICY-2026-08-30 (면허 결합 규칙 · 최소 표본 정책의 version 문자열)"
  band_axis_separation:
    rule: |-
      `data-dictionary.md` §13.1 — 「값이 같고 축이 다른 **B4·B5를 한 case 에 섞지 않는다**」.
    how: "이 corpus 는 B4(율 라벨 유효 창)도 B5(투찰비 개연 밴드)도 **값으로 쓰지 않는다.** 축을 섞을 자리 자체를 만들지 않았다. 밴드 값이 승격되면 그때 축별로 나눠 만든다."


