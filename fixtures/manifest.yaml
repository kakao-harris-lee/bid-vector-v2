  - axis: "승인 부재로 authoritative 덮개를 잃은 축 — verdict (`SkipReason` 구체 어휘)"
    domain: verdict
    why_blocked: |-
      「두 보류가 문장이 아니라 사유 코드로 구분된다」는 **규칙**은 운영자 결정 `OPEN-DEC-05` 가
      떠받친다 — 결정 기록의 문면은 *"**(a)** 하나의 `Skip` verdict + **필수** reason code"*
      (`reports/evidence/m0/0a2/decisions.md:287`)이고, 같은 기록의 파급 절이 *"다만 A9 셀은
      **reason 문장으로만 구분되는 형태**를 금지하는 것으로 문면을 정확히 해야 한다(reason
      **code**는 이번 결정이 채택했다)"*(`:334-335`)로 그 금지의 방향을 적는다. 그러나
      `verdict-001`·`002` 의 기대값은 그 규칙만이 아니라 **구체 어휘 두 개**(`CapacityHold` ·
      `LowPriority`)를 `skipReason` 리터럴로 고정한다. **결정은 축만 정하고 어휘를 정하지 않는다** —
      두 값이 나오는 자리는 `data-dictionary.md` §3.6의 *"`SkipReason` **필수**. 최소 두 값:
      `CapacityHold` · `LowPriority`"* 하나이고 그것은 **M0 산출 문서의 자체 정의**다. 조달청 공식
      문서·`v2-지침서.md` 에도 없고, `classification_policy.authoritative` ②의 기록자 bullet
      기준으로도 서지 않는다(`data-dictionary.md` 는 커밋된 결정 기록이 아니다).
      **어휘가 판정 대상이라는 것 자체가 운영자 결정 2026-08-31 이며** 그 물음·답은
      `classification_policy.insufficient_evidence` 가 축어로 갖는다.
    owning_open:
      - "소유 `OPEN` 없음 — 막는 것은 미결이 아니라 **운영자 승인 부재**다"
      - "인접: `OPEN-DIC-03` (활성) — 어휘의 **전수성**을 소유한다. 이 축은 전수성이 아니라 **든 두 값의 근거**다"
    what_is_covered_instead: |-
      **열릴 당시에는 verdict 축이 통째로 비지 않았다** — `verdict-004`(개연 밴드 밖 override 의 사유
      있는 거부)를 `OPEN-DEC-04` 라는 **커밋된 결정 문면**이 직접 떠받쳐 `authoritative` 였다.
      **그 case 도 2026-09-02 에 내려가 지금 이 축에 `authoritative` 덮개가 없다.** **덮이지 않는 것은 「두 보류를 가르는
      사유 코드가 무엇인가」** 이고, 그 어휘를 기대값에 실은 셋이 다 내려가 있다 —
      `verdict-001`·`002`(자기 `verifies` 가 어휘를 잠근다) 와 `verdict-003`(규칙은 `OPEN-STR-03` 이
      떠받치나 기대값이 `LowPriority`·`BidNow` 를 잠근다). **셋 다 지워지지 않았다.**
      위 「`SkipReason` 어휘의 전수성」 축도 이제 이 축에 막혀 있다.
    unblocks_when: |-
      운영자가 `data-dictionary.md` §3.6의 *"`SkipReason` **필수**. 최소 두 값: `CapacityHold` ·
      `LowPriority`"* 에서 **그 두 어휘를 업무 규칙으로 명시 승인**한다(`verdict-003` 은 같은 절의
      `Verdict` sealed 이름 `BidNow` 와 `override.source` 리터럴 `OPERATOR_STRATEGY_FLAG` 승인을
      함께 요구한다 — 뒤의 것은 M0 산출 문서에도 없어 **새로 정해야 한다**). 승인 대상은 규칙이
      아니라 **어휘 리터럴**이다 — 규칙(`Skip` 하나 + 사유 코드 의무)은 이미 `OPEN-DEC-05` 가 갖는다.
      운영자가 대신 **다른 어휘를 지정**하면 그때는 기대값 파일이 바뀌므로 `change_history` 에
      `previous_expected_sha256` 를 함께 싣는다.

  - axis: "계약 술어 부재로 **authoritative 를 유지하지 못한** 축 — 동결된 어휘로 표현되지 않는 주장"
    domain: 여러 축에 걸친다
    why_blocked: |-
      **근거의 층이 아니라 계약 가능성으로 내려간 자리다.** 각 case 의 `verifies` 는 승인 문면 위에 서는데,
      **동결된 술어**(`verified_paths` 정확 비교 · `verified_projections` 의 `not-equals`+`normalize`)로는
      그 주장을 기계로 지킬 수 없다. Codex 재리뷰 **B9(high 2)** 가 막지 못하는 변이 셋을 실증했다 —
      **① `verifies` 가 주장하는 필드의 삭제**(사유 없는 거부가 통과) **② projection 경로의 null 치환**
      (`null != 피연산자` 라 통과) **③ 다른 확정 토큰 치환**(배제 대상이 아닌 확정 값으로 세탁).
      **운영자 결정 2026-09-02** 이 Codex 자신의 fallback 을 택했다 — **술어를 더 발명하지 않고 내린다.**
      **어느 case 가 여기 드는지는 이 산문이 세지 않는다** — 스윕이 낸다(`commands.md` **C-15**).
    owning_open:
      - "소유 `OPEN` 없음 — 막는 것은 미결도 승인 부재도 아니라 **계약 술어의 부재**다"
      - "인접: 바로 아래 「승인된 피연산자 부재」 축 — 그쪽은 **피연산자**가 없고 이쪽은 **술어**가 없다"
    what_is_covered_instead: |-
      **case 를 지우지 않았고 기대값·입력·해시도 그대로다** — 계약 필드만 걷혔다(그 층에는 두지 않는다).
      **`source.kind` 도 그대로**라 근거의 층은 보존된다. 남은 `authoritative` 는 **확장 적대 집합에서
      위반 변이체 통과 0** 을 만족하는 case 뿐이고, 그 수와 목록은 스윕이 낸다.
    unblocks_when: |-
      **M1 계약 설계가 필요한 술어를 갖추면** 그 case 에 계약을 달고 `authoritative` 로 되돌린다.
      B9 가 이름 든 것은 **presence/non-null·형태**(①②)와 **의미 범주**(③ — unknown/non-definitive ·
      measurable 류)이고, 앞선 축이 든 **`equals-path`** 도 같은 자리다. **술어의 확장 소유권이 M1 에
      있다는 것이 동결의 내용**이다(`schema.extensions`). 되돌릴 때 `change_history` 에 그 술어의 좌표를 적는다.

      **2026-09-04 갱신 — 소유가 정해졌고 설계가 나왔으나 되돌림은 아직 서지 않는다.** 운영자 결정
      C13 이 그 소유를 1B 에 두었다. 설계 셋(`is-present` · `differs-from-path` · `differs-from-case`)은
      `m1_contract_binding.predicate_design` 에 있다. **남은 것은 정의가 아니라 실행이다** —
      술어를 늘리려면 `fixtures/tools/manifest_contract.py` 의 `holds()` 와 스윕의 변이체 생성 규칙을
      함께 넓혀야 하고, 그 경로는 1B fixture 레인의 `in_scope` 밖이다. **정의만 늘리면 스윕이
      「동결된 어휘 밖의 술어」로 멈춘다.** 분류를 정하는 것이 산문이 아니라 스윕이므로, 돌릴 수
      없는 술어로는 되돌림을 **증명할 수단이 없다.**

      **2026-09-05 해소 — 운영자 결정 decision 18(1B-c).** 정의와 실행이 함께 섰다: 어휘 정의는
      `schema.extensions.verified_projections` 의 「술어 어휘」 절이 갖고, 실행은
      `manifest_contract.holds()` · `mutation_sweep_adversarial.projection_mutants()` ·
      `mutation_sweep_targeted.notation_variants()` 의 가드다. **이 축이 막던 case 의 되돌림은
      이제 스윕이 판정한다** — 어느 case 가 남았는지는 이 산문이 세지 않고 **C-5** 가 낸다.
      **축을 지우지 않는다** — 뒷날 다시 표현되지 않는 주장이 나오면 같은 자리로 돌아온다.

  - axis: "계약이 덮지 못한 축 — **승인된 피연산자 부재**로 잠글 수 없는 결과 토큰"
    domain: 여러 축에 걸친다
    why_blocked: |-
      **B7(2026-09-01, high)의 mutation 실증이 연 축**이다. 열릴 때는 *"`authoritative` 로 **남은** case 의
      `verifies` 가 주장하는데 계약에 넣을 수단이 없어 비는 자리"* 였으나, **2026-09-02 의 동결+강등으로
      그 case 들이 내려갔다** — 이제 이 축은 **바로 위 축과 같은 모집단을 다른 각도에서 적는다**:
      위가 **술어**가 없어 내려간 자리라면 여기는 **피연산자**가 없어 잠글 수 없던 자리다.
      **되돌림 조건이 서로 다르므로 합치지 않는다.**
      **막는 것은 둘 중 하나다** — ① 그 값이 **가족 B 자작 토큰**이라 정확 비교도 projection 도 미승인
      어휘를 잠근다(결과 상태 토큰이 대표다) ② 필요한 술어가 **경로 간 동등**인데
      `schema.extensions.verified_projections` 의 어휘가 `not-equals` 하나다.
      **셋째가 있었으나 전제가 거짓이라 걷혔다** — 「개념은 승인 문면에 있으나 결정 기록이 커밋돼 있지
      않다」로 `money-basis-006` 의 `Inclusive` 를 들었는데, 그 결정은 **커밋된 파일에 있다**
      (`reports/evidence/m0/0c/decisions-2026-08-28.md`). 그 축은 projection 으로 닫혔다(verifier r14 F-1).
      **어느 case 가 여기 드는지는 이 산문이 세지 않는다** — 스윕이 낸다(`reports/evidence/m0/0e/commands.md`
      **C-15**). 열거하면 계약이 바뀔 때마다 낡는다.
    owning_open:
      - "소유 `OPEN` 없음 — 막는 것은 미결이 아니라 **어휘 승인 부재**이거나 **술어 어휘의 좁음**이다"
      - "인접: `pending_user_approval` — 그쪽은 case 단위 비준이고 이쪽은 **계약 가능성**이다"
    what_is_covered_instead: |-
      **각 case 의 나머지 주장 가운데 표현되는 만큼은 계약에 있다** — 승인된 피연산자나 **불리언**으로
      쓸 수 있는 자리는 넣었다(`floor-shortfall-001` 의 0% 렌더 여부가 그 예다). **비는 것은 결과 토큰 자체**다.
      **이 모집단은 2026-09-02 에 내려갔다** — 위 `why_blocked` 가 적는 그 강등이고 여기서도 같은 사실이다.
      **「case 를 내리지 않았다」는 2026-09-02 이전의 상태**이며 그 시점의 기록으로만 읽는다.
    unblocks_when: |-
      둘 중 하나가 풀린다 — ① 운영자가 그 **결과 토큰 어휘를 명시 승인**한다(그러면 `floor-shortfall-005`
      의 `$.transitionedFrom` 과 같은 자리가 된다) ② **`equals-path` 술어를 `verified_projections` 에
      신설**한다(스키마 확장이라 전 case 적용 설계가 따라온다).
      둘 다 **M1 계약 설계와 함께 판단할 일**이고 이 slice 는 결정하지 않았다.
      **표기 통일도 그 자리에서 함께 본다** — **대소문자는 `normalize: case-fold` 가 덮지만**
      **대소문자 밖의 표기 변형**(공백·구분자)은 여전히 밖이라 **통일이 필요하다**(4문 4답이 그 통일을
      M1/M2 로 이월했다).

      **2026-09-04 갱신 — ①의 전제가 좁아졌다.** 1B 계약이 서고 보니 이 축의 결과 토큰은 「승인 문면이
      없다」가 아니라 **「M1 계약이 다른 이름을 채택했다」**이다 — 상태는 `Fact.Known`/`Fact.Absent` 와
      `Measurement.Measured`/`Measurement.Unmeasurable` 이, 사유는 `ReasonCode` enum 이 나른다.
      그래서 ①은 **미승인 이름의 사후 승인이 아니라 fixture 직렬화 토큰과 계약 이름의 정렬** 문제가
      됐고, 정렬은 기대값 파일을 바꾸므로 **되돌림이 아니라 재추출**이다. 대조표와 판정은
      `m1_contract_binding.token_alignment` 이 갖는다. **②는 그대로 살아 있고** 설계가
      `m1_contract_binding.predicate_design` 에 나왔다(실행은 위 축의 갱신이 적는다).
      **basis 축에는 셋째가 있다** — 계약이 그 자리를 컴파일 차단으로 지어 **거부 객체 자체가 생기지
      않는다**(`m1_contract_binding.design_divergence`). 토큰 정렬로 메울 수 있는 차이가 아니다.

      **2026-09-05 해소 — 운영자 결정 decision 19(1B-c).** ①이 열렸다: 결과 토큰 어휘로 **1B 계약
      이름 그대로**(상태 `Fact.Known`/`Fact.Absent` · `Measurement.Measured`/`Unmeasurable`, 사유
      `ReasonCode` enum 이름, `Basis.ESTIMATED`)를 명시 승인했고, 그래서 그 이름들의 **정확 비교가
      미승인 리터럴을 잠그지 않는다.** 정렬은 기대값 파일을 바꾸므로 **재추출**로 했다 —
      `previous_expected_sha256` 를 실은 각 case 의 `change_history` 가 그 기록이다. ②(`equals-path`)는
      **여전히 어휘에 없다** — decision 18 이 푼 셋은 `is-present`·`differs-from-path`·
      `differs-from-case` 이고 **동등** 술어는 그 안에 없다. **셋째(컴파일 차단)도 그대로다** —
      그쪽은 토큰이 아니라 설계 차이라 기대값을 「표현 불가」 형태로 다시 쓰는 것으로만 닫힌다
      (decision 21 이 그 재정의를 승인했다).
      **축을 지우지 않는다** — 남은 ②·셋째가 이 자리를 계속 쓴다.

  - axis: "**해소(2026-09-06, decision 28)** — 승인 부재로 authoritative 덮개를 잃은 축이었던 floor-threshold (경계 등가의 미달 판정)"
    domain: floor-threshold
    why_blocked: |-
      **아래는 열려 있던 동안(2026-09-02 ~ 2026-09-06)의 기록이다 — 현재형으로 읽지 않는다.**
      「실현 사정률이 임계와 **같으면** 미달이 아니다」(`floor-threshold-002`)의 근거가
      `capability-map.md` DEC-04 결정 무관 acceptance *"임계 사정률이 정확히 경계값인 표본은 미달로 세지
      않는다(초과가 아니므로 적격)"* **하나**였고 그것은 **M0 산출 문서의 자체 도출**이었다.
      **인용되던 `v2-지침서.md` §4.4 는 그 선택을 정하지 않는다** — 오히려 *"표본 필터 범위, 최소 표본 수,
      **경계의 포함/제외**는 versioned 정책이다"* 라 적어 **결정을 정책으로 미룬다.** 그런데 **그 정책이 없었다**:
      세 `floor-threshold` 입력 어디에도 경계 정책도 policy version 도 없었다. 그래서 그 case 는
      `approved-spec` 으로 서지 못했고 `classification_policy.authoritative` ①②③ 어디에도 서지 않았다.
    owning_open:
      - "소유 `OPEN` 없음 — 막던 것은 미결 `OPEN` 이 아니라 **versioned 경계 정책의 부재**였다"
      - "인접: `OPEN-DIC-10` (활성) — 반올림 자리수를 소유한다. 이 축은 반올림이 아니라 **경계의 포함/제외**였다"
    what_is_covered_instead: |-
      **이제 등가점도 덮인다.** `floor-threshold-001`(임계 **미만**) · `002`(임계 **등가**) · `003`(임계 **초과**)
      셋이 `authoritative` 다. `001`·`003` 은 강등 기간에도 그대로였다 — 둘의 기대값이 경계 포함/제외 선택에
      의존하지 않기 때문이며, 그 사실은 지금도 같다. **비지 않는 것을 비었다고 적지 않는다** — 분류의 정본은
      각 case 의 `classification` 이고 셈은 스윕이 낸다.
      **여전히 이 축 밖인 것**: 정책값을 반대로(`greater-or-equal`) 두었을 때의 판정은 corpus 가 아니라
      **1D 도메인 test** 가 진다(`floor-threshold-002.contract_binding.fixed_by`). 한 case 의 기대값을
      두 정책값에 재사용하지 않는다(`data-extract.md` §7).
    unblocks_when: |-
      **해소됐다 — 운영자 결정 2026-09-06(M1/1D 착수 D-3 (a), decision 28).** 열릴 때 적어 둔 조건이
      *"경계의 포함/제외가 versioned 정책으로 서고 이 case 의 기대값이 그 정책에서 도출된다"* 였고
      셋 다 채워졌다: 정책 슬롯 `FloorShortfallPolicyData.shortfallComparison` 이 1D 계약으로 섰고,
      그 **version 1 값**이 `strictly-greater` 로 승인됐으며(정본 `docs/discovery/data-dictionary.md` §3.3),
      `floor-threshold-002` 의 입력이 그 정책과 policy version 을 싣고 기대값이 거기서 도출된다.
      **기대값 파일은 바뀌지 않았다** — 되돌림이 재작성이 아님을 `expected_sha256` 불변이 보인다.
      경로는 그 case 의 `change_history` 2026-09-06 항목이 갖는다.
      **축을 지우지 않는다** — 비교 방향을 바꾸는 것은 **새 policy version** 이고, 그때 이 자리가 다시 열린다.

  - axis: "승인 부재로 **검증 주장에서 내린** 축 — `floor-shortfall` 빈도 결과의 출력 표현 (여섯 항목 묶음 · 유리수 분자/분모)"
    domain: floor-shortfall
    why_blocked: |-
      **열릴 때(2026-08-31) 이 항목은 위의 「덮개를 잃은 축」들과 형태가 달랐다** — case 가 내려가서
      비는 자리가 아니라, `authoritative` 로 **남은** case 가 자기 `verifies` 에서 내려놓아 비는
      자리였다. **2026-09-02 동결+강등이 그 전제를 바꿨다** — 그 자리를 지던 case 들이 내려가
      **이제 두 사유가 겹쳐 있다**(주장에서 내림 + 계약 술어 부재).
      **비는 것은 출력 표현이다.** 「빈도 결과가 여섯 항목(임계 사정률 · 빈도 · 분자 · 분모 ·
      범위 · 정책 version)의 묶음으로 반환된다」와 「빈도를 유리수(분자/분모)로 싣는다」를 정하는
      문면은 `capability-map.md` DEC-04 acceptance *"빈도 결과가 값 단독이 아니라 (임계 사정률,
      빈도, 분자, 분모, 범위, 정책 version) 묶음으로 반환된다"* 하나이고, 그것은 **M0 산출 문서의
      자체 도출**이다. 인용된 운영자 결정이 정하는 것은 다른 데까지다 — `OPEN-DEC-01` 은 최소
      표본 수 `150` 의 유지·근거·정책 데이터 외부화(`reports/evidence/m0/0a2/decisions.md:342`),
      `OPEN-DEC-06` 은 `biasDirection` 을 구조화 필드로 노출(`:288`). `v2-지침서.md` §4.4 도
      표본 부족의 `Unmeasurable` · 비확률 표시 · versioned 정책까지다.
      **처리를 정한 것이 운영자 결정 2026-08-31 이다** — 강등이 아니라 **`verifies` 좁혀 유지**이며
      물음·답 축어는 `classification_policy.insufficient_evidence` 가 갖는다.
    owning_open:
      - "소유 `OPEN` 없음 — 막는 것은 미결이 아니라 **운영자 승인 부재**다"
      - "인접: `OPEN-DIC-10` (활성) — 빈도의 **십진 표현·반올림 자리수**를 소유한다. 이 축은 반올림이 아니라 **표현 묶음 자체의 근거**다"
    what_is_covered_instead: |-
      **경계 의미의 덮개가 2026-09-02 에 비었다.** 열릴 당시에는 `N-1`·`N`·`N+1` 세 case 가
      `authoritative` 로 「최소 표본 수 미만이면 값이 아니라 사유 있는 측정 불가」와 그 경계
      포함성을 고정했고 다른 하나가 빈도 `0.0` 과 판정 불가의 구별을 고정했다 — **그 가운데
      계약이 지키지 못한 것들이 내려갔다.** 그래서 **`N`/`N+1` 경계와 0빈도 구별에 지금
      `authoritative` 덮개가 없다.** 어느 case 가 어느 층인지는 **각 case 의 `classification` 이
      정본**이고 셈은 **F-7**·**C-15** 가 낸다 — 여기서 열거하지 않는다.
      **덮이지 않는 것은 「측정될 때 결과가 어떤 항목 묶음으로, 빈도가 어떤 수 표현으로
      나오는가」** 다. 기대값 파일은 그 형태를 **그대로 나른다** — 지우지 않았고 해시도 그대로다.
      **그 「나르기만 한다」가 이제 기계에도 있다** — 운영자 결정 2026-08-31(assertion path 계약화)로
      두 case 의 `verified_paths` 가 `criticalAssessmentRate` · `frequency` 하위 · `band` ·
      `biasDirection` · `numerator`/`denominator` · `policyVersion` 을 **계약 밖**에 두었다.
      앞서 이 자리는 산문 선언뿐이었고 M1 이 전체 파일을 비교하는 것을 막지 못했다.
      **2026-09-01 결정(projection 으로 좁힘)이 그 목록을 한 번 더 줄였다** — 두 case 에 남는
      정확 비교는 `$.sampleSize` 하나이고, `$.result` 는 `verified_projections` 의
      `not-equals` `Unmeasurable` 로만 계약된다. **이 축이 잃은 덮개는 그대로다** — 줄어든 것은
      출력 표현이 아니라 **결과 상태의 이름**이고, 그 자리는 `next_steps` 의 「어휘·표현 승인」이 받는다.
    unblocks_when: |-
      운영자가 `capability-map.md` DEC-04 acceptance 의 *"빈도 결과가 값 단독이 아니라 (임계
      사정률, 빈도, 분자, 분모, 범위, 정책 version) 묶음으로 반환된다"* 를 **업무 규칙으로 명시
      승인**한다. 승인되면 `floor-shortfall-002`·`003`의 `verifies` 를 그 표현까지 넓히고
      `change_history` 에 승인 기록의 좌표를 적는다. **승인 대상은 규칙이 아니라 출력 표현**이다 —
      규칙(최소 표본 수와 그 경계)은 이미 `OPEN-DEC-01` 이 갖는다. 운영자가 대신 **다른 표현을
      지정**하면 그때는 기대값 파일이 바뀌므로 `change_history` 에 `previous_expected_sha256` 를
      함께 싣는다.

  - axis: "검색 경로의 basis 일치 — 감시 경로와 같은 답을 내는가 (**해소 2026-09-06, M1/1E**)"
    domain: money-basis
    status: 해소 — 축은 이력으로 남긴다(지우지 않는다)
    why_blocked: |-
      **막던 것은 계약 층의 부재였다.** 검색 경로(`STR-16`)를 나르는 타입이 1B `shared-kernel` 에 없었고 그
      타입을 만드는 것은 1B-c 의 `out_of_scope` 였다(slice 계약이 명시적으로 뺐다). 이 축을 막던
      다른 둘 — 술어 어휘와 운영자 명시 승인 — 은 2026-09-05 에 풀렸었다(decision 18 · 20·21).
      **남은 하나가 그것이었고 성격이 달랐다**: 근거도 술어도 승인도 아니라 계약 층의 부재였다.
    owning_open:
      - "~~`OPEN-1BC-STR16`~~ (신설 2026-09-05, 1B-c · **해소 2026-09-06, M1/1E**) — 소유였던 strategy slice 가 닫았다"
      - "인접: 위 「승인 부재로 authoritative 덮개를 잃은 축 — money-basis」 — 그 축의 승인 자물쇠는 2026-09-05 에 풀렸고 넘어온 case 가 이 축에서 닫혔다"
    what_is_covered_instead: |-
      **이제 축 자체가 덮인다.** `money-basis-003` 이 2026-09-06 에 `authoritative` 로 돌아왔고
      `$.perPath.*.basisUsed` 둘과 `$.pathsAgree` 가 계약이다. 감시 경로 절반을 지던
      `money-basis-002`(같은 basis 두 금액의 비교가 `compareKnownVat` 위에 선다)는 그대로다.
      **덮이지 않고 남는 것 둘** — ① 결과 상태의 **이름**(`$.perPath.*.outcome` 의 `Comparable`)은
      계약 어휘 밖이라 정확 비교에 두지 않았다(`money-basis-003` 의 `contract_binding.does_not_carry` ①,
      아래 「승인된 피연산자 부재」 계열과 같은 잣대) ② 검색 **API**(엔드포인트·페이지네이션)는 M3 다.
    unblocks_when: |-
      **닫힌 조건 그대로다.** ① 운영자가 `regression-ledger.md` R-BASIS-01 의 「같은 쌍이 감시 경로와 검색
      경로에서 같은 답을 내는지도 함께 고정한다」를 업무 규칙으로 명시 승인하고(그 축을 소유한 `STR-16` 의
      신설 승인을 겸한다) ② strategy slice 가 그 축의 계약 자리를 세운다 — **둘 다 2026-09-06 에 났다**
      (`capability-map.md` STR-16 승인 주석 = decision 29 · M1/1E `WatchRules.evaluate` + `compareKnownVat`).
      ②의 형태는 예고와 다르다 — 「검색 경로를 나르는 타입」이 아니라 **경로를 모르는 함수 하나**를
      두 경로가 공유한다(D-2 (a)·D-11). 계약 경로와 승인 좌표는 `money-basis-003` 의 `change_history`
      2026-09-06 항목이 갖는다.

  - axis: "corpus 적격성 판정 — legacy 유래 행이 승격 대상인가"
    domain: money-basis
    why_blocked: |-
      **1B 는 적격성을 판정하지 않는다.** 값 타입이 내는 것은 `vatTreatment`·`provenance` 이고,
      「이 행이 authoritative corpus 로 승격될 수 있는가」와 그 사유는 **provenance first-match
      rule** 위에 서는 판정이라 그 rule 을 소유한 **1D** 의 몫이다(`Provenance.kt` 의
      `BaseAmountProvenance` 는 라벨 타입만 선언하고 *"first-match rule 자체는 1D 소유"* 라 적는다).
      기대값의 `$.autoTaggedFromDefinitionDefault`·`$.eligibleForAuthoritativeCorpus`·`$.reasonCode`
      (`LegacyOriginNotPromotable`)가 그 축이고, 2026-09-05 계약 정정으로 **나르기만 하는 자리**가 됐다.
    owning_open:
      - "`OPEN-1BC-ELIGIBILITY` (신설 2026-09-05, 1B-c) — 소유는 1D(provenance first-match rule)다"
    what_is_covered_instead: |-
      **세탁의 실질은 덮인다** — `$.vatTreatment`·`$.provenance` 정확 비교가 「legacy 유래 행이
      `INCLUSIVE`·`Clean` 으로 승격되지 않는다」를 표기 변형과 무관하게 잠근다(Codex B7·B8 이
      실증한 변이 가운데 그 둘을 건드리는 것은 전부 걸린다).
      **비는 것은 적격성 불리언 단독 변이다** — B7 이 든 셋째 갈래(`$.eligibleForAuthoritativeCorpus`
      만 `true` 로)가 계약에 걸리지 않는다. **그 사실을 감추지 않는다**: `mutation_sweep_targeted.py`
      의 해당 표적을 지우지 않고 남겨 매 실행 `PASSES` 로 보이게 두었고, `commands.md` **C-7** 이 그
      자리를 이름으로 적는다.
    unblocks_when: |-
      1D 가 provenance first-match rule 과 그 위의 승격 판정을 계약으로 세운다. 그때 이 축의 세
      경로를 `verified_paths` 로 되돌리고 `change_history` 에 그 계약 경로를 적는다 — 되돌아오면
      B7 셋째 갈래도 함께 닫힌다.

  - axis: "어댑터 층의 단위 처리 — 원문 unit 보존과 미선언 거부의 방출"
    domain: rate-unit
    why_blocked: |-
      **계약에 자리가 없다.** `v2-지침서.md` §4.1 은 *"percent 입력은 adapter에서 명시적으로
      변환하며 **원문 unit을 기록한다**"* 로 이 의무를 **어댑터 층**에 둔다. 1B 가 세운 `Rate` 의
      성분은 `fraction` 하나뿐이라 값에 원문 unit 을 실을 자리가 없고, 어댑터 계약은 1C 이후다.
      **막는 것은 근거도 술어도 아니라 계약 층의 부재**다 — 근거(§4.1)는 승인 문면이고 술어도
      갖춰져 있다.

      **2026-09-05 축을 넓혔다 — 미선언 거부의 방출도 같은 층이다.** 같은 §4.1 문장이 *"unit/basis/
      provenance가 없거나 모르는 값은 추측하지 않고 **거부**"* 를 요구하는데, 1B 는 그 요구를
      **구성상 불가**(생성자 `internal`, 공개 경로 둘)로 지켰을 뿐 **`Fact.Absent(UNIT_NOT_DECLARED)`
      를 내는 함수를 두지 않았다** — `ReasonCode.UNIT_NOT_DECLARED` 는 `Carrier.kt` 에 선언만 돼
      있고 그 값을 내는 main 코드가 저장소에 없다. 단위 선언을 **읽어서** 그 사유를 방출하는 자리는
      어댑터이고 원문 unit 보존과 같은 계약이라, 새 OPEN 을 세우지 않고 이 축이 함께 받는다.
    owning_open:
      - "`OPEN-1BC-SOURCE-UNIT` (신설 2026-09-05, 1B-c) — 소유는 1C 이후 어댑터 slice 다"
    what_is_covered_instead: |-
      **변환과 차단은 덮인다** — 수용측은 `$.rate.fraction` 정확 비교가 percent→fraction 변환을
      잠그고, 거부측은 「단위 미선언 입력으로 `Rate` 를 만들 함수가 없다」를 컴파일 fixture 12 가
      잠근다. **비는 것은 둘이다** — ① 「변환 뒤에도 원문이 무엇이었는지 남는가」 ② 「미선언 입력을
      읽었을 때 **어떤 사유로** 거부되는가」. 둘 다 2026-09-05 에 이 축으로 이관됐고(①은 decision 21
      승인, ②는 같은 날 계약 정정) **기대값에서 함께 빠졌으므로 이 축에는 지금 fixture 가 없다.**
      제수 `100` 도 계약 산출이 아니라 나르기만 한다(`Rate.kt` 의 `private const`).
    unblocks_when: |-
      어댑터 계약이 단위 선언을 읽어 원문 unit 을 나르고 미선언 입력을 `Fact.Absent(UNIT_NOT_DECLARED)`
      로 거부하는 자리를 세운다(1C 이후). 그때 이 축의 case 를 **새로 만들고** — 기존 case 에 주장을
      되돌려 붙이지 않는다 — `verifies` 를 그 계약 위에서 쓴다.

