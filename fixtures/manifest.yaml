    2026-08-31(4문 4답)이 그 자리를 「유지 + 어휘 승인 대상」으로 정했다. 반면 corpus 가 스스로
    지은 그릇과 표기 변형(가족 B·C)은 승인 대상이 아니라 **M1/M2 계약 설계가 정할 몫**이다.
    **단 그것이 「잠가도 된다」는 아니다 — 2026-09-02 의 정정.** 가족 B 토큰이라도 `verified_paths`
    가 정확 비교로 잠그면 M1/M2 의 선택을 선점하므로 **그 잠금 자체의 승인**이 따로 필요하다.
    새 가족 B 잠금을 달기 전에 이 요구를 먼저 읽으라 — 정본은 `classification_policy` 의 같은 날 정정이다.
    **같은 축에 이름만이 아니라 표현이 든다** — 운영자 결정 2026-08-31(`floor-shortfall` 출력
    표현)이 `floor-shortfall-002`·`003` 의 `verifies` 를 좁히면서 잠금에서 뺀 **출력 표현 묶음과
    유리수(분자/분모) 표현**이 그 자리다. 승인 문면과 되돌림은 `uncovered_axes` 의 「승인 부재로
    **검증 주장에서 내린** 축」이 지목한다.
    **승인 전까지 그 이름들은 `verified_paths` 에 들지 않는다** — 운영자 결정 2026-09-01(projection
    으로 좁힘)이 `floor-shortfall-002`·`003`·`004` 의 `$.result` 를 `verified_projections` 로 옮겨
    그 상태를 기계에도 맞췄다. **승인이 나면 그 경로를 `verified_paths` 로 되돌리고**
    `change_history` 에 승인 기록의 좌표를 적는다.
  - |-
    **M1 소비 테스트는 `verified_paths` 만 정확 비교하고, `verified_projections` 는 그 술어로만 비교한다.**
    기대값 파일 전체를 비교하면 목록 밖의 미승인 출력 표현까지 golden 으로 굳는다 — 그것을 막으려고
    운영자 결정 2026-08-31(assertion path 계약화)이 앞 필드를 세웠고, 그 정확 비교가 **미승인 이름**을
    잠그는 자리를 막으려고 운영자 결정 2026-09-01(projection 으로 좁힘)이 뒤 필드를 세웠다.
    `insufficient-evidence` case 는 두 필드가 다 없고 **그것은 「계약 없음」이지 「전체 비교」가 아니다**.
    목록 밖 값이나 projection 이 계약하지 않은 이름이 실제 계약이 되어야 한다고 판단되면 **먼저 그
    표현·이름을 승인받고** 해당 case 의 두 필드와 `change_history` 를 함께 갱신한다.
  - "`data-extract.md` §5 7단계 — Claude 가 이 corpus 를 소비하는 test 를 만들고(M1 slice), Codex 가 source·privacy·expected reasoning 을 독립 검토한다."
  - "사용자 승인 시 각 case 의 `review.approved_by_user`를 `true`로 올리고 `review.claude_commit`을 채운다."
  - "기대값을 바꿀 때 case 를 덮어쓰지 않고 `change_history`에 변경 이유와 policy version 을 적는다(`data-extract.md` §3)."
