      accessed: "2026-09-07 — 오케스트레이터가 확보해 전달. curator 레인이 docx 원문에서 표를 **독립 재추출**해 인수본과 대조했다(16행 일치)."
      what_it_declares: |-
        문서 끝 **「OPEN API 에러코드별 조치방안」** 절 — 코드값 **16개**(`01`·`02`·`03`·`04`·`05`·`06`·`07`·`08`·
        `10`·`11`·`12`·`20`·`22`·`30`·`31`·`32`)에 **이름 · 설명 · 조치방안** 문면을 붙인 표다. 같은 문서의 응답
        메시지 명세와 응답 예시가 `resultCode` `00` / `resultMsg` `정상` 을 싣는다 — **`00` 은 에러 표에 없다.**
        16 + `00` = **17** 이 `OPEN-COL-02` 문면의 「17 `resultCode`」와 맞는 셈이다.
        `koneps-collection-027` 이 이 표를 인용하고, **입력 파일이 16행 전문의 커밋된 정본**이다.
      what_it_does_not_contain: |-
        **코드 → 범주(재시도 가능 / 재시도 불가 / quota / 입력 오류 / 데이터 없음) 매핑이 없다.** 표가 주는 것은
        사람이 읽는 조치방안 문면이고, 「이 실패를 재시도해도 되는가」는 문서가 답하지 않는다 — 그 판정은 V2 의
        것이며 **승인 대상**이다(D-M3-4 가 `procurement` 정책 데이터로 두기로 한 자리).
        **성공 코드 집합도 표가 정하지 않는다** — legacy 가 `03`(No Data)을 성공으로 두는데(`OK_RESULT_CODES`)
        이 표는 `03` 을 에러 코드로 등재하고 조치방안 칸만 비워 둔다. **어느 쪽도 이 문서가 결론짓지 않는다.**
      scope_caveat: |-
        **대상 서비스가 다르다.** 이 가이드는 `PubDataOpnStdService`(나라장터 공공데이터개방표준서비스, 2019)의
        것이고 `koneps-collection` 이 겨누는 `BidPublicInfoService`(입찰공고정보서비스, 2025 참고자료 —
        `koneps-openapi-reference`)가 아니다. 「에러코드별 조치방안」 절은 **공공데이터포털 공통 절**로 보이나
        **그 사실을 이 문서가 선언하지는 않는다.**
        그래서 `koneps-collection-027` 은 **「문서가 이 표를 적는다」까지만 `authoritative` 로 주장하고**
        「이 표가 입찰공고정보서비스에 적용된다」는 주장하지 않는다(`appliesToBidPublicInfoServiceDeclared: false`).
        **적용 범위는 운영자 승인 대상**이며 방증 둘이 있다 — ① 두 문서의 `resultCode` 선언이 같다(항목크기 2 ·
        필수 · 샘플 `00`) ② legacy 가 **입찰공고정보서비스에서 관측한** `08` 의 뜻(*"필수값 입력 에러"*)이 이 표의
        `08` 행과 **문면까지 일치**한다. 둘 다 `observed`/`legacy-behavior` 층이다.
      privacy: |-
        이 표에 개인·기관 식별자가 없다. 문서 다른 절의 담당자 정보는 인용하지 않았다.
      not_committed: |-
        **이 파일은 저장소에 없다** — `_workspace/` 는 `.gitignore` 대상이라 clean worktree 에 없고, legacy
        symlink 처럼 blob id 로 고정할 수도 없다. 재취득은 `source_url` + `sha256` 대조로만 된다.
        **그래서 표 본문의 커밋된 정본을 `fixtures/input/koneps-collection-027.json` 에 두었다** — 그 파일은
        해시가 manifest 에 있고 스윕이 읽는다.
