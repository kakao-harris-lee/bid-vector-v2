schema:
  base: data-extract.md §3
  extensions:
    verifies: 이 fixture 가 **무엇을 검증하는가**. 한 case 는 한 의미만 검증한다(§7 「한 case 의 기대값을 여러 의미에 재사용」 금지).
    verified_paths: |-
      **`verifies` 의 기계적 표현이다.** case 의 `verifies` 가 주장하는 축에 대응하는 **기대값 JSON 경로 집합**이며,
      **M1 소비 테스트는 이 경로만 정확 비교해야 한다.** 목록 밖의 값은 기대값이 **나르는 참고**이지 계약이 아니다.
      **정확 비교가 아닌 계약은 이 목록에 들지 않는다** — 그 자리는 `verified_projections` 가 따로 든다.

      **왜 이 필드가 필요한가 — 운영자 결정 2026-08-31(assertion path 계약화).** 앞선 라운드는 `verifies` 를 산문으로
      좁혔으나 `expected_file` 은 그대로여서, 「나르기만 한다」가 **선언에만 있고 기계에는 없었다.** 그 상태로는 M1
      테스트가 기대값 파일 **전체**를 비교해 미승인 출력 표현까지 golden 으로 굳힐 수 있다. 이 필드가 그 선언을
      기계가 읽는 계약으로 옮긴다.

      **강등선과 같은 잣대다.** `classification_policy` 가 세운 선 — *"case 가 그 이름·표현을 **검증 대상으로 잠그는가**"* —
      에서 **잠그는 쪽이 이 목록**이고 **나르기만 하는 쪽이 목록 밖**이다. 그래서 가족 A 가 나르는 미승인 이름
      (`Measured` · `SampleInsufficient` · `Undeclared` · `UNKNOWN`)과 가족 B 의 자작 그릇은 **경로 밖에 놓이는 것이
      기본**이고, `verifies` 가 그 값을 직접 주장하는 자리에서만 목록에 든다 — 그때 그 자리는 **어휘·표현 승인 대상**이다.

      **도출 규칙 셋.** ① `verifies` 가 그 경로의 **값**을 주장하면 **든다**. ② `verifies` 가 **존재·형태만** 주장하고
      어느 값인지는 주장하지 않으면(예: *"사유와 함께 거부된다"*) **들지 않는다** — 실제 어휘는 가족 B 답대로 **M1/M2
      계약 설계**가 정한다. ③ `verifies` 가 아예 언급하지 않는 **동반 산출**(면허 축의 `unparsableRowCount` ·
      `requirementSourceFields`, 공통 `policyVersion`)과 **입력 되울림**은 들지 않는다.

      **`insufficient-evidence` case 에는 이 필드를 두지 않는다.** 그 case 들은 M1 golden 이 아니므로(§6 완료 gate 실패)
      계약할 assertion 이 없다. **필드 생략은 「계약 없음」이지 「전체 비교」가 아니다** — 승인으로 `authoritative` 에
      올라올 때 그 case 의 `verifies` 에서 목록을 도출해 함께 단다.

      **규칙 ①에 단서가 붙는다 — 운영자 결정 2026-09-01(projection 으로 좁힘).** `verifies` 가 주장하는 값이
      **미승인 리터럴**이면 그 경로를 이 목록에 두지 **않는다** — 정확 비교가 곧 그 리터럴을 M1 golden 으로 잠가,
      `classification_policy` 가 「나르기만 한다」로 남긴 이름을 계약이 도로 잠그기 때문이다. 그 자리는
      `verified_projections` 로 옮겨 **승인된 어휘로만 쓴 술어**를 계약한다. 이 목록에 남는 값은 **승인 문면이
      있는 이름**(예: `v2-지침서.md` §4.4 의 `Unmeasurable`)이거나 **가족 B~E 로 판정된 자리**다.

      **목록이 `verifies` 와 어긋나면 그 자체가 finding 이다.** 전건을 `verifies` 문면에서 도출했고, 도출이 갈릴 수
      있는 자리는 바꾸지 않고 레인 보고에 표로 올렸다.
    verified_projections: |-
      **정확 비교가 아닌 계약이다.** `verified_paths` 가 *"이 경로의 값을 그대로 비교한다"* 인 자리라면 이 필드는
      *"이 경로의 값을 **선언된 술어로만** 비교한다"* 인 자리다. 항목 하나의 자리는 다섯이 필수다 — `path` ·
      `projection`(술어) · `operand`(피연산자) · `operand_source`(피연산자 어휘가 서는 승인 문면) ·
      `means`(그 술어가 표현하는 승인된 의미).

      **왜 이 필드가 필요한가 — 운영자 결정 2026-09-01(projection 으로 좁힘).** `verifies` 가 주장하는 값이 미승인
      리터럴이면 `verified_paths` 의 정확 비교가 **승인 대기인 이름을 authoritative golden 으로 굳힌다.** 강등도
      리터럴 승인도 아닌 세 번째 처리로 운영자가 택한 것이 이것이다 — **승인된 의미만 표현하는 projection 으로
      계약을 좁힌다.** **새 정책이 아니라 적용이다** — `classification_policy.authoritative` 가 B3 에서 세운
      *"`verifies` 를 승인된 의미로 좁혀 유지"* 를 그대로 쓰되, 그때 산문에서 한 좁힘을 이번에는 기계 계약에서 한다.

      **술어 어휘는 하나뿐이다** — `not-equals`. 늘릴 일이 있으면 이 자리에 정의하고 늘린다.

      **`normalize` — 여섯째 키이고 선택이다.** 어휘 `case-fold` 하나뿐이며, 있으면 **값과 피연산자를 둘 다
      case-fold 한 뒤** 비교한다. **없으면 정확 비교**이므로 이 키를 달지 않은 항목의 의미는 바뀌지 않는다.
      **왜 필요한가 — Codex 재리뷰 B8 `findings[0]`(high).** `not-equals` 는 **한 표기만** 배제하므로 같은
      개념을 다른 대소문자로 승격하는 산출이 빠져나갔다(`Inclusive` ↔ `INCLUSIVE` 실증). **계약의 대상은
      직렬화 표기가 아니라 개념**이라, 표기 변형(가족 C)이 술어를 우회하지 못하게 비교를 정규화한다.
      **표기 통일 자체는 여전히 M1/M2 몫이다** — 이 키는 통일을 대신하지 않고 **계약을 표기에 둔감하게** 만든다.

      **술어 어휘를 여기서 동결한다 — 운영자 결정 2026-09-02.** 이 slice 의 계약 기계는 **`verified_paths` 의
      정확 비교**와 **`verified_projections` 의 `not-equals`(+ 선택 `normalize: case-fold`)** 가 **전부**다.
      **presence/shape · 의미 범주 · `equals-path` 같은 새 술어를 이 slice 는 만들지 않는다.**
      **왜 — Codex 재리뷰 B9.** 동결된 술어로 막지 못하는 변이(주장 필드 삭제 · null 치환 · 다른 확정 토큰)가
      실증됐고, Codex 자신이 fallback 으로 *"그런 projection 으로 표현할 수 없는 case 는 계약이 준비될 때까지
      authoritative 에서 내린다"* 를 들었다. 운영자가 그것을 택했다 — **리뷰 압력 아래서 계약 기계를 더
      발명하지 않는다.** 표현하지 못하는 case 는 **내린다**(`classification_policy.insufficient_evidence`).
      **술어의 확장 소유권은 M1 계약 설계에 있다** — 거기서 소비 테스트의 형태와 함께 정한다.
      **동결의 결과로 이 필드의 현재 사용처는 0 이다** — projection 을 달았던 case 넷이 같은 결정으로
      전부 내려갔기 때문이다(스윕이 낸다). **필드를 지우지 않는다** — 정의와 도출 규칙이 되돌림의 계약이고,
      M1 이 술어를 갖추거나 case 가 올라올 때 그대로 쓴다.

      **어느 projection 에 다는가 — `means` 문면이 정한다.** `means` 가 **상태·개념**을 계약하면(「승격되지
      않는다」 · 「측정 불가로 떨어지지 않는다」) **단다.** **표기 자체가 계약인 자리에는 달지 않는다** — 그런
      자리는 정확 비교가 의도이기 때문이다. **현재 다섯 projection 은 전부 앞쪽이라 전건에 달렸다**(verifier
      r16 F-8 로 형제 넷을 뒤따라 달았다) — 뒤쪽에 해당하는 자리는 **아직 없고**, 생기면 이 규칙으로 가른다.
      **`operand` 는 승인 문면이 있는 어휘여야 한다.** 없으면 projection 이 잠금을 옮길 뿐이고, 그래서
      `operand_source` 가 필수다.

      **projection 은 값보다 약하고, 그 약한 만큼이 미승인분이다.** `$.result != "Unmeasurable"` 은 「측정 불가로
      떨어지지 않는다」까지만 계약하고 「그때의 이름이 무엇인가」는 계약하지 않는다 — 뒤가 바로 승인 대기인 자리다.
      그 이름이 승인되면 경로를 `verified_paths` 로 되돌리고 `change_history` 에 승인 기록의 좌표를 적는다.

      **같은 경로가 `verified_paths` 와 겹치면 안 된다** — 겹치면 정확 비교가 되살아나 projection 이 무의미하다.
      **`insufficient-evidence` case 에는 이 필드도 두지 않는다** — `verified_paths` 와 같은 이유다(계약할 assertion 이 없다).
    expected_reasoning: 기대값이 **어느 문서의 어느 문장**에서 나왔는가. Codex 독립 검토(§5 7단계)의 대상.
    source.kind 어휘: official-doc | operator-decision | approved-spec | m0-derived-rule | legacy-observation. 앞 셋은 `authoritative` 분류를 낸다. **`m0-derived-rule`은 `authoritative` 를 내지 않는다** — 운영자 결정 2026-08-31 로 `insufficient-evidence` 이며 근거와 되돌림 경로는 `classification_policy.insufficient_evidence`가 적는다. `legacy-observation`은 낼 수 없다.
    classification 어휘: |-
      `data-extract.md` §1의 세 층(`authoritative` · `observed` · `legacy-behavior`)과, 그 셋 어디에도
      들지 않는 case 를 두는 `insufficient-evidence`. **넷째 층이 아니라 §1 밖의 보류 상태**이며 §6의
      어휘를 빌린다(*"명세가 모호 | `insufficient-evidence`, 완료 gate 실패"*). **선언된 이탈**이고
      근거는 `classification_policy.insufficient_evidence` 가 적는다.
    expected_sha256: 기대값 파일의 SHA-256. §3은 fixture 해시만 요구하나 기대값도 사후 변경 탐지 대상이다.
    privacy.synthetic: 입력이 합성인지. 운영 데이터 유래가 아님을 case 마다 명시한다.
    privacy.method: 비식별화 방식. 합성 입력은 `not-applicable-synthetic`.
    extracted_at / extraction_method: 추출 시점과 방법. 합성 입력은 `authored-from-approved-spec`.
    normalization.source_form: 정규화 **전** 원본의 형태(§3 「정규화 전 원본과 정규화 후 fixture 구분」).
    provisional: 이 기대값이 어느 활성 `OPEN`의 결정 전 **임시 처리**인가. 그 `OPEN`이 닫히면 교체된다.
    owning_open: 이 case 가 **건드리지 않는** 인접 축의 소유 `OPEN`. 원칙은 활성 id 이나, 이미 해소된 id 를 드는 자리는 **해소 시점을 함께 적는다** — 이 필드가 든 id 가 활성임을 함의하지 않는다.
    not_covered: 이 case 가 덮지 **못하는** 것.
    change_history: |-
      기대값 변경 이력(§3 「기대값 변경 시 case 를 덮어쓰지 말고 변경 이유와 policy version 기록」). 최초 등재에는 비어 있다.
      항목 하나의 자리는 넷이 필수다 — `date` · `change`(무엇을 바꿨는가) · `reason`(왜) · `policy_version`(§3 요구.
      effective-dated 정책에 의존하지 않는 case 는 「해당 없음」과 근거 문면을 적는다). **입력·기대값이 실제로 바뀐
      항목은** `previous_sha256` · `previous_expected_sha256` 를 더 싣는다 — 앞선 해시를 남기는 것이 「덮어쓰지
      않는다」를 기계로 확인 가능하게 만든다. 분류만 바꾼 항목은 파일이 그대로이므로 그 둘이 없다.

classification_policy:
  authoritative: |-
    출처가 ① 조달청 공식 문서 인용 ② 커밋된 운영자 결정 기록 ③ `v2-지침서.md`(M0 선행 조건으로
    승인된 기준 문서) 중 하나인 case. M0 산출 문서(`capability-map.md`·`regression-ledger.md`·
    `data-dictionary.md`)는 **그 안에 인용된 결정·공식 문서를 가리키는 포인터로만** 쓰고,
    그 문서가 스스로 도출한 규칙은 이 셋 어디에도 들지 않는다.

    **②의 적용 기준 — 운영자 결정 2026-08-31.**

    *결정 축어 — 물음과 답을 그대로 옮긴다(대신 판단하지 않는다).*
    물음: *"결정 기록의 「기록자 bullet」이 `classification_policy.authoritative` ②의 「커밋된 운영자
    결정 기록」에 드는가?"* — 답: ***"든다"***.

    *이 레인이 그 답을 적용한 범위*(운영자 발화가 아니라 적용이다). **②는 「운영자 발화」로
    좁혀지지 않는다** — 커밋된 결정 기록 절 안의 **기록자 bullet 문면도 ②의 근거로 선다**
    (`reports/evidence/m0/0a2/decisions.md` 의 `OPEN-DEC-09` 절 본문 bullet · `OPEN-DEC-04` 절의
    기록자 bullet 이 그런 자리다). 그 문면이 **커밋된 결정 기록 안**에 있어야 한다는 한계는 이
    답이 새로 건 것이 아니라 **② 자신의 문면**(「커밋된 운영자 결정 **기록**」)이 이미 갖는
    것이다 — 그래서 M0 산출 문서가 **스스로 쓴 acceptance·검증 방법**은 이 기준으로 서지 않는다.
    그 구별이 `insufficient_evidence` 의 판정 축과 같은 잣대다.
    **그렇게 도출된 규칙에만 기댄 case 가 실제로 있다** — 그것들은 이 층에 **들지 않는다**.
    `source.kind: m0-derived-rule`이 그 자리를 표시하고 바로 아래
    `classification_policy.insufficient_evidence`가 받는다(**최상위 `insufficient_evidence` 목록과는
    다른 자리다** — 그쪽은 fixture 가 아예 없는 후보다). **case 를 지우지 않는다.**

    **어휘를 나르기만 하는 것은 이 층을 막지 않는다 — 운영자 결정 2026-08-31(4문 4답).**
    case 의 `verifies` 가 미승인 이름을 **검증 대상으로 잠그면** 내려가지만, 규칙만 재고 이름은
    기대값이 **나르기만 하면** 이 층에 남는다. 그 강등선과 가족별 근거는
    `classification_policy.insufficient_evidence` 가 축어로 갖는다. **남은 것이 그 이름을 승인받은
    뜻은 아니다** — 그 이름들은 **어휘 승인 대상**이며 그 축은 같은 자리가 적는다.

    **같은 강등선이 이름만이 아니라 표현에도 걸린다 — 운영자 결정 2026-08-31
    (`floor-shortfall` 출력 표현).** `verifies` 가 미승인 **출력 표현**(결과 항목의 묶음 · 수의
    표현 형태)을 검증 대상으로 잠그는 것도 이름을 잠그는 것과 같은 자리에 선다. 그 결정이
    택한 처리는 강등이 아니라 **`verifies` 를 승인된 의미로 좁혀 유지**이고, 잠금에서 빠진
    표현은 가족 A 와 같이 **어휘·표현 승인 대상**으로 기록된다. 물음·답 축어와 이 레인이 그
    답을 적용한 범위는 `classification_policy.insufficient_evidence` 가 갖는다.
  insufficient_evidence: |-
    **운영자 결정 2026-08-31 — `source.kind: m0-derived-rule` case 를 `authoritative` corpus 에서
    제외한다.** 근거가 **M0 산출 문서가 스스로 도출한 acceptance·정의** 뿐이고, 그것을 세운 운영자
    결정·조달청 문서·`v2-지침서.md` 문면이 그 자리에 없다.

    **왜 `authoritative` 가 아닌가.** `data-extract.md` §1의 `authoritative`는 「공식 규정/API 문서
    또는 **사용자가 승인한** 업무 규칙」인데 **이 근거들이 그 「승인」에 드는지가 정해져 있지 않다.**
    운영자는 2026-08-30 「M0 승인」을 냈고(`milestone-0.md`의 「사용자 명시 승인」) 그 기록이 덮는
    것으로 열거한 셋은 **활성 `OPEN`의 M1 이후 이월 · fixture 가 덮지 못한 축 · `milestone-1.md:12`의
    부분 만족인 채로 M1 진입**이다 — **M0 산출 문서의 acceptance 를 업무 규칙으로 비준한다는 문면은
    그 기록에 없다.** 미결을 확정으로 쓰지 않는다.

    **왜 이 이름인가 — `data-extract.md` 어휘 대조.** §1은 층을 **셋**만 정의하고(`authoritative` ·
    `observed` · `legacy-behavior`) **이 case 들은 셋 어디에도 들지 않는다** — 승인된 규칙이 아니고,
    운영 데이터 관찰이 아니며(입력이 synthetic), 기존 Python 이 낸 출력도 아니다(이 slice 는 legacy
    Python 을 실행하지 않았다). 그래서 **§1의 세 층을 넓히지 않고 그 밖에 둔다.** 그 자리의 어휘를
    주는 것이 **§6**이다 — *"명세가 모호 | `insufficient-evidence`, 완료 gate 실패"*. 이 값은
    **corpus 안의 넷째 층이 아니라 corpus 후보의 보류 상태**이며, §6이 그 상태에 **완료 gate 실패**를
    건다. 그래서 `milestone-1.md:12`의 만족도가 이 결정으로 **내려간다**(`fixtures-scope.md`).

    **되돌림 경로 — 무엇이 승인되면 어디로 올라가는가.** 운영자가 각 case 의 `source.reference` 가 든
    **M0 산출 문서의 acceptance 를 업무 규칙으로 명시 승인**하면 그 case 는 `authoritative` 로
    올라간다. `license-011`은 그 승인만으로는 부족하다 — **활성 `OPEN-QUAL-11`이 닫혀 `provisional`
    기대값이 교체된 뒤**에야 올라간다. 올릴 때는 `classification` 을 되돌리고 `change_history` 에
    승인 기록의 좌표를 적는다. **case 를 지우지 않는 이유가 이 경로다.**

    **legacy 를 정답으로 올린 것과는 다른 축이다** — 이 근거들은 legacy 가 낸 **출력**이 아니라
    M0 조사가 legacy 형태를 읽고 세운 **V2 설계 요구**다. `legacy-behavior` 층은 여전히 0건이다.

    **2026-08-31 전수 재판정 — `source.kind` 자신이 재판정 대상이었다.** 앞선 라운드는 이미
    `m0-derived-rule` 이던 자리만 내렸고 **`source.kind` 를 하나도 바꾸지 않았다.** 그래서 근거가
    실제로는 M0 산출 문서의 자체 도출인데 `kind` 가 `operator-decision`·`official-doc`·`approved-spec`
    으로 적힌 자리가 남았다. 이 라운드가 **`operator-decision` 전건의 결정 문면을 원문으로 열어
    대조**하고 `approved-spec`·`official-doc` 도 같은 눈으로 훑었다. 판정 축 셋 —
    **① 한정어를 지웠는가**(결정이 좁게 말한 것을 case 가 넓게 인용) **② 결정이 축만 정하는가**
    (결정은 「무엇을 어느 축에 넣는다」까지이고 기대값은 다른 데서 온다) **③ 인용한 결정이
    실재·해소됐는가**(활성 `OPEN` 을 결정처럼 인용하지 않았는가).

    **적용 기준을 명시한다** — 판정은 case 가 선언한 **`verifies`(§7 「한 case 는 한 의미만
    검증한다」의 그 의미)** 를 대상으로 한다. `verifies` 가 주장하는 것 중 하나라도 ①②③ 어느
    문면으로도 나오지 않으면 내린다. 반대로 expected JSON 이 스키마로 나르기만 하고 `verifies` 가
    주장하지 않는 필드(예: 면허 축의 `unparsableRowCount`·`requirementSourceFields`, 공통
    `policyVersion`)는 그 자체로 내리는 사유가 아니다 — **그 필드들의 근거는 `data-dictionary.md`
    §3.2.1 「동반 산출」과 `capability-map.md` QUAL-03 acceptance 이며 M0 자체 도출이다. 이 corpus 는
    그것을 case 의 주 규칙으로 세우지 않는다.** 세운 자리는 내렸다.

    **판정 대상에 어휘가 든다 — 운영자 결정 2026-08-31. 물음과 답을 그대로 옮긴다(대신 판단하지
    않는다).**
    물음: *"verdict-001·002가 SkipReason 구체 어휘 `CapacityHold`·`LowPriority`를 authoritative
    golden으로 고정하고 있다. OPEN-DEC-05는 『Skip 판정 + 사유 코드 의무』라는 축만 정했고 이 두
    리터럴 값의 출처는 data-dictionary 자체 도출뿐이다. 어떻게 처리할까?"*
    답: ***"insufficient-evidence 강등"*** — 어휘 명시 승인과 합성 어휘 재작성 두 선택지를
    물리치고 택한 답이다.

    **이 레인이 그 답을 적용한 범위**(운영자 발화가 아니라 적용이다). 판정 대상은 case 의
    `verifies` 가 주장하는 규칙만이 아니라 **기대값이 도메인 어휘로 고정하는 리터럴 토큰** —
    enum 값 · 상태/사유 코드 · 판정 어휘 · 고정 문자열 · 도메인 키 이름 — 도 포함한다. 그 토큰이
    위 세 출처(①②③) 어느 문면에도 없고 출처가 M0 산출 문서의 자체 도출뿐이면 그 case 는
    내려간다. **fixture 파일의 형식·schema 자체**(`data-extract.md` §3가 정하는 것)는 대상이
    아니다 — 어휘를 재는 것이지 그릇을 재는 것이 아니다. `authoritative` 로 남은 case 전수에
    이 잣대를 한 번 돌렸고, 판정이 갈릴 수 있는 자리는 **바꾸지 않고 운영자에게 다섯 가족으로
    묶어 올렸다** — 그 답이 바로 아래다.

    **어휘 판정의 강등선 — 운영자 결정 2026-08-31(에스컬레이션 4문 4답).**

    *결정 축어 — 물음과 답을 그대로 옮긴다(대신 판단하지 않는다). 물음은 이 레인이 세운 가족
    정의 그대로이고, **네 답 모두 「유지」이며 분류를 바꾼 답은 하나도 없다.***

    - **가족 A**(M0 산출 문서가 sealed 정의로 선언한 이름이 기대값에만 실린 자리 — `Measured` ·
      `SampleInsufficient` · `Undeclared` · `UNKNOWN`) — 답: ***"유지 + 강등선 성문화"***.
      강등선은 **「case 의 `verifies` 가 그 이름을 검증 대상으로 잠그는가」**로 확정한다.
      기대값이 나르는 미승인 이름은 **어휘 승인 대상**으로 정책에 기록한다.
      (「여섯 건도 강등」·「이름들 명시 승인」 선택지를 물리치고 택한 답이다.)
    - **가족 B**(corpus 가 스스로 지은 결과·사유 코드) — 답: ***"그릇으로 간주, 유지"***.
      fixture 자작 그릇은 **어휘 비준이 아니며**, 실제 어휘는 **M1/M2 계약 설계가 정한다**.
      (「강등」·「표기 중성화」를 물리쳤다.)
    - **가족 C**(개념은 승인 문면에 있고 표기만 다른 자리) — 답: ***"개념 기준 통과"***.
      승인 문면에 개념이 있으면 표기 변형은 통과한다. **표기 통일은 M1/M2 계약 설계로 이월**한다.
      (「승인 표기로 정정」·「강등」을 물리쳤다.)
    - **가족 D·E**(legacy·조달청 유래 필드 이름 / 입력 되울림 실값) — 답: ***"둘 다 통과"***.
      D 는 `data-extract.md` §2·§5 가 허용하는 **입력 형태의 출처**이고 `lcnsLmtNm` 은 ① 조달청
      필드명이다. E 는 **입력 되울림**이고 규칙이 그 이름에 의존하지 않는다.
      (「E 합성명 재작성」·「강등」을 물리쳤다.)

    *이 레인이 그 답을 적용한 범위*(운영자 발화가 아니라 적용이다). 답이 정한 것은 **강등선의
    위치**와 **유지의 근거**이고, 그 선을 이 corpus 의 case 에 대어 보면 **내려간 것과 남은 것이
    한 잣대의 양면**이다 — *"case 가 그 이름을 검증 대상으로 잠그는가."*
    **잠근다 → 내려간다.** `verdict-001`(*"…구분된다 (`CapacityHold`)"*) · `verdict-002`
    (`LowPriority`) · `floor-applicability-001`(*"…미적용 상태(`OutOfScope`)로 산출된다"*) 셋은
    `verifies` 가 이름을 괄호로 잠근다. `verdict-003` 은 `verifies` 가 잠그지 않으나 기대값이
    **`verdict-002` 를 내린 바로 그 어휘**를 잠가 같은 자리로 왔다.
    **나르기만 한다 → 남는다.** 가족 A 는 case 가 규칙을 재고 이름은 기대값이 나른다. B~E 는
    그에 더해 **출처의 성격 자체가 다르다**(자작 그릇 · 표기 변형 · legacy·조달청 유래 ·
    입력 되울림).
    **「나르기만 한다」가 기계에서도 성립하는가 — 두 번의 정정.** `verifies` 가 그 이름의 값을
    **직접 주장하는** 자리에서는 그 경로가 `verified_paths` 에 들어 **계약이 이름을 잠근다.**
    ① **assertion path 계약화(2026-08-31)** 가 `floor-shortfall-002`·`003`·`004` 의 `$.result` 를
    그렇게 잠갔고, 그것은 **가족 A 의 이름 `Measured` 를 authoritative M1 golden 에 기계적으로
    넣어** 위 답의 「나르기만 한다」와 어긋났다. ② **projection 으로 좁힘(2026-09-01)** 이 그
    셋을 걷었다 — 세 경로는 `verified_paths` 에서 빠지고 `verified_projections` 의
    `$.result != "Unmeasurable"` 로 옮겨, 계약이 **승인 문면이 있는 어휘**로만 서 있다.
    **그래서 가족 A 의 네 이름 가운데 `verified_paths` 에 남는 것은 하나도 없다.**
    **남는 잠금 둘은 가족 A 가 아니고, 둘 다 근거가 붙어 있다** — `floor-shortfall-001`·`005` 의
    `$.result`(`Unmeasurable`)는 `v2-지침서.md` §4.4 가 명시하는 **승인된 이름**이고,
    `floor-shortfall-005` 의 `$.transitionedFrom`(`Measured-candidate`)은 어느 M0 산출 문서에도
    없는 **corpus 자작 그릇(가족 B)** 이라 위 답이 *"그릇으로 간주, 유지"* 로 둔 자리다.
    **그 잠금은 2026-09-02 에 운영자 명시 승인을 받았다** — Codex 재리뷰 B6 `findings[1]` 이
    *"그릇일 뿐 어휘 비준이 아니다"* 라는 정책과 정확 비교가 어긋난다고 들었고, 운영자가 경로
    제거·projection 교체를 물리치고 **어휘 명시 승인**을 택했다. 축어와 승인의 성격은 그 case 의
    `change_history` 2026-09-02 항목이 갖는다. **실제 어휘가 M1/M2 계약 설계 소관이라는 것은
    그대로다** — 승인이 덮는 것은 지금 이 잠금이고, M1/M2 가 다른 토큰을 지정하면 기대값이 바뀐다.
    도출 규칙과 projection 의 형태는
    `schema.extensions.verified_paths`·`verified_projections` 가 적는다.

    **남는 것이 승인된 것은 아니다.** 위 답이 *"어휘 승인 대상으로 정책에 기록한다"* 로 정한
    자리다 — **기대값이 나르는 미승인 이름**(가족 A 의 넷이 대표다)은 M1 이 그 이름을 골든으로
    굳히기 전에 승인이 필요하다. 가족 B·C 의 자작 그릇과 표기 변형은 이 대상이 **아니다**:
    실제 어휘와 표기 통일은 **M1/M2 계약 설계가 정한다**는 것이 위 답이다.
    **단 「승인 대상이 아니다」가 「잠가도 된다」는 아니다 — 2026-09-02 의 정정.** 가족 B 의 토큰이라도
    `verified_paths` 가 그 값을 **정확 비교로 잠그면** M1/M2 의 선택을 선점하므로, 그 자리는 잠금을 걷거나
    (가족 A 처럼) **그 잠금 자체를 명시 승인**받아야 한다. 실제로 그렇게 승인받은 자리가 하나 있고
    (`floor-shortfall-005` 의 `$.transitionedFrom`) 근거는 그 case 의 `change_history` 가 갖는다.
    **이 레인은 그 자리를** `pending_user_approval` **이 적는 case 단위 비준과 다른 축으로 둔다** —
    앞은 **이름**의 층이고 뒤는 case 의 비준 여부다.

    **강등선이 이름만이 아니라 표현에도 걸린다 — 운영자 결정 2026-08-31(`floor-shortfall`
    출력 표현).**

    *결정 축어 — 물음과 답을 그대로 옮긴다(대신 판단하지 않는다).*
    물음: *"`floor-shortfall-002`·`003`의 `verifies`가 승인된 의미(N/N+1 경계·최소 표본 150·
    Unmeasurable·versioned 정책)를 넘어 『임계 사정률·빈도·분자·분모·범위·정책 version』 출력
    표현 묶음 전체와 유리수 표현을 authoritative로 잠그고 있다 — 그 묶음을 승인한 결정이 없다.
    어떻게 처리할까?"*
    답: ***"verifies 좁혀 유지"*** — 「insufficient-evidence 강등」과 「출력 묶음을 명시 승인」
    두 선택지를 물리치고 택한 답이다.

    *이 레인이 그 답을 적용한 범위*(운영자 발화가 아니라 적용이다). 두 case 의 `classification`
    은 `authoritative` 그대로 두고, **`verifies` 와 그 case 가 검증을 주장하는 범위 서술만**
    승인된 의미로 좁혔다 — `OPEN-DEC-01`(최소 표본 수 `150` · 정책 데이터 외부화) ·
    `OPEN-DEC-06`(`biasDirection` 을 구조화 필드로 노출) · `v2-지침서.md` §4.4(표본 부족은
    `Unmeasurable` · 비확률 표시 · versioned 정책) · **`N`/`N+1` 경계 의미**. 잠금에서 뺀
    **출력 표현 묶음 여섯 항목**(임계 사정률 · 빈도 · 분자 · 분모 · 범위 · 정책 version)과
    **유리수(분자/분모) 표현**은 가족 A 와 같은 자리로 간다 — **기대값이 나르는 미승인 표현**
    이며 **어휘·표현 승인 대상**으로 기록된다. 그 표현이 나오는 자리는 `capability-map.md`
    DEC-04 acceptance *"빈도 결과가 값 단독이 아니라 (임계 사정률, 빈도, 분자, 분모, 범위,
    정책 version) 묶음으로 반환된다"* 하나이고 그것은 **M0 산출 문서의 자체 도출**이라 ①②③
    어느 문면으로도 서지 않는다. **기대값·입력 파일과 해시는 바꾸지 않았다** — 기대값이 나르는
    것을 지운 것이 아니라 case 가 **주장하는 범위**를 좁혔다. 잠금이 풀린 축은 `uncovered_axes`
    의 「승인 부재로 검증 주장에서 내린 축 — `floor-shortfall` 빈도 결과의 출력 표현」이 받고,
    되돌림은 그 축의 `unblocks_when` 이 지목한다.

    **선언을 기계가 읽는 계약으로 옮긴다 — 운영자 결정 2026-08-31(assertion path 계약화).**

    *결정 축어 — 물음과 답을 그대로 옮긴다(대신 판단하지 않는다).*
    물음: *"B3 때 택한 『verifies 좁혀 유지』가 불충분하다는 판정이다 — 기대값 JSON 자체에 미승인 출력
    표현(임계 사정률·분자/분모·band·policyVersion)이 정확한 golden으로 남아 있고, manifest에 『어느 JSON
    경로가 assertion인가』 계약이 없어 산문 선언만으로는 M1 테스트가 전체 파일을 비교하는 것을 못 막는다는
    논지다. 어떻게 할까?"*
    답: ***"assertion path 계약화"*** — 「expected를 최소 projection으로」와 「두 case 강등」 두 선택지를
    물리치고 택한 답이다. 답이 든 선택지 문면: *"manifest에 M1 소비 테스트가 비교해야 하는 JSON 경로를
    case 필드로 명시해 승인된 projection만 계약이 되게 함. 기대값 파일 무변경. 스키마 차원의 변경이라
    전 case 적용 설계가 따라옴."*

    *이 레인이 그 답을 적용한 범위*(운영자 발화가 아니라 적용이다). 필드 이름을 `verified_paths` 로 두고
    정의를 `schema.extensions` 에 실었다. **`authoritative` 전건**에 그 case 의 `verifies` 에서 도출한 경로
    목록을 달았고, **`insufficient-evidence` 전건은 필드를 두지 않았다**(생략 = 계약 없음, 전체 비교가
    아니다). 도출 규칙 셋과 그 근거는 `schema.extensions.verified_paths` 가 갖는다.
    **이 필드는 강등선의 기계적 표현이다** — 위 4문 4답이 세운 *"검증 대상으로 잠그는가"* 에서 **잠그는 쪽이
    목록**이고 **나르기만 하는 쪽이 목록 밖**이다. 그래서 **가족 A 의 네 이름과 가족 B 의 자작 그릇은 경로
    밖에 놓이는 것이 기본**이 됐고, `floor-shortfall-002`·`003` 은 승인된 `N`/`N+1` 경계 의미의 경로만
    남아 **B3 이 지적한 출력 표현 묶음이 계약에서 빠졌다**. **기대값·입력 파일과 해시는 바꾸지 않았다** —
    답이 고른 선택지 자신이 *"기대값 파일 무변경"* 을 명시한다.

    **그 계약화가 남긴 구멍 하나 — 운영자 결정 2026-09-01(projection 으로 좁힘).**

    *결정 요지 — 이 레인이 받은 지시를 요약한다. **축어 인용이 아니다**(물음·답 원문을 이 레인이 받지 않았다).*
    Codex 재리뷰 **B5 `findings[0]`(high)** 가 든 것은 위 계약화 자신이 만든 자리다 —
    `floor-shortfall-002`·`003`·`004` 의 `verified_paths` 에 든 `$.result` 가 기대값의 값 **`Measured`** 를
    정확 비교로 고정하는데, 그 이름은 바로 위 4문 4답이 **가족 A 의 미승인 어휘**로 두고 **승인 대상**이라
    적은 것이다. 즉 **승인을 기다려야 할 리터럴이 authoritative M1 golden 에 기계적으로 들어 있었다.**
    운영자는 「리터럴을 명시 승인」과 「`insufficient-evidence` 강등」을 물리치고 **「projection 으로 좁힘」**
    을 택했다. **리터럴 승인도 강등도 아니며, 새 정책도 아니다** — 위
    `classification_policy.authoritative` 가 B3 에서 세운 *"`verifies` 를 승인된 의미로 좁혀 유지"* 의
    **적용**이고, 그때 산문에서 한 좁힘을 이번에는 기계 계약에서 한다.

    *이 레인이 그 답을 적용한 범위*(운영자 발화가 아니라 적용이다). 세 case 의 `$.result` 를
    `verified_paths` 에서 빼고 `verified_projections` 에 `not-equals` `Unmeasurable` 로 다시 달았다.
    피연산자를 `Unmeasurable` 로 고른 이유는 그것이 **`v2-지침서.md` §4.4 가 명시하는 승인된 이름**이라
    projection 이 잠금을 옮기지 않기 때문이고, 「측정 불가로 떨어지지 않는다」가 세 case 의 승인된 의미
    전부이기 때문이다. **분류·기대값·입력 파일과 해시는 이번에도 바꾸지 않았다** — 세 case 는
    `authoritative` 그대로다. 필드의 형태와 도출 규칙은 `schema.extensions.verified_projections` 가 갖는다.

    **둘째 모집단이 생겼다 — 운영자 결정 2026-09-02(동결+강등).** 위까지가 **근거의 층** 때문에 내려간
    자리라면, 이쪽은 **근거는 서는데 계약이 그 주장을 기계로 지키지 못해** 내려간 자리다. Codex 재리뷰
    B9 가 동결된 술어로 막지 못하는 변이 셋을 실증했고, 그 fallback 을 운영자가 택했다.
    **판정은 기계가 낸다** — 「`authoritative` = 확장 적대 집합에서 위반 변이체 통과 **0**」이고
    스윕이 목록을 낸다(`reports/evidence/m0/0e/commands.md` **C-15**).
    **그래서 `source.kind` 를 바꾸지 않았다** — 내려가는 사유가 근거의 층이 아니기 때문이다.
    **`m0-derived-rule` ↔ `insufficient-evidence` 대응은 이제 전건이 아니다**: 앞은 여전히 뒤를
    함의하나 **역은 성립하지 않는다.** 되돌림은 `uncovered_axes` 의 「계약 술어 부재로 authoritative 를
    유지하지 못한 축」이 지목한다 — **M1 이 술어를 갖추면 계약을 달고 되돌린다.**

    **어느 case 가 여기 드는지는 이 산문이 세지 않는다** — `source.kind`가 표시하고
    `reports/evidence/m0/0e/fixtures-commands.md` **F-7**이 센다. **둘째 모집단은 `source.kind` 로
    구별되지 않으므로 스윕이 낸다.**
  observed: 0건. 운영 데이터 접근 승인이 선행한다.
  legacy_behavior: 0건. 이 slice 는 legacy Python 을 실행하지 않았고 golden 기대값을 옮기지 않았다.
  pending_user_approval: |-
    **분류가 `authoritative`인 것과 승인된 것은 다르다.** 운영자의 2026-08-30 「M0 승인」은
    **M1 진입**을 덮고 **개별 case 의 기대값을 비준하지 않는다**(`milestone-0.md`의 「사용자 명시
    승인」이 덮는 것과 덮지 않는 것을 열거한다). 그러므로 **`authoritative` 로 남은 case 도 포함해**
    모든 case 의 `review.approved_by_user`는 여전히 `false`이며, case 단위 승인은 `next_steps`가
    적는 경로로 올린다. **`insufficient-evidence` 로 내린 것과 승인 대기인 것은 다른 축이다** —
    앞은 근거의 층이고 뒤는 비준 여부다. **운영자 결정 2026-08-31(4문 4답)이 어휘 승인 대상을
    정했고 — `authoritative` 로 남은 case 의 기대값이 나르기만 하는 미승인 이름 — 이 레인은 그것을
    셋째 축으로 둔다.** case 의 층도 비준 여부도 아니며 근거는
    `classification_policy.insufficient_evidence` 가 적는다. **같은 날의 `floor-shortfall` 출력
    표현 결정이 그 셋째 축에 이름만이 아니라 표현을 넣었다** — `verifies` 를 좁히면서 잠금에서
    뺀 출력 묶음과 유리수 표현이 그 자리이며, 이 레인은 그것을 **이름과 같은 축**으로 둔다.

numeric_discipline:
  rule: |-
    **`docs/discovery/data-dictionary.md` §12.1이 `legacy-behavior`로 등재한 수를 fixture 가 쓰지
    않는다.** input·expected 양쪽에 걸린다 — 입력에 넣어도 그 값이 곧 정책 경계가 되기 때문이다.
    그런 수가 필요한 자리(밴드 경계, 법정 하한율, 신뢰 상한, 허용 오차)는 **synthetic 정책
    입력**으로 받고, 기대값은 그 값이 아니라 **규칙**에만 의존하게 설계했다.
  check:
    what: "§12.1의 `legacy-behavior` 수 가운데 **비정수 율·배수·오차**와 **금액 구간 경계 셋**과 `-1.0`을 모든 fixture JSON에서 문자열·수치 양쪽으로 찾는다."
    exempt: |-
      정수 counts 와 sentinel — `15`(복수예비가격 개수) · `12`(confidence 계수) · `2`·`4`·`6`
      (반올림 자리수) · `0`·`0.0`. 그 수들은 자기 축 밖에서 흔한 셈이라 **문자열 일치가 채택을
      뜻하지 않는다.** 그 축에서의 채택 여부는 사람이 읽는다. (검사가 못 보는 자리를 적어 둔다.)
    result: "0건 (2026-08-30). 재현 명령은 `reports/evidence/m0/0e/fixtures-commands.md` **F-3**."
  authoritative_numbers_used:
    note: "§12.1이 `authoritative`로 등재한 수는 셋뿐이고(`100` · `150` · `0.10`) 이 corpus 는 그중 둘을 쓴다."
    entries:
      - value: 100
        unit: 무차원
        role: percent → fraction 변환 제수 (정의상 `1` percent = `1` ÷ `100`)
        source: "data-dictionary.md §12.1 — 층 `authoritative`(단위 정의)"
        used_in: [rate-unit-001, rate-unit-005]
        note: "`rate-unit-002`는 fraction 입력이라 제수가 `1`이고, `floor-shortfall-006`은 같은 변환을 쓰되 제수를 기대값에 싣지 않는다."
      - value: 150
        unit: 건수
        role: 하한 미달 빈도의 최소 표본 수
        source: "운영자 결정 2026-08-26 (`OPEN-DEC-01` 해소) · data-dictionary.md §12.1 — 층 `authoritative`"
        used_in: [floor-shortfall-001, floor-shortfall-002, floor-shortfall-003, floor-shortfall-004, floor-shortfall-005]
      - value: 0.10
        unit: fraction
        role: 부가세율
        source: "운영자 결정 2026-08-28 (U-1b)의 근거 서술 · data-dictionary.md §12.1 — 층 `authoritative`"
        used_in: []
        note: "쓰지 않았다. 과세 성분을 계산하는 case 가 이 corpus 에 없다 — 그 축은 `OPEN-REG-05`가 막는다."
  synthetic_policy_inputs:
    note: |-
      아래는 fixture 가 **정책 데이터를 입력으로 받는** 자리다. 값은 전부 synthetic 이며 legacy
      값을 옮긴 것이 아니다(위 검사가 그것을 기계로 확인한다). 각 case 의 기대값은 이 값이 아니라
      규칙에만 의존한다.
    entries:
      - "SYN-BAND-assessment-denominator (사정률 분모 필터 밴드) — 실물은 §1.4.3 B1~B3, 전부 `legacy-behavior`"
      - "SYN-BAND-published-floor-rate (게시 하한율 신뢰 밴드) — 실물은 §1.4.3 B6, `legacy-behavior`"
      - "SYN-TABLE-floor-rate (법정 하한율 시행일 표) — 실물 값은 `OPEN-DEC-10` 소유"
