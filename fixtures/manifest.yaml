# =============================================================================
# 덮지 못한 축 — 비워 두지 않고 소유 `OPEN`과 함께 적는다
# =============================================================================
uncovered_axes:

  - axis: 과세/비과세 경계 쌍 (기초금액 ↔ 추정가격)
    domain: money-basis
    why_blocked: |-
      **유보 사유가 「정의 미결」에서 「저장 값 비일관」으로 바뀌었다.** 정의는 운영자 결정
      U-1(추정가격 `Exclusive`)·U-1b(기초금액 `Inclusive`)로 정해졌다. 그러나
      `data-dictionary.md` §1.2.1이 *"저장된 legacy 값의 실제 과세 처리는 여전히 행마다 다르다"*를
      legacy 자신의 공시로 적는다 — 수집 키가 공고마다 달라 legacy 데이터로는 **행별 라벨을 붙일
      수 없다.** 지금 만들면 미결 과세 의미로 corpus 경계가 굳는다.
    owning_open:
      - "OPEN-REG-05 (활성) — ① 두 금액 차이의 **잔차 성분**(사정률 등) ② **저장 값의 행별 실제 과세 처리**"
    what_is_covered_instead: |-
      `money-basis-001`·`004`가 **basis 태그가 다른 값 쌍**을 고정하되 **두 값의 수치를 같게 두어
      어느 쪽이 크다는 전제를 넣지 않는다**(`regression-ledger.md` §10.1 인계의 요구).
      `money-basis-006`이 legacy 유래 행을 정의상 기본값으로 자동 태깅하지 않음을 고정한다.
    unblocks_when: OPEN-REG-05 가 닫히고 행별 과세 판정 근거가 생긴다.

  - axis: "`기초금액 ÷ 추정가격` 신뢰 상한의 경계값"
    domain: base-amount-provenance
    why_blocked: |-
      legacy 임계 `1.15`의 구성은 부가세 배수 `1.1` + 마진 `0.05`이고 **그 마진이 활성
      `OPEN-DEC-07`의 재유도 대상이며 값이 아직 산출되지 않았다**(capability-map.md DEC-02 결정).
      legacy 값으로 경계를 굳히면 재유도 뒤에 틀린 값이 남는다.
    owning_open:
      - "OPEN-DEC-07 (활성) — 신뢰 비율 마진의 재유도. **값 미산출**"
    what_is_covered_instead: |-
      `base-amount-provenance-002`·`003`이 **판정 순서**만 고정한다 — 같은 rule hit 에 두 정책
      순서를 넣어 결과가 갈리는 것으로 「순서가 load-bearing 이고 정책 데이터로 외부화된다」만
      재고, **어느 순서가 옳은지는 재지 않는다.**
    unblocks_when: OPEN-DEC-07 이 마진 값을 낸다.

  - axis: provenance 판정의 허용 오차와 배수 (정수 `1e-6` · 예정가 역산 `1.0`원 · VAT `0.01` · 배수 `1.1`)
    domain: base-amount-provenance
    why_blocked: |-
      `data-dictionary.md` §12.1이 넷 모두 `legacy-behavior`로 등재한다. 승격 결정이 없으므로
      **정수 원화 후보 / 예정가 역산형 소수 / VAT 파생형 / 추정가격과 모순되는 비율**의 실제
      경계 case(`data-extract.md` §4 최소 corpus 넷)를 만들 수 없다.
    owning_open:
      - "(소유 OPEN 없음) — 승격에는 운영자 결정이 필요하다. `OPEN-DIC-05`가 인접 축(라벨 다섯의 덮개)을 소유한다"
    unblocks_when: 허용 오차·배수를 정책 데이터로 승격하는 운영자 결정이 나온다.

  - axis: "`BaseAmountProvenance`의 미판정(`NULL`) 상태와 여섯째 라벨 `suspect-fractional`"
    domain: base-amount-provenance
    why_blocked: |-
      *"아직 판정하지 않음"이 "신뢰함"으로 접히면 안 된다*는 요구는 확정이나, 그것을 승인 명세의
      어느 variant 가 나르는지(`Unknown`에 접는가, 별도 variant 를 더하는가)가 미결이다.
      `suspect-fractional`도 승인 명세에 대응 이름이 없다.
    owning_open:
      - "OPEN-DIC-05 (활성)"
    unblocks_when: 라벨 집합 변경을 승인하는 별도 결정이 나온다.

  - axis: 밴드 경계 corpus (§1.4.3 B1~B7의 실제 값과 경계 포함성)
    domain: floor-shortfall / rate
    why_blocked: |-
      일곱 밴드 전부 `legacy-behavior`다(§12.1). `data-dictionary.md` §13.1이 *"밴드 경계 fixture 는
      §1.4.3의 일곱 밴드를 **축별로 나눠** 만든다. 값이 같고 축이 다른 **B4·B5를 한 case 에 섞지
      않는다**"*를 지시하나, **축을 나누는 것과 값을 정답으로 고정하는 것은 다르다** — 값을 쓰려면
      승격 결정이 필요하다.
    owning_open:
      - "(B7만) OPEN-ML-05 (활성) — 근거 없는 미분류 상수"
      - "(B1~B6) 소유 OPEN 없음 — 승격에 운영자 결정이 필요하다"
    what_is_covered_instead: |-
      `floor-shortfall-005`가 **synthetic 밴드**로 「밴드 밖 표본이 분모에서 빠지고 표본 부족으로
      전이된다」는 규칙만 고정한다. B4·B5는 축이 다른 별도 사본이므로 **같은 case 에 넣지 않았고**,
      이 corpus 는 둘 중 어느 것도 값으로 쓰지 않는다.
    unblocks_when: 밴드 값·경계 포함성을 정책 데이터로 승격하는 결정이 나온다.

  - axis: 법정 하한율 표의 값과 추정가격 구간 경계
    domain: floor-applicability
    why_blocked: 신율·구율 여섯과 구간 경계 셋이 전부 `legacy-behavior`이고 V2 값의 확정을 활성 OPEN 이 소유한다.
    owning_open:
      - "OPEN-DEC-10 (활성)"
    what_is_covered_instead: |-
      `floor-applicability-003`·`004`가 **synthetic 시행일 표**로 「경계 전후 하루 차이로 다른 tier,
      소급 없음」만 고정하고, `-002`가 「기준일 미상이면 표를 적용하지 않는다」를 고정한다.
      **표 대상 범위를 벗어난 추정가격 구간의 판정 생략**은 구간 경계 값이 필요해 덮지 못했다.
    unblocks_when: OPEN-DEC-10 이 V2 값을 확정한다.

  - axis: 면허 — 별칭 · 포괄 코드 · 지역 · 협회 조건
    domain: license
    why_blocked: |-
      `v2-지침서.md` §4.2가 넷을 versioned policy data 로 요구하나 **그 정책 데이터가 아직 없고**,
      면허 축이 정책 version 을 싣는지 자체가 미결이다. 협회·기술부문 어휘 테이블은 legacy 실물이
      세그먼트 편향(`TECH_FIELD_TERMS` 넷이 전부 해양 계열)이라 그대로 쓸 수 없다.
    owning_open:
      - "OPEN-DIC-01 (활성) — 면허·지역 축이 정책 version 을 싣는가"
      - "OPEN-QUAL-07 (활성) — 어휘 테이블의 세그먼트 편향"
    unblocks_when: 면허 정책 데이터의 소유와 version 축이 정해진다.

  - axis: "면허 — 허용업종(`permsnIndstrytyList`) 단독 보유의 결합 규칙"
    domain: license
    why_blocked: |-
      조달청 문서가 결합 규칙을 말하지 않는다(0A2 라운드 5 재확인). **운영자 판정 2026-08-30 —
      지금 답하지 않고 다시 열어 둔다. M1 자격 slice(1C)가 실제 공고로 관측해 닫는다.**
    owning_open:
      - "OPEN-QUAL-11 (활성)"
    what_is_covered_instead: "`license-011`이 결정 전 임시 처리(사유 있는 `Uncertain`)를 `provisional`로 고정한다."
    unblocks_when: M1 slice 1C 의 관측.

  - axis: 면허 유효기간
    domain: license
    why_blocked: "U-7이 **V2는 보지 않는다**로 확정했다. 판정 자체를 만들 수 없다."
    owning_open:
      - "OPEN-QUAL-05 (알려진 제한으로 후속 이월)"
    what_is_covered_instead: "`license-012`가 「유효기간을 보지 않으며 결과에 「유효기간 미검증」이 드러난다」를 고정한다."
    known_conflict: |-
      `v2-지침서.md` §4.2가 유효기간을 versioned policy data 로 요구하는 것과 U-7이 어긋난다
      (`data-dictionary.md` §8 제한 7 · §13.5). 지침서 개정은 이 slice 의 범위 밖이다.

  - axis: 시공능력평가금액 요건과 보유액의 실제 비교
    domain: capacity-gate
    why_blocked: |-
      ① 공고 게시 요건 필드(`cnstrtnAbltyEvlAmtList` 계열)를 legacy 가 **수집하지 않는다**
      (`ed4b06c`에 키가 없다) — 비교 대상이 없다. ② 게시값의 **단위·과세**가 조달청 문서에 없어
      관측으로만 알 수 있다. ③ 요건 미달의 처리(즉시 실격 vs 적격심사 감점)가 미결이다.
    owning_open:
      - "OPEN-QUAL-10 (활성) — 게시 요건 축의 unit·과세·기준 시점"
      - "OPEN-QUAL-09 (활성) — 미달의 처리"
      - "OPEN-DIC-02 (활성) — 시공능력평가액 공시의 갱신 주기가 역년 경계인가"
    what_is_covered_instead: "`capacity-gate-001`~`004`가 무조건 acceptance 넷(미입력 ≠ 0, 요건 없음 중립, 도급한도는 자격 어휘 아님)을 고정한다."
    unblocks_when: M1 이후 수집 신설 + OPEN-QUAL-09/10 결정.

  - axis: KONEPS — rate limit · timeout · partial page · out-of-order · 중복/수정 이벤트
    domain: koneps-collection
    why_blocked: |-
      늦은 관측의 **적용**은 필드별 fold 가 내는데 그 fold 의 순서 술어(총순서 키·tie-break)가
      미결이고, 전송 멱등 키와 재관측 키의 **구성**도 미결이다. legacy 에 답이 없다 — 전달 순서대로
      in-place mutate 하고 순서 키를 읽지 않으며 `observed_at`이 nullable 이다.
    owning_open:
      - "OPEN-DIC-09 (활성) — fold 의 순서 술어"
      - "OPEN-DIC-07 (활성) — 전송 멱등 키와 재관측 키의 구성"
      - "OPEN-OPS-01 / OPEN-REG-01 (활성) — 재시도 정책과 그 측정"
    unblocks_when: 위 셋이 닫힌다.

  - axis: KONEPS — HTML fallback 경로
    domain: koneps-collection
    why_blocked: |-
      브라우저 경로의 존치 자체가 `근거 부족`으로 분류돼 있다(COL-09). *"브라우저 경로로만 얻을 수
      있는 필드 목록"*을 조사가 특정하지 못했다.
    owning_open:
      - "OPEN-COL-04 (활성)"
    note: |-
      **결정 전이라도 확정된 제약은 있다** — 값 크기·위치 휴리스틱으로 basis 를 추측하는 경로는
      V2에 도입하지 않는다. 그 제약은 `rate-unit-003`·`004`와 `koneps-collection-002`가 이미
      다른 축에서 고정한다.

  - axis: KONEPS — `resultCode` 분류표 · 잘못된 인코딩 · 천 단위 구분자
    domain: koneps-collection
    why_blocked: |-
      `resultCode` 분류표는 운영자 결정 `OPEN-COL-02`가 소유한다고 §4.3.2가 적으나 **표의 내용이
      이 저장소의 문서에 실려 있지 않다.** 인코딩·구분자 정규화 규칙은 승인된 명세가 없다.
    owning_open:
      - "OPEN-COL-02 (분류표의 내용) · (인코딩·구분자) 소유 OPEN 없음 — 명세 부재"
    unblocks_when: 분류표 본문이 명세에 등재되고 정규화 규칙이 정해진다.

  - axis: ML — 피처 스키마 version · artifact checksum · LightGBM 오류 · KDE singular · deterministic seed
    domain: ml-boundary
    why_blocked: |-
      `data-dictionary.md` §6.3이 *"피처 계약은 M2 gRPC 스키마가 소유하고, 이 문서는 피처 이름이
      참조하는 도메인 개념만 정의한다"*로 소유를 M2에 둔다. **그 계약이 아직 없다.**
    owning_open:
      - "(소유 OPEN 없음) — M2 계약 slice 의 산출물 대기"
    what_is_covered_instead: "`ml-boundary-001`~`004`가 **경계**(업무 판정은 Kotlin, 결측 사유, 누수 차단 시그니처)만 고정한다."
    unblocks_when: M2 gRPC 피처 계약이 작성된다.

  - axis: "`SkipReason` 어휘의 전수성"
    domain: verdict
    why_blocked: "최소 두 값은 확인되나 목록이 닫혔는지는 미확인. 지금 닫으면 게이트 사다리를 옮기며 발견될 사유가 갈 곳을 잃는다."
    owning_open:
      - "OPEN-DIC-03 (활성)"
    what_is_covered_instead: "`verdict-001`·`002`가 확인된 두 값으로 「문장이 아니라 reason code 로 구분된다」를 고정한다."
    unblocks_when: M1 에서 게이트 사다리를 옮길 때.

  - axis: 반올림 — `RoundingPolicy`의 `mode` · 금액 축 밖 `scaleDigits` · 첫 `effectiveFrom`
    domain: money-basis / floor-shortfall
    why_blocked: "승인 명세가 요구하는 것은 **형태**(`RoundingPolicy`와 version)뿐이고 값을 고를 근거가 없다."
    owning_open:
      - "OPEN-DIC-10 (활성)"
    what_is_covered_instead: |-
      기대값이 반올림에 의존하지 않게 설계했다 — `floor-threshold-*`는 `0.945 ÷ 0.900 = 1.05`처럼
      십진에서 정확히 떨어지는 수만 쓰고, `floor-shortfall-003`은 빈도를 **유리수(15/151)**로 두고
      십진 표현을 주장하지 않는다.
    unblocks_when: OPEN-DIC-10 이 값을 정한다.

  - axis: 파생값의 되짚기 (`BidAmount` · `AssessmentRate` · `AwardRate`)
    domain: money-basis
    why_blocked: "파생값이 입력과 떨어져 저장·전송된 뒤 그 입력 fact 를 되짚을 수 있는가 — 운반 범위를 정하는 결정이며 근거로 고를 수 없다."
    owning_open:
      - "OPEN-DIC-08 (활성)"
    unblocks_when: 운반 범위 결정.

  - axis: 상태 전이표 · 정산 관측 시각 · 성숙도
    domain: (미착수)
    why_blocked: |-
      `settlementObservedAt`은 **V2 가동 이전 데이터가 `Absent`이며 백필하지 않는다**(U-4).
      그래서 지금 만들 수 있는 것은 「부재 구간을 구별해 노출한다」뿐인데, 그 구별의 표시 규격이
      성숙도 지표 정의에 달려 있고 `OPEN-SET-04`·`OPEN-SET-05`·`OPEN-SET-06`·`OPEN-SET-10`이
      인접 축을 열어 두고 있다. 이 slice 는 이 축에 손대지 않았다.
    owning_open:
      - "OPEN-SET-04 · OPEN-SET-05 · OPEN-SET-06 · OPEN-SET-10 (전부 활성)"
    unblocks_when: 정산 축 slice.

# =============================================================================
# 출처를 확정할 수 없어 fixture 로 만들지 않은 후보 (`data-extract.md` 에러 핸들링)
# =============================================================================
insufficient_evidence:
  - candidate: 같은 면허 코드를 percent·공백·문장 위치 차이로 표현한 입력의 정규화
    why: |-
      `data-extract.md` §4가 면허 최소 corpus 로 요구하나 **정규화 규칙을 정한 승인 명세가 없다.**
      legacy 의 문자열 매칭 형태를 옮기면 그것이 곧 기대값이 되고 `legacy-behavior`를 정답으로
      승격하는 일이 된다.
    needed: 면허명 정규화 규칙의 도메인 명세 또는 운영자 결정.
  - candidate: 음수 금액 · `Long` overflow 의 처리
    why: |-
      `v2-지침서.md` §4.1이 표현(`Long` 원 단위)만 정하고 **범위 위반의 처리**를 정하지 않는다.
      `base-amount-provenance-004`·`005`가 덮는 NaN·Infinity 는 「그 표현에 존재하지 않는 값」이라
      구성 실패가 따라 나오지만, 음수와 overflow 는 그렇지 않다.
    needed: 금액 범위 계약(음수 허용 여부·overflow 시 거부/포화)의 결정.
  - candidate: 적합도 점수(`capacity_score`)의 산식
    why: "legacy 의 추측 정규화가 `폐기`로 확정됐고 **대체 산식이 없다.**"
    needed: 적합도 산식의 도메인 명세.
  - candidate: "`FloorApplicability`의 기관 패턴 테이블 내용"
    why: |-
      첫 매칭 우선 순서가 도메인 의미를 갖는다는 **규율**은 확정이나 **패턴 목록 자체**는 legacy
      코드뿐이고 세그먼트 편향이 확인되지 않았다. `floor-applicability-001`은 그래서 패턴이 아니라
      `orgType` 열거값을 입력으로 받는다.
    needed: 기관 유형 분류의 정책 데이터.

# =============================================================================
# 접근 승인이 필요한 것 — 이 slice 는 하나도 실행하지 않았다
# =============================================================================
access_approval_required:

  - id: A-1
    what: 운영 DB read — `observed` 층 corpus 의 신설
    why: |-
      이 manifest 의 `observed` 층이 **0건**이다. `data-extract.md` §1이 그 층을 *"기존 운영
      데이터/로그에서 비식별화해 관찰한 실제 형태"*로 정의하므로 **접근 없이는 만들 수 없다.**
      지금 corpus 는 전부 synthetic 이라 **실제 payload 형태의 함정**(누락 필드 조합, 인코딩,
      천 단위 구분자, 실제 키 이름의 변형)을 재현하지 못한다.
    would_need:
      query_scope: "`Project` · `HistoricalData` · `TenderResult`의 컬럼 부분집합"
      columns: 금액·율·차수·기관 유형·수집 시각. **회사/운영자 식별자, Telegram id, 연락처, 원문 개인정보는 제외**
      row_limit: 축별 200행 이하 (경계 근방 표본 우선)
      masking: 식별자는 안정적 합성 id 로 치환하고 **masking 전 값을 로그·리뷰 산출물에 남기지 않는다**
    status: 미요청. **`data-extract.md` §5 말미 — 이 문서만으로 DB 접근 권한이 생기지 않는다.**

  - id: A-2
    what: "`OPEN-REG-05` 해소를 위한 행별 과세 판정 표본"
    why: |-
      과세/비과세 경계 쌍 fixture 를 막는 것이 **저장 값의 행별 실제 과세 처리**다. 그것은 문서로
      풀리지 않고 **행을 봐야** 판정된다. A-1의 부분집합이나 목적이 달라 따로 적는다.
    would_need: A-1과 같은 masking 계획 + 두 금액이 함께 있는 행만, 축별 100행 이하
    status: 미요청

  - id: A-3
    what: legacy Python 의 순수 함수 실행 (`legacy-observation` 수집)
    why: |-
      `data-extract.md` §5 5단계가 허용하는 경로다. 지금 `legacy-behavior` 층 case 가 **0건**이라
      differential 판정(§6)의 한쪽 항이 비어 있다. 다만 이 slice 는 **실행하지 않는 쪽**을
      택했다 — 후보 모듈(`app/services/base_amount_basis.py` 등)이 ORM·설정과 같은 패키지에 있어
      import 부작용 없이 순수 호출만 하는지 확인하지 않았기 때문이다.
    would_need:
      commands: 대상 함수 목록과 정확한 호출 명령
      env: "`ENVIRONMENT=test`, 네트워크·DB 비활성"
      side_effects: import 시점 부작용 조사 결과를 먼저 제출
    status: 미요청. **승인 없이는 실행하지 않는다.**
    note: |-
      실행하더라도 그 출력은 `legacy-behavior`이며 **정답 지위가 없다**(`data-extract.md` §1).
      `authoritative` 승격에는 수작업 판정과 사용자 승인 근거가 별도로 필요하다.

  - id: A-4
    what: "`cnstrtnAbltyEvlAmtList` 계열의 실제 게시값 관측 (KONEPS API)"
    why: "게시 요건 값의 **단위·과세**가 조달청 문서에 없어 **관측으로만** 알 수 있다(`OPEN-QUAL-10`)."
    would_need: KONEPS OpenAPI 호출 승인 + 대상 오퍼레이션·건수·저장 계획
    status: 미요청. M1 이후 수집 신설로 인계돼 있다.

