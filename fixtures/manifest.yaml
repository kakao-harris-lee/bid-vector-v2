          *"이 capability 의 신설과 R-BASIS-01 의 「같은 쌍이 감시 경로와 검색 경로에서 같은 답을 낸다」를 **업무 규칙으로 명시 승인**한다"*.
          결정 기록은 `reports/evidence/m1/1e/scope.md` 「착수 2026-09-06 — 운영자 결정」 문단(D-2 (a) = decision 29)이 갖는다.
          인계 근거: `regression-ledger.md` R-BASIS-01·R-BASIS-02 · `OPEN-STR-01`.
    expected_reasoning: |-
      **근거는 커밋된 운영자 결정이다** — `capability-map.md` STR-16 「운영자 승인 2026-09-06(decision 29)」이 R-BASIS-01 의
      「검증 방법 · 결정 무관(무조건)」 한 문장(*"같은 쌍이 감시 경로와 검색 경로(R-BASIS-02)에서 같은 답을 내는지도 함께 고정한다"*)을
      **업무 규칙으로 명시 승인**하고 그 축을 소유한 STR-16 의 신설을 함께 승인했다. 2026-08-31 강등이 든 사유(*"근거가 M0 산출 문서의
      자체 acceptance 뿐"*)가 이 승인으로 사라진다 — 이제 그 문장은 **인용된 운영자 결정 문면**이다.
      같은 STR-16 블록의 acceptance *"금액 범위로 검색할 때 그 값이 어느 basis인지가 선언돼 있고, **비교 대상 금액과 basis가 같다**"* 가
