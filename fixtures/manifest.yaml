      legacy 의 `TRUE_BASE_KEYS = ("bssAmt", "bssamt", "bssAmtPurcnstcst")` 는 셋을 **같은 기초금액 후보**로 순회한다. 문서와 대조하면 셋의 지위가 다르다.
      **`bssAmt`(대문자 `A`)는 문서에 없다** — 미등재 키이고 §5.3 규율 1 이 그런 키를 「미지 필드」로 돌린다.
