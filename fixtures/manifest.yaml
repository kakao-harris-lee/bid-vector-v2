          실증했고, **Codex 자신이 제시한 fallback** 이 *"그런 projection 으로 표현할 수 없는 case 는
          계약이 준비될 때까지 authoritative 에서 내린다"* 였다. 운영자가 그것을 택했다 —
          **리뷰 압력 아래서 계약 기계를 더 발명하지 않는다.**
          이 case 에서 통과한 변이체: $.outcome (a) verifies 주장 필드 삭제.
          **판정은 기계가 냈다** — 「authoritative = 확장 적대 집합에서 위반 변이체 통과 0」이고
          목록의 정본은 스윕이다(`commands.md` **C-15**).
