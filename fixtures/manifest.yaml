      **이 case 는 그 순회를 legacy 결함으로 판정하지 않는다** — 문서가 떠받치는 것은 **개념이 다르다**는 사실이고, 해석 순서를 어떻게 고칠지는 3A ⑤·⑥ 과 `policy-values.md` 가 받는다.
      **과세를 비고 필드의 샘플로 정하지 않는다.** 같은 오퍼레이션의 `rmrk1`(비고1) **샘플데이터**가 *"기초금액은 부가세 포함 가격임."* 인데, 그것은 공고 담당자가 업체에 보내는 **메시지 예시**이지 항목의 규범 선언이 아니다. `remarkSampleUsedAsVatBasis: false` 가 그 구별을 고정하고, 과세 축의 결정은 `OPEN-REG-05` 가 소유한다.
