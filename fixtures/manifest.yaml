# V2 검증 corpus — case manifest
#
# 기준 문서: `data-extract.md` (단일 기준). 이 파일의 구조는 그 문서 §3의 manifest schema를
# 따르고, 확장 키는 아래 `schema.extensions`가 전부 선언한다.
#
# 이 파일을 읽기 전에 알아야 할 것 다섯.
#
#   1. **여기 든 입력은 전부 synthetic이다.** 운영 DB·KONEPS API·로그에서 가져온 행이 하나도
#      없다. `data-extract.md` §7이 금지한 「가상의 fixture를 실운영 샘플이라 표기」를 피하려고
#      모든 식별자를 `SYN-` 접두로 두고 `privacy.synthetic: true`를 case마다 적는다.
#      따라서 **`observed` 층 case는 0건이다** — 그 층은 운영 데이터 접근 승인이 선행한다
#      (`access_approval_required` 참조).
#   2. **legacy 출력을 정답으로 복사한 case가 하나도 없다.** 이 slice는 기존 Python을 실행하지
#      않았고 `tests/goldens/**`의 기대값을 읽어 옮기지 않았다. `legacy_reference`는 **입력 형태와
#      회귀 사례의 출처**로만 달려 있으며 각 항목이 그 사실을 `role`에 적는다.
#   3. **기대값이 legacy 숫자에 의존하지 않는다.** 규율 하나로 강제하고 기계로 확인한다 —
#      *`data-dictionary.md` §12.1이 `legacy-behavior`로 등재한 수를 fixture가 input·expected
#      어느 쪽에도 쓰지 않는다.* 그런 수가 필요한 자리(밴드 경계, 법정 하한율, 신뢰 상한,
#      허용 오차)는 **synthetic 정책 입력**으로 받고, 기대값은 그 값이 아니라 **규칙**에만
#      의존하게 설계했다. §12.1이 `authoritative`로 등재한 수는 셋뿐이고(`100` 변환 제수 ·
#      `150` 최소 표본 수 · `0.10` 부가세율) 이 corpus는 그중 둘을 쓴다.
#      검사 범위와 **검사가 못 보는 자리**는 `numeric_discipline.check`가 적는다.
#   4. **`authoritative` 가 아닌 case 가 있다.** `source.kind: m0-derived-rule` case 는 운영자 결정
#      2026-08-31 로 `authoritative` corpus 에서 **제외**되어 `classification: insufficient-evidence`
#      다 — `data-extract.md` §1의 세 층 어디에도 들지 않는 자리이고 §6이 그 어휘와 **완료 gate 실패**를
#      준다. case 는 지우지 않았고 되돌림 경로가 있다.
#      근거·경로·셈은 `classification_policy.insufficient_evidence`와 **F-7** 이 갖는다.
#   5. **case 단위로는 아직 아무것도 승인되지 않았다.** 모든 case의 `review.approved_by_user`가
#      `false`이고 `review.codex_verdict`가 `pending`이다. `review.claude_commit`은 이 파일을 담은
#      커밋이 자기 SHA를 담을 수 없으므로 `pending`이며 리뷰 라운드에서 채운다.
#      **운영자는 2026-08-30 「M0 승인」을 냈으나**(`milestone-0.md`의 「사용자 명시 승인」)
#      그 기록이 덮는 것은 활성 `OPEN`의 이월 · **그날의** fixture 미덮개 축 · 부분 만족인 채로 M1
#      진입이고, **개별 case 의 기대값 비준은 그 안에 없다.** 같은 기록이 0E의 Codex `approve`도 승인
#      밖으로 둔다. **2026-08-31 결정과 그날의 전수 재판정이 더한 미덮개 축은 그 기록보다 뒤라 그 안에
#      들지 않는다** — 수는 여기 박지 않고 **F-7** 이 낸다.
#
# 덮지 못한 축은 숨기지 않는다 — `uncovered_axes`가 전부 적고 소유 `OPEN`을 단다.

