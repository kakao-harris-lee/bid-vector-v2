          **「필수 단서」** 항목이며 **운영자 발화가 아니라 M0 분석의 도출**이다 (…)."*
          **말미의 괄호절을 생략했다** — 원문은 *"(`…decisions.md` 의 `OPEN-DEC-09` 절이 운영자 답과
          단서를 따로 적는다)"* 로 이어진다. 생략한 자리를 아래 정정이 다룬다.

          **그 논거는 두 자리에서 사실이 아니었다.**
          **하나 — 「M0 분석의 도출」.** 아래 복원 항목이 확인하듯 그 문면은
          `reports/evidence/m0/0a2/decisions.md:317` 의 **커밋된 결정 절 본문 bullet** 이고 이
          slice 가 도출한 것이 아니다.
          **둘 — 「필수 단서」 항목이라는 지목.** 이 case 가 재는 문면은 `:298` 의 **「필수 단서」
          bullet** 이 아니라 `:317` 의 **별개인 「따라서」 bullet** 이다. 생략했던 괄호절이 든
          「운영자 답과 단서를 따로 적는다」는 그 절의 구성에 대해서는 참이지만(`:297` 답 · `:298`
          단서), 이 case 가 기대는 자리는 **그 둘 중 어느 쪽도 아니다**.
          앞문장(운영자 답 한 줄이 정하는 것은 범위 밖까지)은 그대로 참이며, 그 위에서
          **기록자 bullet 이 ②에 드는가**가 갈림길로 남았다.

          **이 항목은 같은 날 아래 복원 항목으로 되돌려졌다** — 운영자가 그 물음에 「든다」로
