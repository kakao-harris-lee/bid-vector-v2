  - axis: 승인 부재로 authoritative 덮개를 잃은 축 — floor-applicability (하한 적용 범위·시행일)
    domain: floor-applicability
    why_blocked: |-
      「기준일 미상이면 시행일 표를 적용하지 않는다」 · 「시행일 경계 전후로 tier 가 갈린다」 ·
      「하한 해석 결과가 (율·출처·적용 범위·개연성) 묶음이다」 셋의 근거가 `capability-map.md`
      DEC-03 acceptance 와 `data-dictionary.md` §1.4.2 **자체 도출**뿐이다. DEC-03 의 운영자 결정
      2026-08-26(`OPEN-DEC-09` 해소)은 **지방계약 범위 축만** 정했고 이 acceptance 들을 세우지 않는다.
    owning_open:
      - "소유 `OPEN` 없음 — 막는 것은 미결이 아니라 **운영자 승인 부재**다"
    what_is_covered_instead: |-
      **덮이지 않는다 — 이 도메인은 `authoritative` 로 남는 case 가 없다.** `-002`~`-005` 의 근거는
      결정 기록이 아니라 `capability-map.md` DEC-03 acceptance 와 `data-dictionary.md` §1.4.2 의 자체
      도출이다. `-001` 은 **규칙**이 커밋된 결정 기록 안의 문면(`reports/evidence/m0/0a2/decisions.md:317`
      의 `OPEN-DEC-09` 결정 절 본문 bullet)으로 서지만, 그 case 의 `verifies` 가 상태의 **이름**
      (`OutOfScope`)까지 괄호로 함께 고정하고 그 어휘는 `data-dictionary.md:960`(스스로 *"0C가 더하는
      variant"* 라 적는다)에서만 나온다 — 어휘 축이 아래 「승인 부재로 authoritative 덮개를 잃은 축 —
      verdict (`SkipReason` 구체 어휘)」와 같은 형태로 막는다. **다섯 다 지워지지 않았다.**
    unblocks_when: |-
      `-002`~`-005`: 운영자가 DEC-03 acceptance 와 §1.4.2 를 업무 규칙으로 명시 승인한다.
      `-001`: 규칙은 이미 섰고 **어휘 승인 하나만 남는다** — 운영자가 `data-dictionary.md:960`의
      `FloorApplicability` sealed 정의 가운데 **`OutOfScope`** 라는 이름(과 `regime` 리터럴)을
      업무 규칙으로 명시 승인한다.

  - axis: 승인 부재로 authoritative 덮개를 잃은 축 — KONEPS 필드 계약 강제와 코드·라벨 분리
    domain: koneps-collection
    why_blocked: |-
      「미지 키가 계수되고 소비되지 않는다」 · 「선언 범위와 어긋난 값이 거부되고 사유가 남는다」 ·
      「제로패딩 식별자에 정수 변환이 없다」 · 「코드와 라벨이 두 값으로 저장된다」 · 「미지 코드에
      임의 라벨이 붙지 않는다」의 근거가 `capability-map.md` COL-07·COL-08 acceptance **자체
      도출**뿐이다. COL-07 의 「계약 테스트로 승격한다」는 판단은 **0C slice 가** 내린 것이고,
      COL-08 자신이 「코드 체계 출처는 활성 `OPEN-COL-03`」이라 적는다.
    owning_open:
      - "(코드 체계 내용) OPEN-COL-03 (활성)"
      - "(acceptance 비준) 소유 `OPEN` 없음 — **운영자 승인 부재**"
    what_is_covered_instead: |-
      **없다 — 2026-08-31 전수 재판정으로 `-003`·`-004`·`-008`·`-009`도 내려갔다.**
      **`-003`·`-004`(축 1)**: `OPEN-ML-04` 문면은 *"**「미정산」**을 `0` 으로 적재하지 않는다"* 로
      **정산 축 한정**인데 두 case 는 「부재를 `0` 으로 적재하지 않는다」로 **한정어를 지운 채**
      인용했고, 실제로 재는 것은 `presmptPrce`(금액 축)다. 넓은 부재 금지 규칙은
      `data-dictionary.md` §1.3 이 *"0C가 도출하는 것"* · *"정산 축만으로 좁히지 않는다"* 로
      **스스로 넓혔음을 밝히는** 자체 규칙이다.
      **`-008`·`-009`(축 2, `approved-spec` 자리)**: `v2-지침서.md` §4.1 이 떠받치는 것은
      `provenance` 필수와 원시 숫자 상호 대입 금지(= basis·과세 보존)까지이고, 두 case 의 **주
      규칙인 「점유 가드」(§5.1 계승 규율 1)와 「derived fact 가 canonical fact 의 자리를 차지할 수
      없다」(§5.2)** 는 `data-dictionary.md` 가 legacy 코드에서 도출해 세운 자체 규칙이다.
      **이 도메인은 `authoritative` corpus 에서 전건 덮이지 않는다.**
    unblocks_when: |-
      운영자가 COL-07·COL-08 acceptance 와 **§1.3 광의 부재 금지 규칙 · §5.1 계승 규율 · §5.2 경계
      규칙**을 업무 규칙으로 명시 승인한다.

  - axis: 승인 부재로 authoritative 덮개를 잃은 축 — ML 피처 결측 provenance 와 누수 차단 시그니처
