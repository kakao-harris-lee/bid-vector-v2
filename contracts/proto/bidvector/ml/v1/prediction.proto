syntax = "proto3";

// M2/2B — Prediction RPC 계약. 정본은 `reports/evidence/m2/2b/scope.md` ③~⑧과
// `ADR 0010` D-3(결과 셋과 상태의 분리). `CalculateOptimalBidResponse`가 결과 봉투
// `oneof result { Success, Unmeasurable, ApplicationFailure }`의 첫 실물이다(2A 인계,
// `reports/evidence/m2/2a/checklist.md` 알려진 제한 7 · 위협 (a)). `error.proto`의
// `Unmeasurable`·`ApplicationFailure` 어휘를 그대로 쓴다(D-3 "어휘 소유" — 2B는 새 실패
// 코드를 만들지 않는다).
package bidvector.ml.v1;

import "bidvector/ml/v1/common.proto";
import "bidvector/ml/v1/error.proto";
import "bidvector/ml/v1/features.proto";

option java_package = "contract.bidvector.ml.v1";
option java_multiple_files = true;

// 후보 라벨 축 — 순서 고정: `CONSERVATIVE`·`BASE`·`AGGRESSIVE`(scope.md ③, legacy
// `scenario_spec.py` "기준 후보는 항상 가운데(인덱스 1)다"의 계약화 — 위치가 아니라 라벨로
// 집는다). 운영자 대면 메뉴(`recommended`/`aggressive`/`safe`)는 이 축이 아니다(조사 01
// H-7 — 한 응답 안에 후보 라벨 축이 둘 있던 legacy 반례, 그 메뉴는 Kotlin 표현 계층 소유).
enum CandidateLabel {
  CANDIDATE_LABEL_UNSPECIFIED = 0;
  CANDIDATE_LABEL_CONSERVATIVE = 1;
  CANDIDATE_LABEL_BASE = 2;
  CANDIDATE_LABEL_AGGRESSIVE = 3;
}

// 불확실성 폭의 출처(`docs/discovery/data-dictionary.md` §6.5 — "이 산식을 사전에 올리지
// 않는다", 성분만 노출한다). legacy는 이 구분을 한국어 설명 문자열에만 두었다(조사 01
// (b-2)) — 계약은 구조화 값으로 강제한다.
enum IntervalSource {
  INTERVAL_SOURCE_UNSPECIFIED = 0;
  INTERVAL_SOURCE_CROSS_VALIDATION_RESIDUAL = 1;
  INTERVAL_SOURCE_TIME_HOLDOUT_RESIDUAL = 2;
  // 사후예측분산 기반(분포 엔진, M2/2F additive) — 잔차 기반 두 값과 다른 축이다.
  // `docs/discovery/data-dictionary.md` §6.5는 아직 이 값을 정의하지 않는다
  // (`OPEN-2F-DICT-INTERVAL-SOURCE`, discovery 문서 소유 — 후속). **제공자 먼저 배포**
  // (ADR 0010 D-7 — enum 값 추가도 수신 fail-closed 규칙 때문에 배포 순서가 필요하다).
  INTERVAL_SOURCE_POSTERIOR_PREDICTIVE = 3;
}

// diagnostics의 세그먼트 지지 근거 — "그 추정이 무엇으로 지지되는가" 하나의 축(H-8 회피 —
// legacy `historical_sample_size`는 엔진마다 다른 모수를 같은 이름으로 날랐다).
enum SegmentSupport {
  SEGMENT_SUPPORT_UNSPECIFIED = 0;
  SEGMENT_SUPPORT_DIRECT = 1;
  SEGMENT_SUPPORT_PARENT_CATEGORY = 2;
  SEGMENT_SUPPORT_GLOBAL = 3;
}

// 서빙 준비 상태 — `GetModelMetadata` 전용.
enum Readiness {
  READINESS_UNSPECIFIED = 0;
  READINESS_READY = 1;
  READINESS_LOADING = 2;
  READINESS_NOT_READY = 3;
}

// 후보 셋의 가중치 — decimal string(`Rate`와 같은 표현 형태: scale 보존, 지수 표기 없음).
// `Rate`를 그대로 재사용하지 않는 이유는 이름이 나르는 축이 다르기 때문이다(common.proto
// "율의 축은 필드·메시지 이름이 나른다") — `Weight`는 투찰율 축이 아니라 **[0,1] 구간의
// fraction 가중치 일반**을 나른다(D-2F-5, M2/2F 가 「시나리오 혼합 계수 축」에서 확장 —
// `Diagnostics.shrinkage_weight`가 형태를 재사용한다, 5D `Decimal` 가중치와 형태 일치).
// 어느 축인지는 그 필드가 속한 메시지·필드 이름이 나른다(교차 대입 방지, 조사 01 (b-1) —
// legacy는 경로마다 0.24/0.52/0.24와 0.22/0.56/0.22가 같은 필드 이름 밑에서 갈렸다).
message Weight {
  string fraction = 1;
}

// 후보 한 건 — **율만**(D-2B-2 (a)). 원 단위 가격은 여기 없다 — `BidAmount` 산출은
// Kotlin 1B `RoundingPolicy`(versioned) 소관이다. `weight`는 정책 version을 동반한다
// (조사 01 (b-1) 반례 시정 — 가중치 값이 어느 정책판에서 왔는지 응답만으로 알 수 있다).
message Candidate {
  CandidateLabel label = 1;
  // 대상 공고 후보율 축 — `Rate.fraction > 1`은 계약 위반이다(D-2B-8). `features.proto`
  // `CompetitionSample.observed_bid_rate`(과거 표본의 관측값 축)와는 다른 축이다
  // (D-2F-4, M2/2F 축 한정 — 그 필드는 `> 1`을 허용한다).
  Rate bid_rate = 2;
  // 항상 `BID_RATE_ORIGIN_RECOMMENDED`(common.proto D-2A-7).
  BidRateOrigin origin = 3;
  Weight weight = 4;
  string weight_policy_version = 5;
}

// 가격 적합도 점수 — 이름에 `probability`·`win`이 없다(D-M2-8, ML-03 "낙찰 확률로 표기하지
// 않는다"). `Uncertainty`와 분리된 별도 축이고, 값의 산식은 이 계약이 규정하지 않는다.
message PriceFitness {
  string score = 1;
}

// 불확실성 — 성분 셋 + 출처(`docs/discovery/data-dictionary.md` §6.5, D-2B-6). 합성
// `confidence`는 없다(조사 01 H-4 — legacy는 [0.45,0.95] 클램프의 단일 값이라 "측정
// 불가"를 나를 수 없었다).
message Uncertainty {
  // 그 추정에 실제로 쓰인 표본 수(§6.5 `sampleSize`). `0`이면 `Success`가 아니라
  // `Unmeasurable`이어야 한다 — 계약 불변식(위협 모델 우회 후보 (3)).
  uint32 sample_size = 1;
  // 투찰율 축 표본의 표준편차(decimal string, §6.5 `dispersion`).
  string dispersion = 2;
  // 평균 투찰율 신뢰구간의 반폭(decimal string, §6.5 `estimateMargin`).
  string estimate_margin = 3;
  IntervalSource interval_source = 4;
}

// release 의 종류(M2/2F additive, D-2F-2) — 아티팩트가 있는 release(`ARTIFACT`, GBM 등)와
// 아티팩트 없이 정책·코드만으로 서빙하는 release(`DERIVED`, 분포 엔진)를 값 위장 없이
// 1급으로 가른다(5D-2 위협 (h) — 값 지어내기 금지). `UNSPECIFIED`는 수신 거부(fail-closed,
// 2A ⑥) — **과도기 규칙**: 기존 표본은 이 필드가 없어 0(`UNSPECIFIED`)이 되므로, 수신자는
// 이 값을 **제공자 배포 뒤**에만 거부를 켠다(ADR 0010 D-7 제공자 먼저). M2/2F 는 testdata
// 5쌍 전부에 명시값을 실어 그 배포를 미리 증명한다.
enum ReleaseKind {
  RELEASE_KIND_UNSPECIFIED = 0;
  RELEASE_KIND_ARTIFACT = 1;
  RELEASE_KIND_DERIVED = 2;
}

// 모델 release 식별 — 구조화(조사 01 H-9, `v2-지침서.md` §5). legacy는 다섯을 문자열
// 하나(`model_version`)에 접었다(조사 01 (b-4)). `metric`은 artifact manifest 소유라
// 응답에 없다(scope.md ⑥) — 여기 넷은 release를 **지목**하는 데 필요한 성분과 식별자다.
message ModelRelease {
  string release_id = 1;
  string artifact_checksum = 2;
  string feature_schema_version = 3;
  string code_version = 4;
  string dataset_id = 5;
  // release 종류(M2/2F additive, D-2F-2). **채움 규약**(`RELEASE_KIND_ARTIFACT`) — 다섯
  // 전부 비공백(기존 규칙 유지). **채움 규약**(`RELEASE_KIND_DERIVED`, 아티팩트 없는
  // release) — `release_id = "distribution/<inference policy version>"`·
  // `artifact_checksum = "sha256:" + sha256(정규화된 정책 YAML bytes)`·
  // `feature_schema_version` = 요청 envelope 값의 에코·`code_version` = ml-engine 패키지
  // version·`dataset_id = ""`(DERIVED 에서만 빈 문자열이 허용된다 — D-2B-6 "아티팩트 학습
  // 행 수" 문면과 충돌하지 않는다, 아티팩트 자체가 없으므로 학습 dataset 도 없다).
  ReleaseKind release_kind = 6;
}

// 진단 — 타입 있는 필드만(조사 01 (b-3) 반례 시정 — legacy는 `dict[str, Any]` 아홉 개와
// 자유 문자열이었다). 사람이 읽는 `explanation`은 없다 — 렌더링은 Kotlin 표현 계층 소관.
message Diagnostics {
  // `training_row_count`는 아티팩트 학습 행 수다(D-2B-6) — `release_kind = DERIVED`(아티팩트
  // 없는 엔진)에서는 항상 `0`이다.
  uint32 training_row_count = 1;
  SegmentSupport segment_support = 2;
  // 기관 표본이 임계 미만일 때 응답 근거에 실리는 수축 가중치(M2/2F additive,
  // `OPEN-5D-DIAGNOSTICS-WIRE`, `capability-map.md` ML-04 「수축 가중치가 응답 근거에」).
  // `Weight`(D-2F-5로 확장된 [0,1] fraction 가중치 일반)를 재사용한다.
  Weight shrinkage_weight = 3;
  // 임계 미달로 제외된 표본 총계(M2/2F additive, `OPEN-5D-DIAGNOSTICS-WIRE`).
  uint32 excluded_observations = 4;
  // 이 예측에 쓰인 기관 표본 수(M2/2F additive, `OPEN-5D2-SAMPLE-SEGMENT`).
  uint32 agency_sample_count = 5;
  // 기관 표본이 임계 미만인지(M2/2F additive, `OPEN-5D2-SAMPLE-SEGMENT`) — 수축 가중치가
  // 적용됐는지를 읽는 쪽이 직접 판정하지 않고 엔진이 명시한다.
  bool agency_sample_below_threshold = 6;
}

// `CalculateOptimalBid`의 성공 답 — 후보 정확히 3(라벨 순서 `CONSERVATIVE`·`BASE`·
// `AGGRESSIVE` 고정, scope.md ③). 개수·순서 위반은 provider/consumer test가 거부한다
// (위협 모델 우회 후보 (2)).
message Success {
  repeated Candidate candidates = 1;
  PriceFitness fitness = 2;
  Uncertainty uncertainty = 3;
  ModelRelease release = 4;
  Diagnostics diagnostics = 5;
}

// `CalculateOptimalBid` 요청 — `PredictionEnvelope`(선택자·schema version, common.proto) +
// 원 fact(`FeatureInputs`) + 정제된 경쟁 표본 + 목적함수.
message CalculateOptimalBidRequest {
  PredictionEnvelope envelope = 1;
  FeatureInputs features = 2;
  repeated CompetitionSample competition_samples = 3;
  OptimizationObjective objective = 4;
}

// `CalculateOptimalBid` 응답 — 결과 봉투(`ADR 0010` D-3, 2A ⑤ 인계의 첫 실물).
// `Unmeasurable`의 `UNTRAINED_SEGMENT`와 `INSUFFICIENT_SAMPLES`는 다른 값이다(scope.md
// ③ — 두 사유가 합쳐지면 "설정으로 끌 수 없다"는 판정과 "학습된 적이 없다"는 판정이
// 구별되지 않는다). `error.proto`가 이미 이 어휘를 갖는다.
message CalculateOptimalBidResponse {
  oneof result {
    Success success = 1;
    Unmeasurable unmeasurable = 2;
    ApplicationFailure failure = 3;
  }
}

// `GetModelMetadata` 요청 — 선택자가 없다(scope.md ⑧). 이 RPC 자체가 "지금 승격된
// release가 무엇인가"를 알아내는 자리라 선택할 대상이 없다.
message GetModelMetadataRequest {
  RequestEnvelope envelope = 1;
}

// `promoted`(현재 승격 release) · 지원 feature schema 집합 · 서빙 준비 상태.
// `CalculateOptimalBidResponse.release`가 `latest_promoted` 선택자로 왔을 때 client가
// 이 메시지의 `promoted`와 대조한다(common.proto D-2A-7 (b), `OPEN-2A-RELEASE-CHECK-4D`).
message ModelMetadata {
  ModelRelease promoted = 1;
  repeated string supported_feature_schema_versions = 2;
  Readiness readiness = 3;
}

// `GetModelMetadata` 응답 — `CalculateOptimalBidResponse`와 같은 결과 봉투 패턴을
// 따르되 `Unmeasurable` 가지는 없다(scope.md ⑧ 권고 — 메타데이터 조회는 "측정 불가"인
// 도메인 결과가 없다. 답이 있거나, 계약이 정의한 실패다).
message GetModelMetadataResponse {
  oneof result {
    ModelMetadata metadata = 1;
    ApplicationFailure failure = 2;
  }
}

service BidPredictionService {
  rpc CalculateOptimalBid(CalculateOptimalBidRequest) returns (CalculateOptimalBidResponse);
  rpc GetModelMetadata(GetModelMetadataRequest) returns (GetModelMetadataResponse);
}
