syntax = "proto3";

// M2/2A — 공통 값 계약. 정본은 `reports/evidence/m2/2a/scope.md` 「이 slice 가 하는 일」
// ①~④·⑥·⑧과 `ADR 0010`. 이 파일은 값 타입·enum·요청 봉투만 갖는다 — 결과 봉투 패턴과
// `FailureCode`·`Unmeasurable`은 `error.proto`(D-3 층 분리와 같은 이유로 파일도 가른다).
//
// **fail-closed 규칙(⑥)**: 모든 enum은 `..._UNSPECIFIED = 0`이고, 수신 측은 `UNSPECIFIED`와
// proto3 open enum이 통과시키는 **정의 밖 정수**를 둘 다 거부한다. 어느 필드도 enum 값 전체를
// 허용하지 않는다 — 각 메시지 주석이 그 필드가 받는 부분집합을 적는다.
package bidvector.ml.v1;

option java_package = "contract.bidvector.ml.v1";
option java_multiple_files = true;

// 이 계약이 다루는 통화. `bidvector.sharedkernel.Currency`의 유일한 값을 미러한다(2A ①).
// 허용 부분집합: `Money.currency`는 `CURRENCY_KRW`만 받는다 — 그 밖(포함 UNSPECIFIED)은
// `INVALID_REQUEST`.
enum Currency {
  CURRENCY_UNSPECIFIED = 0;
  CURRENCY_KRW = 1;
}

// 금액이 어느 개념 축에서 왔는지. `bidvector.sharedkernel.Basis` 여섯 값을 이름까지 미러한다
// (2A ③ — 값 추가는 양쪽 동시, 제공자 먼저 배포). `Money.basis`가 `BASIS_UNSPECIFIED`면 거부(⑥).
// 허용 부분집합은 필드마다 다르다 — 예: 2B `FeatureInputs.base_amount.basis`는
// `BASIS_BASE_AMOUNT`만 받는다(scope.md ⑥ 예시). 2A 자신은 부분집합을 강제하지 않는다 —
// `Money` 메시지 하나가 basis 축 전체를 나른다.
enum Basis {
  BASIS_UNSPECIFIED = 0;
  BASIS_BASE_AMOUNT = 1;
  BASIS_ESTIMATED = 2;
  BASIS_YEGA = 3;
  BASIS_BID = 4;
  BASIS_ALLOCATED_BUDGET = 5;
  BASIS_AWARD = 6;
}

// 부가세 처리. `bidvector.sharedkernel.VatTreatment` 세 값을 미러한다(2A ③).
// `VAT_TREATMENT_UNSPECIFIED`는 거부(⑥) — `UNKNOWN`(과세 처리 미상)과는 다른 값이다.
enum VatTreatment {
  VAT_TREATMENT_UNSPECIFIED = 0;
  VAT_TREATMENT_INCLUSIVE = 1;
  VAT_TREATMENT_EXCLUSIVE = 2;
  VAT_TREATMENT_UNKNOWN = 3;
}

// 금액이 어떻게 얻어졌는가 — `Money`의 다섯째 성분(2A ①). `bidvector.sharedkernel.Provenance`
// 여섯 변형의 **라벨만** 싣는다 — payload 성분(`Published.noticeRevision`·
// `FilledFromBudgetKey.key`)은 업무 어휘라 Kotlin 안에 머문다(D-2A-2). `Money.provenance`가
// `AMOUNT_PROVENANCE_KIND_UNSPECIFIED`면 거부(⑥).
//
// **`BaseAmountProvenanceLabel`과 혼용하지 않는다(D-M2-10, 위협 모델 (h))** — 이 축은
// 「금액이 어떻게 얻어졌나」(Money의 성분), 저 축은 「기초금액 판정이 어느 라벨인가」
// (2B 피처 fact 의 성분). 다른 축이라 한 enum에 접지 않는다.
enum AmountProvenanceKind {
  AMOUNT_PROVENANCE_KIND_UNSPECIFIED = 0;
  AMOUNT_PROVENANCE_KIND_PUBLISHED = 1;
  AMOUNT_PROVENANCE_KIND_DERIVED_FROM_OPENING = 2;
  AMOUNT_PROVENANCE_KIND_FILLED_FROM_BUDGET_KEY = 3;
  AMOUNT_PROVENANCE_KIND_COPIED_FROM_BASE_AMOUNT = 4;
  AMOUNT_PROVENANCE_KIND_OPERATOR_DECLARED = 5;
  AMOUNT_PROVENANCE_KIND_UNDECLARED = 6;
}

// 기초금액 판정 라벨(다섯) — `bidvector.sharedkernel.BaseAmountProvenance`을 미러한다
// (2A ③, `OPEN-DIC-05` 닫힘). GBM의 `denominator_source` 피처 자리에 대응하는 **판정 축**이고
// `Money`의 성분이 아니다 — 2B의 피처 fact가 쓴다. 라벨 집합은 불변이다(decision 27).
enum BaseAmountProvenanceLabel {
  BASE_AMOUNT_PROVENANCE_LABEL_UNSPECIFIED = 0;
  BASE_AMOUNT_PROVENANCE_LABEL_CLEAN = 1;
  BASE_AMOUNT_PROVENANCE_LABEL_DERIVED_YEGA = 2;
  BASE_AMOUNT_PROVENANCE_LABEL_DERIVED_VAT = 3;
  BASE_AMOUNT_PROVENANCE_LABEL_SUSPECT_RATIO = 4;
  BASE_AMOUNT_PROVENANCE_LABEL_UNKNOWN = 5;
}

// 관측/추천 구분(D-2A-7 (a)) — `bidvector.sharedkernel.BidRateOrigin`을 미러한다. 율의 축
// (floor/assessment/bid/award)은 이 enum이 아니라 **필드·메시지 이름**이 나른다(조사 g-1) —
// 이 축은 그 중 `bid_rate`가 실리는 자리(`Candidate.bid_rate`·
// `CompetitionSample.observed_bid_rate`)에서만 관측/추천을 가른다.
enum BidRateOrigin {
  BID_RATE_ORIGIN_UNSPECIFIED = 0;
  BID_RATE_ORIGIN_OBSERVED = 1;
  BID_RATE_ORIGIN_RECOMMENDED = 2;
}

// 결측 사유(D-2A-4) — 2B의 모든 피처 fact가 `oneof { value, missing }`으로 이것을 쓴다.
// `UNKNOWN`은 「모른다」이고 `NOT_APPLICABLE`과 다르다 — 두 값을 합치지 않는다.
enum MissingReason {
  MISSING_REASON_UNSPECIFIED = 0;
  MISSING_REASON_UNKNOWN = 1;
  MISSING_REASON_NOT_APPLICABLE = 2;
  MISSING_REASON_NOT_COLLECTED_YET = 3;
}

// 원화 확정 금액 — 다섯 성분(2A ①, `bidvector.sharedkernel.AmountRecord`와 1:1).
// `won`만 보내면 R-BASIS-06이 wire에서 되살아난다(조사 01 (g-1)) — 다섯 성분 전부가 계약이다.
// **`basis`·`provenance`가 UNSPECIFIED인 금액은 수신 측이 거부한다**(⑥, 위협 모델 (d)).
// 소수 표현 없음(D-M2-6) — `amount_won`은 원화 정수 단위다.
message Money {
  int64 amount_won = 1;
  Currency currency = 2;
  Basis basis = 3;
  VatTreatment vat_treatment = 4;
  AmountProvenanceKind provenance = 5;
}

// 율 — `fraction` 하나(2A ②). 정규형은 `BigDecimal.toPlainString()`(지수 표기 없음,
// **scale 보존** — `"0.8700"`과 `"0.87"`은 다른 문자열이다, `bidvector.sharedkernel.Rate`와
// 같은 표현). 별도 `scale` 필드를 두지 않는다(같은 사실 두 자리 금지) — 「scale 명시」는
// 「문자열이 scale을 잃지 않는다」로 읽는다. percent 표현 없음 — fraction만 받는다(위협
// 모델 (3), R-RATE-01·R-RATE-03 `폐기`). 원문 unit의 기록은 어댑터의 provenance이지 wire가
// 아니다. 율의 축(floor/assessment/bid/award)은 필드·메시지 이름이 나른다(조사 g-1).
message Rate {
  string fraction = 1;
}

// `PredictionEnvelope` 전용 oneof 선택자(2A ④) 중 하나 — 요청 시점의 승격 release로 답하라는
// 지시. 필드 없음(당장은) — servicer가 그 시점의 승격 release를 스스로 조회한다.
message LatestPromoted {}

// `PredictionEnvelope` 전용 oneof 선택자 — 특정 release를 정확히 지목한다(⑥의 제3 변환 금지
// 근거). `Success.release`는 이 selector 요청이면 정확히 이 release와 같아야 한다.
message ExactRelease {
  string release_id = 1;
  string artifact_checksum = 2;
}

// 모델 release 선택자 — 미지정(oneof unset)은 `PredictionEnvelope`에서 거부한다(2A ④, ⑥).
// `latest_promoted`(D-M2-12 (a))도 폴백 구멍이 없다 — client가 응답의 `release_id`를
// `GetModelMetadata.promoted`와 대조한다(⑥ (b), M2는 fake 위의 test까지 —
// `OPEN-2A-RELEASE-CHECK-4D`).
message ModelReleaseSelector {
  oneof selector {
    LatestPromoted latest_promoted = 1;
    ExactRelease exact_release = 2;
  }
}

// 모든 RPC의 필수 봉투(2A ④). 두 필드 모두 **빈 문자열이면 미지정으로 거부**한다 — 기본값이
// 곧 결측 표시라 proto3 필드 presence가 필요 없다.
message RequestEnvelope {
  string request_id = 1;
  string correlation_id = 2;
}

// `CalculateOptimalBid` 전용 봉투(2A ④) — `GetModelMetadata`·training RPC는 `RequestEnvelope`만
// 쓴다. `deadline_policy_version`은 **값이 아니라 정책 참조**다 — 실제 deadline은 gRPC
// 메타데이터로 전파한다(ADR 0010 D-1·D-2). `model_release_selector`가 미지정이면 거부(⑥).
message PredictionEnvelope {
  RequestEnvelope base = 1;
  string feature_schema_version = 2;
  ModelReleaseSelector model_release_selector = 3;
  string deadline_policy_version = 4;
}
