syntax = "proto3";

// M2/2C — 비동기 training 계약. 정본은 `reports/evidence/m2/2c/scope.md` 「이 slice 가
// 하는 일」 ①~⑨과 `ADR 0010` D-4(재시도는 멱등성과 상태)·D-8(별도 job API, 같은 gRPC
// 서버, Kotlin 이 폴링). 세 RPC 전부 unary — 장시간 학습을 동기 RPC 로 붙잡지 않는다
// (`v2-지침서.md` §3.3, ADR 0010 D-2). Celery·task·queue·`raw_status` 이름은 wire 에
// 없다(조사 노트 01 H-12 직접 위반 회피) — 이 계약은 자기 상태 어휘(`JobState`)만 쓴다.
package bidvector.ml.v1;

import "bidvector/ml/v1/common.proto";
import "bidvector/ml/v1/error.proto";
import "bidvector/ml/v1/prediction.proto";
import "google/protobuf/timestamp.proto";

option java_package = "contract.bidvector.ml.v1";
option java_multiple_files = true;

// job 상태 — legacy 5값(`queued`/`running`/`completed`/`failed`/`cancelled`, 조사 01 (d))과
// 달리 미지 상태를 접지 않는다(fail-closed, common.proto 관례). **전이표(scope.md ④,
// ADR 0010 D-8)**:
//   ACCEPTED → RUNNING → SUCCEEDED | FAILED
//   ACCEPTED | RUNNING → CANCELLED
//   종료 상태(SUCCEEDED·FAILED·CANCELLED)에서 CancelTrainingJob 은 멱등 no-op(현재 상태
//   반환, 오류 아님) — 새 전이가 아니다.
// 표에 없는 쌍(예: `RUNNING → ACCEPTED`, `SUCCEEDED → RUNNING`)은 provider 가 만들지 않고
// consumer 가 거부한다(관측 가능한 거부 — `data-dictionary.md` §2.2).
enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_ACCEPTED = 1;
  JOB_STATE_RUNNING = 2;
  JOB_STATE_SUCCEEDED = 3;
  JOB_STATE_FAILED = 4;
  JOB_STATE_CANCELLED = 5;
}

// job 종료 사유 — **2A `FailureCode`(application 어휘)와는 다른 enum**이다(D-2C-4, ADR
// 0010 D-3 「두 층에 같은 실패를 두지 않는다」). application failure 는 RPC 응답 자체의
// 실패(`StartTraining` 거부 등)이고, 이 enum 은 **수리된 job 이 왜 끝났는가**다. transport
// status 이름(`RESOURCE_EXHAUSTED`)과 겹치지 않도록 `WORKER_RESOURCE_EXHAUSTED`로 접두를
// 둔다. 최소 집합이고 5C 가 값을 더한다(호환 추가, `OPEN-2C-FAILURE-CODES`).
enum JobFailureCode {
  JOB_FAILURE_CODE_UNSPECIFIED = 0;
  JOB_FAILURE_CODE_DATASET_UNREADABLE = 1;
  JOB_FAILURE_CODE_DATASET_CHECKSUM_MISMATCH = 2;
  JOB_FAILURE_CODE_TRAINING_ERROR = 3;
  JOB_FAILURE_CODE_EVALUATION_ERROR = 4;
  JOB_FAILURE_CODE_CANCELLED_BY_REQUEST = 5;
  JOB_FAILURE_CODE_WORKER_RESOURCE_EXHAUSTED = 6;
}

// immutable dataset 참조(scope.md ①·②) — `uri`는 ml-engine `adapters/`가 읽는
// object/file storage 경로이지 DB 참조가 아니다(§3.2 serving 무 DB, ADR 0010 D-8).
// 계약은 `uri`의 scheme 을 정하지 않는다(`OPEN-2C-DATASET-URI-SCHEME`, 위협 모델 우회
// 후보 (4) — DB 연결 문자열이 여기 실려도 이 계약은 못 막는다, 5A 의 import boundary
// 소관). `manifest_checksum`은 sha256 hex(소문자 64자, 검증은 M4/5C). checksum 불일치는
// 요청 거부가 아니라 **job 안에서** `FAILED(DATASET_CHECKSUM_MISMATCH)`로 실패한다 —
// 검증은 읽을 때 일어나고 `StartTraining` 시점엔 아직 읽지 않았다.
message DatasetReference {
  string uri = 1;
  string manifest_checksum = 2;
  string dataset_id = 3;
}

// `StartTraining` 요청(scope.md ①) — `idempotency_key`는 **Kotlin 이 업무 의도 단위로
// 발급**한다(D-2C-1 (a), 착수 결정). ml-engine 은 이 문자열을 해석하지 않고 저장·대조만
// 한다(불투명). 계약은 형식을 정하지 않고 **비어 있지 않음**만 요구한다 — 길이 상한은
// 어댑터 쪽 정책 데이터(매직넘버를 계약에 박지 않는다, `v2-지침서.md` §5)이고 이 test
// 파일이 임의 상한(256자)으로 규칙 존재를 문서화한다. 같은 키 두 번은 같은 `job_id`를
// 돌려주고(ADR 0010 D-4, provider test), 같은 키에 다른 `dataset`이 오면
// `ApplicationFailure(IDEMPOTENCY_CONFLICT)`(2A 소유 값)다. `training_spec_version`은
// ml-engine 안의 versioned training spec(D-2C-2 (a), 5C 소유)을 가리키는 참조 문자열일
// 뿐 파라미터 자체가 아니다 — 미지 version 은 job 실패가 아니라 이 RPC 자체의 거부
// (`ApplicationFailure(UNSUPPORTED_TRAINING_SPEC)`)다.
message StartTrainingRequest {
  RequestEnvelope envelope = 1;
  string idempotency_key = 2;
  DatasetReference dataset = 3;
  string training_spec_version = 4;
  optional string requested_release_id = 5;
}

// `job_id`는 ml-engine 발급 불투명 문자열(D-2C-3, 형식은 계약이 정하지 않는다). Kotlin 은
// 저장·조회 키로만 쓴다.
message TrainingJobHandle {
  string job_id = 1;
  JobState state = 2;
}

// `StartTraining` 응답 — 결과 봉투(ADR 0010 D-3, 2A 인계 패턴, 2B `CalculateOptimalBidResponse`와
// 같은 형태). `Unmeasurable` 가지는 없다 — 시작 요청에는 "측정 불가"인 도메인 결과가
// 없다. `StartTraining`은 **즉시 `ACCEPTED`를 돌려준다**(scope.md ⑨, 위협 모델 (g)) —
// 학습 실행을 기다리지 않는다.
message StartTrainingResponse {
  oneof result {
    TrainingJobHandle handle = 1;
    ApplicationFailure failure = 2;
  }
}

// 학습 산출물 참조(scope.md ⑦) — checksum 은 `release.artifact_checksum` **한 자리**다
// (같은 사실 두 자리 금지 — `uri`에도 checksum 필드를 별도로 두지 않는다). `release`는
// 2B `ModelRelease`(다섯 성분)를 그대로 쓴다 — 여기서 새 릴리스 식별 타입을 만들지
// 않는다. `release.dataset_id`는 요청 `StartTrainingRequest.dataset.dataset_id`와 같아야
// 한다(위협 모델 (f), consumer test). manifest 의 **내용**(재현성 파라미터·metric·
// `sample_scope`·서명)은 M5 5C 소유 — 이 메시지는 참조 + `manifest_schema_version`만
// 갖는다.
message ArtifactReference {
  string uri = 1;
  ModelRelease release = 2;
  string manifest_schema_version = 3;
}

// 평가 리포트 참조(scope.md ⑧) — 내용은 M5 5C 소유. 승격 판정(ML-07)의 **입력**일 뿐 이
// 참조 자체가 승격이 아니다(학습 성공 ≠ 승격).
message EvaluationReportReference {
  string uri = 1;
  string checksum = 2;
  string report_schema_version = 3;
}

// job 종료 사유 상세(scope.md ⑥) — `retryable`은 계약이 정하는 값이다(ADR 0010 D-3과
// 같은 형태 — application failure 의 `retryable`과 대칭). 재시도는 **새 job**이다(같은
// `dataset`으로 새 `idempotency_key`의 `StartTraining`) — 이 메시지에 재시도 RPC 참조는
// 없다. `detail_code`는 코드이지 사람이 읽는 문장이 아니다(Celery 원문 유입은 계약이 막지
// 못한다 — 위협 모델 우회 후보 (5), 알려진 제한·리뷰 항목).
message JobFailure {
  JobFailureCode code = 1;
  bool retryable = 2;
  string detail_code = 3;
}

// `GetTrainingJob`/`CancelTrainingJob`의 공통 답(scope.md ③) — **조합 불변식**(provider
// test 가 검사):
//   `SUCCEEDED` ⟹ `artifact`·`evaluation` 둘 다 설정
//   `FAILED` ⟹ `failure` 설정
//   그 밖의 상태(`ACCEPTED`·`RUNNING`·`CANCELLED`)는 `artifact`·`evaluation`·`failure`
//   전부 미설정 — 특히 `CANCELLED`에 `artifact`가 붙는 것은 위협 모델 우회 후보 (3).
// 시각 불변식(D-2C-5): `accepted_at ≤ started_at ≤ finished_at`(둘 다 설정된 경우에만
// 비교, UTC). `google.protobuf.Timestamp`는 well-known type — BSR 의존 없이 buf·protoc·
// grpc_tools 세 도구 모두 로컬로 생성한다(`contracts/buf.yaml`에 `deps`가 없다 — 2B가
// `google.type.Date`를 피한 것과 같은 축, `buf build` 실측으로 확인).
message TrainingJob {
  string job_id = 1;
  JobState state = 2;
  google.protobuf.Timestamp accepted_at = 3;
  optional google.protobuf.Timestamp started_at = 4;
  optional google.protobuf.Timestamp finished_at = 5;
  optional ArtifactReference artifact = 6;
  optional EvaluationReportReference evaluation = 7;
  optional JobFailure failure = 8;
}

message GetTrainingJobRequest {
  RequestEnvelope envelope = 1;
  string job_id = 2;
}

// 결과 봉투 — 미지 `job_id`는 `ApplicationFailure(JOB_NOT_FOUND)`(2A 소유 값)다.
message GetTrainingJobResponse {
  oneof result {
    TrainingJob job = 1;
    ApplicationFailure failure = 2;
  }
}

// `CancelTrainingJob` 요청 — 취소 **권한**은 계약 밖(M6 인증, scope.md ⑤). 계약은
// 「취소가 있다」와 전이만 정한다.
message CancelTrainingJobRequest {
  RequestEnvelope envelope = 1;
  string job_id = 2;
}

// `ACCEPTED`·`RUNNING`에서만 `CANCELLED`로 전이한다. 종료 상태(`SUCCEEDED`·`FAILED`·
// `CANCELLED`)에서는 **멱등 no-op** — 현재 상태를 그대로 반환하고 오류가 아니다(scope.md
// ⑤). 실제 취소 존중(계산 중단·리소스 반환)은 이 계약이 검증하지 않는다 — 5C 소관
// (ADR 0010 §6).
message CancelTrainingJobResponse {
  oneof result {
    TrainingJob job = 1;
    ApplicationFailure failure = 2;
  }
}

// 세 RPC 전부 unary, 같은 gRPC 서버(`bidvector.ml.v1`) — Kotlin 이 폴링한다(scope.md ⑨,
// ADR 0010 D-8). 폴링 주기·재시도는 이 계약 밖(D-M2-14, `adapters` 정책 데이터·M4). job
// 목록 조회(`ListTrainingJobs`)는 두지 않는다(D-2C-6) — Kotlin 이 자기가 시작한 job 만
// 안다(ADR 0003 D-5 방향). 필요가 측정되면 호환 추가.
service TrainingJobService {
  rpc StartTraining(StartTrainingRequest) returns (StartTrainingResponse);
  rpc GetTrainingJob(GetTrainingJobRequest) returns (GetTrainingJobResponse);
  rpc CancelTrainingJob(CancelTrainingJobRequest) returns (CancelTrainingJobResponse);
}
