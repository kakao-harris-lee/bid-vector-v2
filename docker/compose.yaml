# M6/6C — 로컬 환경(scope.md ②, D-6C-2). ml-serving + postgres 둘만 — broker 는
# 소비자 코드가 없어 세우지 않는다(milestone-6.md 「필요한 경우에만」).
#
# 자격증명은 파일에 리터럴로 두지 않는다((2b) 표 「경계로 처리」) — `${VAR:?message}`는
# 호스트/CI 환경에 값이 없으면 `docker compose up`이 그 자리에서 실패한다(기본값 없음,
# D-6C-7 과 같은 규율). 로컬 실행자는 셸에서 내보내거나 `docker compose --env-file`로
# 넘긴다 — 이 파일도 `.env`도 값을 갖지 않는다.
services:
  ml-serving:
    build:
      context: ..
      dockerfile: docker/ml-serving.Dockerfile
    image: bidvector/ml-serving:local
    environment:
      # 정책 파일은 이미지에 복사된 저장소 사본이다(D-6C-7) — 경로만 env 로 준다.
      ML_ENGINE_BIND: "0.0.0.0:50051"
      ML_ENGINE_INFERENCE_POLICY: /app/policy/inference-v1.yaml
      ML_ENGINE_TRAINING_POLICY: /app/policy/training-v1.yaml
      ML_ENGINE_EVALUATION_POLICY: /app/policy/evaluation-v1.yaml
      ML_ENGINE_SERVING_POLICY: /app/policy/serving-v1.yaml
      ML_ENGINE_ARTIFACT_OUT_DIR: /app/artifacts
      ML_ENGINE_CODE_VERSION: "6c-local"
    # R2-3(D-6C-10 ③) — 위생 게이트와 같은 능력 차단. setuid/setgid 상승이 구성상
    # 불가능해진다 — 점 표집(프로브·게이트)에 기대지 않고 로컬 환경도 같은 보장을 받는다.
    security_opt:
      - no-new-privileges:true
    ports:
      - "50051:50051"
    healthcheck:
      # compose 의 healthcheck 는 하나뿐이다 — **readiness**(정책 넷 preload 성공)를
      # 건다. `docker compose ps`의 healthy 는 "요청을 받아도 되는가"를 뜻해야 하고,
      # 그 축은 liveness 가 아니라 readiness 다(scope.md ③, 설계 검토 구현순서 4 —
      # "ml-serving 이 healthy 로 수렴함을 실측(출하 정책 그대로 READY)"). liveness
      # 프로브는 이 이미지 안에 여전히 존재하고(`/app/probe/liveness.py`) 표준
      # orchestrator 배선(k8s livenessProbe 등)이 생기는 6A/6D 에서 그 자리에 쓴다
      # (D-6C-3 — 이 slice 는 프로브 둘을 분리해 두는 것까지다).
      test: ["CMD", "python", "/app/probe/readiness.py"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 15s

  app:
    # M6/6A-2a D-6A2a-5 — Kotlin 앱. 이미지는 **밖에서 만든 `bootJar`** 를 담는다(D-6A2a-2):
    # `./gradlew --no-daemon :app:bootJar` → `docker build -f docker/app.Dockerfile ...` 를
    # 먼저 돌린다. `image:` 가 이미 있으면 `docker compose up -d` 는 다시 빌드하지 않는다.
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
    image: bidvector/app:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 값이 **하나도 이 파일에 없다** — 전부 `${VAR:?}` 참조다(D-6C-7 과 같은 규율을 자격
      # 값뿐 아니라 전 항목으로 넓힌다: 이 서비스는 리터럴 기본값을 하나도 갖지 않는다).
      # 값이 없으면 `docker compose up` 이 그 자리에서 실패한다.
      SERVER_PORT: ${BIDVECTOR_APP_PORT:?BIDVECTOR_APP_PORT 환경변수가 필요합니다 — 로컬 셸에서 내보내거나 --env-file 로 넘긴다}
      MANAGEMENT_SERVER_PORT: ${BIDVECTOR_APP_MANAGEMENT_PORT:?BIDVECTOR_APP_MANAGEMENT_PORT 환경변수가 필요합니다}
      BIDVECTOR_PERSISTENCE_JDBCURL: ${BIDVECTOR_APP_JDBC_URL:?BIDVECTOR_APP_JDBC_URL 환경변수가 필요합니다 — compose 네트워크 안에서는 호스트가 postgres 다}
      BIDVECTOR_PERSISTENCE_USERNAME: ${BIDVECTOR_PG_USER:?BIDVECTOR_PG_USER 환경변수가 필요합니다}
      BIDVECTOR_PERSISTENCE_CREDENTIAL: ${BIDVECTOR_PG_PASSWORD:?BIDVECTOR_PG_PASSWORD 환경변수가 필요합니다}
      OPERATOR_CREDENTIAL_VALUE: ${BIDVECTOR_APP_OPERATOR_CREDENTIAL:?BIDVECTOR_APP_OPERATOR_CREDENTIAL 환경변수가 필요합니다}
      BIDVECTOR_EVALUATION_CANDIDATECAP: ${BIDVECTOR_APP_CANDIDATE_CAP:?BIDVECTOR_APP_CANDIDATE_CAP 환경변수가 필요합니다}
      # **수집 변수를 두지 않는다**(D-6A2a-5, 우회 6) — `bidvector.collection.mode` 가 없으면
      # `CollectionWiring` 전체가 올라오지 않아 KONEPS 서비스 키 바인딩도, 수집 어댑터 생성도
      # 일어나지 않는다(`@ConditionalOnProperty havingValue=once`). compose 기동이 실 외부
      # 호출을 켜는 경로가 **구성상** 없다 — 스모크가 로그에 수집 시작 줄이 0 임을 잰다.
      #
      # **ML 주소 변수도 두지 않는다**(D-6A2a-6) — `EvaluationWiring` 이 자리지킴을 고정하고
      # 이 서비스는 ml-serving 에 `depends_on` 하지 않는다. 쓰지 않는 서비스를 기동 조건으로
      # 만들지 않는다(`OPEN-ML-ANALYSIS-WIRING` 무변경).
    security_opt:
      - no-new-privileges:true
    ports:
      # API 포트만, **루프백에만** publish 한다. 관리 포트는 publish 하지 않는다 — 준비 상태는
      # 컨테이너 안에서만 물어보면 되고(아래 healthcheck), 관리 포트의 네트워크 노출 통제는
      # 배치 환경이 진다(`OPEN-6A2A-MGMT-PORT-EXPOSURE`, 위협 모델 경계 밖).
      - "127.0.0.1:${BIDVECTOR_APP_PORT:?}:${BIDVECTOR_APP_PORT:?}"
    healthcheck:
      # ml-serving 과 같은 선택 — compose 의 healthcheck 는 하나뿐이고 `docker compose ps` 의
      # healthy 는 "요청을 받아도 되는가"를 뜻해야 하므로 **readiness** 를 건다(liveness 아님).
      # readiness 그룹에는 DB 가 들어 있다(D-6A2a-4) — DB 가 없으면 이 서비스는 healthy 가
      # 되지 않는다. `curl` 은 이 JRE 베이스에 이미 들어 있다(2026-09-26 실측) — 도구를 더
      # 설치하지 않는다. `-f` 가 503(DOWN)을 비-0 으로 옮긴다.
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:${BIDVECTOR_APP_MANAGEMENT_PORT:?}/actuator/health/readiness
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  postgres:
    # 6B(Flyway 스키마·backup/restore)가 쓸 자리 — 6C 는 기동·연결까지만(D-6C-2).
    # 다이제스트 고정, adapters 의 Testcontainers 대역과 같은 버전(16.4,
    # PersistenceTestSupport.kt) — 두 대역이 다른 postgres 버전으로 갈라지지 않는다.
    image: postgres:16.4@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      POSTGRES_USER: ${BIDVECTOR_PG_USER:?BIDVECTOR_PG_USER 환경변수가 필요합니다 — 로컬 셸에서 내보내거나 --env-file 로 넘긴다}
      POSTGRES_PASSWORD: ${BIDVECTOR_PG_PASSWORD:?BIDVECTOR_PG_PASSWORD 환경변수가 필요합니다}
      POSTGRES_DB: ${BIDVECTOR_PG_DB:?BIDVECTOR_PG_DB 환경변수가 필요합니다}
    # R3-2(verifier r3 LOW) — ml-serving 과 같은 능력 차단. 공식 postgres 이미지가 이
    # 옵션 아래 정상 기동·`pg_isready`함을 실측 확인(무해) — 판정이 실행 플래그
    # 조건부라는 지적의 남은 두 미적용 경로 중 하나를 닫는다(나머지 하나는
    # RealServerIntegrationTest 의 Testcontainers 컨테이너, checklist.md 알려진 제한).
    security_opt:
      - no-new-privileges:true
    # host 포트를 publish 하지 않는다 — 이 컨테이너의 소비자(6B·`RealServerIntegrationTest`
    # 의 ml-serving 대역)는 compose 네트워크 안 서비스 이름(`postgres:5432`)이나
    # Testcontainers 가 각자 관리하는 별도 컨테이너를 쓴다. 로컬 머신의 5432 는 다른
    # 프로젝트가 이미 점유하고 있을 수 있어(2026-09-16 이 개발 환경에서 실측 충돌)
    # host bind 를 강제하지 않는다 — 필요하면 실행자가 `docker compose ... --
    # publish 5432:5432` 상당을 직접 얹는다.
    volumes:
      - bidvector-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  bidvector-pg-data:
