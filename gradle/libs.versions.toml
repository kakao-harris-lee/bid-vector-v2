[versions]
# 툴체인 — 고정 근거는 reports/evidence/m1/1a/scope.md 「D-1. 툴체인 고정」
kotlin = "2.4.10"
spring-boot = "4.1.1"
detekt = "2.0.0-alpha.6"
ktlint = "1.8.0"
ktlint-gradle = "14.2.0"
kover = "0.9.9"
archunit = "1.5.0"
# M1/1A-b ③(OPEN-ADR-16 (a)) — PMD CPD 관찰 모드. 플러그인 버전만 여기 둔다 — PMD 엔진
# 자체의 `toolVersion`(7.7.0, Gradle 9.6.1 스모크 확인)은 정책 데이터라
# `config/quality/duplicate-policy.properties`가 갖는다(매직 넘버·중복 금지).
cpd = "3.5"
junit = "6.1.3"
kotest = "6.2.4"
coroutines = "1.10.2"

# ADR 0005 가 채택한 운영 라이브러리
db-scheduler = "16.12.0"
resilience4j = "2.4.0"

# OPEN-ADR-07 — mutation 도구는 미결이다. 좌표만 등재하고 어느 모듈에도 적용하지 않는다.
pitest-plugin = "1.19.0"
pitest = "1.30.0"

# M2/2A — gRPC/Protobuf 내부 계약(ADR 0003·0006 D-8). 버전 근거는
# `_workspace/m2-prep/02_grpc_stack_compat.md`(curl 로 Maven Central/PyPI 메타데이터 직접 실측).
# `ml-contract/` included build 전용 — 어느 domain 모듈에도 적용하지 않는다
# (`architecture-policy.properties` `group.forbidden=io.grpc,com.google.protobuf`).
grpc-kotlin = "1.5.0"
# grpc-kotlin-stub:1.5.0 의 POM 은 grpc-stub:1.62.2 를 선언한다(22 마이너 차) — grpc-bom 이
# io.grpc:* 좌표를 이 버전으로 강제 정렬한다. §4b 스모크가 이 정렬의 컴파일·런타임을 확인한다.
grpc-java = "1.84.0"
protobuf-runtime = "3.25.9"
protobuf-gradle-plugin = "0.10.0"

[libraries]
# build-logic 이 convention plugin 안에서 plugin id 로 적용하려면 marker 아티팩트가 필요하다.
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
detekt-gradlePlugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
ktlint-gradlePlugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-gradle" }
kover-gradlePlugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
cpd-gradlePlugin = { module = "de.aaschmid:gradle-cpd-plugin", version.ref = "cpd" }

# quality baseline task 가 컴파일된 바이트코드에서 타입 축을 잰다(OPEN-ADR-06 입력).
archunit-core = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }

# sizeGate 가 함수 길이를 **Kotlin PSI 로 직접** 잰다. 파서 버전을 컴파일러 버전에 묶는다 —
# 같은 `version.ref` 라 코드를 만드는 컴파일러와 그것을 재는 파서가 어긋날 수 없다.
# KGP 2.4.10 의 pom 에는 compiler-embeddable 이 없어 명시 선언이 필요하다(2.2.0 에는 있었다).
# reflect·coroutines 가 없으면 `KotlinCoreEnvironment` 초기화가 NoClassDefFoundError 로 죽는다.
kotlin-compilerEmbeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# runner 를 붙이지 않는다 — kotest-property 는 junit-platform 에 의존하지 않아
# 평범한 Jupiter 테스트에서 호출된다(scope.md D-1).
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }

archunit-junit6 = { module = "com.tngtech.archunit:archunit-junit6", version.ref = "archunit" }

# 4.x 호환 스모크 대상 일곱. 아래 셋은 **버전을 적지 않는다** — Boot BOM 이 관리하는지가
# 측정 대상이기 때문이다(ADR 0004 §6 의 미확인 항목). 해석된 버전은 compatibilitySmoke 가 낸다.
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
flyway-core = { module = "org.flywaydb:flyway-core" }
# M3/3D — PostgreSQL 전용 Flyway 파서/DB 지원 모듈(ADR 0004 D-1). Flyway 10+ 는 엔진별 지원을
# 별도 모듈로 분리했다 — `flyway-core` 만으로는 `jdbc:postgresql:` URL 을 인식하지 못한다.
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
micrometer-core = { module = "io.micrometer:micrometer-core" }
# Testcontainers 2.x 가 좌표를 바꿨다 — 1.x 의 `org.testcontainers:postgresql` 은 1.21.4 에서 멈췄고
# Boot 4.1.1 BOM 이 끌어오는 testcontainers-bom 2.0.5 는 `testcontainers-postgresql` 을 관리한다.
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
# M3/3D — JUnit 5 확장(`@Testcontainers`/`@Container`) 좌표. `testcontainers-postgresql` 은
# 컨테이너 정의만 주고 JUnit 라이프사이클 통합은 이 모듈이 따로 갖는다. Testcontainers 2.x 는
# 이 모듈도 `testcontainers-` 접두로 이름을 바꿨다(실측 — `org.testcontainers:junit-jupiter`는
# 이 BOM 아래서 해석되지 않는다, 위 `testcontainers-postgresql` 좌표 개명과 같은 축).
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
# M3/3D — D-3D-1 (a) JDBC 직접 접근(HikariCP 없음, `PGSimpleDataSource`). 버전은 Boot BOM 관리.
postgresql-driver = { module = "org.postgresql:postgresql" }

# 금지 가족마다 위반 fixture 를 컴파일하기 위한 좌표. app 의 **test** 에만 오르며 어떤 모듈도
# production 에서 쓰지 않는다 — 게이트가 그 가족을 실제로 잡는지 재는 것이 유일한 용도다.
jakarta-persistence = { module = "jakarta.persistence:jakarta.persistence-api" }
jakarta-jms = { module = "jakarta.jms:jakarta.jms-api" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
grpc-api = { module = "io.grpc:grpc-api" }
protobuf-java = { module = "com.google.protobuf:protobuf-java" }

# M1/1B-c ④ corpus 소비 테스트(app/src/test)가 `fixtures/manifest.yaml` 을 읽는다. 버전을 적지
# 않는다 — Boot 4.1.1 BOM 이 관리하고(`org.yaml:snakeyaml:2.6`, 실측 2026-09-05) app 의 test
# classpath 에 이미 transitively 해석돼 있다(Boot 의 `application.yml` 지원 경로). domain
# 모듈이 아니라 `moduleDependencyGate` 의 `group.forbidden` 대상도 아니다.
snakeyaml = { module = "org.yaml:snakeyaml" }

db-scheduler = { module = "com.github.kagkarlsson:db-scheduler", version.ref = "db-scheduler" }
resilience4j-retry = { module = "io.github.resilience4j:resilience4j-retry", version.ref = "resilience4j" }
# M3/3B — KONEPS HTTP 어댑터의 quota·bounded retry/backoff·rate limiter(②, ADR 0005 D-11
# 「외부 호출의 재시도는 Resilience4j 한 곳」). `resilience4j-kotlin`은 scope.md D-3B-2 가
# 카탈로그 등재를 요구해 좌표만 둔다 — 실제 구현은 Java API(`Retry.of`·`decorateSupplier`)로
# 충분해 어느 모듈도 이 좌표를 `implementation`으로 끌어오지 않는다(불필요한 결합 회피,
# checklist.md 「판단이 갈린 지점」).
resilience4j-ratelimiter = { module = "io.github.resilience4j:resilience4j-ratelimiter", version.ref = "resilience4j" }
resilience4j-kotlin = { module = "io.github.resilience4j:resilience4j-kotlin", version.ref = "resilience4j" }

# OPEN-ADR-07 이 닫힐 때까지 좌표만 든다. gradle-pitest-plugin 의 기본 PIT 는 1.22.1 이라
# 적용 slice 는 pitestVersion 을 반드시 명시해야 한다.
pitest-engine = { module = "org.pitest:pitest", version.ref = "pitest" }

# M2/2A — `ml-contract/` included build 전용 좌표. 기존 `grpc-api`·`protobuf-java`(버전 없음,
# app 위반 fixture 전용)와 별개 alias 다 — 저 둘은 Boot BOM 이 관리하는 다른 자리라 여기서
# 버전을 얹으면 그 용도가 깨진다.
grpc-kotlin-stub = { module = "io.grpc:grpc-kotlin-stub", version.ref = "grpc-kotlin" }
grpc-protoc-gen-grpc-kotlin = { module = "io.grpc:protoc-gen-grpc-kotlin", version.ref = "grpc-kotlin" }
grpc-bom = { module = "io.grpc:grpc-bom", version.ref = "grpc-java" }
grpc-stub = { module = "io.grpc:grpc-stub" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf" }
grpc-testing = { module = "io.grpc:grpc-testing" }
# in-process transport(`io.grpc.inprocess.*`)는 `grpc-core`가 아니라 별도 좌표
# `grpc-inprocess`에 있다(실측 — jar 내용 확인). `grpc-stub`/`grpc-kotlin-stub`/`grpc-testing`은
# 이것을 끌어오지 않는다 — §4b 런타임 스모크·2D fake servicer test 전용.
grpc-core = { module = "io.grpc:grpc-core" }
grpc-inprocess = { module = "io.grpc:grpc-inprocess" }
# M2/2D ⑤ — in-process transport 는 메시지를 marshaling 없이 참조로 넘겨 `maxInboundMessageSize`를
# 강제하지 않는다(실측 — in-process 채널/서버에 정책 상한을 걸어도 초과 표본이 그냥 통과했다).
# 경계 쌍(D-2D-6)의 실제 강제를 재려면 진짜 wire marshaling 이 필요해 localhost 전용으로
# 이 좌표를 쓴다 — cross-language socket 스모크(D-2D-3, S-6)와는 다른 용도(같은 JVM 안의
# 실제 프레이밍 경로 실측)다.
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded" }
protobuf-java-runtime = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf-runtime" }
protobuf-protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf-runtime" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
pitest = { id = "info.solidsoft.pitest", version.ref = "pitest-plugin" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-gradle-plugin" }
