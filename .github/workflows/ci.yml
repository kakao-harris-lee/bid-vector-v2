name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # 액션 넷의 major 는 **Node 24 진입점에서 멈춰 있다**(2026-09-09) — 상위 major 가
      # 있어도 올리지 않는다. 여기서 올리는 유일한 사유가 Node 20 지원 종료이고,
      # 그 밖의 major 는 각자 별도 사유로 판단할 일이다.
      #
      # `fetch-depth: 0` 은 `contractGate` 가 요구한다 — `buf breaking` 이
      # `.git#tag=<승인 태그>,subdir=contracts` 를 대조 대상으로 쓰므로 **전체 이력과 태그**가
      # 있어야 한다. 기본값(얕은 clone, 태그 없음)이면 그 검사가 대상을 찾지 못한다.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 러너의 launcher JVM. 컴파일에 쓰이는 toolchain 은 gradle.properties 의
      # `bidvector.jvmToolchain` 이 정하고, 없으면 foojay resolver 가 내려받는다.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # `contractGate`(bidvector.quality-baseline)가 `buf` 를 실행 파일로 부른다 —
      # lint · breaking · 버전 대조 셋. 러너에 없으면 `check` 가
      # `IOException: Cannot run program "buf"` 로 떨어진다(2026-09-06 이후 CI 상시 실패의 원인).
      #
      # `bufbuild/buf-setup-action` 을 쓰지 않는다 — **2025-08 아카이브**라 Node 20 에 묶인 채
      # 갱신되지 않는다. 대신 릴리스 바이너리를 직접 받는다. **버전은 정책 파일이 정한다** —
      # 워크플로에 숫자를 적으면 `tool.buf.version` 과 조용히 어긋날 자리가 하나 더 생긴다.
      - name: install buf
        run: |
          set -euo pipefail
          version="$(sed -n 's/^tool\.buf\.version=//p' config/quality/contract-policy.properties)"
          if [ -z "$version" ]; then
            echo "config/quality/contract-policy.properties 에서 tool.buf.version 을 읽지 못했다" >&2
            exit 1
          fi
          base="https://github.com/bufbuild/buf/releases/download/v${version}"
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/buf" "$base/buf-Linux-x86_64"
          curl -fsSL -o "$tmp/sha256.txt" "$base/sha256.txt"
          # 대상 자산의 행이 없으면 `pipefail` 로 여기서 떨어진다 — 조용한 미검증을 막는다.
          ( cd "$tmp" && grep ' buf-Linux-x86_64$' sha256.txt | sed 's/buf-Linux-x86_64$/buf/' | sha256sum -c - )
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$tmp/buf" "$RUNNER_TEMP/bin/buf"
          rm -rf "$tmp"
          # PATH 등재는 다음 step 부터 듣는다 — 이 step 의 스모크는 절대 경로로 건다.
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/buf" --version

      # v6 은 **캐싱을 `gradle-actions-caching` 상용 컴포넌트로 분리**해 Gradle 이용약관 동의를
      # 요구한다(MIT 아님). Node 24 는 v5 에서 이미 충족되므로 라이선스 변경을 딸려 들이지 않는다.
      - uses: gradle/actions/setup-gradle@v5

      # check 가 게이트 전부를 든다 — 컴파일 · ktlint · detekt · sizeGate ·
      # domainDependencyGate · architecture test · compatibilitySmoke.
      - run: ./gradlew --no-daemon check

      # OPEN-ADR-06 의 입력. 게이트가 아니라 측정이라 실패시키지 않는다.
      - run: ./gradlew --no-daemon qualityBaseline

      # R2-2(D-6C-10 ④, verifier r2 HIGH) — one-command-check.sh(완료 조건 1)를 CI 에서
      # 직접 잰다. `container` job(그 전제가 없다 — buf 미설치·얕은 checkout)이 아니라
      # **이 job**에 둔다: 이 스크립트의 첫 명령이 `./gradlew --no-daemon check`이고 그
      # 안의 `contractGate`가 `buf`와 전체 이력·태그를 요구하는데, 그 둘을 이미 갖춘 job이
      # 여기뿐이다(verifier r2 실측 — 다른 job 에 그대로 두면 S-20 이 반드시 실패하고,
      # step 순서상 뒤따르는 6C 게이트 축 전체가 CI 에서 한 번도 실행되지 않았다).
      - uses: actions/setup-python@v6
        with:
          python-version-file: ml-engine/.python-version

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.22"

      - name: one-command-check.sh — 완료 조건 1 (S-20)
        run: ./tools/one-command-check.sh

      # v5 는 Node 24 를 예비 지원만 하고 기본은 여전히 Node 20 이라 v6 이 최소선이다.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: reports
          path: |
            build/reports/quality-baseline/
            */build/reports/
          retention-days: 14

  # M5/5A — Python ML engine CI(2D D-2D-4 (a) · ADR 0009 D-6 「CI 가 확인한다」). Kotlin `check`
  # job 과 독립(소스 겹침 0, 위 job 은 무편집). `ml-engine/` 이 최초로 CI 에 얹는 Python job이다
  # (조사 02 §4 — 이전까지 없었음).
  ml-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-engine
    steps:
      - uses: actions/checkout@v5

      # `.python-version`(3.12, D-5A-1)을 읽어 버전을 고정한다 — 워크플로에 숫자를 적지
      # 않는다(`buf` 버전과 같은 이유, install buf 주석 참고). v6 부터 Node 24(`using: node24`
      # 실측, v5 는 node20) — 위 job 들과 같은 원칙(Node 24 를 만족하는 가장 낮은 major),
      # v5 는 아니다(verifier r1 F-5).
      - uses: actions/setup-python@v6
        with:
          python-version-file: ml-engine/.python-version

      # 재현성(D-5A-4) — 로컬 실측 버전과 같은 값으로 고정. uv 자체는 lock 대상이 아니라
      # (lock 파일이 검증하는 것은 Python 의존성 그래프뿐) 여기서 직접 핀한다. v7 부터 Node 24
      # (실측 — v6 이하는 node20), v6 는 아니다(verifier r1 F-5, 같은 원칙).
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.22"

      - name: install (S-1)
        run: uv sync --frozen --all-extras

      # extras 분리(D-5A-0 (b) ②) — serving 전용 설치에 SQLAlchemy·DB driver·requests·httpx·
      # celery 가 전혀 없음을 lock 그래프로 실측한 뒤 dev 를 복구한다(S-1b).
      - name: serving extras 분리 확인 (S-1b)
        run: |
          set -euo pipefail
          uv sync --frozen --extra serving --no-dev
          for m in sqlalchemy psycopg requests httpx celery; do
            if uv run --no-sync python -c "import $m" >/dev/null 2>&1; then
              echo "금지 패키지 $m 이 serving extras 에 설치됐다" >&2
              exit 1
            fi
          done
          uv sync --frozen --all-extras

      - name: ruff (S-2)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: mypy --strict (S-3)
        run: uv run mypy --strict src/ml_engine

      - name: import-linter (S-4)
        run: uv run lint-imports

      - name: pytest — 게이트 test 포함, test 수는 이 step 출력에 남는다 (S-5)
        run: uv run python -m pytest tests -q

      - name: 설계 래칫 — 함수 50/파일 500/dict[str,Any] 경계 0 (S-6)
        run: uv run python tools/design_ratchet.py --check

      # ADR 0009 D-6 — 이식 모듈 docstring 포인터와 reuse.md 두 자리 대조 + 양성 대조.
      - name: 재활용 출처 두 자리 대조 (S-7)
        run: |
          set -euo pipefail
          uv run python tools/reuse_provenance_check.py
          if uv run python tools/reuse_provenance_check.py --evidence tests/gates/fixtures/reuse-mismatch.md; then
            echo "양성 대조(어긋난 evidence)가 실패해야 하는데 통과했다" >&2
            exit 1
          fi

      - name: Python 버전 두 자리 대조 (S-9)
        run: |
          uv run python -c "import tomllib,pathlib; p=tomllib.load(open('pyproject.toml','rb')); v=pathlib.Path('.python-version').read_text().strip(); assert v.startswith('3.12') and '3.12' in p['project']['requires-python'], (v, p['project']['requires-python'])"

      # M5/5E-1 D-5E-8 — `OPEN-5A-WHEEL-BUILD-HOOK` 종결 증거. wheel 을 만들어 설치본에서
      # `ml_engine.contracts` 재수출 + servicer import 가 `sys.path` 조작 없이 성립하는지
      # 확인한다(test 자체가 저장소 밖 임시 venv 를 만들어 검증한다, 설계 검토 우회 (21)).
      - name: wheel 빌드 + 설치본 재수출 확인 (S-11)
        run: |
          uv build --wheel -o /tmp/ml-engine-wheel
          uv run python -m pytest tests/gates/test_wheel_reexport.py -q

  # M6/6C — 이미지 빌드·위생 게이트·실 서버 통합 test(D-6C-4). `check`·`ml-engine` 두
  # job 의 명령은 위에서 무편집이다 — 이 job이 컨테이너 축 전부를 진다(하네스 2026-09-12
  # 「줄일 수 있는 단위는 게이트가 아니라 job」). 소스 겹침은 `docker/`·`tools/*.sh`·이
  # job 전용 test 하나뿐 — 위 두 job과 독립.
  container:
    runs-on: ubuntu-latest
    env:
      # compose 의 postgres 서비스 전용 — 이 job 안에서만 뜨는 일회성 컨테이너의
      # 자격증명이다(6B 스키마도 얹기 전, 저장 데이터 없음). scope.md (2b) 「경계로
      # 처리」— compose.yaml 파일 자체에는 이 값이 없고 `${VAR:?...}` 참조만 있다
      # (D-6C-7과 같은 규율, 리터럴 0을 게이트로 실측). 사용자·DB 이름은 식별자일 뿐이라
      # 여기 둔다 — 값은 다음 step 이 실행 시점에 만들어 `$GITHUB_ENV` 에 채운다(F-4,
      # D-6C-9 — 파일에 리터럴 값을 남기지 않는다).
      BIDVECTOR_PG_USER: bidvector_ci
      BIDVECTOR_PG_DB: bidvector_ci
      # M6/6A-2a D-6A2a-5·8 — compose 의 `app` 서비스는 값을 하나도 갖지 않고 전부 `${VAR:?}`
      # 참조다. 자격이 아닌 값(포트·후보 상한·compose 네트워크 안의 DB 주소)만 여기 둔다 —
      # 자격 값은 다음 두 step 이 실행 시점에 만들어 `$GITHUB_ENV` 에 채운다(D-6C-9, 저장소
      # 파일에 리터럴을 남기지 않는다). API 포트는 루프백에만 publish 되고 관리 포트는 publish
      # 되지 않으므로, 관리 포트 검사는 컨테이너 안에서 묻는다(아래 스모크).
      BIDVECTOR_APP_PORT: 18080
      BIDVECTOR_APP_MANAGEMENT_PORT: 18081
      BIDVECTOR_APP_JDBC_URL: jdbc:postgresql://postgres:5432/bidvector_ci
      BIDVECTOR_APP_CANDIDATE_CAP: 1000
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: DB 접속 값 생성(이 job 전용 일회성, 파일에 리터럴로 두지 않는다)
        run: echo "BIDVECTOR_PG_PASSWORD=$(openssl rand -hex 20)" >> "$GITHUB_ENV"

      # M6/6A-2a — 운영자 자격 값도 같은 형태로 이 job 안에서 만든다(D-6C-9 선례). 저장소
      # 파일에는 리터럴이 없다. 이 값은 두 곳에 닿아야 한다: ① `app` 컨테이너 —
      # compose 의 `${...}` 참조가 job 환경에서 읽으므로 argv 를 지나지 않는다 ② 스모크의
      # `curl` — **`-H "…$VALUE"` 를 쓰지 않는다.** 그 형태는 값을 curl 의 argv 에 실어 같은
      # 러너의 다른 프로세스가 `/proc/<pid>/cmdline` 으로 읽을 수 있다(2026-09-26 실측: `-H`
      # 형태는 프로세스 표에서 26회 관측, `printf | curl --config -` 형태는 0회 — `printf` 는
      # 셸 내장이라 별 프로세스를 만들지 않고 값은 파이프로만 흐른다).
      - name: 운영자 자격 값 생성(이 job 전용 일회성, 파일에 리터럴로 두지 않는다)
        run: echo "BIDVECTOR_APP_OPERATOR_CREDENTIAL=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      # R2-2(D-6C-10 ④) — S-20 은 `check` job 으로 옮겼다(그 전제인 buf·전체 이력을
      # 이미 갖춘 자리, 위 참고). 이 job 은 컨테이너 축(S-21~S-25)만 진다 — python/uv
      # 툴체인도 여기서는 필요 없어졌다(R2-8 중복 비용도 함께 준다).
      - name: 이미지 빌드 (S-21)
        run: docker build -f docker/ml-serving.Dockerfile -t bidvector/ml-serving:local .

      # M6/6A-2a D-6A2a-2 — 이미지는 **밖에서 만든 `bootJar`** 를 담는다(이미지 안에서 Gradle 을
      # 돌리지 않는다). 이 step 이 없으면 다음 step 의 `COPY` 가 그 경로를 이름으로 대며 실패한다.
      - name: 앱 배포물 빌드 (S-21a)
        run: ./gradlew --no-daemon :app:bootJar

      - name: 앱 이미지 빌드 (S-21b)
        run: docker build -f docker/app.Dockerfile -t bidvector/app:local .

      # M6/6A-2a D-6A2a-7 — 정책 파일을 **인자로** 받는다(기본값 없음 — 어느 정책으로 판정했는지가
      # 명령에 보인다). 두 이미지의 「금지」 판정이 서로 다르다: ml-serving 은 Python `import`,
      # 앱은 JVM 구조(컴파일 도구 실행 불가 + 풀린 의존 layer 의 test 전용 좌표 0).
      - name: 이미지 위생 게이트 — ml-serving (S-22a)
        run: ./tools/image-hygiene-check.sh bidvector/ml-serving:local config/quality/image-hygiene-policy.properties

      - name: 이미지 위생 게이트 — 앱 (S-22b)
        run: ./tools/image-hygiene-check.sh bidvector/app:local config/quality/image-hygiene-policy-app.properties

      - name: 로컬 환경 기동 — app+ml-serving+postgres 가 healthy 로 수렴 (S-23)
        run: |
          docker compose -f docker/compose.yaml up -d
          for i in $(seq 1 30); do
            ps_out="$(docker compose -f docker/compose.yaml ps --format '{{.Service}}: {{.Status}}')"
            echo "$ps_out"
            if echo "$ps_out" | grep -q "app:.*healthy" \
              && echo "$ps_out" | grep -q "ml-serving:.*healthy" \
              && echo "$ps_out" | grep -q "postgres:.*healthy"; then
              exit 0
            fi
            sleep 3
          done
          echo "app/ml-serving/postgres 가 제한 시간 안에 healthy 로 수렴하지 않았다" >&2
          docker compose -f docker/compose.yaml logs
          exit 1

      # M6/6A-2a D-6A2a-8 — 「이미지가 뜬다」가 아니라 **「뜬 이미지가 인증 경계를 지키며 준비
      # 상태를 알린다」** 를 잰다. 관리 포트는 host 에 publish 되지 않으므로 컨테이너 안에서
      # 묻고, API 포트는 루프백에서 묻는다. 자격 값은 argv 를 지나지 않는다(위 생성 step 주석).
      - name: 컨테이너 스모크 — 준비 상태·인증 경계·health 격리·수집 꺼짐 (S-23b)
        run: |
          set -euo pipefail
          COMPOSE="docker compose -f docker/compose.yaml"
          API="http://127.0.0.1:${BIDVECTOR_APP_PORT}"
          MGMT="http://127.0.0.1:${BIDVECTOR_APP_MANAGEMENT_PORT}"
          fail() { echo "스모크 실패: $1" >&2; $COMPOSE logs app >&2 || true; exit 1; }
          # R2-8 계열 — 도구 부재를 스모크 실패로 오인하지 않는다(`ubuntu-latest` 선탑재지만
          # 워크플로가 설치를 선언하지 않는다). 위생 게이트도 같은 자리에서 같은 이유로 끊는다.
          command -v jq >/dev/null 2>&1 || { echo "jq 가 필요하다 — 본문 키 집합 판정에 쓴다" >&2; exit 2; }
          _mgmt() { $COMPOSE exec -T app curl -sS -w '\n%{http_code}' "$MGMT$1"; }
          _api_authorized_code() {
            printf 'header = "X-Operator-Credential: %s"\n' "$BIDVECTOR_APP_OPERATOR_CREDENTIAL" \
              | curl --config - -sS -o /dev/null -w '%{http_code}' "$API$1"
          }

          echo "-- 관리 포트 프로브 둘: 200 · 본문 키 하나(status) --"
          for path in /actuator/health/liveness /actuator/health/readiness; do
            out="$(_mgmt "$path")"
            code="$(printf '%s' "$out" | tail -n1)"
            body="$(printf '%s' "$out" | sed '$d')"
            [ "$code" = "200" ] || fail "$path 가 200 이 아니다: $code"
            keys="$(printf '%s' "$body" | jq -r 'keys | join(",")')"
            [ "$keys" = "status" ] || fail "$path 본문 키가 status 하나가 아니다: [$keys]"
            [ "$(printf '%s' "$body" | jq -r '.status')" = "UP" ] || fail "$path 가 UP 이 아니다"
          done

          echo "-- API 포트 무인증 401 · 인증 GET /api/strategy 200 --"
          code="$(curl -sS -o /dev/null -w '%{http_code}' "$API/api/strategy")"
          [ "$code" = "401" ] || fail "무인증 /api/strategy 가 401 이 아니다: $code"
          code="$(_api_authorized_code /api/strategy)"
          [ "$code" = "200" ] || fail "인증 /api/strategy 가 200 이 아니다: $code"

          echo "-- API 포트의 actuator: 401 또는 404(200 이면 실패) --"
          for path in /actuator /actuator/health /actuator/health/readiness /actuator/env; do
            anon="$(curl -sS -o /dev/null -w '%{http_code}' "$API$path")"
            auth="$(_api_authorized_code "$path")"
            case "$anon" in 401|404) ;; *) fail "무인증 $path 가 401·404 가 아니다: $anon" ;; esac
            case "$auth" in 401|404) ;; *) fail "인증 $path 가 401·404 가 아니다: $auth — actuator 가 API 포트에 있다" ;; esac
          done

          echo "-- 관리 포트의 health 외 경로 404 --"
          for path in /actuator /actuator/env /actuator/configprops /actuator/beans \
            /actuator/heapdump /actuator/shutdown /actuator/loggers /actuator/metrics \
            /actuator/threaddump /actuator/mappings /actuator/info; do
            code="$(printf '%s' "$(_mgmt "$path")" | tail -n1)"
            [ "$code" = "404" ] || fail "관리 포트 $path 가 404 가 아니다: $code"
          done

          echo "-- 앱 로그에 수집 시작 줄 0 (우회 6) --"
          if $COMPOSE logs app 2>&1 | grep -q 'collection start'; then
            fail "앱 로그에 수집 시작 줄이 있다 — compose 기동이 수집을 켰다"
          fi

          echo "== 스모크 통과 =="

      - name: 실 Kotlin gateway ↔ 컨테이너의 실 Python 서버 (S-24, OPEN-5E2-CROSSLANG-REAL-SERVER)
        # `RealServerIntegrationTest`는 Testcontainers 로 (S-21) 이미지의 **자기 전용**
        # 컨테이너를 새로 띄운다(위 compose 환경과 별개 — 두 검증이 서로를 대신하지
        # 않는다: compose 는 로컬 환경 기동 자체를, 이 test 는 실 Kotlin 소비자 규칙을 잰다).
        run: ./gradlew --no-daemon :adapters:test --tests '*RealServerIntegrationTest*' -PrealServer=true

      - name: 로컬 환경 정리 — 볼륨까지 (S-25)
        if: always()
        run: docker compose -f docker/compose.yaml down -v
