name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # 액션 넷의 major 는 **Node 24 진입점에서 멈춰 있다**(2026-09-09) — 상위 major 가
      # 있어도 올리지 않는다. 여기서 올리는 유일한 사유가 Node 20 지원 종료이고,
      # 그 밖의 major 는 각자 별도 사유로 판단할 일이다.
      #
      # `fetch-depth: 0` 은 `contractGate` 가 요구한다 — `buf breaking` 이
      # `.git#tag=<승인 태그>,subdir=contracts` 를 대조 대상으로 쓰므로 **전체 이력과 태그**가
      # 있어야 한다. 기본값(얕은 clone, 태그 없음)이면 그 검사가 대상을 찾지 못한다.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 러너의 launcher JVM. 컴파일에 쓰이는 toolchain 은 gradle.properties 의
      # `bidvector.jvmToolchain` 이 정하고, 없으면 foojay resolver 가 내려받는다.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # `contractGate`(bidvector.quality-baseline)가 `buf` 를 실행 파일로 부른다 —
      # lint · breaking · 버전 대조 셋. 러너에 없으면 `check` 가
      # `IOException: Cannot run program "buf"` 로 떨어진다(2026-09-06 이후 CI 상시 실패의 원인).
      #
      # `bufbuild/buf-setup-action` 을 쓰지 않는다 — **2025-08 아카이브**라 Node 20 에 묶인 채
      # 갱신되지 않는다. 대신 릴리스 바이너리를 직접 받는다. **버전은 정책 파일이 정한다** —
      # 워크플로에 숫자를 적으면 `tool.buf.version` 과 조용히 어긋날 자리가 하나 더 생긴다.
      - name: install buf
        run: |
          set -euo pipefail
          version="$(sed -n 's/^tool\.buf\.version=//p' config/quality/contract-policy.properties)"
          if [ -z "$version" ]; then
            echo "config/quality/contract-policy.properties 에서 tool.buf.version 을 읽지 못했다" >&2
            exit 1
          fi
          base="https://github.com/bufbuild/buf/releases/download/v${version}"
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/buf" "$base/buf-Linux-x86_64"
          curl -fsSL -o "$tmp/sha256.txt" "$base/sha256.txt"
          # 대상 자산의 행이 없으면 `pipefail` 로 여기서 떨어진다 — 조용한 미검증을 막는다.
          ( cd "$tmp" && grep ' buf-Linux-x86_64$' sha256.txt | sed 's/buf-Linux-x86_64$/buf/' | sha256sum -c - )
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$tmp/buf" "$RUNNER_TEMP/bin/buf"
          rm -rf "$tmp"
          # PATH 등재는 다음 step 부터 듣는다 — 이 step 의 스모크는 절대 경로로 건다.
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/buf" --version

      # v6 은 **캐싱을 `gradle-actions-caching` 상용 컴포넌트로 분리**해 Gradle 이용약관 동의를
      # 요구한다(MIT 아님). Node 24 는 v5 에서 이미 충족되므로 라이선스 변경을 딸려 들이지 않는다.
      - uses: gradle/actions/setup-gradle@v5

      # check 가 게이트 전부를 든다 — 컴파일 · ktlint · detekt · sizeGate ·
      # domainDependencyGate · architecture test · compatibilitySmoke.
      - run: ./gradlew --no-daemon check

      # OPEN-ADR-06 의 입력. 게이트가 아니라 측정이라 실패시키지 않는다.
      - run: ./gradlew --no-daemon qualityBaseline

      # R2-2(D-6C-10 ④, verifier r2 HIGH) — one-command-check.sh(완료 조건 1)를 CI 에서
      # 직접 잰다. `container` job(그 전제가 없다 — buf 미설치·얕은 checkout)이 아니라
      # **이 job**에 둔다: 이 스크립트의 첫 명령이 `./gradlew --no-daemon check`이고 그
      # 안의 `contractGate`가 `buf`와 전체 이력·태그를 요구하는데, 그 둘을 이미 갖춘 job이
      # 여기뿐이다(verifier r2 실측 — 다른 job 에 그대로 두면 S-20 이 반드시 실패하고,
      # step 순서상 뒤따르는 6C 게이트 축 전체가 CI 에서 한 번도 실행되지 않았다).
      - uses: actions/setup-python@v6
        with:
          python-version-file: ml-engine/.python-version

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.22"

      # M7/7A(code-review r1 F-3) — S-20 이 이제 web 레인 전건(`npm ci` → … → Playwright
      # 스모크)까지 돈다. 그 job 에 Node 툴체인이 없으면 러너 이미지의 Node 로 돌아 **같은
      # 게이트를 두 다른 툴체인에서 재는** 상태가 되고(ADR 0011 D-1 「Node 는 web/.nvmrc 가
      # 정본」이 이 job 에서만 성립하지 않는다), 이미지 Node 가 바뀌는 날 이 변경과 무관한
      # 이유로 붉어진다. 선례가 같은 파일에 있다 — S-20 이 Python 전건을 품게 된 라운드에
      # setup-python·setup-uv 를 바로 위에 더했다.
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # CI 전용 — 브라우저의 시스템 패키지(apt). `web` job 과 같은 사유이고, S-20 이 그 job 과
      # 같은 Playwright 스모크를 돌리므로 같은 전제가 필요하다. 「필요 없다」고 적는 대신
      # 명시한다(러너 이미지에 무엇이 들어 있는지는 이 저장소가 통제하지 않는다).
      # 한 step 에 둘을 묶지 않는다(PR #75 리뷰 H) — 원인 하나에 빨강 하나다. 앞은 레지스트리
      # 의존, 뒤는 apt 의존이고 실패 사유가 다르다.
      #
      # `npm ci` 를 여기서 한 번 돌리는 이유는 **잠금 파일이 고정한 Playwright** 로 시스템 의존을
      # 설치하기 위해서다(워크플로에 버전 숫자를 적지 않는다 — `buf`·`.python-version` 과 같은
      # 원칙). S-20 이 같은 명령을 다시 돌리고, `npm ci` 는 **`node_modules` 를 지우고 다시
      # 설치한다** — 두 번째가 빠른 것은 설치본이 남아서가 아니라 **npm 캐시와 setup-node 캐시**
      # 때문이다(PR #75 리뷰 E 문면 정정).
      - name: web 설치 — 잠금 파일 고정판 (CI 전용, S-20 의 web 절 전제)
        working-directory: web
        run: npm ci

      - name: Playwright 시스템 의존 설치 (CI 전용, S-20 의 web 절 전제)
        working-directory: web
        run: npx playwright install-deps chromium

      - name: one-command-check.sh — 완료 조건 1 (S-20)
        run: ./tools/one-command-check.sh

      # v5 는 Node 24 를 예비 지원만 하고 기본은 여전히 Node 20 이라 v6 이 최소선이다.
      # M7/7A(PR #75 리뷰 G) — S-20 이 web 스모크까지 돌리므로 그 trace 도 **이 step 에 얹는다**
      # (새 step 을 만들지 않는다). `web` job 과 조건이 다른 이유를 적는다: 거기서는 업로드 조건이
      # **스모크 step 하나**라 「파일 0 건」이 곧 신호이고(`if-no-files-found: error`), 여기서는
      # 깨진 step 이 Kotlin·Python 일 수도 있어 **0 건이 정상**이다 — 그래서 기본 동작(경고)을 쓴다.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: reports
          path: |
            build/reports/quality-baseline/
            */build/reports/
            web/test-results/
          retention-days: 14

  # M5/5A — Python ML engine CI(2D D-2D-4 (a) · ADR 0009 D-6 「CI 가 확인한다」). Kotlin `check`
  # job 과 독립(소스 겹침 0, 위 job 은 무편집). `ml-engine/` 이 최초로 CI 에 얹는 Python job이다
  # (조사 02 §4 — 이전까지 없었음).
  ml-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-engine
    steps:
      - uses: actions/checkout@v5

      # `.python-version`(3.12, D-5A-1)을 읽어 버전을 고정한다 — 워크플로에 숫자를 적지
      # 않는다(`buf` 버전과 같은 이유, install buf 주석 참고). v6 부터 Node 24(`using: node24`
      # 실측, v5 는 node20) — 위 job 들과 같은 원칙(Node 24 를 만족하는 가장 낮은 major),
      # v5 는 아니다(verifier r1 F-5).
      - uses: actions/setup-python@v6
        with:
          python-version-file: ml-engine/.python-version

      # 재현성(D-5A-4) — 로컬 실측 버전과 같은 값으로 고정. uv 자체는 lock 대상이 아니라
      # (lock 파일이 검증하는 것은 Python 의존성 그래프뿐) 여기서 직접 핀한다. v7 부터 Node 24
      # (실측 — v6 이하는 node20), v6 는 아니다(verifier r1 F-5, 같은 원칙).
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.22"

      - name: install (S-1)
        run: uv sync --frozen --all-extras

      # extras 분리(D-5A-0 (b) ②) — serving 전용 설치에 SQLAlchemy·DB driver·requests·httpx·
      # celery 가 전혀 없음을 lock 그래프로 실측한 뒤 dev 를 복구한다(S-1b).
      - name: serving extras 분리 확인 (S-1b)
        run: |
          set -euo pipefail
          uv sync --frozen --extra serving --no-dev
          for m in sqlalchemy psycopg requests httpx celery; do
            if uv run --no-sync python -c "import $m" >/dev/null 2>&1; then
              echo "금지 패키지 $m 이 serving extras 에 설치됐다" >&2
              exit 1
            fi
          done
          uv sync --frozen --all-extras

      - name: ruff (S-2)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: mypy --strict (S-3)
        run: uv run mypy --strict src/ml_engine

      - name: import-linter (S-4)
        run: uv run lint-imports

      - name: pytest — 게이트 test 포함, test 수는 이 step 출력에 남는다 (S-5)
        run: uv run python -m pytest tests -q

      - name: 설계 래칫 — 함수 50/파일 500/dict[str,Any] 경계 0 (S-6)
        run: uv run python tools/design_ratchet.py --check

      # ADR 0009 D-6 — 이식 모듈 docstring 포인터와 reuse.md 두 자리 대조 + 양성 대조.
      - name: 재활용 출처 두 자리 대조 (S-7)
        run: |
          set -euo pipefail
          uv run python tools/reuse_provenance_check.py
          if uv run python tools/reuse_provenance_check.py --evidence tests/gates/fixtures/reuse-mismatch.md; then
            echo "양성 대조(어긋난 evidence)가 실패해야 하는데 통과했다" >&2
            exit 1
          fi

      - name: Python 버전 두 자리 대조 (S-9)
        run: |
          uv run python -c "import tomllib,pathlib; p=tomllib.load(open('pyproject.toml','rb')); v=pathlib.Path('.python-version').read_text().strip(); assert v.startswith('3.12') and '3.12' in p['project']['requires-python'], (v, p['project']['requires-python'])"

      # M5/5E-1 D-5E-8 — `OPEN-5A-WHEEL-BUILD-HOOK` 종결 증거. wheel 을 만들어 설치본에서
      # `ml_engine.contracts` 재수출 + servicer import 가 `sys.path` 조작 없이 성립하는지
      # 확인한다(test 자체가 저장소 밖 임시 venv 를 만들어 검증한다, 설계 검토 우회 (21)).
      - name: wheel 빌드 + 설치본 재수출 확인 (S-11)
        run: |
          uv build --wheel -o /tmp/ml-engine-wheel
          uv run python -m pytest tests/gates/test_wheel_reexport.py -q

  # M7/7A — `web/` 골격의 게이트(ADR 0011 D-5). 별도 job 하나로 둔다(하네스 2026-09-12 「줄일 수
  # 있는 단위는 게이트가 아니라 job」). **사실 관계를 정확히 적는다**(PR #75 리뷰 D): `ml-engine`·
  # `container` job 은 이 slice 에서 무편집이지만 `check` job 은 **편집했다** — S-20 이 web 레인
  # 전건을 품게 되어 그 job 에 Node 툴체인과 Playwright 시스템 의존 step 을 더했다. 소스 겹침도
  # 0 이 아니다: `web/**` 는 Gradle 모듈도 Python 패키지도 아니지만, `check` job 이 S-20 을 통해
  # **같은 web 명령을 다시 돌린다**(그 이중 실행 비용은 checklist 의 알려진 제한에 등재).
  #
  # 단계 ID 는 `W-n` 이다. M6 완료 조건의 `S-n` 등록부에 새 번호를 끼우지 않는다 — 그 번호는
  # M6 문서가 조건별로 가리키는 좌표라, 뒤에서 늘리면 그 참조가 가리키는 집합이 조용히 바뀐다.
  #
  # build 가 test 뒤인 것은 Playwright 스모크가 **빌드 산출물**을 `vite preview` 로 띄우기
  # 때문이다(dev server 가 아니다 — 그래야 번들이 실제로 뜨는지를 잰다).
  web:
    runs-on: ubuntu-latest
    # M7/7A(PR #75 리뷰 J) — `container` job 과 같은 사유로 상한을 둔다. 이 job 의 네트워크 의존은
    # 넷이다(npm 레지스트리 · Playwright 브라우저 CDN · apt · **postgres 이미지**). 하나가 멈추면
    # 기본 6시간까지 러너를 쥔다. 실측 소요는 분 단위라 넉넉히 잡는다.
    #
    # M7/7E-1(D-7E-10) — 여정 e2e 가 들어와 `container` job 과 같은 상한(30)으로 올린다. 실측:
    # 기존 job 42s · `:app:bootJar` 21s(main, Gradle 캐시) ~ 59s(기능 브랜치) · 하네스+여정 33s.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      # `web/.nvmrc`(ADR 0011 D-1 — Node 의 정본)를 읽어 버전을 고정한다. 워크플로에 숫자를
      # 적지 않는다(`buf`·`.python-version` 과 같은 이유). v5 부터 Node 24(`using: node24`
      # 실측, v4 는 node20) — 위 job 들과 같은 원칙(Node 24 를 만족하는 가장 낮은 major).
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` 는 잠금 파일 밖 해석을 하지 않는다 — 잠금 파일과 `package.json` 이 어긋나면
      # 설치 자체가 실패한다(D-1 「CI 는 npm ci」).
      - name: install (W-1)
        run: npm ci

      - name: eslint (W-2)
        run: npm run lint

      # 어댑터 금지 게이트 1차 층(D-3) — rootDir 밖 파일이 프로그램에 들어오면 TS6059.
      - name: typecheck (W-3)
        run: npm run typecheck

      # 그 1차 층의 **전제**를 잰다 — 실측에서 `src` 안 심볼릭 링크는 TS6059 를 내지 않았고
      # (U-3), rootDir·include·allowJs·paths 가 바뀌면 TS6059 가 날 자리 자체가 사라지는데
      # typecheck 는 그것을 보지 못한다. tsconfig 의 유효 옵션과 src 트리를 직접 단언한다.
      - name: 컴파일 경계 전제 — src 트리·tsconfig (W-4)
        run: npm run gate:src-tree

      # 어댑터 금지 게이트 2차 층(D-2) — 생성 타입과 OpenAPI 문서의 바이트 등식.
      - name: OpenAPI 생성 타입 바이트 등식 (W-5)
        run: npm run api:types:check

      - name: vitest (W-6)
        run: npm run test

      # **게이트 test 가 실제로 돌았는가**(verifier r6 M-12). 앞선 판은 `vite.config.ts` 의
      # `include` 리터럴을 AST 로 찾는 문자열 단언이었는데, `test.exclude` 한 줄 · 미끼 속성 ·
      # `describe.skip` · `package.json` 의 CLI 경로 필터가 모두 그것을 지나면서 게이트 test 를
      # 수집에서 뺐다(실측). 이 step 은 **W-6 와 같은 명령**(`npm run test`)에 JSON reporter 를
      # 붙여 돌려 등록부(`web/config/gate-tests.txt`)의 파일이 passed ≥ 1 · skipped/todo 0 ·
      # failed 0 인지 본다 — 선례는 `config/quality/gate-tests.properties` 다.
      - name: 게이트 test 실행 확인 (W-7)
        run: npm run gate:tests

      - name: build (W-8)
        run: npm run build

      # **경계가 활성인지 직접 잰다**(verifier r2 M-3 · code-review r2 G-1). W-4 의 등재 단언은
      # 설정의 문법을 보는 선행 검사이고, 플러그인을 비활성으로 만드는 형태는 끝없다(조건식 ·
      # spread 로 덮어쓰기 · 같은 키 중복 · `apply: 'serve'` · 객체 spread 로 `buildEnd` 덮어쓰기 ·
      # 참조만 하고 호출 안 함). 카나리는 **실제 `vite.config.ts` 로 빌드를 돌려** 경계 오류로
      # 실패해야 통과한다 — 메인 그래프와 워커 그래프 둘 다.
      - name: 번들 경계 카나리 — 활성 측정 (W-9)
        run: npm run gate:boundary-canary

      # CI 전용 — 브라우저가 쓰는 **시스템 패키지** 설치(apt). 로컬 one-command 는 이 step 을
      # 빼고 바로 아래 브라우저 설치부터 돈다(그 스크립트의 머리 주석 「CI 전용 step(체크아웃·
      # 툴체인 설치·아티팩트 업로드)만 뺀다」). 브라우저 설치와 **두 명령으로 나눈 이유**가
      # 이것이다 — 한 명령(`install --with-deps`)이면 로컬이 같은 명령을 쓸 수 없어 축약·새
      # 플래그가 생긴다.
      - name: Playwright 시스템 의존 설치 (CI 전용)
        run: npx playwright install-deps chromium

      - name: Playwright chromium 설치 (W-10)
        run: npx playwright install chromium

      - name: Playwright 스모크 (W-11)
        id: web-smoke
        run: npm run test:e2e

      # **아래 업로드는 셸 스모크(W-11)의 산출물이다.** code-review r1 F-7 — CI reporter 는
      # `list` 하나라, **CI 에서만** 깨지는 스모크는 로그 한 줄만 남기고 trace·스크린샷을
      # 버렸다. 위 두 job 과 같은 major 다.
      #
      # **이 블록은 그 업로드 바로 위에 있어야 한다**(M7/7E-1 r2 CR L-2) — r1 에서 문면으로만
      # 자리를 적었더니 블록이 여정 step 뒤에 남아 바로 아래가 **여정 업로드**가 됐고, 첫 줄이
      # 틀린 말이 됐다. 설명은 설명하는 step 옆에 둔다.
      #
      # `if-no-files-found: error` 를 **유지하는** 사유(M7/7E-1 r3 CR L-7 — 자리를 옮기며 이
      # 단락이 지워졌고 조건식만 남아 근거 없는 꼴이 됐다): 이 업로드는 **스모크가 실패했을
      # 때만** 돈다. 그때 산출물이 0 건이면 그 자체가 신호다 — 빈 artifact 를 올리고 초록인
      # 것은 보관하지 않은 것과 같다(PR #75 리뷰 G · 같은 파일 선례 PR #68 M-4).

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() && steps.web-smoke.outcome == 'failure' }}
        with:
          name: web-playwright
          path: web/test-results/
          retention-days: 14
          if-no-files-found: error

      # ── 여정 e2e(M7/7E-1, D-7E-1·10) ───────────────────────────────────────
      # 여기서 **출하 jar 를 짓는다**. `needs: check` + 산출물 전달을 기각한 이유: `check` 는
      # 실측 12m44s 이고 그것을 기다리면 web 단독 실패도 13분 뒤에 드러난다 — 지금 이 job 은
      # 독립이고 CI 임계경로는 `check` 가 쥐고 있으므로, 같은 job 에서 짓는 쪽이 총 wall clock
      # 을 늘리지 않는다(중복 컴파일 비용은 실측 21~59s).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Gradle 캐시 복원 — 이것이 bootJar 를 21s 로 만든다(`container` job 실측).
      - uses: gradle/actions/setup-gradle@v5

      - name: 앱 배포물 빌드 — 여정 e2e 의 입력 (W-12)
        working-directory: ${{ github.workspace }}
        run: ./gradlew --no-daemon :app:bootJar

      # 출하 app.jar + 버릴 Postgres(compose 와 같은 digest) + loopback fake KONEPS 위에서
      # 여정 ②③ 을 민다. API 목이 0 이고 공고는 수집 경로로 들어온다(완료 조건 「V2 API 만」).
      # 하네스가 컨테이너·자식 프로세스를 거둔다(`gracefulShutdown`).
      - name: 여정 e2e — 수집 → 저장 → API → 화면 (W-13)
        id: web-journey
        run: npm run test:e2e:journey

      # 여정 trace 는 **따로 올린다** — 스모크와 같은 이름에 얹으면 어느 층이 깨졌는지 이름이
      # 말하지 못한다. 같은 관례(실패 때만 · 0 건이면 신호)를 쓴다. 실행 맥락 파일(로그인 이름·
      # 비밀 문구)은 **이 경로 밖**이라 올라가지 않는다(D-7E-6).
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() && steps.web-journey.outcome == 'failure' }}
        with:
          name: web-journey-playwright
          path: web/test-results/
          retention-days: 14
          if-no-files-found: error

  # M6/6C — 이미지 빌드·위생 게이트·실 서버 통합 test(D-6C-4). `check`·`ml-engine` 두
  # job 의 명령은 위에서 무편집이다 — 이 job이 컨테이너 축 전부를 진다(하네스 2026-09-12
  # 「줄일 수 있는 단위는 게이트가 아니라 job」). 소스 겹침은 `docker/`·`tools/*.sh`·이
  # job 전용 test 하나뿐 — 위 두 job과 독립.
  container:
    runs-on: ubuntu-latest
    # M6/6E-2b r1(code-review L-9) — 이 job 의 네트워크 의존이 셋 늘었다(릴리스 자산 · 취약점 DB ·
    # Java DB). 셋 중 하나가 멈추면 기본 6시간까지 러너를 쥔다. 실측 소요는 10분대이므로 넉넉히
    # 둘로 잡는다. chore 2026-10-29 — 넷째 의존이 생겼다: web·proxy 빌드가 caddy 를 컴파일하며
    # proxy.golang.org·sum.golang.org 에서 모듈을 받는다(첫 실행 실측: 그 빌드 step 약 72초, job 전체
    # 3분 34초 — main 의 같은 날 3분 38초와 같은 대역이라 상한은 그대로다). 나머지 두 job 은 이 slice 의 범위 밖이라 그대로다(알려진 제한에 등재).
    timeout-minutes: 30
    env:
      # compose 의 postgres 서비스 전용 — 이 job 안에서만 뜨는 일회성 컨테이너의
      # 자격증명이다(6B 스키마도 얹기 전, 저장 데이터 없음). scope.md (2b) 「경계로
      # 처리」— compose.yaml 파일 자체에는 이 값이 없고 `${VAR:?...}` 참조만 있다
      # (D-6C-7과 같은 규율, 리터럴 0을 게이트로 실측). 사용자·DB 이름은 식별자일 뿐이라
      # 여기 둔다 — 값은 다음 step 이 실행 시점에 만들어 `$GITHUB_ENV` 에 채운다(F-4,
      # D-6C-9 — 파일에 리터럴 값을 남기지 않는다).
      BIDVECTOR_PG_USER: bidvector_ci
      BIDVECTOR_PG_DB: bidvector_ci
      # M6/6A-2a D-6A2a-5·8 — compose 의 `app` 서비스는 값을 하나도 갖지 않고 전부 `${VAR:?}`
      # 참조다. 자격이 아닌 값(포트·후보 상한·compose 네트워크 안의 DB 주소)만 여기 둔다 —
      # 자격 값은 다음 두 step 이 실행 시점에 만들어 `$GITHUB_ENV` 에 채운다(D-6C-9, 저장소
      # 파일에 리터럴을 남기지 않는다). API 포트는 루프백에만 publish 되고 관리 포트는 publish
      # 되지 않으므로, 관리 포트 검사는 컨테이너 안에서 묻는다(아래 스모크).
      BIDVECTOR_APP_PORT: 18080
      BIDVECTOR_APP_MANAGEMENT_PORT: 18081
      BIDVECTOR_APP_JDBC_URL: jdbc:postgresql://postgres:5432/bidvector_ci
      BIDVECTOR_APP_CANDIDATE_CAP: 1000
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      # M7/7F-local(검토 r2 R2-H1) — **이 워크플로 자신의 `if:` 가 없는 step id 를 가리키는지**
      # 먼저 잰다. r1 이 빌드 step 둘을 하나로 합치면서 취약점 게이트 둘의 조건이 옛 id 를 그대로
      # 가리켰고, 없는 step 의 `outcome` 은 null 이라 두 게이트가 **매 실행 조용히 skipped** 였다
      # (실패가 아니라 부재라 job 은 초록이었다). 가장 앞에 두어 비싼 step 앞에서 끊는다.
      - name: 워크플로 step 참조 검사 — 매달린 steps.<id> 0 (S-20z)
        id: workflow_step_refs
        run: ./tools/workflow-step-refs-check.sh .github/workflows/ci.yml

      # M6/6A-2a r1(code-review LOW) — `::add-mask::` 를 먼저 붙인다. argv 축은 아래 주석대로
      # 닫혀 있지만, 더 실질적인 축은 **공개 워크플로 로그**다: 스모크의 `fail()` 이 앱 로그를
      # 찍고 Boot 의 바인딩 실패 보고는 속성 값을 문면에 낼 수 있다. 마스크는 그 경로를 값이
      # 어디서 새든 덮는다.
      - name: DB 접속 값 생성(이 job 전용 일회성, 파일에 리터럴로 두지 않는다)
        run: |
          value="$(openssl rand -hex 20)"
          echo "::add-mask::$value"
          echo "BIDVECTOR_PG_PASSWORD=$value" >> "$GITHUB_ENV"

      # M6/6A-2a — 운영자 자격 값도 같은 형태로 이 job 안에서 만든다(D-6C-9 선례). 저장소
      # 파일에는 리터럴이 없다. 이 값은 두 곳에 닿아야 한다: ① `app` 컨테이너 —
      # compose 의 `${...}` 참조가 job 환경에서 읽으므로 argv 를 지나지 않는다 ② 스모크의
      # `curl` — **`-H "…$VALUE"` 를 쓰지 않는다.** 그 형태는 값을 curl 의 argv 에 실어 같은
      # 러너의 다른 프로세스가 `/proc/<pid>/cmdline` 으로 읽을 수 있다(2026-09-26 실측: `-H`
      # 형태는 프로세스 표에서 26회 관측, `printf | curl --config -` 형태는 0회 — `printf` 는
      # 셸 내장이라 별 프로세스를 만들지 않고 값은 파이프로만 흐른다).
      - name: 운영자 자격 값 생성(이 job 전용 일회성, 파일에 리터럴로 두지 않는다)
        run: |
          value="$(openssl rand -hex 24)"
          echo "::add-mask::$value"
          echo "BIDVECTOR_APP_OPERATOR_CREDENTIAL=$value" >> "$GITHUB_ENV"

      # R2-2(D-6C-10 ④) — S-20 은 `check` job 으로 옮겼다(그 전제인 buf·전체 이력을
      # 이미 갖춘 자리, 위 참고). 이 job 은 컨테이너 축(S-21~S-25)만 진다 — python/uv
      # 툴체인도 여기서는 필요 없어졌다(R2-8 중복 비용도 함께 준다).
      - name: 이미지 빌드 (S-21)
        run: docker build -f docker/ml-serving.Dockerfile -t bidvector/ml-serving:local .

      # M6/6A-2a D-6A2a-2 — 이미지는 **밖에서 만든 `bootJar`** 를 담는다(이미지 안에서 Gradle 을
      # 돌리지 않는다). 이 step 이 없으면 다음 step 의 `COPY` 가 그 경로를 이름으로 대며 실패한다.
      - name: 앱 배포물 빌드 (S-21a)
        run: ./gradlew --no-daemon :app:bootJar

      - name: 앱 이미지 빌드 (S-21b)
        id: build_app
        run: docker build -f docker/app.Dockerfile -t bidvector/app:local .

      # M7/7F-local(D-7F-1, cr M-5 로 r1 에서 고침) — 로컬 패키징의 두 이미지. **여기서 먼저
      # 빌드하는 이유**는 아래 위생·취약점 게이트가 이미지를 요구하기 때문이다(S-26 의 스모크는
      # 그 뒤에 선다).
      #
      # 앞 판은 여기서 `docker build -f … -t bidvector/web:local .` 를 직접 돌렸다 — 태그·컨텍스트·
      # Dockerfile 을 ci.yml 에 **다시 적는 둘째 정의**였고, 주석은 「정의는 compose 한 자리」라고
      # 적었지만 코드는 그렇지 않았다. 이제 두 호출자(이 step 과 스모크)가 같은 진입점을 지나므로
      # 정의가 실제로 한 자리다. 스모크는 그 위에 **빌드 전후 이미지 ID 등식**을 단언한다 —
      # 재빌드가 캐시를 놓치면 게이트가 판정한 바이트와 실행하는 바이트가 갈리기 때문이다.
      #
      # 번들은 이미지 안에서 만들어지므로(`docker/web.Dockerfile` 의 builder stage) 이 job 에
      # setup-node 가 필요 없다.
      - name: web·프록시 이미지 빌드 (S-21c)
        id: build_web_proxy
        run: ./tools/local-tls-build.sh

      # M6/6A-2a D-6A2a-7 — 정책 파일을 **인자로** 받는다(기본값 없음 — 어느 정책으로 판정했는지가
      # 명령에 보인다). 두 이미지의 「금지」 판정이 서로 다르다: ml-serving 은 Python `import`,
      # 앱은 JVM 구조(컴파일 도구 실행 불가 + 풀린 의존 layer 의 test 전용 좌표 0).
      - name: 이미지 위생 게이트 — ml-serving (S-22a)
        id: hygiene_ml
        run: ./tools/image-hygiene-check.sh bidvector/ml-serving:local config/quality/image-hygiene-policy.properties

      - name: 이미지 위생 게이트 — 앱 (S-22b)
        id: hygiene_app
        run: ./tools/image-hygiene-check.sh bidvector/app:local config/quality/image-hygiene-policy-app.properties

      # M7/7F-local(D-7F-1) — 같은 스크립트·같은 공통 술어(태그·실 프로세스 uid·베이스 layer
      # 체인·크기)에 두 이미지를 더 태운다. 「금지」 판정만 갈라지고 그 갈래는 정책 파일의
      # `runtime.kind` 가 고른다 — 두 정책이 같은 갈래(`caddy-site`)를 쓰고 **값만** 다르다
      # (판정 형태가 같은 것을 두 벌로 만들지 않는다). 정책 파일을 **인자로** 받는 관례도
      # 그대로다 — 어느 정책으로 판정했는지가 명령에 보인다.
      - name: 이미지 위생 게이트 — web (S-22b2)
        id: hygiene_web
        run: ./tools/image-hygiene-check.sh bidvector/web:local config/quality/image-hygiene-policy-web.properties

      - name: 이미지 위생 게이트 — 프록시 (S-22b3)
        id: hygiene_proxy
        run: ./tools/image-hygiene-check.sh bidvector/proxy:local config/quality/image-hygiene-policy-proxy.properties

      # M6/6A-2a r2 D-6A2a-14 — verifier r2 F-1r 이 **출하 이미지에서** 쓴 환경변수 그대로를 컨테이너
      # 축에 고정한다. 그 한 줄이 r1 결함 셋을 전부 다시 열었으므로, 「뜬 이미지가 그것을 거부한다」를
      # test 가 아니라 이미지에서 잰다. DB·compose 없이 `docker run` 한 번이라 값이 싸다.
      #
      # 거부 **사유**까지 요구한다 — 이 환경에는 DB 가 없어 기동은 어차피 실패하므로, 종료 코드만
      # 보면 스모크가 아무것도 재지 않는 것과 같다(관리 표면 판정이 사라져도 초록이 된다).
      #
      # r3(code-review r3 LOW-1) — 사유를 **D-6A2a-10 하나로** 좁혔다. 이 환경변수의 정규형은
      # `server.servlet.context-parameters` 이름공간이고 그것은 거부 접두사이므로 **초기화자의 조기
      # 검사가 먼저 끊는다** — 이 step 이 재는 것은 「운반 이름공간을 조기에 거부한다」이고, 늦은
      # 재검사(D-6A2a-14)는 여기서 도달하지 못한다. 둘 다 받는 형태는 어느 잠금이 섰는지를 문면에서
      # 지운다. 늦은 재검사를 재는 것은 `ManagementSurfaceLateSourceRefusalTest` 이고, 오늘 이미지
      # 밖에서 그 자리에 닿을 채널은 없다(설정 데이터·명령행·JSON 은 모두 초기화자보다 앞에 서고
      # 실행 가능 jar 에는 `web.xml` 도 JNDI 도 없다) — 그 재검사는 **미래의 늦은 소스**에 대한
      # 방어다.
      - name: 앱 이미지 거부 스모크 — 운반 이름공간을 조기에 거부한다 (S-22c)
        id: refusal_smoke
        run: |
          set -euo pipefail
          name="m6a2a-late-source-refusal"
          docker rm -f "$name" >/dev/null 2>&1 || true
          out="$(docker run --rm --name "$name" --security-opt no-new-privileges \
            -e SERVER_PORT=8080 \
            -e MANAGEMENT_SERVER_PORT=8081 \
            -e BIDVECTOR_PERSISTENCE_JDBCURL=jdbc:postgresql://192.0.2.1:5432/refusal-smoke \
            -e BIDVECTOR_PERSISTENCE_USERNAME=refusal-smoke \
            -e BIDVECTOR_PERSISTENCE_CREDENTIAL=refusal-smoke \
            -e OPERATOR_CREDENTIAL_VALUE=refusal-smoke-placeholder-not-an-operator-value \
            -e BIDVECTOR_EVALUATION_CANDIDATECAP=1 \
            -e SERVER_SERVLET_CONTEXTPARAMETERS_MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_SHOWDETAILS=always \
            bidvector/app:local 2>&1)" && rc=0 || rc=$?
          # r3(code-review r3 LOW-6) — 실패 분기에서 컨테이너 출력을 **버리지 않는다.** 이 step 이
          # 붉어지는 경우가 곧 「무엇이 나왔는지 알아야 하는」 경우다. 다만 전문을 찍지 않는다 —
          # 값이 실릴 축이 오늘 없다는 것은 이 step 자신이 보증하지만(입력 여덟이 전부 리터럴
          # 일회성 값이고 생성 자격은 이 컨테이너로 전달되지 않는다), 뒤 편집이 실 값을 붙이는
          # 날 그 전문이 로그로 간다. **고정 표지 줄만** 낸다.
          _markers() {
            local lines
            lines="$(printf '%s\n' "$out" \
              | grep -aE 'D-6A2a-|APPLICATION FAILED TO START|Application run failed' | tail -n 5)" || lines=""
            if [ -n "$lines" ]; then
              printf '%s\n' "$lines" >&2
            else
              echo "(값 없는 표지 줄이 없다 — 컨테이너 출력 ${#out} 자)" >&2
            fi
          }
          if [ "$rc" -eq 0 ]; then
            echo "적대 환경변수를 줬는데 컨테이너가 0 으로 끝났다 — 관리 표면 거부가 서지 않았다" >&2
            _markers
            exit 1
          fi
          case "$out" in
            *D-6A2a-10*) ;;
            *) echo "컨테이너가 비-0(${rc})으로 끝났지만 조기 거부(D-6A2a-10) 사유가 아니다" >&2; _markers; exit 1 ;;
          esac
          case "$out" in
            *server.servlet.contextparameters*) ;;
            *) echo "거부 문면이 운반 이름공간 키를 말하지 않는다" >&2; _markers; exit 1 ;;
          esac
          echo "== 거부 스모크 통과(exit=${rc}) =="

      # M6/6E-2b B-2 — 이미지 취약점 게이트가 `trivy` 를 실행 파일로 부른다(SBOM 생성 + 스캔).
      #
      # **자리: 쓰는 step 바로 앞**(PR #68 /code-review M). 앞 판은 job 머리에 있어 설치 실패가
      # 뒤 전부를 건너뛰게 했다. 이동으로 **실제로 살아나는 것은 S-21~S-22c**(이미지 빌드·위생·거부
      # 스모크)다 — 그 셋은 trivy 와 무관하고 이제 설치가 깨져도 판정이 남는다.
      #
      # **S-23~S-24 는 여전히 건너뛴다**(verifier 표적4 M-1 실측). 그 step 들에는 `if` 가 없어 암묵
      # `success()` 이고, 앞에서 job 이 실패하면 멈춘다 — 6E-2b 이전과 **같은 결합**이고 이 이동이
      # 고치는 축이 아니다. 주석이 그것까지 살아난다고 적었던 것은 거짓이었고 여기서 좁힌다.
      # **`aquasecurity/trivy-action`·`setup-trivy` 를 쓰지 않는다.** 사유 둘 — ① 액션 안의 trivy
      # 버전은 워크플로에 보이지 않아 정책 파일과 조용히 어긋나는 **둘째 버전 축**이 된다
      # ② 2026-03-19 공급망 사고에서 **먼저 무너진 것이 바로 그 액션 태그들**이다(공식 권고
      # GHSA-69fq-xp46-6x23 — 액션 태그 전부가 악성 커밋으로 force-push 됐고 바이너리 쪽 피해는
      # 한 판에 그쳤다). `install buf` 선례대로 릴리스 바이너리를 직접 받는다.
      #
      # **체크섬 대조의 기준은 릴리스가 함께 내는 목록이 아니라 이 저장소에 핀한 값**이다.
      # 자산이 뒤에 바뀌면 그 목록도 함께 바뀌므로 목록 대조만으로는 바뀐 것을 잡지 못한다.
      # 버전·자산 이름·체크섬 셋 다 정책 파일이 정한다 — 워크플로에 숫자를 적지 않는다.
      - name: install trivy
        id: install_trivy
        run: |
          set -euo pipefail
          policy=config/quality/vuln-policy.properties
          # r1(code-review L-1) — 이 step 은 스크립트의 `_policy_value` 와 **같은 파일을 읽으면서**
          # 중복 키·값 모양을 보지 않았다. `tool.trivy.sha256` 이 두 번 선언되면 `pinned` 이 두 줄이
          # 되고, 결과 체크섬 파일의 첫 줄은 형식 불량이 된다 — GNU `sha256sum -c` 는 형식 불량 줄을
          # **경고만 하고 넘어가므로** 둘째 값으로 검증이 성립해 exit 0 이 날 수 있었다.
          _one() { # <키> — 정확히 한 줄이어야 한다
            local v n
            v="$(sed -n "s/^$1=//p" "$policy")"
            n="$(printf '%s' "$v" | grep -c '' || true)"
            if [ -z "$v" ] || [ "$n" -ne 1 ]; then
              echo "$policy 의 ${1//\\/} 가 없거나 ${n}번 선언됐다(정확히 한 번이어야 한다)" >&2
              exit 1
            fi
            printf '%s' "$v"
          }
          version="$(_one 'tool\.trivy\.version')"
          asset="$(_one 'tool\.trivy\.asset')"
          pinned="$(_one 'tool\.trivy\.sha256')"
          case "$pinned" in
            *[!0-9a-f]* | "") echo "tool.trivy.sha256 이 소문자 16진수가 아니다" >&2; exit 1 ;;
          esac
          [ "${#pinned}" -eq 64 ] || { echo "tool.trivy.sha256 이 64자리가 아니다(${#pinned})" >&2; exit 1; }
          tmp="$(mktemp -d)"
          # r1(code-review L-9) — 네트워크 한 번 튀는 것으로 CI 가 붉어지지 않게 한다.
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors -o "$tmp/$asset" \
            "https://github.com/aquasecurity/trivy/releases/download/v${version}/${asset}"
          printf '%s  %s\n' "$pinned" "$asset" > "$tmp/pinned.sha256"
          # `--strict` 가 형식 불량 줄을 **경고가 아니라 실패**로 만든다(위 주석의 경로를 닫는다).
          ( cd "$tmp" && sha256sum --strict -c pinned.sha256 )
          tar -xzf "$tmp/$asset" -C "$tmp" trivy
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$tmp/trivy" "$RUNNER_TEMP/bin/trivy"
          rm -rf "$tmp"
          # PATH 등재는 다음 step 부터 듣는다 — 이 step 의 스모크는 절대 경로로 건다.
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/trivy" --version

      # M6/6E-2b — 완료 조건 8 의 나머지 절반(`OPEN-6C-IMAGE-VULN-SCAN`, D-6C-5 「흉내만 낸
      # 스캔은 상시 초록 게이트가 된다」). 위 S-22a/b 가 「무엇이 이미지에 들어 있나」를 쟀다면
      # 이 둘은 **그 안의 패키지에 알려진 결함이 있는가**를 잰다. 두 이미지를 다 돌리는 것이
      # 중요하다 — 베이스도 패키지 생태계도 서로 다르고, allowlist 키가 kind 를 성분으로 갖는
      # 이유가 그것이다. 판정 기준(차단 severity·수정본 유무·만료 상한)은 전부 정책 파일에 있다.
      - name: 이미지 취약점 게이트 — ml-serving (S-22d)
        id: scan_ml
        run: ./tools/vuln-scan-check.sh bidvector/ml-serving:local ml-serving config/quality/vuln-policy.properties

      # M6/6E-2b r1(code-review M-3) — **앞 이미지가 막아도 이 스캔은 돈다.** 조건이 없으면
      # ml-serving 이 막는 순간 이 step 이 통째로 건너뛰어져 앱 쪽 판정을 같은 회차에 볼 수 없고,
      # 수정 라운드가 둘로 쪼개진다(ml 고치고 → 그제야 앱의 미등재가 처음 보인다). runbook §8.1 의
      # 「게이트가 막아도 SBOM 이 올라간다」도 그 경우 거짓이 된다.
      #
      # 다만 `always()` 가 아니라 **앱 이미지 빌드가 성공했을 때**다 — 이미지가 없으면 이 게이트는
      # 「이미지를 찾지 못했다」로 끊기고, 그것은 원인(빌드 실패)을 가리키지 않는 둘째 빨강이다.
      # job 의 실패 자체는 막은 step 이 그대로 진다.
      - name: 이미지 취약점 게이트 — 앱 (S-22e)
        id: scan_app
        # M6/6E-2b r? (PR #68 /code-review H) — 조건이 `build_app` 만 봤다. 그러면 **앞선 위생 게이트나
        # 거부 스모크가 실패해도** 이 스캔이 돌아, 이미 붉은 회차에 판정 하나를 더 얹는다(그 이미지가
        # 위생 축에서 이미 거부됐는데 취약점 축 결과를 내는 것은 뜻이 흐리다). 앞 축들의 성공까지 본다.
        #
        # **`scan_ml` 은 일부러 보지 않는다**(M-3 의 결정 유지) — ml-serving 이 막아도 앱 판정을 같은
        # 회차에서 봐야 수정 라운드가 둘로 쪼개지지 않는다. 두 스캔은 서로 독립이고, 앞 단계와만 묶인다.
        if: ${{ !cancelled() && steps.install_trivy.outcome == 'success' && steps.build_app.outcome == 'success' && steps.hygiene_ml.outcome == 'success' && steps.hygiene_app.outcome == 'success' && steps.refusal_smoke.outcome == 'success' }}
        run: ./tools/vuln-scan-check.sh bidvector/app:local app config/quality/vuln-policy.properties

      # M7/7F-local(D-7F-1) — 같은 스크립트에 두 이미지를 더 태운다. 정책은 **한 파일**이고
      # kind 별 키(하한 둘·배포판 둘·Java DB 여부)를 갖는다 — 선언 없는 kind 는 그 kind 가 돌 때까지
      # 구멍이 보이지 않으므로 스크립트가 **전수 확인**한다(그래서 kind 를 더하면 키도 함께 더해야
      # 하고, 빠뜨리면 네 kind 전부가 그 자리에서 멈춘다 — fail-closed).
      #
      # 조건은 **자기 축만** 본다(앞 이미지들의 스캔을 보지 않는다, PR #68 M-3 의 결정과 같은 방향):
      # 한 이미지가 막아도 나머지 판정을 같은 회차에서 봐야 수정 라운드가 쪼개지지 않는다. 다만
      # **자기 빌드·자기 위생이 성공했을 때**다 — 이미 위생 축에서 거부된 이미지의 취약점 판정은
      # 뜻이 흐리다(같은 job 의 S-22e 가 그 사유로 조건을 가진 것과 같은 형태).
      - name: 이미지 취약점 게이트 — web (S-22e2)
        id: scan_web
        if: ${{ !cancelled() && steps.install_trivy.outcome == 'success' && steps.build_web_proxy.outcome == 'success' && steps.hygiene_web.outcome == 'success' }}
        run: ./tools/vuln-scan-check.sh bidvector/web:local web config/quality/vuln-policy.properties

      - name: 이미지 취약점 게이트 — 프록시 (S-22e3)
        id: scan_proxy
        if: ${{ !cancelled() && steps.install_trivy.outcome == 'success' && steps.build_web_proxy.outcome == 'success' && steps.hygiene_proxy.outcome == 'success' }}
        run: ./tools/vuln-scan-check.sh bidvector/proxy:local proxy config/quality/vuln-policy.properties

      # B-6 — CycloneDX SBOM 보관. 보존 90일은 운영자 보존 결정 2026-09-26 과 같은 값이다.
      # M7/7F-local(D-7F-1) — 담는 이미지가 넷이 됐다(web·proxy 추가). 경로 glob 은 그대로이고
      # 스캔 스크립트가 kind 별 파일 이름을 쓰므로 배선 변경이 없다 — 바뀐 것은 조건의 「어느
      # 스캔이든 돌았는가」에 새 둘이 들어간 것뿐이다.
      # **게이트가 막았을 때가 곧 SBOM 이 필요한 때**이므로 스캔 실패에도 올린다.
      #
      # M6/6E-2b r1(code-review M-4) — 그러나 `always()` 는 **스캔과 무관한 실패마다 가짜 빨강을
      # 하나 더** 만들었다. `install trivy`·S-21·S-21a/b·S-22a/b/c 중 무엇이 실패해도 이 step 이 돌고,
      # `build/vuln-scan/` 이 비어 있으므로 `if-no-files-found: error` 로 또 붉어진다 — 로그를 처음
      # 보는 사람이 둘 중 어느 쪽이 원인인지 한 번 더 추적해야 했다. 그래서 **스캔 step 이 실제로
      # 돌았을 때만** 올린다(둘 다 `skipped` 면 올릴 것도 없다).
      #
      # `if-no-files-found: error` 는 유지한다 — 빈 artifact 를 올리고 초록인 것은 보관하지 않은 것과
      # 같다. 남는 경우 하나(스캔이 SBOM 을 쓰기 **전에** exit 2 로 끊김 — 정책·환경 오류)는 가짜가
      # 아니라 **관련된** 빨강이므로 그대로 둔다. major 는 위 `check` job 의 같은 액션과 맞춘다.
      - name: SBOM 보관 — CycloneDX, 이미지 넷 (S-22f)
        # **install 성공까지 본다**(verifier 표적4 M-1). 그러지 않으면 설치 실패 하나가 빨강 셋을
        # 만든다 — install 자신 · 조건이 install 을 안 보던 S-22e(「trivy 가 필요하다」 exit 2) ·
        # 올릴 파일이 없는 이 step. **원인 하나에 빨강 하나**가 맞다.
        if: ${{ !cancelled() && steps.install_trivy.outcome == 'success' && (steps.scan_ml.outcome != 'skipped' || steps.scan_app.outcome != 'skipped' || steps.scan_web.outcome != 'skipped' || steps.scan_proxy.outcome != 'skipped') }}
        uses: actions/upload-artifact@v6
        with:
          name: sbom-cyclonedx
          path: build/vuln-scan/*-sbom.cdx.json
          retention-days: 90
          if-no-files-found: error

      - name: 로컬 환경 기동 — app+ml-serving+postgres 가 healthy 로 수렴 (S-23)
        run: |
          docker compose -f docker/compose.yaml up -d
          for i in $(seq 1 30); do
            ps_out="$(docker compose -f docker/compose.yaml ps --format '{{.Service}}: {{.Status}}')"
            echo "$ps_out"
            # 괄호 리터럴(BRE) — `.*healthy` 는 `(unhealthy)` 의 `un`+`healthy` 에도 맞아
            # 「수렴에 실패했다」가 확정되는 순간을 「수렴했다」로 읽는다. M7/7F-local 이 이
            # 형태를 복제했다가 cr M-1 로 잡혀 두 자리를 같은 커밋에서 고쳤다.
            if echo "$ps_out" | grep -q "app:.*(healthy)" \
              && echo "$ps_out" | grep -q "ml-serving:.*(healthy)" \
              && echo "$ps_out" | grep -q "postgres:.*(healthy)"; then
              exit 0
            fi
            sleep 3
          done
          echo "app/ml-serving/postgres 가 제한 시간 안에 healthy 로 수렴하지 않았다" >&2
          docker compose -f docker/compose.yaml logs
          exit 1

      # M6/6A-2a D-6A2a-8 — 「이미지가 뜬다」가 아니라 **「뜬 이미지가 인증 경계를 지키며 준비
      # 상태를 알린다」** 를 잰다. 관리 포트는 host 에 publish 되지 않으므로 컨테이너 안에서
      # 묻고, API 포트는 루프백에서 묻는다. 자격 값은 argv 를 지나지 않는다(위 생성 step 주석).
      - name: 컨테이너 스모크 — 준비 상태·인증 경계·health 격리·수집 꺼짐 (S-23b)
        run: |
          set -euo pipefail
          COMPOSE="docker compose -f docker/compose.yaml"
          API="http://127.0.0.1:${BIDVECTOR_APP_PORT}"
          MGMT="http://127.0.0.1:${BIDVECTOR_APP_MANAGEMENT_PORT}"
          fail() { echo "스모크 실패: $1" >&2; $COMPOSE logs app >&2 || true; exit 1; }
          # R2-8 계열 — 도구 부재를 스모크 실패로 오인하지 않는다(`ubuntu-latest` 선탑재지만
          # 워크플로가 설치를 선언하지 않는다). 위생 게이트도 같은 자리에서 같은 이유로 끊는다.
          command -v jq >/dev/null 2>&1 || { echo "jq 가 필요하다 — 본문 키 집합 판정에 쓴다" >&2; exit 2; }
          # M6/6A-2a r1(code-review LOW) — 전송 오류를 **`fail()` 로 옮긴다.** `set -euo pipefail`
          # 아래서는 curl 의 비-0(예: exit 7 연결 거부)이 대입 자체를 실패시켜 step 이 즉사하고,
          # `fail()` 이 붙이는 앱 로그를 잃는다. 실패는 정직한 사유로 나와야 한다.
          # M6/6A-2a r2(code-review LOW-4) — `|| echo` 는 **덧붙이는** 형태였다. 전송 실패(exit 7)
          # 에서도 curl 은 `-w '%{http_code}'` 를 처리해 `000` 을 stdout 에 쓰므로 잡히는 값이
          # `000transport-error` 가 됐다(판정은 `fail()` 로 떨어지지만 문면이 정직하지 않다).
          # 대입은 실패해도 일어나므로 `||` 로 **덮어쓴다** — `_api_authorized_code` 와 같은 형태다.
          _anon_code() {
            local out
            out="$(curl -sS -o /dev/null -w '%{http_code}' "$1")" || out="transport-error"
            printf '%s' "$out"
          }
          _mgmt() {
            local out
            # r3(code-review r3 LOW-7) — `$'…'` 가 같은 값을 서브셸 없이 준다(명령 치환은 뒤따르는
            # 개행만 지우므로 앞 형태의 거동도 같았다). 형태가 위 두 helper 와 한 번 더 같아진다.
            out="$($COMPOSE exec -T app curl -sS -w '\n%{http_code}' "$MGMT$1")" || out=$'\ntransport-error'
            printf '%s' "$out"
          }
          _mgmt_code() { printf '%s' "$(_mgmt "$1")" | tail -n1; }
          _api_authorized_code() {
            local out
            out="$(printf 'header = "X-Operator-Credential: %s"\n' "$BIDVECTOR_APP_OPERATOR_CREDENTIAL" \
              | curl --config - -sS -o /dev/null -w '%{http_code}' "$API$1")" || out="transport-error"
            printf '%s' "$out"
          }
          _mgmt_body_keys() { printf '%s' "$1" | jq -r 'keys | sort | join(",")' || echo parse-error; }

          echo "-- 관리 포트 프로브 둘: 200 · 본문 키 하나(status) --"
          for path in /actuator/health/liveness /actuator/health/readiness; do
            out="$(_mgmt "$path")"
            code="$(printf '%s' "$out" | tail -n1)"
            body="$(printf '%s' "$out" | sed '$d')"
            [ "$code" = "200" ] || fail "$path 가 200 이 아니다: $code"
            keys="$(_mgmt_body_keys "$body")"
            [ "$keys" = "status" ] || fail "$path 본문 키가 status 하나가 아니다: [$keys]"
            [ "$(printf '%s' "$body" | jq -r '.status')" = "UP" ] || fail "$path 가 UP 이 아니다"
          done

          # M6/6A-2a D-6A2a-12 — **집계 경로도 잰다.** Boot 4.1.1 은 `show-details=never` 아래에서도
          # `groups` 칸을 낸다(그룹이 있으면 항상 실린다 — 세부 설정과 무관하다). 값은 우리가 지은
          # 그룹 이름 둘이고 구성 요소 이름·주소·예외·버전은 없다. 스모크가 프로브만 재면 이 칸이
          # 환경으로 늘어나도(예: 새 그룹 이름) 컨테이너 축에서는 조용하다.
          echo "-- 관리 포트 집계 health: 200 · 키는 status·groups · 그룹 이름 둘 --"
          out="$(_mgmt /actuator/health)"
          code="$(printf '%s' "$out" | tail -n1)"
          body="$(printf '%s' "$out" | sed '$d')"
          [ "$code" = "200" ] || fail "집계 /actuator/health 가 200 이 아니다: $code"
          keys="$(_mgmt_body_keys "$body")"
          [ "$keys" = "groups,status" ] || fail "집계 health 본문 키가 groups,status 가 아니다: [$keys]"
          groups="$(printf '%s' "$body" | jq -r '.groups | sort | join(",")')"
          [ "$groups" = "liveness,readiness" ] || fail "집계 health 그룹 이름이 liveness,readiness 가 아니다: [$groups]"
          [ "$(printf '%s' "$body" | jq -r '.status')" = "UP" ] || fail "집계 health 가 UP 이 아니다"

          echo "-- API 포트 무인증 401 · 인증 GET /api/strategy 200 --"
          code="$(_anon_code "$API/api/strategy")"
          [ "$code" = "401" ] || fail "무인증 /api/strategy 가 401 이 아니다: $code"
          code="$(_api_authorized_code /api/strategy)"
          [ "$code" = "200" ] || fail "인증 /api/strategy 가 200 이 아니다: $code"

          # M6/6A-2b D-6A2b-13 — 「뜬 이미지에서 쓰기가 인증 경계 아래에서 끝까지 간다」를 잰다.
          # 자격 값은 argv 를 지나지 않는다(위 생성 step 주석과 같은 형태) — 본문은 비밀이
          # 아니지만 `--config` 의 `data = "@파일"` 로 넘겨 인용 규칙을 단순하게 둔다.
          echo "-- API 포트 쓰기 왕복: begin → value → confirm → GET 반영 --"
          bodies="$(mktemp -d)"
          _api_get() {
            local out
            out="$(printf 'header = "X-Operator-Credential: %s"\n' "$BIDVECTOR_APP_OPERATOR_CREDENTIAL" \
              | curl --config - -sS -w '\n%{http_code}' "$API$1")" || out=$'\ntransport-error'
            printf '%s' "$out"
          }
          _api_post() {
            local out
            out="$(printf 'header = "X-Operator-Credential: %s"\nheader = "Content-Type: application/json"\nrequest = "POST"\ndata = "@%s"\n' \
              "$BIDVECTOR_APP_OPERATOR_CREDENTIAL" "$2" \
              | curl --config - -sS -w '\n%{http_code}' "$API$1")" || out=$'\ntransport-error'
            printf '%s' "$out"
          }
          _code() { printf '%s' "$1" | tail -n1; }
          _body() { printf '%s' "$1" | sed '$d'; }

          # F3(PR #65 /code-review) — 두 왕복이 같은 네 단계(begin → value → confirm → 반영 확인)를
          # 거의 똑같이 적고 있었다. 한 helper 로 모은다. `$1` 필드 토큰 · `$2` `count` 값 ·
          # `$3` 조회 본문의 확인 칸 이름. **기준 revision 은 산술로 짐작하지 않고 매번 다시 읽는다**
          # (앞 왕복 수가 바뀔 때 조용히 409 로 떨어진다). 읽기 전에 코드를 단언한다 — 전송 오류면
          # 본문이 빈 문자열이 되고 `jq` 가 출력 없이 exit 0 이라, 단언이 없으면 뒤 판정의 문면이
          # 원인을 지운다(r1 cr G-4 와 같은 결함 클래스).
          _edit_field() {
            local field="$1" count="$2" view_key="$3" tag="$4"
            local before seen begun session provided confirmed after
            before="$(_api_get /api/strategy)"
            [ "$(_code "$before")" = "200" ] || fail "$field 왕복 전 GET /api/strategy 가 200 이 아니다: $(_code "$before")"
            seen="$(_body "$before" | jq -r '.revision')" || fail "$field 왕복 전 revision 판독 실패"
            case "$seen" in ''|*[!0-9]*) fail "$field 왕복 전 revision 이 수가 아니다: [$seen]" ;; esac

            printf '{"field":"%s"}' "$field" > "$bodies/$tag-begin.json"
            begun="$(_api_post /api/strategy/edit-sessions "$bodies/$tag-begin.json")"
            [ "$(_code "$begun")" = "201" ] || fail "$field begin 이 201 이 아니다: $(_code "$begun")"
            session="$(_body "$begun" | jq -r '.sessionId')" || fail "$field begin 응답 판독 실패"
            [ -n "$session" ] && [ "$session" != "null" ] || fail "$field begin 응답에 sessionId 가 없다"

            printf '{"commandId":"smoke-%s-v","field":"%s","count":%s}' "$tag" "$field" "$count" > "$bodies/$tag-value.json"
            provided="$(_api_post "/api/strategy/edit-sessions/$session/value" "$bodies/$tag-value.json")"
            [ "$(_code "$provided")" = "200" ] || fail "$field value 가 200 이 아니다: $(_code "$provided")"

            printf '{"commandId":"smoke-%s-c","seenRevision":%s}' "$tag" "$seen" > "$bodies/$tag-confirm.json"
            confirmed="$(_api_post "/api/strategy/edit-sessions/$session/confirm" "$bodies/$tag-confirm.json")"
            [ "$(_code "$confirmed")" = "200" ] || fail "$field confirm 이 200 이 아니다: $(_code "$confirmed")"
            # F3 — `APPLIED` 단언을 **두 왕복 다** 한다(앞 판은 첫 왕복에만 있었다). 200 만 보면
            # 커널이 적용 없이 세션을 닫는 변이를 놓친다.
            [ "$(_body "$confirmed" | jq -r '.state')" = "APPLIED" ] || fail "$field confirm 뒤 state 가 APPLIED 가 아니다"

            after="$(_api_get /api/strategy)"
            [ "$(_code "$after")" = "200" ] || fail "$field 반영 확인 GET /api/strategy 가 200 이 아니다: $(_code "$after")"
            [ "$(_body "$after" | jq -r ".$view_key")" = "$count" ] || fail "$field 쓰기 값이 조회에 반영되지 않았다"
            [ "$(_body "$after" | jq -r '.revision')" = "$((seen + 1))" ] || fail "$field 뒤 revision 이 1 오르지 않았다"
          }

          _edit_field CANDIDATE_LIMIT 13 candidateLimit cl

          echo "-- 무인증 쓰기 401 · 미선언 메서드 405 --"
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            --data '{"field":"CANDIDATE_LIMIT"}' "$API/api/strategy/edit-sessions")" || code="transport-error"
          [ "$code" = "401" ] || fail "무인증 쓰기가 401 이 아니다: $code"
          code="$(_code "$(_api_get /api/strategy/edit-sessions)")"
          [ "$code" = "405" ] || fail "미선언 메서드가 405 가 아니다: $code"

          # M6/6E-1 G-4 — 완료 조건 4(「실제 외부 effect 없이 dry-run acceptance 가능」)의 **컨테이너 축
          # 관측**이다. 단언 셋 — ① 200 ② 응답 본문 키 집합이 openapi `EvaluationDryRunResponse` 의
          # required 아홉과 **같다**(늘어도 줄어도 붉어진다) ③ 그 왕복 전후로 outbox 행 수가 같다.
          #
          # **③ 이 재는 것을 과대 주장하지 않는다**(verifier r1 R1-H-2). 이 job 의 DB 에는 공고 seed 가
          # 없어 후보가 0 이고, 후보가 0 이면 dry-run 이 outbox 에 닿을 유일한 경로(`BidNow` 판정의 알림
          # 요청)가 애초에 0 회 불린다 — 그래서 ③ 은 「쓰기 경로가 막혀 있다」가 아니라 **「빈 후보에서
          # 쓰지 않는다」**를 잰다. 「외부 effect 없음」의 정본은 Kotlin `check` 안의
          # `DryRunCommitSeparationGateTest`(조립 분리를 구조로 잠근다)이고, 후보 ≥ 1 ·
          # `wouldNotifyNoticeIds` 비어 있지 않음을 전제로 둔 비공허 측정은 ML 배선 뒤
          # `OPEN-6E1-G4-NONVACUOUS` 다.
          #
          # **이 블록의 실제 의존은 앞 왕복이 남긴 DB 상태가 아니라 같은 step 안의 정의들**이다(cr r1
          # G-11) — `_api_post`·`_api_get`·`_code`·`_body`·`$bodies`·`jq` 선행 검사. 그 정의들보다
          # 앞으로 옮기면 깨진다. 여력 상한은 **스스로** 세운다(위 왕복과 같은 형태) — dry-run 은 저장된
          # 전략을 읽으므로 상한이 없으면 409 `MAX_ACTIVE_BIDS_NOT_CONFIGURED` 로 fail-closed 다
          # (0 으로도 무한으로도 지어내지 않는다).
          echo "-- 여력 상한 세우기: begin → value → confirm (dry-run 200 의 전제) --"
          _edit_field MAX_ACTIVE_BIDS 5 maxActiveBids mab

          echo "-- 평가 dry-run 왕복: 200 · 본문 키 아홉 · outbox 행 수 전후 등식 (G-4) --"
          # DB 질의는 S-23c 리허설과 같은 형태다 — 컨테이너 **안**의 유닉스 소켓이고 공식 postgres
          # 이미지의 `pg_hba.conf` 가 그 경로를 `trust` 로 두므로 자격 값을 새 자리에 두지 않는다.
          _outbox_rows() {
            local out
            out="$($COMPOSE exec -T postgres psql -X -q -t -A -v ON_ERROR_STOP=1 \
              -U "$BIDVECTOR_PG_USER" -d "$BIDVECTOR_PG_DB" -c 'select count(*) from outbox')" \
              || out="query-error"
            printf '%s' "$out"
          }
          outbox_before="$(_outbox_rows)"
          case "$outbox_before" in
            ''|*[!0-9]*) fail "dry-run 전 outbox 행 수를 읽지 못했다: [$outbox_before]" ;;
          esac

          printf '{"currentActiveBids":0}' > "$bodies/dry-run.json"
          dry="$(_api_post /api/evaluation-dry-runs "$bodies/dry-run.json")"
          # 실패 문면에 **본문 전문을 싣지 않는다**(cr r1 G-3 — S-22c r3 의 「고정 표지 줄만」과 같은
          # 선택). 오늘 본문은 평탄한 ID·계수뿐이지만 후보별 사유 상세를 더하는 것이 열린 항목
          # (`OPEN-6A3-EVALUATION-DETAIL`)이라, 그 날 이 한 줄이 상세를 공개 CI 로그로 보낸다.
          # 진단에 필요한 것은 키 집합과 오류 코드다.
          if [ "$(_code "$dry")" != "200" ]; then
            fail "dry-run 이 200 이 아니다: $(_code "$dry") 키 [$(_body "$dry" | jq -r 'keys|sort|join(",")' 2>/dev/null || echo parse-error)] code $(_body "$dry" | jq -r '.code // "none"' 2>/dev/null || echo parse-error)"
          fi
          keys="$(_body "$dry" | jq -r 'keys | sort | join(",")')" \
            || fail "dry-run 본문을 JSON 으로 읽지 못했다(키 집합 판정 불가)"
          dry_run_keys="bidNowNoticeIds,candidateCount,currentActiveBids,maxActiveBids,notReachedNoticeIds,reviewNoticeIds,skipNoticeIds,strategyRevision,wouldNotifyNoticeIds"
          [ "$keys" = "$dry_run_keys" ] || fail "dry-run 본문 키 집합이 openapi required 아홉과 다르다: [$keys]"
          [ "$(_body "$dry" | jq -r '.maxActiveBids')" = "5" ] || fail "dry-run 이 방금 세운 여력 상한을 읽지 않았다"

          outbox_after="$(_outbox_rows)"
          [ "$outbox_after" = "$outbox_before" ] \
            || fail "dry-run 이 outbox 를 건드렸다 — 전 $outbox_before 후 $outbox_after"
          echo "dry-run 왕복 통과 — outbox 행 수 $outbox_before == $outbox_after (쓰기 0)"
          rm -rf "$bodies"

          echo "-- API 포트의 actuator: 401 또는 404(200 이면 실패) --"
          for path in /actuator /actuator/health /actuator/health/readiness /actuator/env; do
            anon="$(_anon_code "$API$path")"
            auth="$(_api_authorized_code "$path")"
            case "$anon" in 401|404) ;; *) fail "무인증 $path 가 401·404 가 아니다: $anon" ;; esac
            case "$auth" in 401|404) ;; *) fail "인증 $path 가 401·404 가 아니다: $auth — actuator 가 API 포트에 있다" ;; esac
          done

          # `/actuator/health/db` 는 구성 요소 경로다(privacy-gate r1 L-1) — `show-components=never`
          # 아래에서는 404 이고, 그 설정이 열리는 순간 **가장 먼저 세부를 내는 경로**다.
          echo "-- 관리 포트의 health 외 경로 404 --"
          for path in /actuator /actuator/env /actuator/configprops /actuator/beans \
            /actuator/heapdump /actuator/shutdown /actuator/loggers /actuator/metrics \
            /actuator/threaddump /actuator/mappings /actuator/info /actuator/health/db; do
            code="$(_mgmt_code "$path")"
            [ "$code" = "404" ] || fail "관리 포트 $path 가 404 가 아니다: $code"
          done

          # D-6A2a-13 ② — 관리 포트의 **actuator 밖 표면**을 실측 그대로 잠근다. `/error` 는 404 가
          # 아니다(Boot 의 오류 처리 경로가 관리 child context 에도 붙는다). 새는 값은 없고 — 우리
          # 예외가 아니라 「디스패치된 오류 없음」 상태다 — 칸이 늘면 이 단언이 붉어진다.
          echo "-- 관리 포트 /error: 200 · 키 셋 고정 --"
          out="$(_mgmt /error)"
          code="$(printf '%s' "$out" | tail -n1)"
          [ "$code" = "200" ] || fail "관리 포트 /error 가 200 이 아니다: $code"
          keys="$(_mgmt_body_keys "$(printf '%s' "$out" | sed '$d')")"
          [ "$keys" = "error,status,timestamp" ] || fail "관리 포트 /error 본문 키가 실측 모양과 다르다: [$keys]"

          echo "-- 앱 로그에 수집 시작 줄 0 (우회 6) --"
          # `$COMPOSE logs app | grep -q …` 를 쓰지 않는다(code-review r1 MEDIUM): `grep -q` 는 **첫
          # 일치에서 즉시 나가** 파이프를 닫고, `pipefail` 아래 파이프라인 상태는 마지막 비-0 이므로
          # **일치했을 때에도** `if` 가 거짓이 될 수 있었다 — 위반을 **숨기는 방향**의 비결정성이다.
          # 로그를 변수로 먼저 받고 판정은 셸 패턴으로 한다(파이프가 없으므로 SIGPIPE 도 없다).
          app_logs="$($COMPOSE logs app 2>&1)" || fail "app 로그를 읽지 못했다"
          case "$app_logs" in
            *'collection start'*) fail "앱 로그에 수집 시작 줄이 있다 — compose 기동이 수집을 켰다" ;;
          esac

          echo "== 스모크 통과 =="

      # M6/6B-2 D-6B2-1(A-2 (a)) — 완료 조건 7 의 「rollback/restore rehearsal 증거」를 매 PR 에
      # 실측으로 만든다. **이 자리인 이유는 앞 step 이 남긴 상태다**: S-23b 의 쓰기 왕복이
      # `operator_strategy` 에 식별 가능한 행을 남기고 — **왕복이 둘이므로 종료 상태는
      # `candidateLimit=13` · `max_active_bids=5` · `revision+2` 다**(F6, PR #65 /code-review: 앞 판은
      # G-4 가 더한 둘째 왕복을 셈에 넣지 않아 `revision+1` 로 적혀 있었다) —
      # 리허설의 데이터 손실 축이 바로 그 값이 백업으로 돌아오는지를 잰다. 그 행이 없으면
      # 리허설은 「쓰기 왕복이 선행하지 않았다」로 끊는다 — step 순서가 단언으로 잠긴다.
      #
      # **자격 값을 새 자리에 두지 않는다.** 리허설의 모든 DB 접속은 컨테이너 안 유닉스
      # 소켓이거나 자기가 만든 컨테이너의 netns 를 공유한 루프백이고, 공식 postgres 이미지의
      # `pg_hba.conf` 가 둘 다 `trust` 로 둔다. compose 파일 해석이 요구하는 `${VAR:?}` 값들은
      # job env 와 앞 step 들이 채운 `$GITHUB_ENV` 가 이미 주고, `docker compose config` 가
      # 그것을 실제로 **해석한다** — 리허설이 하지 않는 것은 그 값을 **로그·argv 로 내보내는**
      # 것이다. `config` 의 출력은 `jq` 로만 흘러 이름 둘(프로젝트·앱 이미지)만 꺼낸다.
      #
      # 파괴는 **리허설이 만든 컨테이너 안에서만** 일어난다(D-6B2-3). compose 환경은 읽기만
      # 하므로 뒤따르는 S-24 가 쓰는 상태도, S-25 가 치우는 자원도 건드리지 않는다.
      - name: 백업·복원·되돌림 리허설 (S-23c)
        run: |
          set -euo pipefail
          ./tools/db-rehearsal.sh docker/compose.yaml postgres

      - name: 실 Kotlin gateway ↔ 컨테이너의 실 Python 서버 (S-24, OPEN-5E2-CROSSLANG-REAL-SERVER)
        # `RealServerIntegrationTest`는 Testcontainers 로 (S-21) 이미지의 **자기 전용**
        # 컨테이너를 새로 띄운다(위 compose 환경과 별개 — 두 검증이 서로를 대신하지
        # 않는다: compose 는 로컬 환경 기동 자체를, 이 test 는 실 Kotlin 소비자 규칙을 잰다).
        run: ./gradlew --no-daemon :adapters:test --tests '*RealServerIntegrationTest*' -PrealServer=true

      - name: 로컬 환경 정리 — 볼륨까지 (S-25)
        if: always()
        run: docker compose -f docker/compose.yaml down -v

      # M7/7F-local — 로컬 패키징 프로필(web 정적 이미지 · 리버스 프록시 · 로컬 TLS)을 **매 PR
      # 에서** 잰다. 한 번만 로컬에서 돌린 스모크는 뒤따르는 편집을 아무것도 막지 못하므로
      # (하네스 「안 돌린 게이트는 아무것도 막지 못한다」), 설계 검토 우회 ①~⑤ 의 측정이
      # 여기 선다. 비용은 **이 job 안에서 web 번들 빌드 한 번**(이미지 안 `npm ci` + `vite
      # build`)과 app+postgres 기동 한 번이다 — `web` job 의 설치·빌드와 겹치지만 그 job 의
      # 산출물을 이 job 으로 옮기는 배선(아티팩트 왕복)보다 싸고, 이미지가 **자기 입력만으로**
      # 재현되는 성질을 지킨다.
      #
      # **자리가 마지막인 이유**: ① 이 스모크는 S-21b 의 앱 이미지를 쓴다 ② 여기서 붉어져도
      # 앞선 판정(위생·취약점·컨테이너 스모크·리허설·실서버 test)이 이미 다 나왔다 — 앞에
      # 두면 한 회차에 보이는 판정이 줄어 수정 라운드가 쪼개진다(PR #68 M-3 와 같은 사유).
      # ③ S-25 가 기본 프로필을 치운 뒤라 포트·프로젝트가 비어 있다. 스크립트는 자기 스택을
      # 올리고 **종료 경로에서 반드시** `down -v` 로 내리며 잔여 0 을 센다.
      #
      # `tools/one-command-check.sh` 는 **건드리지 않는다** — 그 스크립트가 축어로 따르는 것은
      # `check`·`ml-engine`·`web` 세 job 이고 이 job(컨테이너 축)은 애초에 그 안에 없다.
      - name: 로컬 패키징 스모크 — web 셸 · /api 401 · 우회 ①~⑤ (S-26)
        run: ./tools/local-tls-smoke.sh

      # M7/7F 본편(D-7F2-2) — 운영 프로필의 구조 게이트 셋. **자리가 S-26 뒤인 이유**: ① S-21c 가 구운
      # proxy 이미지(로컬·운영 두 site 가 함께 구워진 바이트)를 그대로 판정한다 ② 앞선 판정이 이미 다
      # 나온 뒤라 여기서 붉어져도 한 회차의 판정이 줄지 않는다 ③ 기존 step 번호를 재배치하지 않는다.
      # 셋 다 운영 host 에 닿지 않는다 — S-27c 는 저장소의 **대역** host 설정(`deploy/nginx/test-fixture/`)으로
      # 돈다(운영 host 의 실제 설정으로 도는 것은 runbook 의 배치 전 검증이다).
      - name: 운영 env 키 집합 등식 — 템플릿 == compose 참조 (S-27)
        run: ./tools/prod-env-keys-check.sh

      - name: 운영 proxy site 등식 · 운영 compose 구조 (S-27b)
        run: ./tools/prod-proxy-sites-check.sh --proxy-image bidvector/proxy:local

      - name: host nginx 조각 — 기존 site 불변 · 새 거동 (대역 host 설정) (S-27c)
        run: ./tools/prod-nginx-check.sh --proxy-image bidvector/proxy:local
