name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # 액션 넷의 major 는 **Node 24 진입점에서 멈춰 있다**(2026-09-09) — 상위 major 가
      # 있어도 올리지 않는다. 여기서 올리는 유일한 사유가 Node 20 지원 종료이고,
      # 그 밖의 major 는 각자 별도 사유로 판단할 일이다.
      #
      # `fetch-depth: 0` 은 `contractGate` 가 요구한다 — `buf breaking` 이
      # `.git#tag=<승인 태그>,subdir=contracts` 를 대조 대상으로 쓰므로 **전체 이력과 태그**가
      # 있어야 한다. 기본값(얕은 clone, 태그 없음)이면 그 검사가 대상을 찾지 못한다.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 러너의 launcher JVM. 컴파일에 쓰이는 toolchain 은 gradle.properties 의
      # `bidvector.jvmToolchain` 이 정하고, 없으면 foojay resolver 가 내려받는다.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # `contractGate`(bidvector.quality-baseline)가 `buf` 를 실행 파일로 부른다 —
      # lint · breaking · 버전 대조 셋. 러너에 없으면 `check` 가
      # `IOException: Cannot run program "buf"` 로 떨어진다(2026-09-06 이후 CI 상시 실패의 원인).
      #
      # `bufbuild/buf-setup-action` 을 쓰지 않는다 — **2025-08 아카이브**라 Node 20 에 묶인 채
      # 갱신되지 않는다. 대신 릴리스 바이너리를 직접 받는다. **버전은 정책 파일이 정한다** —
      # 워크플로에 숫자를 적으면 `tool.buf.version` 과 조용히 어긋날 자리가 하나 더 생긴다.
      - name: install buf
        run: |
          set -euo pipefail
          version="$(sed -n 's/^tool\.buf\.version=//p' config/quality/contract-policy.properties)"
          if [ -z "$version" ]; then
            echo "config/quality/contract-policy.properties 에서 tool.buf.version 을 읽지 못했다" >&2
            exit 1
          fi
          base="https://github.com/bufbuild/buf/releases/download/v${version}"
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/buf" "$base/buf-Linux-x86_64"
          curl -fsSL -o "$tmp/sha256.txt" "$base/sha256.txt"
          # 대상 자산의 행이 없으면 `pipefail` 로 여기서 떨어진다 — 조용한 미검증을 막는다.
          ( cd "$tmp" && grep ' buf-Linux-x86_64$' sha256.txt | sed 's/buf-Linux-x86_64$/buf/' | sha256sum -c - )
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$tmp/buf" "$RUNNER_TEMP/bin/buf"
          rm -rf "$tmp"
          # PATH 등재는 다음 step 부터 듣는다 — 이 step 의 스모크는 절대 경로로 건다.
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/buf" --version

      # v6 은 **캐싱을 `gradle-actions-caching` 상용 컴포넌트로 분리**해 Gradle 이용약관 동의를
      # 요구한다(MIT 아님). Node 24 는 v5 에서 이미 충족되므로 라이선스 변경을 딸려 들이지 않는다.
      - uses: gradle/actions/setup-gradle@v5

      # check 가 게이트 전부를 든다 — 컴파일 · ktlint · detekt · sizeGate ·
      # domainDependencyGate · architecture test · compatibilitySmoke.
      - run: ./gradlew --no-daemon check

      # OPEN-ADR-06 의 입력. 게이트가 아니라 측정이라 실패시키지 않는다.
      - run: ./gradlew --no-daemon qualityBaseline

      # v5 는 Node 24 를 예비 지원만 하고 기본은 여전히 Node 20 이라 v6 이 최소선이다.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: reports
          path: |
            build/reports/quality-baseline/
            */build/reports/
          retention-days: 14

  # M5/5A — Python ML engine CI(2D D-2D-4 (a) · ADR 0009 D-6 「CI 가 확인한다」). Kotlin `check`
  # job 과 독립(소스 겹침 0, 위 job 은 무편집). `ml-engine/` 이 최초로 CI 에 얹는 Python job이다
  # (조사 02 §4 — 이전까지 없었음).
  ml-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-engine
    steps:
      - uses: actions/checkout@v5

      # `.python-version`(3.12, D-5A-1)을 읽어 버전을 고정한다 — 워크플로에 숫자를 적지
      # 않는다(`buf` 버전과 같은 이유, install buf 주석 참고).
      - uses: actions/setup-python@v5
        with:
          python-version-file: ml-engine/.python-version

      # 재현성(D-5A-4) — 로컬 실측 버전과 같은 값으로 고정. uv 자체는 lock 대상이 아니라
      # (lock 파일이 검증하는 것은 Python 의존성 그래프뿐) 여기서 직접 핀한다.
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.22"

      - name: install (S-1)
        run: uv sync --frozen --all-extras

      # extras 분리(D-5A-0 (b) ②) — serving 전용 설치에 SQLAlchemy·DB driver·requests·httpx·
      # celery 가 전혀 없음을 lock 그래프로 실측한 뒤 dev 를 복구한다(S-1b).
      - name: serving extras 분리 확인 (S-1b)
        run: |
          set -euo pipefail
          uv sync --frozen --extra serving --no-dev
          for m in sqlalchemy psycopg requests httpx celery; do
            if uv run --no-sync python -c "import $m" >/dev/null 2>&1; then
              echo "금지 패키지 $m 이 serving extras 에 설치됐다" >&2
              exit 1
            fi
          done
          uv sync --frozen --all-extras

      - name: ruff (S-2)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: mypy --strict (S-3)
        run: uv run mypy --strict src/ml_engine

      - name: import-linter (S-4)
        run: uv run lint-imports

      - name: pytest — 게이트 test 포함, test 수는 이 step 출력에 남는다 (S-5)
        run: uv run python -m pytest tests -q

      - name: 설계 래칫 — 함수 50/파일 500/dict[str,Any] 경계 0 (S-6)
        run: uv run python tools/design_ratchet.py --check

      # ADR 0009 D-6 — 이식 모듈 docstring 포인터와 reuse.md 두 자리 대조 + 양성 대조.
      - name: 재활용 출처 두 자리 대조 (S-7)
        run: |
          set -euo pipefail
          uv run python tools/reuse_provenance_check.py
          if uv run python tools/reuse_provenance_check.py --evidence tests/gates/fixtures/reuse-mismatch.md; then
            echo "양성 대조(어긋난 evidence)가 실패해야 하는데 통과했다" >&2
            exit 1
          fi

      - name: Python 버전 두 자리 대조 (S-9)
        run: |
          uv run python -c "import tomllib,pathlib; p=tomllib.load(open('pyproject.toml','rb')); v=pathlib.Path('.python-version').read_text().strip(); assert v.startswith('3.12') and '3.12' in p['project']['requires-python'], (v, p['project']['requires-python'])"
