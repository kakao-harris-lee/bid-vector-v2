version: strategy-backtest-v1
# M6/6G — 가격 경로 결정 실험(D-6G-6)의 사전 등록 정책. **실험 창을 보기 전에 고정된
# 값**이고, 값을 바꾸면 새 version 이며 이전 판정과 구분된다(위협 모델 ②).
#
# effective date: 2026-09-27(착수일). 이 파일의 값은 `reports/evidence/m6/6g/scope.md`
# 「운영자 승인 필요」 A-3 의 승인 문면에서 온다 — 축어 인용:
#   "**A-3 판정 정책 값**: Δ(제안: 상대 +20%) · α(0.05 단측, 주 가설 Bonferroni /3) ·
#    비열등 한계(실격률 +1%p) · 검정력 0.8 · 창 최소 3 · seed 5."
#   "**2026-09-27 운영자: 「A-1~A-5 추천안대로 승인」.** 아래 다섯 항목이 제안값 그대로
#    확정됐다."
# 창당 표본 하한은 같은 문서 D-6G-5 의 "창당 n ≥ 483(ML-07 legacy 필요 표본 승계)".
#
# **코드 리터럴 금지**(ML-07 acceptance ③) — 이 값들은 `load_strategy_backtest_policy`
# 로만 읽힌다. CLI·환경변수로 완화하는 통로는 없다(같은 acceptance ④, 로더는 `path`
# 하나만 받는다). 값 갱신 절차: scope.md 승인 문면 → 이 파일 → test.

# ── 판정식 (D-6G-6) ────────────────────────────────────────────────────────────
# 주 지표는 would-have-won 비율의 S0 대비 차이(공고 단위 쌍대). 각 창에서 McNemar
# 정확 검정(단측) + 상대 개선 >= Δ.
verdict.min_relative_improvement: 0.20
verdict.alpha: 0.05
# 주 가설은 S2 의 세 후보(S2c·S2b·S2a) 대 S0 — Bonferroni 분모(우회 ⑥).
verdict.primary_hypothesis_count: 3
# 실격률 비열등 한계 +1%p — S0 보다 이만큼 넘게 나쁘면 Passed 가 아니다.
verdict.ineligibility_noninferiority_margin: 0.01
verdict.target_power: 0.80
verdict.min_window_count: 3
verdict.min_window_rows: 483

# ── 창 (D-6G-5·D-6G-14) ───────────────────────────────────────────────────────
# 비중첩 주 단위 창 + embargo 1주. 창은 개찰 주로 자르되 포함 여부는 공고일로 본다.
window.days: 7
window.embargo_days: 7

# ── 제도 상수 (복수예비가격) ──────────────────────────────────────────────────
# 예가 범위를 균등 폭 15구간으로 나눠 구간마다 하나씩 뽑고, 그 15개 중 무작위 4개의
# 평균이 예정가격이다. 값은 `ml-engine/policy/inference-v1.yaml` 의
# `reserve.expected_price_count`·`reserve.draw_count` 와 같다 — evaluation 층은
# inference 를 import 할 수 없어(import-linter forbidden) 같은 제도 상수를 이 파일이
# 따로 나른다. 두 파일이 갈리면 `test_policy.py` 의 대조 test 가 붉어진다.
institution.reserve_price_count: 15
institution.draw_count: 4

# ── 낙찰하한율 개연 밴드 (D-6G-13 ②) ─────────────────────────────────────────
# legacy 게이트 승계. 밴드 확정은 `OPEN-DEC-10` 소관이라 여기서 판정하지 않는다 —
# 밴드 밖 값은 사유별 계수와 함께 제외된다.
floor.rate_band_low: 0.30
floor.rate_band_high: 0.995
# 공사 순공사원가 배제 비율 — 예정가격 중 재료비·노무비·경비와 그 부가가치세 합산액의
# 100분의 98 미만으로 투찰한 자는 낙찰자가 되지 못한다(국가계약법 시행령 제42조 계열,
# 추정가격 100억 미만 공사). 하한가 위의 **두 번째 실격선**이다(P-3 §4.3).
floor.pure_construction_cost_ratio: 0.98

# ── 2026 낙찰하한율 개정 시행일 (D-6G-14 · P-3 §3.4) ────────────────────────
# 적용례가 「시행일 이후 최초 **입찰공고분**」이므로 개찰일이 아니라 **공고일**로 가른다.
# 이 날 이전 공고분은 제외한다(하한율이 바뀐 앞뒤를 섞으면 표적이 움직인 것을 전략
# 효과로 읽는다, D-6G-5). 물품 시행일은 보도가 05-26/05-29 로 갈려 **늦은 쪽(05-29)** 을
# 쓴다 — 경계 구간 05-26~05-28 공고분이 그 선택으로 통째 빠진다(D-6G-14).
effective.construction: "2026-01-30"
effective.service: "2026-05-26"
effective.goods: "2026-05-29"

# ── 제외 규칙 상수 (D-6G-35) ─────────────────────────────────────────────────
# 「재입찰·정정」 제외(③)의 기준이 되는 **첫 공고 차수**(`bidNtceOrd`). 이 값이 틀리면
# 전량이 ③ 으로 빠지거나(값이 관측보다 크면) 정정 공고가 섞인다(작으면). 추측하지
# 않는다 — 값의 근거는 Kotlin 레인이 공식 참고자료 XML 예제와 실제 관측에서 확인해
# evidence 에 적는다. **확인 전까지 판정 JSON 이 `FIRST_NOTICE_ORDINAL_UNVERIFIED` 를
# 알려진 제한으로 싣는다**(잊히지 않게).
exclusion.first_notice_ordinal: 1

# ── 전략 상수 ────────────────────────────────────────────────────────────────
# S1 규칙 앵커의 offset(bp) — D-6G-15 확정(A-4 「legacy 값 승계」). legacy 의 선언 데이터
# `PREDICTION_CONSTRUCTION_SCENARIO_FLOOR_OFFSETS` 의 **추천(p50) = 0.0053** 을 bp 로
# 옮긴 값이다(공격 p25 = 0.0016, 안전 p75 = 0.0148 — S1 은 공고당 금액 하나를 낸다).
# 산식은 `하한율 + offset` 이고 E[R] 을 곱하지 않는다(legacy 가 그 변형을 기각했다).
# 이 값은 legacy 가 **공사 정착행**에서 잰 것이라 S1 은 공사에서만 채점한다 —
# 용역·물품은 기권으로 공시한다. 창을 보고 조정하지 않는다(우회 ②).
strategy.s1_offset_bp: 53.0
# S4 제도 분포 + 경쟁자 분포 몬테카를로. 난수는 판정 seed 에서만 오고 반복 수·격자는
# 여기 고정한다(seed 쇼핑·격자 쇼핑 차단).
strategy.s4_iteration_count: 4000
strategy.s4_grid_size: 41
strategy.s4_grid_span_bp: 400.0
strategy.s4_min_competitor_samples: 30

# ── 표본 크기 결정식 (D-6G-20) ────────────────────────────────────────────────
# 수집 호출 예산이 표본 크기를 정한다: 목록 호출 + 공고당 호출 x 표본 <= 상한.
# Kotlin 레인이 수집 쪽에서 강제하고, Python 은 판정 JSON 에 입력과 결과를 공시한다.
# `max_total_calls` 는 A-1 승인 범위 안의 수치(일 20,000 x 4일)다.
sampling.list_call_count: 600
# 공고당 상세 호출 수는 **업무별**이다(verifier r1 M-3) — 공사는 A값 오퍼레이션이
# 하나 더 붙어 넷이다. 하나로 뭉치면 공사를 과소 계상한다.
sampling.calls_per_notice_construction: 4
sampling.calls_per_notice_service: 3
sampling.calls_per_notice_goods: 3
sampling.max_total_calls: 80000
# 최소 필요 표본은 **파생값**이다: 창당 하한 x 창 최소 수 x 업무 셋 x (1 + 여유).
# 숫자를 따로 적으면 창 규칙이 바뀔 때 조용히 어긋난다(앞 판의 1449 는 업무 축을
# 빠뜨린 값이었다). 표본이 이 수에 못 미치면 **판정 대신 멈춘다**.
sampling.headroom_ratio: 0.20

# ── 지자체 민감도 (D-6G-21) ──────────────────────────────────────────────────
# 주 판정은 지자체를 가르지 못한 채로 낸다(판정 불가로 계수). 보조 민감도 둘을 함께
# 낸다: (a) 예가 범위율이 넓은(지방 계열로 알려진 +-3%) 공고를 뺀 판 (b) 기관 코드
# 접두로 지자체를 **추정**해 뺀 판. 접두 목록은 **비어 있다** — authoritative 대응을
# 확보하지 못했고 지어내면 DEC-03 을 코드가 조용히 재정의한다. 비어 있는 동안 (b) 는
# 주 판정과 같은 표본이고, 판정 JSON 이 「추정 불가」를 명시한다.
sensitivity.wide_reserve_half_width: 0.025

# ── P-4 제도 분포 적합도 ─────────────────────────────────────────────────────
# 실험 앞에 돈다. 맞지 않으면 판정 대신 멈춤 결과를 낸다(scope.md 선행 조사 P-4).
fit.alpha: 0.05
fit.min_sample_count: 200
fit.max_bin_ratio_deviation: 0.02

# ── seed 안정성 (A-3 「seed 5」) ──────────────────────────────────────────────
# S0 의 난수 seed 5개. 판정 부호가 하나라도 뒤집히면 NotEvaluable(SEED_UNSTABLE).
# 값은 `ml-engine/policy/evaluation-v1.yaml` 의 `stability_seeds` 와 같은 다섯이다
# (5C-2 가 고정한 값 — 6G 가 새 다섯을 지어내면 그 자체가 seed 쇼핑 표면이다).
stability_seeds.0: 20260812
stability_seeds.1: 1
stability_seeds.2: 7
stability_seeds.3: 42
stability_seeds.4: 2026
