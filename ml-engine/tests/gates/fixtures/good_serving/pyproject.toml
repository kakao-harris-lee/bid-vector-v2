# S-4 양성 대조(F-1, verifier r1) — 승인된 재수출 통로(`from ml_engine.contracts import
# common_pb2`)의 **간접** 연쇄(`serving -> contracts -> bidvector`)가 `allow_indirect_imports
# = true` 아래서 실제로 열려 있는지 증명한다. 실제 `ml-engine/pyproject.toml`의 「bidvector
# 직접 import 금지」 계약과 같은 형태 — `ml_engine.contracts`가 fixture 안에서도 `bidvector`를
# 재수출하는 실물처럼 import 해, 간접 체인이 진짜로 생기게 만든다.
[tool.importlinter]
root_packages = ["ml_engine"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "승인 통로(간접)는 열린다(양성 대조)"
type = "forbidden"
source_modules = ["ml_engine.serving"]
forbidden_modules = ["bidvector"]
allow_indirect_imports = true
