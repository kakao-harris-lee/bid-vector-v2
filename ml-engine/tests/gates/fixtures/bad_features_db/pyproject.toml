# M5/5C-1 ⑫ 양성 대조 — 실제 `ml-engine/pyproject.toml`의 신설 forbidden 계약(D-5C-13)과
# 같은 형태를 독립 미니 프로젝트에 적용한다. `ml_engine/features/__init__.py`가 의도적으로
# `sqlalchemy`를 import 해서 `lint-imports --config`가 이 파일을 가리키면 exit 0 이 아니어야
# 한다(`tests/gates/test_import_contracts.py`).
[tool.importlinter]
root_packages = ["ml_engine"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "features 는 DB 모듈을 모른다(양성 대조)"
type = "forbidden"
source_modules = ["ml_engine.features"]
forbidden_modules = ["sqlalchemy"]
