[project]
name = "ml-engine"
version = "0.1.0"
description = "bid-vector V2 ML engine — M2/2A 최소 골격(계약 round-trip). 패키지 구조·import 경계는 M5 5A 가 완성한다 (m2-prep.md D-M2-3)."
requires-python = ">=3.12"
dependencies = [
    # 버전 근거: _workspace/m2-prep/02_grpc_stack_compat.md(PyPI 메타데이터 curl 실측) —
    # Kotlin 쪽 grpc-java 1.84.0/grpc-kotlin 1.5.0 과 wire format(proto3)에서만 호환,
    # 버전 숫자로 "같은 축"을 주장하지 않는다.
    "grpcio==1.83.1",
    "protobuf==7.36.1",
]

[project.optional-dependencies]
# 생성·test 전용 — 실제 serving(5A)은 grpcio-tools 를 런타임에 필요로 하지 않는다.
# M2/2D — grpcio-testing 은 승인됨(pip 네트워크 허용, 그 밖 네트워크 없음). 실측(2026-09-07,
# test_contract_resilience.py 상단 docstring): `grpc_testing` 모듈은 `grpc.aio`를 지원하지
# 않는다(`OPEN-2D-AIO-INPROCESS` 닫힘) — 그래도 정책 데이터 대조 test(도구 버전)가 이
# 패키지의 실제 설치를 전제하므로 dev 의존에 남긴다.
dev = [
    "grpcio-tools==1.83.1",
    "grpcio-testing==1.83.1",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
