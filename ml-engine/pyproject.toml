[project]
name = "ml-engine"
version = "0.1.0"
description = "bid-vector V2 ML engine — 패키지 경계·import boundary·래칫·재활용 출처 검사(M5/5A, v2-지침서.md §3.2·§5)."
requires-python = ">=3.12,<3.13"
dependencies = [
    # 버전 근거: _workspace/m2-prep/02_grpc_stack_compat.md(PyPI 메타데이터 curl 실측) —
    # Kotlin 쪽 grpc-java 1.84.0/grpc-kotlin 1.5.0 과 wire format(proto3)에서만 호환,
    # 버전 숫자로 "같은 축"을 주장하지 않는다.
    "grpcio==1.83.1",
    "protobuf==7.36.1",
]

[project.optional-dependencies]
# M5/5A D-5A-0(b)·조사 02 — serving 런타임: numpy/lightgbm 만(SQLAlchemy·DB driver·requests
# 없음, S-1b 가 lock 그래프에서 실측). scipy 는 lightgbm 의 강제 전이 의존이라 직접 선언하지
# 않는다(조사 02 §1).
#
# PR #12 리뷰 MEDIUM — 5D `inference/policy.py::load_inference_policy` → 5A
# `registry/policy.py::load_policy` → `yaml.safe_load` 이므로 정책 로더가 serving 경로에
# 있다. `pyyaml` 이 `dev` extras 에만 있어 serving-only 설치(`--extra serving --no-dev`)에서
# `ModuleNotFoundError` 였다(5A 가 만든 잔여, 5D 가 첫 실질 소비자). serving/training 에도
# 추가한다.
serving = [
    "numpy==2.5.2",
    "lightgbm==4.7.0",
    "pyyaml==6.0.3",
]
# training 은 M5/5C-1 이 storage adapter 의존(정책 YAML 로더)을 더했다 — `pyyaml`은
# `registry.policy.load_policy` 가 이미 쓰던 것과 같은 버전(dev 그룹과 동일 고정).
training = [
    "numpy==2.5.2",
    "lightgbm==4.7.0",
    "pyyaml==6.0.3",
]
dev = [
    "grpcio-tools==1.83.1",
    "grpcio-testing==1.83.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "hypothesis==6.167.1",
    "import-linter==2.15",
    "ruff==0.16.6",
    "mypy==2.3.1",
    "pyyaml==6.0.3",
    "types-pyyaml==6.0.12.20250915",
    # M5/5E-1 D-5E-9 — mypy strict 가 `grpc`(serving.grpc·training.jobs.servicer 그 밖
    # 진입점)를 타입 검사하려면 stub 이 필요하다. `[[tool.mypy.overrides]]`로
    # `ignore_missing_imports` 하지 않는다(5A 규율 — override 는 사유·해소가 필수인데
    # 여기는 stub 이 있어 예외가 불필요하다).
    "grpc-stubs==1.53.0.6",
]

[build-system]
# M5/5E-1 D-5E-8 — `setup.py`가 `tools/build_hook.py`(→ `tools/generate_contracts.py`)를
# import 해야 `cmdclass`를 등록할 수 있는데, setuptools 는 어떤 질의(메타데이터 조회
# 포함)든 `setup.py` 전체를 실행한다(실측 — `get_requires_for_build_wheel` 단계에서부터
# `ModuleNotFoundError: grpc_tools`). `grpcio-tools`(버전은 `[project.optional-dependencies]
# .dev`와 동일 고정)를 격리 빌드 환경에도 넣는다.
requires = ["setuptools>=68", "grpcio-tools==1.83.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
# `tests/conftest.py`가 `tools/generate_contracts.py`(`ml-engine/` 아래, `src/` 밖)를 import
# 한다 — rootdir(`.` = `ml-engine/`, 이 ini 파일 기준)를 sys.path 에 추가해 `tools` 를
# namespace package 로 찾게 한다(pytest 7+ 내장 옵션, 추가 플러그인 불필요).
pythonpath = ["."]
markers = [
    # M5/5D(D-5D-6 구현 지시) — legacy 산식과의 재현 대조 라벨. `--strict-markers`가
    # 미등록 마커를 거부하므로 여기서 등록한다. **판정 근거가 아니다**(CLAUDE.md 운영자
    # 지시 — 기존 Python 출력 재현은 acceptance 가 아니다) — 이식이 legacy 산식과 같음을
    # 확인하는 회귀 관측 라벨일 뿐, 기대값은 승인된 도메인 명세·corpus 에서만 온다.
    # 5C-1 이 같은 마커를 중복 등록했던 줄은 rebase 시 제거(2026-09-13, 5D 선점).
    "legacy_parity: legacy 산식과의 재현 대조(회귀 관측 — 정답 판정 아님)",
]

[tool.ruff]
target-version = "py312"
# `src/ml_engine/contracts/_generated` 항목은 뺐다(D-5A-0 (b) 정정 — 생성 위치가 패키지 트리
# 밖 `.contracts-generated/`로 옮겨져 이 경로가 더는 존재하지 않는다, 죽은 exclude 항목이었다).
#
# verifier r1 F-4 — `"tests/*.py"`(glob)는 `tests/` **직계 전부**를 뺐다(게이트 test 13개·
# fixtures 도 포함, 실측 — 「직계만」이라는 원래 의도와 어긋났다). 2A~2E 가 만든 기존 계약
# test 다섯 + `crosslang_smoke_server.py`는 편집 금지(회귀 0)인데 `ruff format`이 요구하는
# 폭·줄바꿈으로 이미 작성되지 않았다(실측). `conftest.py`는 5A 가 편집하며 이미 `ruff
# format`에 맞춰 다시 썼으므로 뺄 필요가 없다(제외하면 향후 재검사를 잃기만 한다 — 실측
# 확인 후 여섯만 남긴다). `ruff`는 lint·format 이 같은 `exclude`를 공유해 format 만 빼는
# 옵션이 없으므로, **파일명을 정확히 나열**한다(`tests/gates/**`는 대상에서 빠지지 않는다).
extend-exclude = [
    "tests/crosslang_smoke_server.py",
    "tests/test_contract_resilience.py",
    "tests/test_contract_roundtrip.py",
    "tests/test_embedding_contract.py",
    "tests/test_prediction_contract.py",
    "tests/test_training_contract.py",
]

[tool.ruff.lint]
# `N`(pep8-naming) 포함 — 2A~2E 기존 test 의 gRPC 생성 servicer 메서드(`CalculateOptimalBid`
# 등, PascalCase 는 생성 시그니처 요구)가 `# noqa: N802`를 쓴다. 끄면 그 noqa 가
# "미사용"(RUF100)이 되어 편집 금지인 기존 test 파일이 새로 위반을 낸다.
# `BLE`(D-5D-6, M5/5D) 추가 — `except Exception`(blind except) 을 거부해 위협 모델 (a)
# 「실패의 폴백 접힘」 방어(결과 타입 + 예외로 실패를 나르지 않는다)를 린트가 강제한다.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "PGH", "N", "BLE"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
# M5/5D verifier r1 M-4(계약 갱신 2026-09-12) — `dict[str, JsonScalar]`(중첩 컨테이너
# 배제)가 `feature_names`/`release`/`reproducibility` 같은 실제로는 list/dict 인 필드의
# isinstance 분기를 mypy 관점에서 도달 불가로 만들었다(값 타입이 애초에 list/dict일 수
# 없다고 선언했으므로). `warn_unreachable`을 켜 이런 죽은 코드를 게이트가 잡게 한다 —
# `registry/artifact.py`는 `JsonValue`(재귀 유니온, list/dict 포함)로 갈아 죽은 구간을
# 없앴다(S-3 재확인 완료). 5A/5B 코드에 새 unreachable 이 없음을 5D 재검증 시 확인했다.
warn_unreachable = true
# verifier r1 F-2 뒤 D-5A-0 (b) 정정 — 생성 stub 이 `ml-engine/.contracts-generated/`(패키지
# 트리 밖)로 옮겨져 `src/ml_engine` 스캔 범위 안에 더는 없다 — `exclude` 항목 자체가 죽은
# 설정이라 지웠다(F-8 과 같은 갈래: 안 쓰는 설정을 남기지 않는다).

[[tool.mypy.overrides]]
module = "bidvector.*"
ignore_missing_imports = true
# reason: `ml_engine.contracts.__init__`가 `.contracts-generated/`(D-5A-0 (b), 패키지 트리
#   밖)를 sys.path 에 얹고 `bidvector.ml.v1.*_pb2` 를 절대 import 한다(protoc 생성 코드가
#   형제 proto 를 항상 절대 import 로 참조하므로 상대 nesting 이 불가능 — contracts/__init__.py
#   구현 노트 참고). 생성 stub 은 VCS 밖이라 `mypy --strict`(S-3) 단독 실행 시점엔 디스크에
#   없을 수 있다 — 재수출 import 하나를 위한 구조적 예외.
# resolve: 해소 없음 — 생성물이 VCS 밖인 한 계속 필요하다(설계 검토 (1) 「생성물 유출」 방어와
#   같은 경계, allowlist 대상이 아니라 재수출 경계 자체의 성질).

[tool.importlinter]
root_packages = ["ml_engine"]
# forbidden 계약이 저장소 밖 패키지(sqlalchemy·grpc·bidvector 등)를 겨눈다 — import-linter
# 는 그런 "external forbidden modules"가 있으면 이 플래그를 명시하도록 요구한다(실측).
include_external_packages = true

[[tool.importlinter.contracts]]
name = "serving/inference 층 — features·contracts 위로만 의존"
type = "layers"
layers = [
    "ml_engine.serving",
    "ml_engine.inference",
    "ml_engine.features",
    "ml_engine.contracts",
]

[[tool.importlinter.contracts]]
name = "training/evaluation 층 — features·contracts 위로만 의존"
type = "layers"
layers = [
    "ml_engine.training",
    "ml_engine.evaluation",
    "ml_engine.features",
    "ml_engine.contracts",
]

[[tool.importlinter.contracts]]
name = "registry 는 features·contracts 만"
type = "forbidden"
source_modules = ["ml_engine.registry"]
forbidden_modules = [
    "ml_engine.serving",
    "ml_engine.training",
    "ml_engine.inference",
    "ml_engine.evaluation",
    "ml_engine.adapters",
]

[[tool.importlinter.contracts]]
name = "serving/inference 는 DB·HTTP·업무 모듈·grpc 진입점 밖 grpc 를 모른다"
type = "forbidden"
source_modules = ["ml_engine.serving", "ml_engine.inference"]
forbidden_modules = [
    "sqlalchemy",
    "psycopg",
    "requests",
    "httpx",
    "celery",
    "ml_engine.training",
    "ml_engine.adapters",
    "grpc",
]
# M5/5E-1 — `OPEN-5A-SERVING-GRPC-EXCEPTION` 종결. `ml_engine.serving.grpc`가 유일 진입점
# (build_server·shutdown·is_deadline_active, scope.md ①) — 그 밖 serving/inference 모듈은
# 여전히 `grpc`를 직접 import 하지 않는다(`test_serving_purity.py`가 실행 시점으로도
# 재확인).
ignore_imports = ["ml_engine.serving.grpc -> grpc"]

[[tool.importlinter.contracts]]
name = "bidvector 직접 import 금지 — contracts 재수출(간접)은 허용"
type = "forbidden"
source_modules = [
    "ml_engine.features",
    "ml_engine.training",
    "ml_engine.evaluation",
    "ml_engine.inference",
    "ml_engine.registry",
    "ml_engine.serving",
    "ml_engine.adapters",
    "ml_engine.app",
]
forbidden_modules = ["bidvector"]
# verifier r1 F-1 — 기본값(간접 포함)은 승인 통로(`from ml_engine.contracts import
# common_pb2`)의 간접 연쇄(`X -> ml_engine.contracts -> bidvector`)까지 BROKEN 을 냈다(5A 가
# 초록인 건 패키지 일곱이 비어서였다 — 5B 의 첫 import 에서 S-4 가 붉어질 뻔했다, M1/1A
# 「빈 도메인에서만 초록」 계열). `allow_indirect_imports = true`로 **직접 import 만** 막는다
# — `tests/gates/fixtures/good_serving/`(양성) 이 그 간접 경로가 실제로 열림을,
# `bad_contracts_bypass/`(양성, 반대 방향) 가 직접 import 는 계속 막힘을 증명한다.
allow_indirect_imports = true
# `ml_engine.contracts._generated` 항목은 뺐다(verifier r1 F-2) — D-5A-0 (b) 정정으로 생성
# stub 이 `ml-engine/.contracts-generated/`(패키지 트리 밖)로 옮겨져 그 이름의 Python import
# 경로 자체가 더는 존재하지 않는다(열거로 막는 대신 경로를 없앴다) —
# `tests/gates/test_import_contracts.py`가 `ModuleNotFoundError`로 구조적 폐쇄를 단언한다.

[[tool.importlinter.contracts]]
# M5/5C-1 ⑫(D-5C-13) — `OPEN-5B-FEATURES-FORBIDDEN` 해소. `adapters`는 제외한다(6C
# object storage 의 자리, D-5C-13). `ml_engine.inference`·`ml_engine.serving`도 겨눈다
# (설계 검토 우회 (10) — training 이 K7 성숙도 커널을 끌어오는 경로를 막는다).
name = "features/training/evaluation/registry 는 DB·HTTP·업무 모듈·grpc 진입점을 모른다"
type = "forbidden"
source_modules = [
    "ml_engine.features",
    "ml_engine.training",
    "ml_engine.evaluation",
    "ml_engine.registry",
]
forbidden_modules = [
    "sqlalchemy",
    "psycopg",
    "requests",
    "httpx",
    "celery",
    "ml_engine.inference",
    "ml_engine.serving",
    "grpc",
]
# M5/5E-1 — `training.jobs.servicer`가 grpc 진입점 둘 중 하나다(5A ③, 위 계약의
# `serving.grpc`와 대칭). 그 밖 `features`·`training`(jobs 제외)·`evaluation`·`registry`는
# 여전히 `grpc`를 모른다.
ignore_imports = ["ml_engine.training.jobs.servicer -> grpc"]

[[tool.importlinter.contracts]]
# M5/5E-1 우회 (11) — `ml_engine.app`(조립 근, layers 계약 밖)은 serving·training·
# inference·adapters 를 전부 잇지만, DB·HTTP·업무 모듈은 여전히 몰라야 한다(serving 순수성
# 이 조립 근을 거쳐 새는 것을 막는다).
name = "app 은 DB·HTTP·업무 모듈을 모른다"
type = "forbidden"
source_modules = ["ml_engine.app"]
forbidden_modules = ["sqlalchemy", "psycopg", "requests", "httpx", "celery"]

[tool.design-ratchet]
# ML-11.2 승인값 — 바꾸려면 이 값과 `tests/gates/test_design_ratchet.py` 단언을 함께
# 고쳐야 해서 diff 에 드러난다(설계 검토 (2) 우회 (10) 방어).
function_soft_limit_lines = 50
file_loc_soft_limit = 500
# verifier r1 F-8 — `allowlist = []`(inline 배열)를 남겨 둔 채 이 주석이 안내하는
# `[[tool.design-ratchet.allowlist]]`(array-of-tables)를 더하면 TOML 타입 충돌로
# `duplicate key`(실측: `uv run` 자체가 `pyproject.toml` 파싱에 실패해 exit 2 — 이 스크립트
# 뿐 아니라 ruff·mypy·pytest 등 `uv run` 전체가 깨진다). D-5A-3 — baseline(증가만 차단) 이
# 아니라 위반 0 또는 명시 allowlist. 5A 시점 **항목 0**(설계 검토 (1)) — 키를 아예 선언하지
# 않는다(`design_ratchet.load_config`가 부재 시 빈 목록으로 읽는다, `test_allowlist_is_empty_
# at_5a`가 확인). allowlist 가 필요해지면 `[[tool.design-ratchet.allowlist]]`
# array-of-tables **하나만** 쓴다(`allowlist = []`를 지우고) — 경로는 정확히 일치해야 하고
# 와일드카드는 스크립트가 거부한다(설계 검토 (2) 우회 (3)).
target_dirs = ["src/ml_engine", "tools"]
