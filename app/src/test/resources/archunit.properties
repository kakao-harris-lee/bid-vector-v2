# cr L-3 — ArchUnit 설정 핀. 두 게이트의 「뿌리가 실제로 production 에 있다」 단언은 뿌리 목록이 비면
# `forEach` 가 공허해지고, 그 길을 실제로 닫는 것은 **빈 should 에서 실패하는** 기본 거동이다. 기본값에
# 기대고 있던 것을 값으로 고정한다 — ArchUnit 판이 기본값을 바꾸면 핀이 없으면 조용히 열린다.
failOnEmptyShould=true

# **핀의 범위는 `:app` test classpath 다**(cr r2 L-8). `build-logic` 도 ArchUnit 을 의존하지만 `ArchRule`·
# `should` 를 쓰지 않아(전수 확인) 오늘 효과는 같다. 다른 모듈에 ArchUnit rule 이 생기면 그 모듈의 test
# 리소스에도 같은 핀을 둬야 한다 — 이 파일 하나가 저장소 전체를 덮지는 않는다.
