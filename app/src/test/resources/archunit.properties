# cr L-3 · PR #58 A — ArchUnit 설정 핀. 두 게이트의 「뿌리가 실제로 production 에 있다」 단언은 뿌리 목록이
# 비면 `forEach` 가 공허해지고, 그 길을 실제로 닫는 것은 **빈 should 에서 실패하는** 거동이다. 기본값에
# 기대고 있던 것을 값으로 고정한다 — ArchUnit 판이 기본값을 바꾸면 핀이 없으면 조용히 열린다.
#
# **키 이름은 `archRule.failOnEmptyShould` 다**(ArchUnit 1.5.0 `AllowEmptyShould` 의 상수). 앞 판은
# `failOnEmptyShould` 로 적어 **아무 설정도 켜지 않는 죽은 핀**이었다 — 이름 하나가 틀려 조용했다.
# 그래서 `ArchitectureGateTest` 가 이 값을 **읽어서** 단언하고, 빈 `should` 규칙이 실제로 실패하는지도
# 함께 잰다(핀이 죽으면 그 둘이 붉다).
#
# **핀의 범위는 `:app` test classpath 다**(cr r2 L-8). `build-logic` 도 ArchUnit 을 의존하지만 `ArchRule`·
# `should` 를 쓰지 않아(전수 확인) 오늘 효과는 같다. 다른 모듈에 ArchUnit rule 이 생기면 그 모듈의 test
# 리소스에도 같은 핀을 둬야 한다 — 이 파일 하나가 저장소 전체를 덮지는 않는다.
archRule.failOnEmptyShould=true
