# M7/7F 본편 — `tools/prod-nginx-check.sh` 의 **대역 host 설정**(CI·host 설정이 없는 자리용).
# 운영 host 의 구성 **모양**만 옮긴다: Ubuntu 패키지의 http 문맥 + `sites-enabled/*` include ·
# 80 에만 `default_server` · 443 에는 `default_server` 없음 · 기존 공개 site 하나(이름 정렬이
# `bidvector_kr` 과 `zz-` 사이에 오도록 `existing_site`). 이름·경로·포트는 전부 지어낸 값이다 —
# 실제 host 의 설정 내용은 저장소에 두지 않는다(D-7F2-2).
user www-data;
worker_processes 1;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
